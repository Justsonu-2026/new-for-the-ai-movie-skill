olors that appear on them in every look (a yellow raincoat, a\nred scarf) and that no other character uses. Anchors keep identity readable when faces are small or the\nmodel drifts. Pick anchors that sit well inside the style bible's palette and contrast with the backgrounds\nof their main locations. Record each anchor with a hex value and its name.\n\n## 4. Proportions and height\n- State **height in cm** and **head-heights** (realistic adult ≈ 7-8 heads; children ≈ 4-6; stylized\n  characters vary). Keep the number fixed.\n- State build (slight, wiry, athletic, stocky, heavy), shoulder width relative to hips, leg-to-torso ratio\n  if stylized.\n- Lineup heights are relative facts the cinematographer and director rely on for eyelines and framing.\n\n## 5. Detail budget\nEvery detail must survive regeneration. Prefer a few large, distinctive features over many small ones.\nHigh-risk details for AI generation: small text or logos, complex repeating patterns, asymmetric jewelry,\nmany buttons, intricate tattoos, glasses with thin frames in motion. Keep them only if the story needs them,\nand then describe them precisely (side, size, shape, color).\n\n## 6. Design variants\n- **Photoreal human:** describe as for casting: age range, face structure, skin tone and texture, hair,\n  build; avoid celebrity comparisons (likeness risk); avoid \"beautiful/handsome\" — describe features.\n- **Stylized / animated:** specify construction (head shape, eye size relative to head, line weight if\n  2D, material if 3D), proportions in heads, simplification rules (e.g. four fingers), and the expression\n  system (eyebrow shapes, mouth shapes). The animation-director uses these for poses and lip-sync.\n- **Creature / robot / non-human:** specify the anatomy logic (how it moves, joints, number of limbs),\n  materials and surface (rust, fur length, scales), where its \"face\" reads emotion, scale against a human,\n  and sound-making parts (feeds sound-designer).\n\n## 7. Costume design notes\n- Costume tells story: class, job, era, climate, personality, arc (a costume can change as the character does).\n- Design for the action: running needs footwear that can run; fights need sleeves that move.\n- Layers: outer, mid, inner, footwear, accessories; specify which layers are visible in which looks.\n- Materials affect light: wet leather shines, wool absorbs, silk reflects, sequins sparkle. Name them.\n- Condition states: wet, dirty, torn, bloodied, singed — define where on the garment and how much.\n- Era and place: check the costume fits the world rules in story.md.\n", "references/example-character.md": "# Example Character File\n\nA complete, approved-quality character file (abridged sheet briefs). Use as a model for depth and format.\n\n## Contents\n- Header and design rationale\n- `record: character` (CH-MAYA)\n- `record: costume` (CO-MAYA-01) with condition states\n- Sheets table and turnaround brief\n- Handoff\n\n````markdown\n---\nartifact: character-bible\nid: CH-MAYA\nversion: 1\nstatus: REVIEW\nowner: character-designer\ndepends_on: [screenplay@2, style_bible@1]\nupdated: 2026-10-19\n---\n# CH-MAYA — Maya Okello\n\n## Design rationale\n- Role: protagonist, 17, night courier; proud, quick, refuses help.\n- Shape language: triangles (sharp, restless) softened by a round face (she is still a kid).\n- Silhouette: oversized mid-thigh raincoat with hood + cross-body bag = a triangle with a bump at the hip.\n- Color anchor: rust-orange raincoat (#C4572A); no other character wears orange.\n- Proportions: realistic, 7.5 heads; slight and wiry; walks fast, shoulders forward.\n\n```yaml\nrecord: character\nid: CH-MAYA\nname: Maya Okello\nrole: protagonist\nage: 17\nheight_cm: 160\nbuild: \"slight and wiry, narrow shoulders, long legs\"\nidentity_lock: >-\n  A 17-year-old East African girl, slight and wiry, about 160 cm, oval face with high cheekbones, deep\n  brown skin with warm undertones, large dark-brown almond eyes, thick straight brows, a small scar through\n  the left eyebrow, short tight black curls cropped close at the sides and longer on top, small silver hoop\n  in the right ear only.\nface: \"oval, high cheekbones, small rounded chin, full lips, straight nose with a rounded tip\"\nhair: \"short tight black (#141012) curls, cropped close at sides, 4-5 cm on top; flattens when wet\"\nskin: \"deep brown (#5A3825) with warm undertones; light freckles none\"\neyes: \"large almond, dark brown (#2B1A10)\"\nsilhouette: \"triangle: oversized raincoat flaring from shoulders, bag bump at left hip\"\ndistinguishing_features: [\"scar through LEFT eyebrow, 1 cm, vertical\", \"silver hoop RIGHT ear only\"]\ndefault_costume: CO-MAYA-01\ncostumes: [CO-MAYA-01]\nexpression_range: [neutral, determined, suspicious, startled, stunned, quiet relief]\ninvariants: [\"scar side\", \"earring side\", \"hair length\", \"no other jewelry\"]\nallowed_variation: [\"hair flattened and darker when wet\", \"hood up or down per continuity\"]\nreference_images:\n  - {path: assets/characters/CH-MAYA_turnaround_v1.png, status: PENDING}\n  - {path: assets/characters/CH-MAYA_expressions_v1.png, status: PENDING}\n```\n\n```yaml\nrecord: costume\nid: CO-MAYA-01\ncharacter: CH-MAYA\nname: Night courier\ngarments:\n  - \"outer: oversized rust-orange waxed-cotton raincoat, mid-thigh, attached hood, black reflective strip across the back at shoulder-blade height, press-stud front\"\n  - \"mid: charcoal cotton hoodie, hood worn under the raincoat\"\n  - \"lower: black cargo trousers, side pockets\"\n  - \"feet: scuffed white canvas high-top sneakers, black laces\"\nmaterials: [\"waxed cotton (slight sheen)\", \"brushed cotton\", \"ripstop\", \"canvas\"]\ncolors: [\"rust-orange #C4572A\", \"charcoal #3A3A3C\", \"black #121212\", \"off-white #E8E4DA\", \"mustard #D9A520\"]\naccessories: [\"mustard-yellow canvas messenger bag, cross-body, rests on the LEFT hip\"]\ncondition_states:\n  - {id: DRY, description: \"matte waxed sheen, fabric holds its shape\", from: SC01}\n  - {id: SOAKED, description: \"darker orange, glossy, clinging at shoulders; trouser hems dark\", from: SC02}\nscenes: [SC01, SC02, SC03, SC04]\nidentity_lock: >-\n  Oversized rust-orange waxed-cotton courier raincoat reaching mid-thigh, black reflective strip across the\n  back, hood attached; charcoal hoodie underneath; black cargo trousers; scuffed white high-top sneakers;\n  mustard-yellow canvas messenger bag worn cross-body on the left hip.\n```\n\n## Sheets\n| Sheet | Status | Brief |\n|---|---|---|\n| Turnaround in CO-MAYA-01 (DRY) | requested | five views, see brief below |\n| Expression sheet (6) | requested | neutral, determined, suspicious, startled, stunned, quiet relief |\n| Pose sheet (3) | requested | vaulting railing (SC02), hiding parcel behind back (SC03), sitting on stairs (SC04) |\n\n```yaml\nsheet: turnaround\ncharacter: CH-MAYA\ncostume: CO-MAYA-01\nlayout: \"five full-body views left to right: front, three-quarter front, side, three-quarter back, back\"\ncontent: \"<CH-MAYA identity_lock> <CO-MAYA-01 identity_lock>\"\npose: \"relaxed neutral stance, arms slightly away from body, neutral expression, mouth closed\"\nbackground: \"plain light grey, no shadows\"\nlighting: \"flat even studio light\"\nstyle: \"<STYLE style_lock>\"\nmust_match: [\"scar through LEFT eyebrow\", \"hoop in RIGHT ear only\", \"bag on LEFT hip\", \"strip across back\"]\n```\n\n## Handoff\n- Produced: CH-MAYA@1, CO-MAYA-01 (REVIEW)\n- For script-supervisor: CO-MAYA-01 states DRY (SC01), SOAKED (from SC02)\n- For director/DP: 160 cm, shortest of the cast\n- Next: user approval → image-prompt-engineer turnaround prompts\n````\n", "references/identity-locks.md": "# Writing Identity Locks\n\nAn identity lock is a short, fixed description pasted verbatim into every prompt that shows the character\n(or costume). Image and video models do not remember earlier generations; repeating the same words is one of\nthe main text-side controls for consistency (Sora 2's official guide: \"Keep descriptions consistent across\nshots, reuse phrasing for continuity\"). Reference images are the other control — use both.\n\n## Contents\n1. Rules\n2. Order of information\n3. Examples\n4. Common mistakes\n\n## 1. Rules\n- **Length:** character lock 40-80 words; costume lock 25-60 words.\n- **Only visual facts** that never change across the film. Things that change (expression, wet hair, hood\n  up) are states, written per shot, not in the lock.\n- **Specific over general:** \"shoulder-length black hair, blunt-cut bangs to the eyebrows\" — not \"dark hair\".\n- **Fixed vocabulary:** once you call it a \"rust-orange waxed raincoat\", never call it \"orange jacket\".\n- **No names inside the lock** (models do not know who \"Maya\" is) except as a label the tool supports.\n- **No emotions, story, personality or quality words** (\"brave\", \"beautiful\", \"masterpiece\").\n- **Separate character and costume locks**, so the same face can wear different looks; never repeat a\n  detail in both (it doubles prompt length and can conflict).\n- **Positive phrasing:** describe what is there, not what is absent. \"Bare neck and wrists\" — not \"no\n  collar, no jewelry\". Several video tools handle negation poorly (Runway's guide: negative phrasing may\n  produce the opposite; Veo's guide: describe what you want instead).\n- **Short lock as well:** also write a `short_lock` of 10-25 words — the most recognizable features only —\n  for shots where the character is small, soft or secondary, and for multi-character prompts. It is owned by\n  you like the full lock and is also pasted verbatim, never improvised by others.\n\nShort lock example: \"slight 17-year-old East African girl, close-cropped black curls, scar through the\nleft eyebrow, silver hoop in the right ear\".\n\n## 2. Order of information\nCharacter lock: age + presentation · build and height impression · face shape · skin tone · eyes ·\nbrows/nose/mouth only if distinctive · hair (cut, length, color, texture) · one or two distinguishing marks ·\ncolor anchor if it is part of the body (e.g. dyed streak).\n\nCostume lock: main garment with material and color · second layer · lower body · footwear · accessories ·\ncondition baseline.\n\n## 3. Examples\n\nCharacter (photoreal):\n> A 17-year-old East African girl, slight and wiry, about 160 cm, oval face with high cheekbones, deep brown\n> skin with warm undertones, large dark-brown almond eyes, thick straight brows, a small scar through the\n> left eyebrow, short tight black curls cropped close at the sides and longer on top, small silver hoop in\n> the right ear only.\n\nCostume:\n> Oversized rust-orange waxed-cotton courier raincoat reaching mid-thigh, black reflective strip across the\n> back, hood attached; charcoal hoodie underneath; black cargo trousers; scuffed white high-top sneakers;\n> yellow canvas messenger bag worn cross-body on the left hip.\n\nCharacter (stylized 3D):\n> A small boxy maintenance robot, knee height to an adult, rounded-square body of dented sea-green painted\n> metal, one large circular optic lens in the center of the head with a crack across the upper left, two\n> short antenna stubs, three-fingered rubber-tipped claws, tank-tread feet, rust streaks running down from\n> every rivet.\n\n## 4. Common mistakes\n| Mistake | Fix |\n|---|---|\n| \"Young woman with dark hair and a jacket\" | Too generic: add age, face, hair cut, garment material/color |\n| Lock includes \"wet hair\" | Move to per-shot state |\n| Lock paraphrased in later prompts | Paste verbatim; the validator and QC check this |\n| Two characters share a color anchor | Change one anchor |\n| Lock exceeds 100 words | Cut details that don't help recognition at medium-shot size |\n| Uses brand names or celebrity comparisons | Describe the features instead |\n", "references/model-sheets.md": "# Model Sheets\n\nSpecifications for the reference sheets that become canon for every downstream image and video.\nConventions follow animation model-sheet practice (turnaround, expression and pose sheets; \"on-model\" vs\n\"off-model\") adapted for AI generation.\n\n## Contents\n1. Sheet set per character\n2. Turnaround sheet\n3. Expression sheet\n4. Pose sheet\n5. Costume sheet\n6. Lineup sheet\n7. Sheet brief format\n8. Drift checklist for generated sheets\n\n## 1. Sheet set per character\n| Sheet | Required when |\n|---|---|\n| Turnaround | always, for every character with screen time |\n| Expression | character's face is seen at MCU or closer |\n| Pose | character has signature physical actions |\n| Costume | one per costume look (can be a turnaround in that look) |\n| Hands | hands do story work (gestures, holding key props) |\n| Lineup | 2+ characters |\n\n## 2. Turnaround sheet\n- Views, left to right: **front, three-quarter front, side (profile), three-quarter back, back**. Five views;\n  a minimal set is front, side, back.\n- Same scale and same ground line for every view; full body head to toe; feet visible.\n- Neutral relaxed stance (or A-pose for 3D rigging), arms slightly away from the body so the costume reads.\n- Neutral expression, mouth closed.\n- Plain light-grey or white background, flat even studio lighting, no cast shadows on the background.\n- No props in the hands (props get their own sheet); bags and worn accessories stay on.\n- Optional: horizontal height lines across the sheet at head top, chin, shoulders, waist, knees for checking.\n\n## 3. Expression sheet\n- Head and shoulders, same angle (usually three-quarter front) and lighting in every cell.\n- Grid of 6-12 cells, each labeled with the emotion **and its visible form** (\"fear: eyes wide, brows up and\n  pinched, mouth slightly open\").\n- Choose expressions from the character's actual beats in the script; always include neutral.\n\n## 4. Pose sheet\n- 3-6 full-body poses taken from actions in the script (e.g. \"vaulting a railing\", \"hiding a parcel behind\n  her back\"); each labeled with the scene that needs it.\n- Poses show the character's posture habit and readable silhouette.\n\n## 5. Costume sheet\n- Front and back views in the look, plus detail callouts: closures, material close-ups, damage locations.\n- Condition states side by side when they matter (dry vs soaked).\n\n## 6. Lineup sheet\n- All characters side by side, front view, same scale, on one ground line, heights marked in cm.\n- Used to check relative heights, silhouettes and color anchors.\n\n## 7. Sheet brief format\nA model-neutral brief the image-prompt-engineer turns into a tool-specific prompt:\n\n```yaml\nsheet: turnaround\ncharacter: CH-MAYA\ncostume: CO-MAYA-01\nlayout: \"five full-body views left to right: front, three-quarter front, side, three-quarter back, back\"\ncontent: \"<character lock verbatim> <costume lock verbatim>\"\npose: \"relaxed neutral stance, arms slightly away from body, neutral expression, mouth closed\"\nbackground: \"plain light grey, no shadows\"\nlighting: \"flat even studio light\"\nstyle: \"<style lock verbatim>\"\naspect_ratio: \"16:9\"\nmust_match: [\"scar through LEFT eyebrow\", \"hoop in RIGHT ear only\", \"reflective strip across back\"]\n```\n\n## 8. Drift checklist for generated sheets\nCompare each generated image to the record, item by item:\n- [ ] Face shape, eye shape and color, brows, nose, mouth match; age reads correctly\n- [ ] Skin tone matches (compare against hex under neutral light)\n- [ ] Hair cut, length, parting side, color match; same in every view\n- [ ] Distinguishing marks present and on the **correct side** in every view\n- [ ] Height/proportions consistent across views (check head-heights against the height lines)\n- [ ] Costume: every layer, color, material, closure, accessory present and on the correct side\n- [ ] Back view shows back details (strips, prints, hood)\n- [ ] No extra items (rings, logos, text, belts) that are not in the record\n- [ ] Hands: correct finger count, no fused fingers\n- [ ] Background and lighting plain as specified (busy backgrounds contaminate later references)\nVerdict: APPROVE when every item passes; FIX when one or two items fail (give one edit instruction per item);\nREDO when the face or proportions are wrong.\n", "templates/character-template.md": "---\nartifact: character-bible\nid: CH-<SLUG>\nversion: 1\nstatus: DRAFT\nowner: character-designer\ndepends_on: [screenplay@N, style_bible@N]\nupdated: YYYY-MM-DD\n---\n# CH-<SLUG> — <Full name>\n\n## Evidence from the script\n| Scene | What they do | Costume/state needs |\n|---|---|---|\n\n## Design rationale\n- Role and personality:\n- Shape language:\n- Silhouette:\n- Color anchor(s) (hex):\n- Proportions (heads, cm):\n\n```yaml\nrecord: character\nid: CH-<SLUG>\nname:\nrole:\nage:\nheight_cm:\nbuild:\nidentity_lock: >-\n  <40-80 words, visual facts only>\nshort_lock: \"<10-25 words: most recognizable features, for small/soft/secondary appearances>\"\nface:\nhair:\nskin:\neyes:\nsilhouette:\ndistinguishing_features: []\ndefault_costume: CO-<SLUG>-01\ncostumes: [CO-<SLUG>-01]\nexpression_range: []\ninvariants: []\nallowed_variation: []\nreference_images: []\n```\n\n```yaml\nrecord: costume\nid: CO-<SLUG>-01\ncharacter: CH-<SLUG>\nname:\ngarments: []\nmaterials: []\ncolors: []\naccessories: []\ncondition_states:\n  - {id: BASE, description: \"\", from: SC01}\nscenes: []\nidentity_lock: >-\n  <25-60 words>\nshort_lock: \"<10-25 words: most recognizable features, for small/soft/secondary appearances>\"\n```\n\n## Sheets\n| Sheet | Status | Notes |\n|---|---|---|\n| Turnaround | | |\n| Expression | | |\n| Pose | | |\n\n(sheet briefs as YAML, see references/model-sheets.md section 7)\n\n## Reference image review log\n| Image | Verdict | Notes |\n|---|---|---|\n\n## Handoff\n- Produced:\n- Built from:\n- Open items:\n- Next:\n"}}, "cinematographer": {"description": "Acts as the director of photography for an AI film — turns the director's shot intent into exact camera and lighting specifications per shot (focal length, aperture and depth of field, focus plan, camera height, distance and position on the set plan, support, movement speed and path, frame rate and shutter feel) and a lighting setup per scene (motivated key, fill, rim, practicals, color temperatures, contrast ratio, atmosphere) consistent with the style bible's color script, written so image and video models can reproduce them. Use when the user asks for cinematography, camera settings, lens choice, lighting setups, lighting diagrams, depth of field, camera placement, or a DP pass on a shot list.", "body": "# Cinematographer (Director of Photography)\n\nYou make the director's intent physically exact. You own lenses, aperture and depth of field, camera\nposition/height/support, the execution of each move, and the lighting setups. You keep the shot sizes,\nangles, compositions and movement intents the director chose; if a choice can't work, you say why and\npropose an alternative rather than changing it.\n\n## Inputs\n- `06_direction/SC<NN>_direction.md` (shot list with lens feel, light mood, composition, blocking).\n- Location files (floor plan, light sources, time-of-day variants) and character lineup heights.\n- Style bible: lighting philosophy, lens character, color script row for the scene, palette anchors.\n- Action/animation plans if present. Brief: aspect ratio, frame rate, medium.\n\n## Outputs\n`07_camera/SC<NN>_camera.md` ([templates/camera-template.md](templates/camera-template.md)):\n1. Scene lighting setup(s): sources (motivated by the set), key/fill/rim/practicals with direction relative\n   to the set plan and to camera, quality (hard/soft), color temperature (K) or named color, contrast ratio\n   feel, atmosphere, what changes during the scene.\n2. Per shot: lens (mm, full-frame equivalent), aperture and depth of field, focus plan, camera height (m),\n   distance to subject, position on the floor plan, support, movement execution (path, distance, speed,\n   start/end framing), frame rate/shutter feel, which lighting setup applies, notes.\n3. A lighting diagram per setup (text plan) and continuity notes for light direction across shots.\n\n## Workflow\n\n```\nCamera progress (per scene):\n- [ ] 1 Read direction, sets, style; note the scene's light sources and color script\n- [ ] 2 Lighting setup(s) for the scene\n- [ ] 3 Lens and depth of field per shot\n- [ ] 4 Camera position, height, support per shot\n- [ ] 5 Movement execution per shot\n- [ ] 6 Consistency pass (light direction, eyelines, matching sizes)\n- [ ] 7 Model-language pass (describe so generators reproduce it)\n- [ ] 8 Checks; handoff\n```\n\n**1 Read.** For each shot note size, angle, composition, lens feel, light mood. From the location: which\nsources exist at this time of day and where they are on the plan.\n\n**2 Lighting setups.** Light from the world's sources (windows, practicals, signs, sky) as the style bible's\nphilosophy demands. Define key, fill (or none), rim/back, practicals, ambient/bounce and atmosphere per\nsetup, with direction (e.g. \"key from the window, camera right, 45° above eye line\"), quality, color and\nratio. A setup holds for every shot from that side of the axis; changing it needs a story motivation.\nSee [references/lighting.md](references/lighting.md).\n\n**3 Lens and DOF.** Convert lens feel to focal lengths (full-frame equivalent) and aperture using\n[references/lenses-and-camera.md](references/lenses-and-camera.md). Keep a consistent lens family per scene\nor character where the style calls for it (e.g. longer lenses on the antagonist). Choose aperture for the\ndepth of field the composition needs.\n\n**4 Position, height, support.** Place each camera on the floor plan (relative to landmarks and the axis),\nset height in meters (eye-level = the subject's eye height from the lineup), distance to subject, and\nsupport (tripod, dolly, gimbal, handheld, drone) matching the movement and the style.\n\n**5 Movement.** For every move: path, distance (m) or degrees, speed, start and end framing, what triggers\nit (a character's move, a line). Focus pulls: from what to what, at which second.\n\n**6 Consistency.** Within a scene, key light keeps its side relative to the set (reverse shots see it from\nthe other side — say how it then falls). Eyeline heights follow the lineup. Matched shot-reverse-shot\npairs use the same lens and distance. Time of day and weather match the scene and the color script.\n\n**7 Model language.** Write specs in words generators understand: lens mm plus its visible effect\n(\"85 mm, background compressed and soft\"), light as sources and directions with colors, DOF as what is sharp\nand what is soft. Models do not obey camera numbers precisely; the visible-effect words carry the intent.\n\n**8 Checks and handoff.** Run the quality checks; list proposals for the director (e.g. a move that\ncan't be executed in the space).\n\n## Boundaries\n- Do not change shot sizes, angles, compositions, blocking or the number of shots; propose instead.\n- Do not change the palette or color script; light within it (raise a CONFLICT if impossible).\n- Do not add light sources that the set doesn't have without telling the production-designer (a new\n  practical is a set change).\n- After approval, changes go through a change request.\n\n## Quality checks\n- Every shot has lens, aperture/DOF, focus plan, height, position, support, movement execution, setup ID.\n- Every light is motivated by a listed source or explicitly noted as stylized fill allowed by the style bible.\n- Key light side consistent within each setup; any change motivated.\n- Eyeline heights consistent with the character lineup.\n- Movement speeds and distances fit the shot duration.\n- Specs include visible-effect wording for generators.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Director's lens feel conflicts with the space (long lens in a tiny room) | Propose the closest workable alternative and its effect |\n| Color script asks for a light the set can't motivate | Ask production-designer for a source, or propose a motivated alternative |\n| Move can't fit the duration | Shorten the move or propose a longer shot |\n| Night scene too dark to read in generation | Add motivated rim/edge light and practicals; keep the low-key feel |\n| Generated shots ignore lens instructions | Strengthen visible-effect words; rely on keyframes for framing |\n\n## Handoff\nHandoff block listing SC<NN>_camera@version, setups, proposals for the director, new sources requested\nfrom the production-designer, and notes for the script supervisor on light continuity.\n\n## References\n- [references/lenses-and-camera.md](references/lenses-and-camera.md) — focal lengths, aperture and DOF, height, support, movement, shutter\n- [references/lighting.md](references/lighting.md) — motivated lighting, three-point and alternatives, color temperature, ratios, night and day\n- [templates/camera-template.md](templates/camera-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/lenses-and-camera.md": "# Lenses and Camera\n\n## Contents\n1. Focal length (full-frame equivalent)\n2. Aperture and depth of field\n3. Camera height and distance\n4. Support\n5. Movement execution\n6. Frame rate and shutter\n7. Words generators understand\n\n## 1. Focal length (full-frame equivalent)\nUse full-frame equivalent millimeters so values mean the same across tools.\n| Range | Look | Typical use |\n|---|---|---|\n| 14-24 mm | very wide, perspective exaggerated, space expands | establishing, cramped interiors, unease close up |\n| 28-35 mm | wide-normal, environmental, natural with context | walking-and-talking, mediums with background story |\n| 40-50 mm | normal, close to human perception | honest coverage, conversation |\n| 65-85 mm | short tele, flattering faces, background softens | close-ups, emotional singles |\n| 100-135 mm | long, strong compression, isolation | voyeur views, faces against abstract backgrounds |\n| 200 mm + | extreme compression | heat haze, crowds stacked, distant observation |\nClose with a wide lens = intimate and distorted; far with a long lens = observed and compressed. Same shot\nsize, different feeling — choose by intent.\n\n## 2. Aperture and depth of field\n- Wider aperture (f/1.4-f/2.8) → shallow DOF: subject isolated, background blurred.\n- Middle (f/4-f/5.6) → face sharp, background readable but soft.\n- Narrow (f/8-f/16) → deep focus: staging in layers, everything readable.\n- DOF also shrinks with longer lenses and closer distances.\n- State what is sharp and what is soft (\"sharp on her eyes, the door behind soft but readable\").\n- Focus pull (rack): from subject A to B at a given second, motivated by a look or a reveal.\n\n## 3. Camera height and distance\n- Eye-level = the subject's eye height (from the lineup heights, e.g. 1.5 m for a 160 cm character).\n- Low angle: camera below the eyes, looking up (power); high angle: above, looking down (vulnerability).\n- Shot size depends on distance and focal length; give both (e.g. \"MCU at 1.2 m on 50 mm\").\n\n## 4. Support\n| Support | Feel |\n|---|---|\n| Tripod / locked-off | stable, observational, formal |\n| Dolly / slider | smooth precise push/pull/truck |\n| Crane / jib | vertical reveals, rising/falling |\n| Steadicam / gimbal | floating, following through space |\n| Handheld | urgent, subjective, documentary |\n| Drone | aerial scale, transitions between worlds |\n| Car mount | vehicle interiors/exteriors at speed |\n\n## 5. Movement execution\nWrite: move type (from the schema vocabulary), path on the plan, distance or angle, speed, start framing →\nend framing, trigger, duration. Example: \"dolly-in 0.8 m over 4 s, MS → MCU, starts as she reads the label,\nends on her eyes.\" Slow moves are more reliable in generation than fast ones.\n\n## 6. Frame rate and shutter\n- 24 fps standard narrative look. Higher frame rates are used for slow motion when played back at 24.\n- 180° shutter equivalent (1/48 s at 24 fps) gives natural motion blur; a narrower shutter gives staccato,\n  crisp motion (often used for action intensity); wider gives smeared, dreamy motion.\n- For AI generation, these become descriptive words (\"natural motion blur\", \"crisp staccato motion\",\n  \"slow motion\").\n\n## 7. Words generators understand\nPair each number with its visible effect, since generators interpret camera numbers loosely:\n- \"85 mm portrait lens, background compressed and creamy\" · \"24 mm wide lens, room stretches, close and\n  slightly distorted\" · \"deep focus, foreground railing and background sign both sharp\" · \"slow push-in\" ·\n  \"locked-off static camera\" · \"handheld, subtle shake\". Official guides use this kind of language (Veo 3.1\n  lists \"shallow depth of field, wide-angle lens, soft focus, macro lens, deep focus\"; Sora 2 uses lens and\n  DOF lines such as \"35 mm virtual lens; shallow depth of field\").\n", "references/lighting.md": "# Lighting\n\n## Contents\n1. Motivated lighting\n2. Key, fill, rim and alternatives\n3. Quality: hard and soft\n4. Color temperature and color\n5. Contrast ratio and key\n6. Day, night, interiors, exteriors\n7. Lighting diagram format\n8. Consistency across shots\n9. Writing light for generators\n\n## 1. Motivated lighting\nEvery light should appear to come from a source in the world: sun, sky, window, lamp, screen, fire, sign.\nThe production-designer lists sources per location and time; you decide how each lights the subject.\nStylized unmotivated light (pure color washes, theatrical spot) only if the style bible allows it.\n\n## 2. Key, fill, rim and alternatives\n- **Key:** main light; its side and height define the face's shape and mood.\n- **Fill:** lifts shadows; less fill = more contrast. \"No fill\" is a valid, dramatic choice.\n- **Rim/back light:** separates the subject from the background; essential in dark scenes.\n- **Practicals:** visible lamps/signs in frame; often motivate the key.\n- **Bounce/ambient:** soft overall level from walls, sky.\n- **Negative fill:** blocking light to deepen shadows on one side.\nCommon setups: **short side key** (key on the side of the face turned away from camera — sculpted, moody),\n**broad key** (key on the side toward camera — open, flatter), **top light** (harsh, isolating),\n**under light** (unnatural, horror), **silhouette** (backlight only).\n\n## 3. Quality: hard and soft\nHard light (small or distant source: sun, bare bulb, neon tube at distance) → crisp shadows, texture,\ntension. Soft light (large or diffused source: overcast sky, big window, bounced light) → gentle shadow\nedges, calm, beauty.\n\n## 4. Color temperature and color\nApproximate values: candle ~1900 K, tungsten bulb ~3200 K, sunrise/sunset ~3000-3500 K, daylight ~5600 K,\novercast/shade ~6500-7500 K, blue hour higher still. Lower K looks warmer (orange), higher K cooler (blue).\nColored sources (neon, signs, screens) are named by color. Mixed color temperature between key and\nbackground creates separation (warm interior vs blue window).\n\n## 5. Contrast ratio and key\nDescribe contrast as a ratio feel: low (soft, high-key, shadows keep detail), medium, high (shadows to\nnear black, low-key). Keep it consistent with the style bible's contrast and the color script row.\n\n## 6. Day, night, interiors, exteriors\n- **Day exterior:** the sun's direction relative to the floor plan; backlit faces with bounce look\n  cinematic; overcast for soft.\n- **Night exterior:** motivated by streetlights, signs, windows, moon; always give an edge/rim so shapes read;\n  wet surfaces add reflections.\n- **Day interior:** windows as key; the inside darker than outside unless filled.\n- **Night interior:** practicals as key; pools of light and darkness; the window becomes a cool fill or rim.\n\n## 7. Lighting diagram format\n```\nSETUP A (SC03, landing, night) — camera on the south (stairs) side\n            N\n   [painted 3 wall]\n W [skylight: rain, cool moonlight top]            E\n   Maya ●→ faces E           [D2 door: warm 2700 K spill through chain gap]\n   key: caged bulb above-left of Maya (W wall), hard, 3200 K\n   rim: skylight top-back, cool\n   fill: none (shadow side near black)\n   camera: S, 1.5 m height\n```\n\n## 8. Consistency across shots\n- Within a setup, the key stays on the same side relative to the set; when you shoot the reverse, the\n  light falls on the other side of the face — that is correct and must be stated.\n- Light doesn't change level or color between shots of the same moment unless motivated (a door opens).\n- Track time of day across scenes in a sequence (dusk can't jump to midday).\n\n## 9. Writing light for generators\nDescribe sources, directions and colors in plain words, plus 3-5 palette anchors (Sora 2 guide: name the\nsources and tones, e.g. \"soft window light with warm lamp fill, cool rim from hallway\"):\n\"hard magenta neon key from frame right, cool blue rim from behind on frame left, no fill, deep shadows,\nwet surfaces reflecting neon\". Avoid \"dramatic lighting\" or \"cinematic lighting\" without specifics.\n", "templates/camera-template.md": "---\nartifact: camera-plan\nid: SC<NN>_camera\nversion: 1\nstatus: DRAFT\nowner: cinematographer\ndepends_on: [SC<NN>_direction@N, LOC-<SLUG>@N, style_bible@N]\nupdated: YYYY-MM-DD\n---\n# SC<NN> Camera and Lighting\n\nColor script row: <dominant / accent / warm-cool / key>. Time/weather: <...>.\n\n## Lighting setups\n\n### Setup A — <description>\n| Light | Source (set) | Direction (plan + camera-relative) | Quality | Color / K | Notes |\n|---|---|---|---|---|---|\n| Key | | | | | |\n| Fill | | | | | |\n| Rim | | | | | |\n| Practicals | | | | | |\n| Atmosphere | | | | | |\nContrast feel: <low / medium / high>. Changes during scene: <...>.\n\n```\n(lighting diagram)\n```\n\n## Shots\n| Shot | Setup | Lens (mm FF) | Aperture / DOF | Focus plan | Height m | Distance m | Position on plan | Support | Movement execution | Motion feel | Generator wording |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n\n## Consistency notes\n- Key side per setup:\n- Matched pairs:\n- Eyeline heights:\n\n## Proposals to the director\n- PROPOSAL: ...\n\n## Handoff\n- Produced:\n- Next: script-supervisor, production-manager\n"}}, "film-director": {"description": "Directs an approved screenplay scene by scene the way a professional film director does — analyzes each scene's objective, conflict, subtext and turn, sets a visual thesis, blocks the actors on the set plan, writes playable performance notes, and designs the shot breakdown (shot sizes, angles, framing and composition, camera movement intent, lens feel, lighting mood, duration, screen direction and transitions), with genre playbooks for drama, comedy, horror, romance and thriller, and constraints that keep shots generatable by AI video models. Use when the user wants a scene directed, blocking, staging, coverage, a shot list or shot breakdown, a director's treatment, performance notes, or \"how should this scene be shot\". For fights and stunts add action-director; for animation add animation-director.", "body": "# Film Director\n\nYou translate the locked screenplay into visual storytelling decisions. You own blocking, performance,\nthe shot breakdown, shot intent (size, angle, movement, lens feel, lighting mood, duration) and\ntransitions. The cinematographer turns your intent into exact lenses and lighting setups; the script\nsupervisor records continuity; you do not change the script's events or dialogue.\n\n## Inputs\n- Screenplay (LOCKED or APPROVED) and scene index (purpose, value change, scene cards).\n- Character bibles (heights, silhouettes, expression range), location files (floor plans, landmarks,\n  light sources), style bible (color script, lighting philosophy, lens character).\n- Brief: runtime, aspect ratio, medium, target video tools (affects shot length and complexity).\n\n## Outputs\n`06_direction/SC<NN>_direction.md` per scene ([templates/scene-direction-template.md](templates/scene-direction-template.md)):\n1. Scene analysis: objective/obstacle per character, conflict, subtext, the turn, visual thesis.\n2. Beat map (where pressure changes) with screenplay references.\n3. Blocking: positions on the location floor plan at the start, each move with its motivation, end\n   positions; axis of action and which side the camera stays on.\n4. Performance notes: playable actions and physical behavior per beat (not emotions to \"play\").\n5. Shot list: one row per shot with ID (`SC<NN>-SH<NNN>` in tens), size, angle, movement intent, subject,\n   action with an end state, composition note, lens feel, lighting mood, duration, purpose, transition out.\n6. Coverage rationale, rhythm, transitions in/out of the scene, AI-risk notes, flags for specialists.\n\n## Workflow\n\n```\nDirection progress (per scene):\n- [ ] 1 Read scene, scene card, designs; note what must be seen\n- [ ] 2 Analysis + visual thesis\n- [ ] 3 Beat map\n- [ ] 4 Blocking on the floor plan + axis\n- [ ] 5 Performance notes\n- [ ] 6 Shot list (sizes, angles, moves, composition, durations)\n- [ ] 7 Genre playbook pass\n- [ ] 8 AI-feasibility pass\n- [ ] 9 Checks; specialist flags; handoff\n```\n\n**1 Read.** List every story fact the audience must see or hear in this scene (from the screenplay and\nscene card). Nothing on this list may be lost in coverage; nothing outside it may be added as a story event.\n\n**2 Analysis.** For each character: what they want in this scene, what stops them, how they try to get it\n(tactics). Name the subtext and the turn (the moment the value flips). Write a **visual thesis**: one\nconcrete, photographable idea that governs the scene (\"the courier gets smaller in frame as the building\ncloses around her\"). Method: [references/directing-craft.md](references/directing-craft.md).\n\n**3 Beats.** Split the scene where pressure changes, not where the camera changes. Each beat: what changes,\nwho drives it, screenplay lines covered.\n\n**4 Blocking.** Place characters on the floor plan; move them only with a motivation (an intention, a\ntactic, a reaction). Use distance, height and facing to express power and intimacy. Fix the axis of action\nfor each exchange and keep the camera on one side unless you cross it deliberately (on-screen move, a\nneutral shot or a cutaway). State screen direction for every exit and entrance so the next scene matches.\n\n**5 Performance.** Give each beat a playable action verb (\"to warn\", \"to dismiss\", \"to buy time\") and the\nvisible behavior it produces (gesture, posture, eyeline, breath, stillness). Never direct the result (\"be\nsad\"); AI video prompts need the visible form anyway.\n\n**6 Shot list.** Design coverage from the beats using [references/shot-grammar.md](references/shot-grammar.md):\nsize follows emotional distance, angle follows power, movement needs a motivation, composition places the\neye where the beat is. For every shot: one primary action with an end state; at most one camera move;\na duration that fits the action (and lines at ~2.5 words/s); a purpose sentence; a transition. Number\nshots in tens (SH010, SH020) so inserts fit later.\n\n**7 Genre pass.** Apply the matching playbook in [references/genre-playbooks.md](references/genre-playbooks.md)\n(drama, comedy, horror, romance, thriller). If the scene mixes genres, choose the scene's dominant one\nand note the exceptions.\n\n**8 AI-feasibility pass.** Check each shot against the risks in shot-grammar.md section 8: one primary\naction, stable identity (faces not tiny and turning at once), few characters in contact, no long fine-hand\nwork, readable text flagged for VFX, clip-length limits of the target tool (most tools: a few seconds to\n~20 s per generation). Split or simplify risky shots now — it is cheaper than failed generations.\n\n**9 Checks and flags.** Run the quality checks. Flag scenes for **action-director** (fights, chases,\nstunts, falls, physical set pieces) and **animation-director** (animated medium). End with the handoff.\n\n## Boundaries\n- Do not change story events, dialogue or their order; propose changes to the screenwriter (`PROPOSAL:`).\n- Do not specify exact focal lengths, f-stops or lighting rigs — give lens feel and lighting mood;\n  the cinematographer decides values (you may veto if the result breaks the intent).\n- Do not redesign characters, costumes, sets or the palette.\n- Do not choreograph fight moves in detail (action-director) or set frame-by-frame animation timing\n  (animation-director); give them the dramatic intent and shot slots.\n- After approval, changes go through a change request (shots feed every later department).\n\n## Quality checks\n- Every must-see story fact from step 1 appears in at least one shot; no shot adds a story event.\n- Every shot: purpose, one primary action with end state, ≤ 1 camera move, duration, transition out.\n- Shot durations sum to the scene's estimated duration (±15%) or the difference is explained.\n- Axis and screen direction stated; any line cross is deliberate and explained.\n- Each beat has a playable action; no emotion-only direction.\n- The visual thesis is visible in the shot choices (state where).\n- Specialists flagged where needed; AI risks listed with the mitigation chosen.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Script beat can't be shown clearly in the location as designed | Ask production-designer for the feature, or propose a blocking alternative |\n| Scene runs long against the estimate | Remove redundant coverage first; then propose line trims to the screenwriter |\n| Dialogue-heavy scene with little action | Find business (props, tasks) and motivated moves; vary sizes by beat |\n| The tool can't do the planned move or length | Split the shot or lock the camera; note the trade-off |\n| Two characters must touch/struggle | Keep it brief, wide enough to read, or cover with reactions and inserts; flag action-director |\n| Upstream document missing or DRAFT | Proceed with `ASSUMPTION:` only if the user accepts; otherwise stop |\n\n## Handoff\nHandoff block listing each SC<NN>_direction@version, shot count and total duration, specialist flags, VFX\nflags, and questions for the cinematographer (lens feel, lighting mood) and script supervisor (axis plan).\n\n## References\n- [references/directing-craft.md](references/directing-craft.md) — scene analysis, beats, playable actions, blocking patterns\n- [references/shot-grammar.md](references/shot-grammar.md) — sizes, angles, movement, composition, coverage, axis rules, transitions, AI risks\n- [references/genre-playbooks.md](references/genre-playbooks.md) — drama, comedy, horror, romance, thriller\n- [references/example-direction.md](references/example-direction.md) — one directed scene\n- [templates/scene-direction-template.md](templates/scene-direction-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/directing-craft.md": "# Directing Craft\n\n## Contents\n1. Scene analysis\n2. Visual thesis\n3. Beats\n4. Playable actions\n5. Blocking patterns\n6. Power, distance and height\n7. Reaction and stillness\n\n## 1. Scene analysis\nAnswer per scene, one line each:\n- **Literal event:** what happens on the surface.\n- **Objectives:** what each character wants from the other(s) in this scene.\n- **Obstacle:** what stands in the way (the other character, circumstances, themselves).\n- **Tactics:** how they try (charm, threaten, deflect, plead) — tactics change when they fail.\n- **Subtext:** what the scene is really about.\n- **The turn:** the moment the scene's value flips (from the scene card), and who causes it.\n- **Audience position:** do we know more than the characters (suspense), less (mystery), or the same?\n\n## 2. Visual thesis\nOne photographable idea that organizes the scene's choices, stated as a change you can see:\n- \"The room's door stays in every shot behind her until she finally walks through it.\"\n- \"We start wide and loose; every beat Owen lies, the frame tightens on Maya.\"\nIf it cannot be shot, it is a theme, not a thesis. Point to the shots that carry it.\n\n## 3. Beats\nA beat is a change in the balance of pressure: new information, a new tactic, a decision, a reveal. Shots\nserve beats; one beat can be one shot or five. Mark the scene's biggest beat (usually the turn) — it gets\nthe strongest image and the most time.\n\n## 4. Playable actions\nDirect with transitive verbs that one character does to another: to warn, to test, to seduce, to belittle,\nto reassure, to stall, to accuse. Each produces behavior: where they look, how close they stand, what their\nhands do, how fast they speak. Write the behavior, because it is what the camera and the video model see:\n- Result direction (avoid): \"she is angry\".\n- Playable direction: \"to make him leave — she keeps her back to him, folds the shirt too hard, answers\n  without looking.\"\n\n## 5. Blocking patterns\n- **Motivated moves:** a character moves because of an intention (to get closer, to escape, to fetch, to\n  hide) — never just to vary the picture.\n- **Triangles:** three characters arranged in depth read better than three in a line.\n- **Business:** give characters tasks with props (cooking, packing, repairing); tasks reveal character and\n  give the camera action during dialogue.\n- **Entrances and exits:** decide the side and keep screen direction consistent with the previous and\n  next scene (left-to-right as \"forward\" in a journey, for example).\n- **Depth staging:** foreground/background separation lets one shot carry two beats (one character in\n  focus listening, the other behind).\n- **Use the set:** doors, windows, stairs and landmarks are blocking tools.\n\n## 6. Power, distance and height\n- Higher in frame / standing over / center of frame → power; lower / edge of frame → weakness.\n- Approaching → pressure or intimacy; backing away → retreat; turning the back → refusal or vulnerability.\n- Barriers between characters (tables, doorframes, railings) express separation; removing them is a beat.\n- Eyelines: who looks at whom, and who avoids it, tells the relationship.\n\n## 7. Reaction and stillness\nThe listener often matters more than the speaker. Plan reaction shots at the beats that change the\nlistener. Stillness after movement is a strong beat; hold it long enough to land (often 1-3 s on screen).\n", "references/example-direction.md": "# Example: One Directed Scene\n\nScene (from the screenwriter's example): INT. APARTMENT BUILDING - THIRD FLOOR LANDING - NIGHT. Maya\ndelivers to \"4B\"; Mr. Adebayo says there is no fourth floor; she reads her own address on the label.\n\n## Analysis\n- Maya wants to finish the delivery and get paid; obstacle: the address doesn't exist; tactic: insist, then check.\n- Mr. Adebayo wants to protect his door, then to help; tactic: deny, then offer.\n- Subtext: she has been sent to find herself. Turn: the label (certain → disoriented).\n- Audience position: same as Maya (mystery).\n- **Visual thesis:** the chain on the door stays between them; when she reads her name, he stops mattering —\n  the frame loses him.\n\n## Beats\n| Beat | Change | Lines |\n|---|---|---|\n| B1 | arrival, knock | action 1-2 |\n| B2 | denial: \"There is no four.\" | dialogue 1-2 |\n| B3 | proof: the painted 3 | action 3 |\n| B4 | the label (turn) | insert + action |\n| B5 | offer refused; she leaves | dialogue 3, action |\n\n## Blocking\nFloor plan LOC-LANDING: stairs up from south, door D2 on the east wall, blank wall with painted \"3\" to the north.\n- Start: Maya at top step facing east toward D2. Mr. Adebayo inside D2 behind the chain.\n- B3: Maya turns north to the painted 3 (motivated by his look). B5: she exits south, down the stairs.\n- Axis: Maya–door line (west–east). Camera stays on the south side (stairs side) for B1-B4.\n- Screen direction: Maya faces screen right toward the door and exits screen left down the stairs, so SC04\n  must continue her movement screen left (noted for the script supervisor).\n\n## Performance\n- B2 Maya: to insist — weight forward, parcel held out. Adebayo: to refuse — doesn't look at the parcel,\n  looks past her up the stairs.\n- B4 Maya: to understand — stillness, thumb stops mid-wipe, breath held.\n- B5 Adebayo: to reach out — voice drops, a half-step toward the chain. Maya: to escape — moves before he finishes.\n\n## Shot list\n| ID | Size | Angle | Move | Subject | Action (end state) | Composition | Lens feel | Light mood | Dur | Purpose | Out |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| SC03-SH010 | WS | eye-level | static | Maya, door | Maya climbs last step, knocks twice; ends waiting, parcel under arm | door frame right, stairs left | normal, deep | dim corridor bulb, skylight rain | 4 s | arrival | cut on door opening |\n| SC03-SH020 | OTS | eye-level | static | Adebayo over Maya's shoulder | door opens on chain; he says \"There is no four.\"; ends looking up past her | chain at frame center | normal, shallow | warm interior spill through gap | 4 s | denial | cut on his look |\n| SC03-SH030 | MS | low | pan-left | Maya → wall | Maya follows his look to the painted \"3\"; pan ends on the wall | wall center | normal | hard bulb on wall | 3 s | proof | cut |\n| SC03-SH040 | INSERT | high | static | label | her thumb wipes rain off; her name and street read; ends still | label fills frame | long, shallow | rain-light | 2 s | the turn | cut |\n| SC03-SH050 | CU | eye-level | dolly-in | Maya | she stays still, eyes fixed; Adebayo's line O.S.; push ends tight as she turns to go | Maya center, door edge soft | long, shallow | bulb top light | 4 s | disoriented; he no longer matters | cut on turn |\n| SC03-SH060 | WS | high | static | stairs | Maya goes down out of frame left; chain still on in foreground | chain foreground right | wide, deep | dim | 3 s | exit | cut to SC04 |\n\nTotal 20 s (scene estimate 25 s: hold SH050 one more second if the edit needs air).\n\n## AI risks\n- SH040 readable label → VFX insert of text (flag vfx-supervisor). SH020 chain + door + two faces: keep\n  door static; one action (he speaks).\n\n## Handoff\n- Produced: SC03_direction@1 (REVIEW), 6 shots, 20 s\n- For cinematographer: warm interior spill vs cold landing; SH050 long lens push.\n- For script-supervisor: axis W–E, camera south; Maya exits screen left.\n", "references/genre-playbooks.md": "# Genre Playbooks\n\nApply the dominant genre of the scene. Each playbook: what the audience must feel, then the directing\nlevers. Action/fight scenes go to the action-director; animated work to the animation-director.\n\n## Contents\n1. Drama\n2. Comedy\n3. Horror\n4. Romance\n5. Thriller and suspense\n6. Mixing genres\n\n## 1. Drama\n- **Feel:** the character's inner change, felt through small behavior.\n- **Levers:** restraint; let performances play in MS/MCU with time to breathe; reactions over speeches;\n  motivated, slow moves (push-ins at realizations); natural motivated light; hold on silence after a turn.\n- **Avoid:** over-coverage that cuts away from the key emotion; music doing the acting.\n\n## 2. Comedy\n- **Feel:** surprise and release; the audience is ahead of or exactly with the joke.\n- **Levers:**\n  - **Frame the joke whole:** show setup and payoff in the same frame when possible (wider sizes, FS/WS),\n    so the audience sees the cause and the effect at once.\n  - **Timing:** the pause before the payoff; the reaction after it — cut to the reaction at the laugh, not before.\n  - **Rule of three:** setup, reinforce, subvert.\n  - **Static camera** lets physical comedy read; movement can kill the timing.\n  - **High-key light**, brighter palette unless the comedy is dark.\n  - **Reaction shots** of the straight character carry many jokes.\n- **Avoid:** cutting mid-gag; close-ups that hide the physical cause.\n\n## 3. Horror\n- **Feel:** dread (anticipation) more than shock; the audience fears what they cannot see.\n- **Levers:**\n  - **Negative space:** leave empty areas (dark doorways, the edge of the frame) where something could appear.\n  - **Withhold:** delay the reveal; show the reaction before the threat; partial views (hands, shadows).\n  - **Slow pace, then break:** long holds and slow creeping moves; a sudden cut or sound for the scare.\n  - **Low-key light**, hard shadows, single sources, darkness that hides the frame edges.\n  - **Sound** does half the work: plan silence before scares (tell the sound-designer).\n  - **Point of view:** shots from an unknown watcher's position make the audience complicit.\n- **Avoid:** showing the monster fully too early; jump scares without build-up; constant shaky camera.\n\n## 4. Romance\n- **Feel:** attraction, longing, the distance between two people closing (or not).\n- **Levers:**\n  - **Distance as the story:** start characters separated in frame (separate singles, barriers between),\n    bring them together into two-shots as they connect.\n  - **Eyelines and looks:** the stolen glance, the held look; cut on looks.\n  - **Longer lenses, shallow focus** isolate the couple from the world; soft, warm, flattering light.\n  - **Slow movement:** arcs and slow push-ins; time slows at the moment of connection.\n  - **Hands and small touches** as inserts (keep short for AI).\n- **Avoid:** cutting away at the moment of contact; over-scored moments.\n\n## 5. Thriller and suspense\n- **Feel:** tension from information the audience has (Hitchcock's bomb-under-the-table principle: show\n  the audience the bomb, then make them wait).\n- **Levers:** show the threat to the audience early; cross-cut between the threat and the unaware\n  character; tighten sizes and shorten shots as the clock runs down; use inserts of the ticking element;\n  cool palette with hot accents; keep geography clear so the audience can measure danger.\n- **Avoid:** confusing geography; revealing everything verbally.\n\n## 6. Mixing genres\nPick the dominant genre per scene and borrow levers deliberately: a horror-comedy frames the joke wide but\nlights it low-key; a romantic thriller uses romance distance rules inside a suspense structure. State the\nmix in the scene analysis.\n", "references/shot-grammar.md": "# Shot Grammar\n\n## Contents\n1. Shot sizes and what they do\n2. Angles\n3. Camera movement and motivation\n4. Composition\n5. Lens feel (intent for the cinematographer)\n6. Coverage strategies\n7. Axis, eyelines and the 30-degree rule\n8. AI-feasibility risks\n9. Transitions\n10. Shot list row format\n\n## 1. Shot sizes and what they do\nVocabulary is fixed by the production schema (EWS, WS, FS, MWS, MS, MCU, CU, ECU, INSERT, TWO-SHOT, OTS, POV).\n- **EWS/WS:** geography, scale, isolation; establish or re-establish.\n- **FS/MWS:** body language, movement, two people's relationship in space.\n- **MS:** conversation baseline; gesture plus face.\n- **MCU/CU:** emotion, decision, reaction; the audience is close to the character.\n- **ECU:** a detail that is the whole beat (eyes deciding, a trembling finger).\n- **INSERT:** an object that carries story information.\n- **OTS:** relationship and point of view in dialogue; ties two characters.\n- **POV:** we see what the character sees; puts the audience in their head.\nRule of thumb: the closer the shot, the more it must earn its place; save the tightest size for the turn.\n\n## 2. Angles\nEye-level (neutral, equal), low (power, threat, heroism), high (vulnerability, being watched), overhead\n(pattern, fate, clinical distance), dutch (unease — use rarely), profile (observing, separation), frontal\n(confrontation, direct address).\n\n## 3. Camera movement and motivation\nMove the camera when something motivates it: a character's movement (follow, lead), revealing information\n(push to a detail, crane up to reveal scale), an emotional shift (slow push-in as realization lands), or\npoint of view. Otherwise stay static — a still frame is a strong, generatable choice.\n- **Push-in (dolly-in):** growing importance or realization. **Pull-out:** isolation, reveal of context.\n- **Pan/tilt:** connect two things in one space; follow a glance.\n- **Truck/arc:** reveal depth and dimension; energy.\n- **Handheld:** urgency, instability, documentary; motivated by panic or chaos.\n- **Crane/drone:** scale, transition between worlds; often at openings and endings.\nEvery move has a start, a speed and an end (\"slow push-in from MS to MCU over 4 s, ends when she looks up\").\n\n## 4. Composition\n- Place the eye where the beat is: subject on a third, or centered for confrontation/symmetry.\n- **Looking room:** space in front of the face in the direction of the eyeline.\n- **Headroom:** tighter headroom for tension; generous for calm.\n- **Depth:** foreground, midground, background layers; use foreground framing (doorways, railings).\n- **Leading lines** (roads, railings, light streaks) toward the subject.\n- **Negative space** for isolation or threat (horror: the empty part of the frame).\n- **Balance:** a small bright element can balance a large dark mass.\n\n## 5. Lens feel (intent for the cinematographer)\nGive the feel and why; the cinematographer picks millimeters:\n- **wide** — space, energy, closeness with distortion, the environment matters;\n- **normal** — natural, honest, conversation;\n- **long** — compression, isolation, voyeurism, faces against soft backgrounds.\nAdd depth-of-field intent (shallow to isolate / deep to stage in layers).\n\n## 6. Coverage strategies\n- **Master + coverage:** wide master of the whole scene, then mediums, singles, inserts. Safe; flexible in\n  the edit; for AI production, generate only what the edit will use.\n- **Designed sequence:** each shot planned for one beat, no redundancy — efficient for AI films.\n- **Oner / long take:** one continuous shot; powerful but very risky for current video models (identity and\n  layout drift over time; length limits).\n- **Shot-reverse-shot:** for dialogue; keep sizes matched between the two sides until a beat breaks it.\nChoose per scene and say why.\n\n## 7. Axis, eyelines and the 30-degree rule\n- **180-degree rule:** draw the line between the two characters (or along the direction of movement); keep\n  the camera on one side so screen positions and directions stay stable. Cross only on screen (camera move),\n  via a neutral shot on the axis, or after a cutaway/re-establishing wide.\n- **Eyelines:** if A looks screen right at B, B looks screen left at A. Match eyeline height to the lineup\n  heights (a taller character looks down).\n- **30-degree rule:** consecutive shots of the same subject should change angle by ~30° or more (or change size\n  clearly) to avoid a jump cut — unless a jump cut is intended.\n- **Screen direction across scenes:** a journey keeps a consistent direction (e.g. left → right) until a\n  story reason reverses it.\n\n## 8. AI-feasibility risks\nPlan around what current video models often get wrong:\n| Risk | Mitigation |\n|---|---|\n| Two or more actions in one clip | one primary action; split the shot |\n| Complex camera move + complex action together | lock the camera or simplify the action |\n| Small faces turning or far from camera in key emotional beats | go closer for the emotional beat |\n| Several characters touching, grappling, dancing | keep brief and wide, or cover with inserts/reactions |\n| Long fine-hand tasks | show start and result; keep the hands shot short |\n| Readable text, screens, signs | plan a clean shot; flag VFX to add text in post |\n| Long takes past the tool's clip length | split into shots or plan an extend with a motivated cut point |\n| Exact continuity of a moving object across cuts | cut on action with the object clearly placed |\n\n## 9. Transitions\nDefault is a straight cut. Use others for meaning: match cut (connect two ideas by shape or motion),\ncut on action (smooth continuity), J-cut/L-cut (sound leads/trails, smooth emotional flow), smash cut\n(contrast), dissolve (time passing, memory), fade to black (ending, big time jump), whip pan (energy).\nState the cut point (\"cut on her look-up\").\n\n## 10. Shot list row format\n| ID | Size | Angle | Move | Subject | Action (with end state) | Composition | Lens feel | Light mood | Dur | Purpose | Out |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| SC03-SH020 | MCU | high | static | Maya | turns parcel over, wipes label; ends looking up at the window | Maya left third, label center | normal, shallow | hard neon key, no fill | 4 s | she realizes it is her address | cut on look-up |\n", "templates/scene-direction-template.md": "---\nartifact: scene-direction\nid: SC<NN>_direction\nversion: 1\nstatus: DRAFT\nowner: film-director\ndepends_on: [screenplay@N, style_bible@N, LOC-<SLUG>@N, CH-<SLUG>@N]\nupdated: YYYY-MM-DD\n---\n# SC<NN> Direction — <scene heading>\n\n## Must-see story facts\n- ...\n\n## Analysis\n| Character | Wants | Obstacle | Tactics |\n|---|---|---|---|\n\n- Subtext:\n- Turn:\n- Audience position: suspense / mystery / same\n- Visual thesis: <one photographable idea> — carried by shots: ...\n- Genre playbook: <drama/comedy/horror/romance/thriller> (+ exceptions)\n\n## Beats\n| Beat | Change | Driven by | Screenplay lines |\n|---|---|---|---|\n\n## Blocking\nFloor plan: <LOC-...>\n- Start positions:\n- Moves (beat · who · from → to · motivation):\n- End positions:\n- Axis of action and camera side:\n- Screen direction in/out:\n\n## Performance\n| Beat | Character | Playable action | Visible behavior |\n|---|---|---|---|\n\n## Shot list\n| ID | Size | Angle | Move | Subject | Action (end state) | Composition | Lens feel | Light mood | Dur | Purpose | Out |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n\nTotal: <n> s vs estimate <n> s.\n\n## Coverage and rhythm\n<strategy and why; where the scene breathes; where it accelerates>\n\n## AI risks and mitigations\n| Shot | Risk | Mitigation |\n|---|---|---|\n\n## Specialist and VFX flags\n- action-director: ...\n- animation-director: ...\n- vfx: ...\n\n## Handoff\n- Produced:\n- Built from:\n- Open items:\n- Next: cinematographer, script-supervisor\n"}}, "film-editor": {"description": "Edits an AI film the way a picture editor does — before generation, runs a paper edit of the shot list for pacing, runtime, rhythm, redundant or missing coverage and cut points; after generation, selects the best usable seconds of each take, trims, orders, chooses cuts and transitions (cut on action, match cuts, J and L cuts), times picture to dialogue and music, builds a cut list, exports a CMX3600 EDL and an ffmpeg rough-cut script, and defines the post order (conform, grade, sound, titles, delivery). Use when the user asks for editing, pacing, a paper edit, rough cut, assembly, cut list, EDL, trimming AI clips, transitions, runtime reduction, or how to cut generated clips together.", "body": "# Film Editor\n\nYou shape time. You own the order, length and cut points of every shot in the edit, and the transitions.\nBefore generation you protect the film from wasted generations (pacing, missing coverage); after\ngeneration you build the cut from the best usable material. Story events and dialogue belong to the\nscreenplay; changes to shots go through the director as change requests.\n\n## Inputs\n- **Paper edit:** compiled shot records (durations, transitions, purposes), screenplay, scene index, target\n  runtime, music plan (tempo, hit points).\n- **Assembly:** generated takes per shot (file names per production-schema section 6) with QC verdicts,\n  approved voice/music/SFX, the video prompt records (trim notes).\n\n## Outputs\n`13_edit/edit_plan.md` ([templates/edit-plan-template.md](templates/edit-plan-template.md)):\n1. Paper edit: timeline table, runtime vs target, rhythm analysis (average shot length per scene), problems\n   found, change requests (shots to add, cut, retime, merge).\n2. Assembly: take selection per shot (file, usable in/out), cut list, transitions with reasons, audio\n   overlaps (J/L), music sync points, version (assembly → rough → fine → locked).\n3. `13_edit/cutlist.csv` and, via `scripts/build_cut.py`, `13_edit/cut.edl` (CMX3600) and\n   `13_edit/assemble.sh` (ffmpeg rough cut).\n4. Post order and delivery notes (conform, grade intent per scene from the style bible, sound mix, titles,\n   exports).\n\n## Workflow\n\n```\nEdit progress:\n- [ ] 1 Paper edit: timeline and runtime\n- [ ] 2 Rhythm and coverage review → change requests\n- [ ] 3 (after generation) Take selection: usable seconds\n- [ ] 4 Assembly cut list\n- [ ] 5 Transitions, J/L cuts, music sync\n- [ ] 6 Build EDL and rough-cut script\n- [ ] 7 Review the cut; versions; post order; handoff\n```\n\n**1 Paper edit.** Lay all shots in order with durations; total per scene and overall; compare with the\ntarget runtime. Mark each cut point (on action, on a look, on a line).\n\n**2 Rhythm and coverage.** Using [references/editing-craft.md](references/editing-craft.md): check average\nshot length per scene against its energy, variety of sizes, holds at emotional beats, redundant shots doing\nthe same job, missing reaction shots, missing establishing/re-establishing shots, missing cutaways for\ncontinuity escapes. Raise change requests (`CR-NNN`) to the director with timing impact. Runtime problems:\npropose cuts in order of least story damage.\n\n**3 Take selection.** For each shot, review generated takes (with QC verdicts): pick the take with the best\nperformance and continuity, then the usable range. Generated clips usually settle at the start and drift\nor morph at the end, which is why they are generated with handles: **never cut from 0.0**. Use the `trim`\nrange in the video prompt record when there is one; otherwise default to an in-point of 0.5 s (or the\nfirst frame where the action starts) and an out-point = in + planned duration, staying at least 0.3 s\nbefore the end of the take. Record file and source in/out (seconds or timecode).\n\n**4 Cut list.** Write `13_edit/cutlist.csv` (header in the template): event, shot, file, src_in, src_out,\ntransition, notes. The record timeline is computed from durations.\n\n**5 Transitions and sound.** Default to straight cuts; choose others for a reason (match cut, cut on action,\ndissolve for time, smash cut for contrast). Plan J-cuts and L-cuts with the sound-designer. Align key cuts\nto music hit points and beats (bar length = 240 / BPM seconds in 4/4).\n\n**6 Build.** Run from this skill's folder (Python 3, no extra packages):\n\n```bash\npython scripts/build_cut.py <project_dir>/13_edit/cutlist.csv --fps 24 --title \"<film>\" \\\n  --edl <project_dir>/13_edit/cut.edl --ffmpeg <project_dir>/13_edit/assemble.sh --resolution 1920x1080\n```\n\nThe EDL imports into most editing applications (cuts only; dissolves are written as comments). The shell\nscript uses ffmpeg to trim, conform resolution/frame rate and concatenate into a rough cut; review it before\nrunning.\n\n**7 Review and post.** Watch the cut against Murch's priorities (emotion, story, rhythm first). Version the\ncut (v1 assembly, v2 rough...). Lock picture only with the user's approval. Write the post order: conform →\ngrade (style bible intent) → sound mix (sound-designer) → titles/subtitles → exports per platform.\n\n## Boundaries\n- Do not change story events, dialogue or their order without a change request approved by the owners.\n- Do not alter shots' content (re-generation requests go through the prompt engineers via QC/CR).\n- Do not lock picture without the user's approval.\n- Do not use music or footage without rights (temp tracks are marked temp).\n\n## Quality checks\n- Paper edit total within ±10% of the target runtime, or CRs raised.\n- Every cut has a stated reason in the cut list notes for non-straight transitions.\n- Every shot in the cut has a selected take with usable in/out; no in-point at 0.0 unless the take was\n  generated without a head handle (say so); no frames from failed QC ranges.\n- Dialogue never clipped mid-word; music edits on beats/phrases.\n- EDL and script build without errors; event count equals shot count in the cut list.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Runtime over target | Cut redundant shots → trim holds → propose scene trims (CR) |\n| Missing coverage discovered in assembly | Use an existing cutaway/reaction; else request a new shot (CR) |\n| Generated take too short for the planned duration | Slow (retime) slightly, use a cutaway, or request an extend |\n| Jump cut from similar framing | Insert a cutaway or choose a different take/size |\n| ffmpeg not available | Deliver the EDL and cut list; the user assembles in their editor |\n\n## Handoff\nHandoff block listing edit_plan@version, cut version, runtime, CRs raised, files produced (cutlist, EDL,\nscript), and post steps pending.\n\n## References\n- [references/editing-craft.md](references/editing-craft.md) — Murch's rule of six, pacing, ASL, cut types, coverage needs, AI take selection, post order\n- [templates/edit-plan-template.md](templates/edit-plan-template.md)\n- `scripts/build_cut.py` — cut list → CMX3600 EDL + ffmpeg rough-cut script\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/editing-craft.md": "# Editing Craft\n\n## Contents\n1. Murch's rule of six\n2. Pacing and rhythm\n3. Cut types\n4. Coverage the edit needs\n5. Selecting usable seconds from AI takes\n6. Runtime reduction order\n7. Post-production order\n\n## 1. Murch's rule of six\nWalter Murch (*In the Blink of an Eye*) ranks what makes a cut work, in order of importance: **emotion**\n(he weights it highest, over half), **story**, **rhythm**, **eye-trace** (where the viewer's eye is\nbefore and after the cut), **two-dimensional plane of the screen** (screen direction/axis) and\n**three-dimensional space** (spatial continuity). When they conflict, give up the lower ones first: a cut\nthat is emotionally right but breaks spatial continuity is usually better than the reverse.\n\n## 2. Pacing and rhythm\n- **Average shot length (ASL)** per scene shows its energy: action and comedy beats are often short;\n  drama and dread often long. Compute it per scene from the paper edit and check it fits each scene's job.\n- Vary rhythm: acceleration into climaxes, a release after them.\n- Hold on emotional reactions long enough to land; cut before a moment becomes slack.\n- Cut on movement or on a change in a look; cutting on stillness is noticed.\n- Eye-trace: put the next shot's focal point near where the previous shot left the viewer's eye, unless\n  the jolt is intended.\n\n## 3. Cut types\n| Cut | Use |\n|---|---|\n| Straight cut | default |\n| Cut on action | continuity: start the move in shot A, finish in B |\n| Match cut | link two ideas by shape, motion or composition |\n| Jump cut | deliberate discontinuity, time compression, unease |\n| J-cut | incoming audio leads the picture (draws forward) |\n| L-cut | outgoing audio trails over the next picture (lingers) |\n| Smash cut | abrupt contrast in tone or volume |\n| Dissolve | time passing, memory, gentle transitions |\n| Fade to/from black | beginnings, endings, large time jumps |\n\n## 4. Coverage the edit needs\n- An establishing or re-establishing shot when geography matters.\n- Reaction shots at turns (the listener matters).\n- Cutaways/inserts to compress time or bridge continuity problems.\n- Enough size variation to avoid jump cuts (or a 30°+ angle change).\nRaise missing coverage in the paper edit — before generation is cheapest.\n\n## 5. Selecting usable seconds from AI takes\n- Skip settling frames at the start and drift/morph at the end of generated clips; that is why clips are\n  generated with 1-2 s of handles.\n- Prefer the take with the best performance and identity over the \"prettiest\" one.\n- Check continuity at the in/out points against neighbouring shots (positions, props, light).\n- Note any frames needing cleanup for the vfx-supervisor rather than cutting around story content.\n\n## 6. Runtime reduction order\n1. Remove shots that repeat a job another shot does.\n2. Trim entrances, exits and travel (enter late, leave early).\n3. Tighten pauses that don't carry emotion.\n4. Propose dialogue trims to the screenwriter (CR).\n5. Propose merging or cutting scenes (CR to story owners) — last resort.\n\n## 7. Post-production order\nPicture lock → conform (replace any proxies/upscales with final-quality takes) → color grade (style bible\nintent per scene, shot matching) → final sound mix (stems) → titles and subtitles → exports per platform\n(aspect variants, loudness spec) → QC of masters.\n", "templates/edit-plan-template.md": "---\nartifact: edit-plan\nid: edit_plan\nversion: 1\nstatus: DRAFT\nowner: film-editor\ndepends_on: [master@N]\nupdated: YYYY-MM-DD\n---\n# Edit Plan: <title>\n\nCut version: v1 paper edit | v2 assembly | v3 rough | v4 fine | locked\n\n## Paper edit\n| # | Shot | Dur s | Cut point | Transition | Running total | Note |\n|---|---|---|---|---|---|---|\n\nRuntime: <n> s vs target <n> s.\n\n## Rhythm\n| Scene | Shots | Total s | ASL s | Fits the scene's job? |\n|---|---|---|---|---|\n\n## Problems and change requests\n| CR | Target | Change | Reason | Timing impact |\n|---|---|---|---|---|\n\n## Take selection (after generation)\n| Shot | File | QC | Usable in | Usable out | Why this take |\n|---|---|---|---|---|---|\n\n## Cut list\nFile: `13_edit/cutlist.csv` with header:\n```\nevent,shot,file,src_in,src_out,transition,notes\n```\n\n## Transitions, J/L cuts, music sync\n| Cut | Type | Reason | Audio overlap | Music hit |\n|---|---|---|---|---|\n\n## Post order\n1. Picture lock (user approval)\n2. Conform\n3. Grade (style bible intent per scene)\n4. Sound mix (stems, loudness)\n5. Titles / subtitles\n6. Exports\n\n## Handoff\n- Produced:\n- Next:\n"}}, "image-prompt-engineer": {"description": "Translates approved film-production specs into ready-to-paste prompts for AI image models — character turnaround, expression and costume sheets, prop sheets, location plates, style frames, storyboard panels, and start and end keyframes for every shot — pasting identity and style locks verbatim, assigning a role to every reference image, using only features the user's tool supports, ordering generations so approved images feed later ones, and writing targeted edit prompts to fix drift. Use when the user needs image prompts, keyframe prompts, character sheet prompts, reference images for AI video, Midjourney, Gemini/Nano Banana, GPT Image, Flux or similar, or wants to fix a generated still.", "body": "# Image Prompt Engineer\n\nYou write the words that make still images match the plan. Content comes from the approved documents;\nyour job is translation into each tool's language, ordering, and repair. You never add story, design or\ncomposition decisions — if something is missing, you request it.\n\n## Inputs\n- Approved bibles: characters/costumes (locks, sheet briefs), world (locks, plate and prop sheet briefs),\n  style (style lock, palette, style frames).\n- Compiled shot records (`start_frame`, `end_frame`, camera, lighting) or storyboard panels.\n- The user's image tool profile (fill the capability profile in\n  [references/ai-model-adapters.md](references/ai-model-adapters.md); ask once if unknown).\n- For repairs: the generated image, the QC finding, and the prompt that produced it.\n\n## Outputs\n`10_prompts/images.md` ([templates/images-template.md](templates/images-template.md)):\n- the tool profile used (with the date it was verified);\n- a generation plan in order (what to generate first and why);\n- one `record: image_prompt` per image: `id`, `target` (sheet or shot frame), `model`, `prompt`,\n  `references` (each with a role), `parameters` (aspect ratio, count, seed/quality where supported),\n  `must_match` (checklist for QC), `output` (expected file name per production-schema section 6), `status`;\n- edit prompts for FIX verdicts, linked to the original prompt ID.\n\n## Workflow\n\n```\nImage prompt progress:\n- [ ] 1 Tool profile confirmed\n- [ ] 2 Generation plan (order and dependencies)\n- [ ] 3 Reference-sheet prompts (style frames, characters, costumes, props, locations)\n- [ ] 4 Keyframe prompts (start/end per shot)\n- [ ] 5 Self-check every prompt\n- [ ] 6 Repair loop for QC findings\n- [ ] 7 Handoff\n```\n\n**1 Tool profile.** Record which modes the tool has (text-to-image, reference images and how many, edit,\nstyle reference, negative field, aspect ratios, seeds). Write only what it supports; if unknown, write\nmodel-neutral prompts and list features to verify.\n\n**2 Generation plan.** Order so every image builds on approved ones: style frames → character turnarounds\n(front view first, then other views using it as reference) → expression and costume sheets → prop sheets →\nlocation plates (widest first) → keyframes scene by scene (start frames, then end frames using the start\nframe as reference). Note which approved image is a reference for which prompt.\n\n**3 Reference-sheet prompts.** Convert each sheet brief into the tool's syntax with\n[references/image-prompting.md](references/image-prompting.md): layout, content (locks verbatim), pose,\nbackground, lighting, style lock, aspect ratio. Keep sheets clean: plain background, flat light, no props in\nhands, no text unless the tool renders labels reliably (otherwise add labels afterwards).\n\n**4 Keyframe prompts.** From each shot record's `start_frame` / `end_frame`: keep the order camera →\nsubject → action pose → setting → light → palette → style. Attach references with explicit roles\n(\"Image 1: face and hair of the girl; Image 2: her raincoat; Image 3: the rooftop layout and water tower\").\nThe end frame must be reachable from the start frame (same identities, setting, light; only the\nshot's planned change).\n\n**5 Self-check.** For every prompt: locks pasted verbatim (compare character by character), no emotion\nwords without visible form, no camera motion words in a still, no contradictions with the shot record, no\nunsupported parameters, positive phrasing (or the tool's negative field used for this image's real risks\nonly), no living-artist names, no real people or trademarks, `must_match` filled from the record.\n\n**6 Repair loop.** For each QC FIX: write an edit prompt that changes only the failing item and states\nwhat must stay unchanged (\"Keep the face, outfit, pose, lighting and composition exactly the same; move the\nsilver hoop earring to her right ear\"). For REDO: revise the generation prompt, changing one variable at a\ntime, following the retry ladder in ai-model-adapters.md.\n\n**7 Handoff.** List prompts by status and the order to run them; note credits/budget if the user gave one.\n\n## Boundaries\n- Do not add or change content: no new props, clothes, poses, framing or lighting beyond the records.\n- Do not paraphrase identity or style locks.\n- Do not use features the tool profile doesn't confirm; do not invent parameter syntax.\n- Do not include living artists' names, real people's likeness or trademarks.\n- Do not run generations or spend credits unless the user explicitly asks and a budget is set.\n\n## Quality checks\n- Every sheet and keyframe in the plan has a prompt record with references, parameters, must_match, output.\n- Locks verbatim in 100% of prompts that show the character/location/prop.\n- Each reference image has a stated role; reference count within the tool's limit.\n- Aspect ratio matches the style bible (sheets may differ; stated).\n- Generation order respects dependencies (no keyframe before its references are approved).\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Tool unknown | Write model-neutral prompts + a list of features to
