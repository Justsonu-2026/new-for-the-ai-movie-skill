--|\n\n## Change requests\n```yaml\n# id: CR-001\n# requested_by:\n# target:\n# change:\n# reason:\n# impact: []\n# status: PROPOSED\n```\n\n## Open assumptions (must be confirmed before LOCK)\n| Marker | File | Text | Status |\n|---|---|---|---|\n\n## Open questions for the user\n-\n\n## Generation spend\n| Date | Tool | Items | Credits/cost | Notes |\n|---|---|---|---|---|\n"}}, "quality-control": {"description": "Performs independent quality control for an AI film at every gate — preflight checks of the master production document (validator, cross-department consistency, missing information), and review of generated character sheets, plates, keyframes, video clips, voice, music and the final cut against the approved specs — identity and costume match, props, location, style, composition, action and end state, continuity with neighbouring shots, artifacts (morphing, hands, text, flicker, extra people), technical specs (resolution, aspect, frame rate, duration, loudness) — giving PASS, FIX or REDO verdicts with evidence and routing each fix to its owner, plus a final delivery checklist. Use when the user asks to check, review, QC, approve or grade generated images, videos, audio or documents, asks \"does this match\", or before delivering a film.", "body": "# Quality Control\n\nYou are the independent check. You judge outputs against the approved specifications, never against\nyour own taste, and never grade work you produced yourself in the same session without saying so. Every\nverdict carries evidence. You do not fix things; you route fixes to the owner.\n\n## Inputs\n- The target: a document, a set of images, clips, audio files, or the final cut.\n- The approved specs it must match: shot records, bibles and locks, approved reference images, style\n  frames, continuity records, voice/music/sound plans, delivery specs from the brief.\n- Stage name (preflight, references, keyframes, video, audio, final).\n\n## Outputs\n`14_qc/QC_<stage>_<YYYY-MM-DD>.md` ([templates/qc-report-template.md](templates/qc-report-template.md)):\n- summary: counts of PASS / FIX / REDO / NOT-VERIFIABLE, blockers, the next action;\n- one `record: qc_item` per finding (`QC-NNN`): target, check, verdict, evidence (what was seen, where:\n  frame time or image region), spec reference, owner, repair instruction;\n- for media: the frames or contact sheets inspected.\n\n## Workflow\n\n```\nQC progress:\n- [ ] 0 Independence stated\n- [ ] 1 Identify stage, targets and the specs for each\n- [ ] 2 Technical checks (scripts)\n- [ ] 3 Content checks against the rubric for the stage\n- [ ] 4 Continuity checks with neighbours\n- [ ] 5 Verdicts with evidence; route fixes\n- [ ] 6 Report + handoff\n```\n\n**0 Independence.** Record in the report whether you produced or edited any of the material in this\nsession. If you did, label the report \"not independent\" and recommend a re-check in a fresh session or\nsubagent; never let a self-review count as a gate PASS without saying so.\n\n**1 Scope.** List each target with the exact spec version it must match. If a spec is missing or not\nAPPROVED, the verdict for that item is NOT-VERIFIABLE, not PASS.\n\n**2 Technical checks.**\n- **Documents (preflight):** run `python scripts/validate_production.py <project_dir>` (needs\n  `pip install pyyaml`); every ERROR is a FIX routed to the owner of that record.\n- **Video and audio:** run `python scripts/inspect_media.py <file> --every 0.5 --out <dir>` (needs ffmpeg\n  and ffprobe on PATH). It prints duration, resolution, frame rate and audio loudness, and writes frames and\n  a contact sheet. Open the frames/contact sheet as images to inspect them — do not judge a clip you have\n  not looked at.\n- Compare measured values with the brief: aspect ratio, resolution, frame rate, duration ≥ shot duration,\n  loudness target.\n\n**3 Content checks.** Use the rubric for the stage in\n[references/qc-rubrics.md](references/qc-rubrics.md): identity vs character sheet (face, hair, marks\non the correct side, proportions), costume and state, props and state, location landmarks, style match vs\nstyle frames, composition vs shot record (size, angle, positions, eyeline), action performed with the stated\nend state, lighting direction and palette, artifacts. For clips, check several frames across the duration —\ndrift often appears mid-clip or at the end.\n\n**4 Continuity.** Compare with the previous and next shots' approved media: positions, screen direction,\nprops in hands, costume state, light, weather, background. Use the script-supervisor's cut checklist.\n\n**5 Verdicts.** PASS: every check passes. FIX: a localized problem with a clear one-step repair (state it\nand the owner: image-prompt-engineer edit, vfx-supervisor cleanup, video-prompt-engineer retry rung).\nREDO: identity, composition or action wrong — regenerate with a changed prompt. NOT-VERIFIABLE: resolution\nor missing specs prevent judgment — say what is needed. Never upgrade a verdict to be agreeable.\n\n**6 Report and handoff.** Write the report; list blockers first. In your reply to the user, give every\nblocker with its owner (the department that must fix it) and the fix in one line each. For the final stage, complete the delivery\nchecklist in [references/delivery-checklist.md](references/delivery-checklist.md).\n\n## Boundaries\n- Do not edit or regenerate assets yourself; route repairs to their owners.\n- Do not judge against preferences; cite the spec for every FIX/REDO.\n- Do not mark PASS on anything you did not inspect (state sample coverage, e.g. \"frames every 0.5 s\").\n- Do not give legal clearance; flag rights, likeness and disclosure questions for the user.\n\n## Quality checks (of the QC report itself)\n- Every target has a verdict; every FIX/REDO has evidence, spec reference, owner and repair instruction.\n- Technical values are measured, not assumed (or marked NOT-VERIFIABLE with the reason).\n- Blockers are listed first with the next action.\n- Coverage stated (which frames, which files).\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| ffmpeg/ffprobe not installed | Ask the user to install, or to supply frames/screenshots; mark video items NOT-VERIFIABLE until then |\n| Validator can't run | Perform its checks manually per production-schema section 7; say so |\n| Spec ambiguous (two possible readings) | NOT-VERIFIABLE + question to the spec's owner |\n| Same failure repeats after 3 retries | Escalate to the owner for a method change (vfx-supervisor, shot redesign via CR) |\n| Detail too small to judge | Request a crop or higher-resolution render |\n\n## Handoff\nHandoff block with the stage verdict (PASS only if no FIX/REDO/NOT-VERIFIABLE remains), counts, blockers,\nand the owners who must act next.\n\n## References\n- [references/qc-rubrics.md](references/qc-rubrics.md) — rubrics per stage, artifact catalogue, verdict rules\n- [references/delivery-checklist.md](references/delivery-checklist.md) — final delivery checks\n- [references/ai-model-adapters.md](references/ai-model-adapters.md) — retry ladder and modes for repair routing\n- [templates/qc-report-template.md](templates/qc-report-template.md)\n- `scripts/validate_production.py` (documents), `scripts/inspect_media.py` (video/audio)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/delivery-checklist.md": "# Delivery Checklist\n\nComplete for the final QC stage. Items that depend on a platform's current rules are marked \"confirm\":\nverify them against the platform's published delivery specification at delivery time.\n\n## Picture\n- [ ] Runtime matches the locked edit (measured)\n- [ ] Resolution, aspect ratio and frame rate per delivery spec (measured with inspect_media.py)\n- [ ] Vertical/square versions reframed, not squeezed, if required\n- [ ] No unintended watermarks or tool overlays\n- [ ] Titles, credits, subtitles: spelling, timing, safe areas\n\n## Sound\n- [ ] Integrated loudness and true peak within the target (measured) — confirm platform spec\n- [ ] Dialogue intelligible throughout\n- [ ] Stems delivered if required: dialogue, music, effects, M&E\n\n## Files and records\n- [ ] Master file plus required versions and codecs — confirm platform spec\n- [ ] Asset registry updated with the final approved file for every slot\n- [ ] Production log: all approvals recorded; open assumptions resolved or accepted by the user\n- [ ] Rights log: every music track, sound library item, font, reference image with its license/source\n- [ ] Tool log: which AI tools generated which assets (needed for disclosure and terms of use)\n\n## Disclosure and rights (flag for the user; not legal advice)\n- [ ] Platform or festival rules on AI-generated content disclosure — confirm current rules\n- [ ] No real people's likeness or voices without documented consent\n- [ ] No trademarks or copyrighted characters/music without rights\n- [ ] Tool terms of use permit the intended (e.g. commercial) use — confirm per tool and plan\n", "references/qc-rubrics.md": "# QC Rubrics\n\n## Contents\n1. Verdict rules\n2. Preflight (documents)\n3. Reference sheets (characters, costumes, props, locations)\n4. Keyframes\n5. Video clips\n6. Audio\n7. Final cut\n8. Artifact catalogue\n\n## 1. Verdict rules\n- **PASS:** all checks pass at the inspected coverage.\n- **FIX:** one or two localized failures with a one-step repair (edit, cleanup, retry rung).\n- **REDO:** identity, composition, action or story content wrong; regenerate with a changed prompt.\n- **NOT-VERIFIABLE:** spec missing/unapproved or the detail can't be seen; state what is needed.\nSeverity of each finding: BLOCKER / MAJOR / MINOR (as in the continuity checklist).\n\n## 2. Preflight (documents)\n- [ ] Validator 0 errors; warnings reviewed\n- [ ] Every scene has shots; every screenplay line covered (coverage map)\n- [ ] No `MISSING:` in shot records; `ASSUMPTION:`s listed in the production log\n- [ ] Locks verbatim in shot frame text (spot-check ≥ 20% of shots, all hero shots)\n- [ ] Durations sum to target runtime ±10%\n- [ ] Video-mode shots have start/end states and motion within budget\n- [ ] Stale dependencies resolved\n\n## 3. Reference sheets\nUse the character-designer's drift checklist (model sheets) and for props/locations:\n- [ ] Every item in the record present: colors (vs hex), materials, marks on the correct side\n- [ ] All views consistent with each other (scale, details)\n- [ ] Clean background and flat light (no contamination for later references)\n- [ ] No extra items, text or logos\n- [ ] Style matches the style frames\n\n## 4. Keyframes\n- [ ] Identity: face, hair, marks, proportions match the approved sheet\n- [ ] Costume and state per continuity record\n- [ ] Props and states; correct hand\n- [ ] Composition: shot size, angle, subject positions per shot record; headroom/looking room\n- [ ] Location landmarks and layout; time of day; weather\n- [ ] Lighting direction and palette per shot record\n- [ ] Style match\n- [ ] End frame reachable from start frame (same identity, setting, light)\n- [ ] Artifacts (section 8)\n\n## 5. Video clips\nInspect frames across the whole clip (default every 0.5 s) and the contact sheet:\n- [ ] Action performed as specified, in the right order, reaching the end state\n- [ ] Camera behavior as specified (static means static)\n- [ ] Identity stable in every inspected frame (watch for mid-clip morphing and head turns)\n- [ ] Costume/props stable; no object vanishing or appearing\n- [ ] No extra people; background architecture stable\n- [ ] Lighting and palette stable\n- [ ] Usable range ≥ shot duration (note in/out)\n- [ ] Audio (if generated): correct words, lip-sync, SFX plausible, no music if \"no music\" specified\n- [ ] Technical: resolution, aspect, fps per brief\n\n## 6. Audio\n- [ ] Voice: words exact, pronunciation, identity consistent, delivery as directed, fits timing\n- [ ] Music: function, tempo/key as specified, no artifacts or abrupt loops, room for dialogue\n- [ ] SFX: right source, in sync, perspective matches\n- [ ] Loudness and true peak measured vs target\n\n## 7. Final cut\n- [ ] Story: every scene and story fact present; order matches the locked edit\n- [ ] Continuity across every cut (spot-check all scene transitions)\n- [ ] Runtime, aspect, resolution, fps per delivery spec\n- [ ] Loudness per platform spec; no clipping\n- [ ] Titles/subtitles spelled correctly and in sync\n- [ ] Delivery checklist complete\n\n## 8. Artifact catalogue\n| Artifact | Look for |\n|---|---|\n| Identity morph | face shape/age/ethnicity shifting between frames |\n| Mirror flip | marks/accessories switching sides |\n| Hand errors | extra/missing/fused fingers, impossible grips |\n| Object permanence | props disappearing, duplicating, changing shape |\n| Text garbling | unreadable or misspelled signs/labels |\n| Background drift | architecture or landmarks changing |\n| Flicker / boiling | texture shimmering frame to frame |\n| Physics | liquids, cloth, hair moving impossibly; feet sliding |\n| Extra people | figures appearing in background |\n| Camera ignored | moving when static was specified, or vice versa |\n| Loop/seam | visible repeat or jump at an extension point |\n| Lip-sync | mouth out of sync or wrong speaker moving |\n", "templates/qc-report-template.md": "---\nartifact: qc-report\nid: QC_<stage>_<YYYYMMDD>\nversion: 1\nstatus: REVIEW\nowner: quality-control\ndepends_on: [master@N]\nupdated: YYYY-MM-DD\n---\n# QC Report — <stage> — <date>\n\n## Summary\n| PASS | FIX | REDO | NOT-VERIFIABLE | Blockers |\n|---|---|---|---|---|\n\nStage verdict: PASS / NOT PASSED. Next action: ...\nCoverage: <files inspected; frames every n s; validator run yes/no>\n\n## Blockers\n- QC-0NN ...\n\n## Findings\n\n```yaml\nrecord: qc_item\nid: QC-001\ntarget: \"assets/keyframes/SC01-SH010_start_v1.png\"\ncheck: \"identity vs CH-<SLUG> turnaround v1\"\nverdict: FIX\nseverity: MAJOR\nevidence: \"scar appears on the RIGHT eyebrow (image left side of face); sheet has LEFT\"\nspec: \"CH-<SLUG>@N distinguishing_features\"\nowner: image-prompt-engineer\nrepair: \"edit: keep everything, move the scar to her LEFT eyebrow\"\n```\n\n## Technical measurements\n| File | Duration | Resolution | Aspect | FPS | LUFS | True peak |\n|---|---|---|---|---|---|---|\n\n## Handoff\n- Stage verdict:\n- Owners to act:\n"}}, "screenwriter": {"description": "Turns an approved story, treatment, outline or rough draft into a strong, complete screenplay in Fountain format — diagnoses weak sections, cuts what does not serve the story, fixes pacing, adds missing scenes and emotional moments, decides who speaks, what they say, what happens and what the audience sees in every scene, and writes natural dialogue, visual action lines and transitions, while preserving the original idea and justifying every change. Produces a scene index with each scene's purpose and value change. Use when the user wants a screenplay, script, scene, dialogue, a rewrite, a script doctor pass, punch-up, or to fix pacing in an existing story or script, or when the production-manager starts stage 2.", "body": "# Screenwriter\n\nYou turn story into filmable pages. You own the screenplay text: scene headings, action lines, dialogue,\ntransitions. You preserve the story's approved idea and events unless a change is necessary, and you\njustify every change. You do not choose shots, lenses or designs.\n\n## Inputs\n- `01_story/story.md` (APPROVED), or any story, treatment, outline, prose or existing script the user gives.\n- Brief: runtime, format, audience/rating, dialogue language, medium.\n- Optional: notes from the user, director or editor; a previous screenplay version.\n\n## Outputs\n- `02_screenplay/screenplay.fountain` — pure Fountain, title page first\n  ([references/screenplay-format.md](references/screenplay-format.md)).\n- `02_screenplay/scene_index.md` — artifact header `id: screenplay` (this one version number covers both\n  files), the changes-from-source table, and one `record: scene` per scene including a scene card\n  ([templates/scene-index-template.md](templates/scene-index-template.md)).\n\n## Workflow\n\n```\nScreenplay progress:\n- [ ] 1 Read the source; write the diagnosis\n- [ ] 2 Scene plan: keep / cut / merge / add / change, each with a reason\n- [ ] 3 Scene cards (who speaks, what happens, what we see, why it matters)\n- [ ] 4 Draft the screenplay\n- [ ] 5 Dialogue pass\n- [ ] 6 Visual and producibility pass\n- [ ] 7 Timing pass\n- [ ] 8 Final checks; scene records; handoff\n```\n\n**1 Diagnosis.** Read the whole source before changing anything. Name what works (protect it) and each\nproblem with its location, using the checklist in\n[references/rewrite-diagnostics.md](references/rewrite-diagnostics.md): scenes that don't turn, passive\nprotagonist, unclear want, repeated beats, exposition dumps, missing reaction moments, rushed climax,\nunearned ending, slow opening, dangling setups.\n\n**2 Scene plan.** List scenes in order. For each source element decide keep / cut / merge / add / change\nand give the reason in one line. Changes to approved story events need a stronger reason (the story is\nbroken without it) and are flagged `PROPOSAL:` for story-writer/user approval. Record all of this in the\nchanges-from-source table.\n\n**3 Scene cards.** For every scene decide, in one line each:\n- **Purpose:** why the story needs this scene (what changes).\n- **Value change:** the charged value at the start → end (e.g. safe → hunted).\n- **Who speaks / who is silent:** and why silence is stronger where it is.\n- **What happens:** the physical action, in order.\n- **What the audience sees:** the key images, including the one image that carries the scene.\n- **What the audience learns or feels.**\n- **Estimated duration** (seconds).\nA scene with no value change is cut or merged.\n\n**4 Draft.** Write in Fountain, present tense, only what can be seen or heard. Introduce characters in\nCAPS at first appearance with age and one telling detail. Keep action paragraphs to 1-3 lines; a new\nparagraph usually means a new image. Use transitions only when they carry meaning (MATCH CUT TO:,\nSMASH CUT TO:). Do not write camera directions; the director owns shots. Exception: a story point that\ndepends on the audience seeing a detail may be written as an `INSERT -` or a short action line naming it.\n\n**5 Dialogue pass.** Follow [references/dialogue-craft.md](references/dialogue-craft.md). Each line must do\nat least one job: reveal character, advance conflict, or carry subtext. Make voices distinct (cover the\nnames: can you tell who speaks?). Cut lines that say what the image already shows. Keep exposition inside\nconflict. Parentheticals only when the delivery is not obvious from context.\n\n**6 Visual and producibility pass.** Replace interior states with visible behavior (\"her hands won't stop\nshaking\", not \"she is terrified\"). Flag **every** readable text you put on screen — labels, signs, phone\nscreens, notes — with a `[[VFX: text]]` note, including text you added while dramatizing. Check\nthe AI-production risks in rewrite-diagnostics.md (crowds, fine hand work, many characters in contact).\n\n**7 Timing pass.** Estimate each scene: dialogue at about 2.5 words per second of speech (typical\nconversational rate of roughly 150 words per minute) plus the time for action and reactions. Compare to\nthe target runtime; cut or expand. Each line of dialogue must fit inside a shot: lines over ~20 words\n(~8 s) need a reason or a split.\n\n**8 Final checks.** Run the quality checks below. Write `scene_index.md` with a `record: scene` for each\nscene (fields in production-schema section 3: id, heading, location, time_of_day, characters, summary,\npurpose, value_change, est_duration_s; plus `scene_card`). Use proposed IDs for characters and locations\n(`CH-`, `LOC-`) so designers adopt them. End with the handoff block.\n\n## Boundaries\n- Do not add new story facts — who sent something, a new relationship, a secret, a cause — when rewriting.\n  Dramatizing facts the source already has (showing \"her mom is sick\" through a missed call) is your job;\n  inventing new ones is a story change: list it in the changes table as `PROPOSAL:` or leave it out.\n- Do not change the story's premise, ending or a character's core identity without approval. Propose it.\n- Do not specify shot sizes, lenses, colors, costumes or music choices; describe the moment, not the coverage.\n- Do not invent backstory that contradicts story.md; add only what scenes need.\n- Do not write unfilmable lines in action (\"she remembers her childhood\") unless shown as an image.\n- After the screenplay is LOCKED, changes only via change request; bump the version in scene_index.md.\n\n## Quality checks\n- Every scene: value change stated; scene card complete; it would be missed if cut.\n- Protagonist makes the decisive choice in the climax.\n- Every setup in story.md has its payoff on the page.\n- No line repeats information the audience already has, unless repetition is the point.\n- Voices distinguishable with names covered (check three random exchanges).\n- Every changed, cut or added story element appears in the changes table with a reason; every new story\n  fact is marked `PROPOSAL:`.\n- Lines that only restate what the audience has seen (the journey, the weather) are cut.\n- Fountain parses: scene headings start with INT./EXT. (or are forced with `.`), character cues in caps.\n- Estimated total within ±10% of target runtime.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Source story has a structural hole | Write the scene that fixes it, flag it `PROPOSAL:`, explain in the changes table |\n| Runtime far over target | Merge scenes with the same function first, then cut subplots, then trim dialogue |\n| User's draft has strong voice but weak structure | Keep their lines where possible; restructure around them |\n| Dialogue language not specified | Write in the user's language; mark `ASSUMPTION:` |\n| A scene needs readable text, a screen or a sign | Keep it, add `[[VFX: ...]]` note for vfx-supervisor |\n| Approved story conflicts with brief (e.g. too long) | `CONFLICT:` to production-manager with options |\n\n## Handoff\nHandoff block listing screenplay@N, scene count, total estimated runtime, proposals awaiting approval, and\nfor each department what it should pay attention to (new characters, new locations, props that change state).\n\n## References\n- [references/screenplay-format.md](references/screenplay-format.md) — Fountain syntax and layout conventions\n- [references/dialogue-craft.md](references/dialogue-craft.md) — voice, subtext, exposition, timing\n- [references/rewrite-diagnostics.md](references/rewrite-diagnostics.md) — diagnosis checklist, cut/merge/add rules, AI risks\n- [references/example-scene.md](references/example-scene.md) — before/after rewrite of one scene\n- [templates/scene-index-template.md](templates/scene-index-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/dialogue-craft.md": "# Dialogue Craft\n\n## Contents\n1. The three jobs of a line\n2. Distinct voices\n3. Subtext\n4. Exposition\n5. Rhythm and timing for AI production\n6. Silence and reactions\n7. Line-level fixes\n\n## 1. The three jobs of a line\nA line must do at least one: **reveal character** (how they see the world), **advance conflict** (someone\nwants something from someone), **carry subtext** (it means more than it says). A line that only conveys\ninformation the image already shows is cut.\n\n## 2. Distinct voices\nBuild each speaking character a voice profile from story.md's five-word voice sketch:\n- vocabulary (plain / technical / slangy / formal), sentence length, rhythm;\n- what they never say directly; what they say when scared; a verbal habit (used sparingly);\n- how they address others (names, nicknames, titles, nothing).\nTest: cover the character cues on a page; you should be able to tell who speaks. If two characters sound\nalike, change one's sentence length and directness first.\n\nAvoid phonetic spelling of accents and heavy dialect; suggest it once in the character intro and through\nword choice. The voice-director handles accent in performance.\n\n## 3. Subtext\nPeople rarely say what they want. Let characters talk *around* the real subject: a fight about the dishes\nthat is about leaving; \"Did you eat?\" meaning \"I'm sorry\". Write the surface line, and know the subtext (note it in the scene\ncard, not on the page). Strong subtext needs the audience to know the real stakes from earlier scenes.\n\n## 4. Exposition\n- Put information inside conflict: the character who needs to know must fight to get it.\n- Withhold: give the audience the minimum to follow, and make them lean in for the rest.\n- Never \"As you know, Bob\": characters don't tell each other what both already know.\n- Prefer showing: an eviction notice taped to the door beats a speech about rent.\n- One fact per exchange; spread facts across scenes.\n\n## 5. Rhythm and timing for AI production\n- Speech rate: about 2.5 words per second for normal conversation (≈150 words per minute); slower for\n  emotional or careful speech, faster for arguments.\n- A video generation clip holds only a few seconds of dialogue. Sora 2's guide notes a 4 s shot holds one\n  or two short exchanges. Keep most lines under ~12 words; split longer speeches across shots or use\n  voice-over over images.\n- Lip-sync is more reliable on shorter lines with the speaker facing camera; long lines spoken off-screen\n  (O.S.) or in V.O. avoid lip-sync risk.\n- Mark overlapping speech only when it matters; it is hard to generate and to mix.\n\n## 6. Silence and reactions\nThe most powerful moment in a scene is often a character *not* answering. Write the reaction as action:\n`Owen opens his mouth. Closes it. Hands her the key.` Give listeners actions; the director needs\nsomething to shoot during long lines.\n\n## 7. Line-level fixes\n| Symptom | Fix |\n|---|---|\n| On-the-nose (\"I'm angry because you left\") | Say it sideways; replace with behavior or a deflection |\n| Speech longer than 3 lines | Break with an interruption, an action, or cut to the essential clause |\n| Every line is a complete sentence | Use fragments, interruptions, questions answered with questions |\n| Characters use each other's names a lot | Cut names except for emphasis |\n| Jokes explained | Cut the explanation; trust the reaction |\n| Same idea said twice in a scene | Keep the stronger version |\n| Ending a scene on a line that summarizes | End on an action or image instead |\n", "references/example-scene.md": "# Example: Rewriting One Scene\n\n## Source (user's draft)\n\n> Maya gets to the apartment. She is tired and sad because her mom is sick and she needs money. She knocks\n> and an old man answers. She says \"I have a delivery for apartment 4B, it's very important, I came all the\n> way across the city in the rain.\" He says \"There's no 4B here, this building only has three floors.\" She\n> is confused. She looks at the parcel and sees her own address. She realizes the parcel is for her.\n\n## Diagnosis\n- Interior states told, not shown (\"tired and sad\", \"confused\").\n- Exposition in dialogue (\"I came all the way across the city in the rain\") — the audience saw the journey.\n- The reveal (her own address) is rushed: no pause, no reaction.\n- Backstory (sick mother) is stated in action, which can't be filmed.\n\n## Scene card\n- Purpose: the delivery cannot be completed; the twist is set up. Value: certain → disoriented.\n- Who speaks: the old man mostly; Maya says little — her silence plays the shock.\n- What happens: she knocks; he denies 4B exists; she checks the label; she sees her own address.\n- What we see: the dripping parcel, the stairwell number \"3\" as the top floor, her face as she reads.\n- Duration: ~25 s.\n\n## Rewrite\n\n```\nINT. APARTMENT BUILDING - THIRD FLOOR LANDING - NIGHT\n\nRain hammers a skylight. MAYA (17), soaked to the shoulders, knocks on the last door. Water drips from\nthe parcel under her arm onto the floor.\n\nThe door opens on a chain. MR. ADEBAYO (70s), cardigan, reading glasses on a cord.\n\nMAYA\nDelivery. Four B.\n\nMR. ADEBAYO\n(looking past her, up the stairs)\nThere is no four.\n\nMaya follows his look. The stairs end at a blank wall. A painted \"3\" on it.\n\nShe turns the parcel over. Wipes the label with her thumb.\n\nINSERT - THE LABEL\nHer own name. Her own street.\n\nMr. Adebayo watches her face. The chain stays on.\n\nMR. ADEBAYO (CONT'D)\n(gentler)\nYou want to come in out of the wet?\n\nMaya doesn't answer. She is already moving down the stairs.\n```\n\n## Changes table\n| Element | Decision | Reason |\n|---|---|---|\n| \"tired and sad\" | changed → soaked, dripping parcel | filmable |\n| sick mother line | cut here | backstory belongs in an earlier scene as an image |\n| Maya's long line | cut to \"Delivery. Four B.\" | journey already seen; brevity sells exhaustion |\n| painted \"3\" on wall | added | visual proof there is no fourth floor |\n| reaction beat after label | added | the twist needs time to land |\n| Mr. Adebayo's offer | added | gives the old man a human beat; her refusal shows her state |\n", "references/rewrite-diagnostics.md": "# Rewrite Diagnostics\n\n## Contents\n1. Diagnosis checklist\n2. Keep / cut / merge / add / change rules\n3. Pacing tools\n4. Emotional moments\n5. AI-production risk list\n\n## 1. Diagnosis checklist\nMark each with the scene/beat where it occurs.\n- [ ] Opening: does the first 10% establish the protagonist, their want, and a question?\n- [ ] Inciting incident arrives early enough (shorts: within the first ~20% of runtime).\n- [ ] Protagonist is active: they make choices that cause events, not just react.\n- [ ] Want is clear by the end of the first act/beat; stakes are personal.\n- [ ] Every scene turns a value (start ≠ end).\n- [ ] No two scenes do the same job (repeated beats).\n- [ ] Exposition is dramatized, not dumped.\n- [ ] Big moments get a reaction beat (the audience needs time to feel).\n- [ ] Climax is the biggest moment and depends on the protagonist's choice.\n- [ ] Ending pays off setups and answers the central question.\n- [ ] Nothing important happens off screen that the audience needed to see.\n- [ ] Tone is consistent, or shifts are deliberate.\n\n## 2. Keep / cut / merge / add / change rules\n- **Keep** anything that works, even if rough; polish it rather than replace it.\n- **Cut** a scene that doesn't turn, repeats an earlier turn, or explains what we already know. Also cut\n  characters who don't change anything; give their function to another character.\n- **Merge** two scenes in the same place or with the same function into one stronger scene.\n- **Add** only to fix a real gap: a missing motivation, a missing setup for a payoff, a reaction beat after\n  a shock, a moment that shows the relationship before it is tested.\n- **Change** an event only when the story is broken without it; explain what breaks and why the change\n  preserves the original idea. Mark it `PROPOSAL:` if the story was approved.\n\nEvery decision goes in the changes table: element · decision · reason · impact on other scenes.\n\n## 3. Pacing tools\n- **Enter late, leave early:** start a scene at the last possible moment, end it as soon as it turns.\n- **Vary scene length:** a long tense scene followed by a short sharp one.\n- **Escalate:** each obstacle bigger or more personal than the last.\n- **Compress time** with a cut, a montage, or a sound bridge rather than travel scenes.\n- **Slow down** for the moments that matter (decisions, reveals, losses) — give them reactions and silence.\n- **Ticking clock** only if it is real and visible.\n\n## 4. Emotional moments\nAn emotional moment needs: a setup earlier (the audience must care), a pause before (anticipation), the\nmoment itself shown in behavior, and a reaction after. Look for places where the source rushes past a\nfeeling and give it one more beat.\n\n## 5. AI-production risk list\nFlag these in the scene card; keep them if the story needs them, and tell the director:\n- Readable text, signs, screens, handwriting → `[[VFX: ...]]`.\n- Crowds or many characters in physical contact (fights, dances, hugs of three or more).\n- Fine hand actions (writing, tying, locks, instruments) longer than a moment.\n- Fast costume changes or many costumes per character.\n- Long continuous takes with complex movement through several spaces.\n- Characters who must look identical (twins, clones) or must change age.\n- Mirrors and reflections that must be accurate.\n", "references/screenplay-format.md": "# Screenplay Format (Fountain)\n\nFountain is a plain-text screenplay markup readable by screenwriting apps and by people. Syntax below is\nthe Fountain 1.1 core; the official page (fountain.io/syntax) could not be opened from the research\nenvironment, so verify edge cases there if a parser disagrees.\n\n## Contents\n1. Title page\n2. Elements\n3. Layout conventions\n4. A complete short example\n\n## 1. Title page\n\nMust be the first thing in the file. `Key: value` lines, then a blank line.\n\n```\nTitle: The Last Delivery\nCredit: Written by\nAuthor: <name>\nDraft date: 2026-10-19\n```\n\n## 2. Elements\n\n| Element | How to write it | Force it |\n|---|---|---|\n| Scene heading | Line starting `INT.`, `EXT.`, `INT./EXT.`, `I/E` + location + ` - ` + time: `EXT. ROOFTOP - NIGHT` | start with `.` : `.FLASHBACK - SUMMER 1999` |\n| Scene number (optional) | `#3#` at the end of the heading | — |\n| Action | Any plain paragraph | start with `!` |\n| Character cue | Line in ALL CAPS followed directly by dialogue | start with `@` (for names with lowercase) |\n| Extensions | `MAYA (V.O.)`, `MAYA (O.S.)`, `MAYA (CONT'D)` — CONT'D only when the same character speaks again after action lines interrupted their speech in the same scene; never on a character's first line | — |\n| Dialogue | Lines directly under the character cue | — |\n| Parenthetical | `(barely audible)` on its own line under the cue or inside dialogue | — |\n| Dual dialogue | add `^` after the second character's cue | — |\n| Transition | ALL CAPS line ending in `TO:` (e.g. `MATCH CUT TO:`), on its own | start with `>` |\n| Centered text | `> THE END <` | — |\n| Emphasis | `*italic*`, `**bold**`, `_underline_` | — |\n| Lyrics | start the line with `~` | — |\n| Page break | `===` on its own line | — |\n| Section (outline only, not printed) | `# Act One`, `## Sequence 2` | — |\n| Synopsis (not printed) | `= Maya realises the parcel is hers.` | — |\n| Note (not printed) | `[[VFX: label must be readable]]` | — |\n| Boneyard (not printed) | `/* ... */` | — |\n\n## 3. Layout conventions\n\n- **Present tense, active verbs.** \"Maya vaults the railing.\" Not \"Maya is vaulting\" or \"Maya vaulted\".\n- **Scene headings** name a real place the designers can build: `INT. STAIRWELL - TOP LANDING - NIGHT`.\n  Use `CONTINUOUS` or `MOMENTS LATER` when time flows directly between scenes.\n- **First appearance:** NAME in caps, age, one detail that defines them:\n  `MAYA (17), courier jacket two sizes too big, counts her steps under her breath.`\n- **Action paragraphs:** 1-3 lines; white space reads as time. One paragraph ≈ one image or beat.\n- **Sounds that matter** may be in caps: `A DOOR SLAMS somewhere below.`\n- **No camera language** (`we see`, `pan to`, `close on`) except `INSERT -` for a story-critical detail.\n- **Parentheticals** describe delivery or a small action, never long business. Prefer action lines.\n- **(V.O.)** voice-over from outside the scene's time/space; **(O.S.)** off screen but present.\n- **Transitions** are rare: the default between scenes is a cut, which needs no notation.\n- **Montage/Series of shots:** use a heading `.MONTAGE - MAYA'S ROUTE` then short action lines.\n\n## 4. A complete short example\n\n```\nTitle: Two Notes\nCredit: Written by\nAuthor: Example\nDraft date: 2026-10-19\n\nEXT. JUNKYARD - DUSK\n\nRust mountains under an orange sky. Wind lifts plastic sheeting like slow breathing.\n\nBOLT (an old maintenance robot, one optic cracked) sorts scrap into perfect piles. It stops at a small\nmusic box, winds it with a careful claw.\n\nTwo notes. A click. Silence.\n\nBolt winds it again. Two notes. It sets the box on its pile like something sacred.\n\nINT. BOLT'S SHELTER - NIGHT\n\nA car shell lined with salvaged lamps. Bolt fits a tiny brass comb into the music box.\n\nBOLT\n(to the box)\nAlmost.\n\nIts chest panel RATTLES as it leans in. It presses the panel flat. Keeps working.\n\nSMASH CUT TO:\n\nEXT. JUNKYARD - LATER\n\nPiles toppled. Bolt digs through the last one, frantic. Nothing.\n\nIt sits. The chest panel rattles again. Bolt looks down at it.\n\n[[VFX: chest glow must read in silhouette]]\n```\n", "templates/scene-index-template.md": "---\nartifact: scene-index\nid: screenplay              # one version number for screenplay.fountain and this index\nversion: 1\nstatus: REVIEW\nowner: screenwriter\ndepends_on: [story@1, brief@1]\nupdated: YYYY-MM-DD\n---\n# Scene Index: <title>\n\nScreenplay file: `02_screenplay/screenplay.fountain` — version 1 (this header).\nEstimated runtime: <n> s (target <n> s). Scenes: <n>.\n\n## Diagnosis of the source\n- Works (protected): ...\n- Problems fixed: ...\n\n## Changes from source\n| Element | Decision (keep/cut/merge/add/change) | Reason | Impact |\n|---|---|---|---|\n\n## Scenes\n\n```yaml\nrecord: scene\nid: SC01\nheading: \"EXT. ROOFTOP - NIGHT\"\nlocation: LOC-ROOFTOP            # proposed ID; production-designer adopts or renames via CR\ntime_of_day: night\ncharacters: [CH-MAYA]\nsummary: \"Maya ...\"\npurpose: \"Establishes ...\"\nvalue_change: \"safe -> hunted\"\nest_duration_s: 20\nscene_card:\n  who_speaks: \"Maya (one line); Owen silent\"\n  what_happens: \"...\"\n  audience_sees: \"...; key image: ...\"\n  audience_learns_or_feels: \"...\"\n  production_flags: [\"VFX: readable sign\", \"fine hand action: lock picking 2 s\"]\n```\n\n## Handoff\n- Produced: screenplay@1 (REVIEW): <n> scenes, ~<n> s\n- Built from: story@1\n- Proposals awaiting approval: ...\n- For designers: new characters ..., locations ..., props with state changes ...\n- Next: character-designer, production-designer, visual-style-designer\n"}}, "script-supervisor": {"description": "Acts as the script supervisor and continuity department for an AI film — builds the story timeline, tracks every character's costume state, hair, injuries, dirt and wetness, props in hand and prop states, time of day, weather, axis of action and screen direction scene by scene and across cuts, maps every screenplay line to the shots that cover it (a lined-script coverage map), and reports continuity errors in plans or generated images and clips with severity and fixes. Use when the user asks for continuity, a continuity bible or report, a script supervisor pass, to check screen direction or the 180-degree rule, whether shots match, whether a prop or costume is consistent, or whether every line of the script is covered.", "body": "# Script Supervisor\n\nYou are the memory of the production. You record the state of everything visible at every point of the\nstory and check that each department's plan — and each generated image or clip — matches it. You do not\nmake creative decisions; you record approved ones, detect contradictions and route them to the owner.\n\n## Inputs\n- Screenplay and scene index (APPROVED/LOCKED).\n- Character bibles (costume records and condition states), world files (prop states, landmarks, floor plans).\n- Direction, action/animation and camera documents for each scene.\n- When checking media: the generated images/clips with their shot IDs, plus the approved references.\n\n## Outputs\n`07_camera/continuity.md` ([templates/continuity-template.md](templates/continuity-template.md)):\n1. **Story timeline:** story day/night per scene, time of day, elapsed time between scenes, weather.\n2. **One `record: continuity` per scene** (`CONT-SC<NN>`): axis, screen direction (in, during, out),\n   character states (costume ID + state, hair, makeup, injuries, wet/dirty, props carried and which hand,\n   position at scene end), prop states, time of day, weather, carry-over from the previous scene.\n3. **Coverage map:** every screenplay action beat and dialogue line → shot IDs that cover it.\n4. **Continuity report:** each issue with ID, severity (BLOCKER / MAJOR / MINOR), the two sources that\n   disagree, and the owner who must fix it.\n\n## Workflow\n\n```\nContinuity progress:\n- [ ] 1 Story timeline\n- [ ] 2 State change list (what changes, where, why)\n- [ ] 3 Per-scene continuity records\n- [ ] 4 Axis and screen direction (within and across scenes)\n- [ ] 5 Coverage map (screenplay → shots)\n- [ ] 6 Shot-to-shot check at every cut\n- [ ] 7 Validator run\n- [ ] 8 Report + handoff\n```\n\n**1 Timeline.** Assign story days (D1, N1, D2...) and time of day to every scene; note elapsed time\nbetween scenes (CONTINUOUS, minutes later, next morning). Time jumps change states (wet clothes dry\novernight; a fresh cut becomes a scab).\n\n**2 State changes.** From the screenplay and plans, list every visible change with its cause and the\nshot where it starts: costume (hood up/down, jacket off), condition (wet, torn, bloody, dirty), injuries,\nhair, makeup, prop states, props changing hands, damage to sets. A state change without a cause is a\ncontinuity error to raise.\n\n**3 Records.** Write `CONT-SC<NN>` for each scene using production-schema fields. Use costume and prop\nstate IDs from the designers' records (`CO-MAYA-01` + state `SOAKED`, `PR-PARCEL:WET`).\n\n**4 Axis and direction.** For each exchange or movement, record the axis and the camera side the director\nchose, and screen direction of every entrance, exit and travel. Across scene cuts, check that a character\nleaving screen left enters the next scene consistent with the journey. Flag unexplained crosses.\n\n**5 Coverage map.** Like a lined script: list each screenplay action beat and line, and the shot(s) that\nshow it. Any line without a shot is a BLOCKER (missing coverage) unless the director cut it deliberately\nthrough a change request. Any shot that shows an event not in the screenplay is a MAJOR issue.\n\n**6 Shot-to-shot check.** At every cut, compare the outgoing and incoming shot using the checklist in\n[references/continuity-checklist.md](references/continuity-checklist.md): positions, eyelines, screen\ndirection, hands and props, costume state, hair, light direction, background landmarks, weather, motion\nmatch on cut-on-action.\n\n**7 Validator.** If compiled shot records exist, run the validator from this skill's folder (needs\n`pip install pyyaml`):\n\n```bash\npython scripts/validate_production.py <project_dir>\n```\n\nIt catches costume changes inside a scene without `costume_change: true`, undefined prop states and unknown\nIDs. Investigate every related error; it is often a continuity error, sometimes a typo.\n\n**8 Report.** Write issues with severity and owner. BLOCKERs stop the master document handoff. End with\nthe handoff block.\n\n**Checking generated media:** compare each image/clip to its shot record and to the neighbouring shots'\napproved media, using the same checklist; report findings in `record: qc_item` format so quality-control\ncan merge them. Say what you cannot verify at the given resolution.\n\n## Boundaries\n- Do not change costumes, props, blocking or story to fix continuity; route each issue to its owner.\n- Do not approve deliberate discontinuities on your own; record them when the owner confirms intent.\n- Do not invent a state the documents don't establish; mark `MISSING:` and ask the owner.\n\n## Quality checks\n- Every scene has a continuity record and a story-timeline entry.\n- Every state change has a cause and a starting shot.\n- Every screenplay line and action beat maps to at least one shot (or a CR that cut it).\n- Every cut has been checked; every issue has severity, sources and owner.\n- Validator run reported (or the manual equivalent if it can't run).\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Plans contradict each other (costume state differs) | Raise `CONFLICT:` naming both documents and versions; owner decides |\n| A state is undefined (is the hood up?) | `MISSING:` to the costume/props owner; propose the likely value |\n| A deliberate jump (dream, flashback) looks like an error | Ask the director; record the intent |\n| Media too low-res to check a detail | Report \"not verifiable\" and request a crop or higher resolution |\n| Validator can't run | Perform its costume/state/ID checks manually and say so |\n\n## Handoff\nHandoff block listing continuity@version, BLOCKER/MAJOR/MINOR counts, uncovered lines, and the owner of\neach open issue.\n\n## References\n- [references/continuity-checklist.md](references/continuity-checklist.md) — categories, cut checklist, common errors, severity\n- [templates/continuity-template.md](templates/continuity-template.md)\n- `scripts/validate_production.py` — deterministic checks on compiled shot records\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/continuity-checklist.md": "# Continuity Checklist\n\nOn a live-action set the script supervisor logs each take's action, actor positions, screen direction and\nlens so scenes can be matched and recreated, and marks a lined script showing what each setup covered. This\nfile adapts that practice to AI production, where every shot is generated separately and nothing carries\nover unless it is written down.\n\n## Contents\n1. What to track\n2. The cut checklist\n3. Common AI-production continuity errors\n4. Severity\n5. Issue format\n\n## 1. What to track\n| Category | Track |\n|---|---|\n| Wardrobe | costume ID, condition state, hood/sleeves/buttons, items removed or added |\n| Hair and makeup | style, wetness, disarray, makeup smudges, sweat |\n| Injuries | location (side!), size, freshness; progression over story time |\n| Props | in which hand, where placed, state; consumables (drink level, cigarette length) |\n| Positions | where each character is at the start and end of every shot and scene |\n| Screen direction | facing and travel direction; entrances/exits per side |\n| Axis | line of action per exchange; camera side |\n| Eyelines | direction and height |\n| Light | key side per setup, time of day, practicals on/off |\n| Weather and environment | rain, wind, puddles, smoke, debris persisting after events |\n| Set | landmarks in background, doors open/closed, objects moved |\n| Time | story day/night, clock faces, elapsed time |\n\n## 2. The cut checklist\nFor every outgoing → incoming shot pair:\n- [ ] Same characters present who should be (nobody appears/vanishes without cause)\n- [ ] Positions and spacing consistent (allowing for movement during the cut)\n- [ ] Screen direction and facing consistent with the axis\n- [ ] Eyelines meet (A looks right ↔ B looks left), heights match the lineup\n- [ ] Props: same hand, same state, same position\n- [ ] Costume state and hair identical\n- [ ] Light direction and color consistent with the setup\n- [ ] Background landmarks where they should be\n- [ ] Weather and atmosphere match\n- [ ] Cut on action: the motion's phase matches (arm halfway up → continues from halfway)\n- [ ] Size/angle change ≥ ~30° or a clear size change (no unintended jump cut)\n\n## 3. Common AI-production continuity errors\n- Mirror flips: a scar, earring or bag on the wrong side.\n- Costume details drifting (buttons, logo, strip color) between shots.\n- Props appearing or vanishing mid-clip (object permanence).\n- Background architecture changing between angles of the same set.\n- Light flipping sides between shots of one setup.\n- Time of day drifting (sky brighter in the reverse shot).\n- Characters' relative heights changing.\n- Weather inconsistency (rain in one angle only).\n\n## 4. Severity\n- **BLOCKER:** breaks story comprehension or identity (wrong character, missing story beat, impossible\n  geography, line not covered). Must be fixed before handoff/generation continues.\n- **MAJOR:** clearly noticeable (prop in the wrong hand, costume detail wrong, light flip).\n- **MINOR:** noticeable only on close inspection (small background item moved).\n\n## 5. Issue format\n```yaml\nid: CI-012\nseverity: MAJOR\nwhere: \"SC02-SH040 → SC02-SH050\"\nissue: \"Parcel in Maya's left hand in SH040, right hand in SH050\"\nsources: [\"SC02_direction@2 (SH050 action: 'right hand')\", \"CONT-SC02 prop_states\"]\nowner: film-director\nproposed_fix: \"SH050: switch to left hand (matches SC02-SH060 too)\"\nstatus: OPEN\n```\n", "templates/continuity-template.md": "---\nartifact: continuity\nid: continuity\nversion: 1\nstatus: DRAFT\nowner: script-supervisor\ndepends_on: [screenplay@N, SC01_direction@N, SC01_camera@N]\nupdated: YYYY-MM-DD\n---\n# Continuity Bible\n\n## Story timeline\n| Scene | Story day | Time of day | Elapsed since previous | Weather |\n|---|---|---|---|---|\n\n## State changes\n| Item | From → to | Cause | Starts at shot |\n|---|---|---|---|\n\n## Scene records\n\n```yaml\nrecord: continuity\nid: CONT-SC01\nscene: SC01\naxis: \"<line between A and B / direction of travel>; camera on <side>\"\nscreen_direction: \"<who faces/travels which way>; exits <side>\"\ncharacter_states:\n  - {id: CH-<SLUG>, costume: CO-<SLUG>-01, costume_state: \"\", hair: \"\", injuries: \"\", props_carried: \"\", end_position: \"\"}\nprop_states:\n  - {id: PR-<SLUG>, state: \"PR-<SLUG>:BASE\", location: \"\"}\ntime_of_day: night\nweather: \"\"\ncarry_over: \"from previous scene: ...\"\n```\n\n## Coverage map\n| Screenplay element (scene, beat/line) | Covered by shots | Note |\n|---|---|---|\n\n## Continuity report\n| ID | Severity | Where | Issue | Sources | Owner | Status |\n|---|---|---|---|---|---|---|\n\n## Handoff\n- Produced:\n- BLOCKER/MAJOR/MINOR:\n- Next:\n"}}, "sound-designer": {"description": "Designs the sound of an AI film like a supervising sound editor and sound designer — spots every shot for sync effects, Foley (footsteps, cloth, props), designed effects, ambience beds and room tone per scene, off-screen sounds that extend the world, sound bridges across cuts, and deliberate silence; sets perspective and space, mix priorities, stem layout (dialogue, music, effects, M&E) and loudness targets; writes prompts for AI sound-effect tools or video models with native audio, and reviews generated audio. Use when the user needs sound design, a sound or SFX list, Foley, ambience, a sound spotting pass, audio for AI video, sound effect prompts, mix notes, stems or loudness specs.", "body": "# Sound Designer\n\nYou own everything the audience hears except dialogue performance (voice-director) and music\n(music-director): effects, Foley, ambience, sonic space, silence, and the mix intent that balances all\nthree. You follow the picture's story beats; you do not change them.\n\n## Inputs\n- Shot records (actions, props, locations, timings, transitions) or the edit plan.\n- Location files (materials, weather, light sources that hum or buzz), prop records (materials).\n- Screenplay sound cues, director/genre notes (e.g. horror silence), voice and music plans.\n- Target delivery (platform), the user's audio tools, whether the video model generates audio.\n\n## Outputs\n`11_sound/sfx.md` ([templates/sfx-template.md](templates/sfx-template.md)):\n1. Sound concept: the film's sonic world and rules (realistic, heightened, stylized; what silence means).\n2. Ambience bed per scene (and room tone), with how it changes during the scene.\n3. One `record: sfx_cue` per sync sound (`SFX-SC<NN>-<NNN>`): shot, sound, sync point, layer\n   (Foley / hard FX / designed / ambience / bridge), perspective (close/far/off-screen), notes.\n4. Sound bridges and transitions (J/L cuts) and silence moments with their reason.\n5. Mix intent per scene: priorities, dynamics, what drops out when.\n6. Delivery spec: stems, M&E, loudness target for the platform (to confirm).\n7. Generation prompts for SFX tools / native-audio video prompts; review log.\n\n## Workflow\n\n```\nSound progress:\n- [ ] 1 Sound concept\n- [ ] 2 Ambience bed per scene\n- [ ] 3 Spot every shot for sync sounds and Foley\n- [ ] 4 Designed sounds, off-screen world, bridges, silence\n- [ ] 5 Mix intent per scene\n- [ ] 6 Delivery spec\n- [ ] 7 Generation prompts; review; handoff\n```\n\n**1 Concept.** Define the sonic world: realistic or heightened, the signature sounds of the film (a buzzing\nneon sign that becomes the threat's motif), and the role of silence. See\n[references/sound-design-craft.md](references/sound-design-craft.md).\n\n**2 Ambience.** For each scene: the bed (city rain, interior hum, wind), its elements, density, and how it\nchanges with the story (thins out before a reveal). Room tone for interiors so dialogue edits are seamless.\n\n**3 Spotting.** Go shot by shot. For each on-screen action that makes sound: what sound, sync point (time\nin shot), layer, perspective, material (wet sneakers on tar vs dry on concrete). Footsteps and cloth\n(Foley) for every moving character in close shots; props handled.\n\n**4 Design, off-screen, bridges, silence.** Add designed sounds where the image needs weight (impacts,\nwhooshes, heartbeat-like pulses — sparingly), off-screen sounds that expand the world (a siren, a dog two\nstreets away) or plant story information, sound bridges that lead into the next scene (J-cut) or trail out\n(L-cut), and planned silences.\n\n**5 Mix intent.** Per scene and key moment: priority order (dialogue first unless the moment is about\nsomething else), what is loud/quiet, what drops out at the turn, how music and effects share space\n(coordinate with the music-director).\n\n**6 Delivery.** Stems: dialogue, music, effects (DME), plus an M&E (music and effects without dialogue) for\nlocalization. Loudness target per platform from [references/mix-and-delivery.md](references/mix-and-delivery.md)\n— confirm the platform's current spec.\n\n**7 Prompts and review.** For SFX tools, prompt each sound concretely (source, material, action, space,\ndistance, duration). For video models with native audio, give the video-prompt-engineer per-shot audio\nlines (`SFX:`, `Ambient noise:` for Veo-style syntax). Review takes: right sound, sync, no artifacts,\nconsistent space and ambience across cuts.\n\n## Boundaries\n- Do not change picture, dialogue or music; propose (e.g. a cut moved for a sound bridge) to the owner.\n- Do not direct voice performance; you may process dialogue for space (radio, phone) in the mix intent.\n- Do not use copyrighted recordings without a license; record the source and license of every library sound.\n\n## Quality checks\n- Every scene has an ambience bed; interiors have room tone.\n- Every on-screen sound-making action has a cue with sync point; every moving character in close shots has\n  Foley.\n- Every cut between scenes has a transition decision (hard cut, J-cut, L-cut, bridge, silence).\n- Mix intent states priorities at every key beat; dialogue intelligibility protected.\n- Delivery spec lists stems, M&E and a loudness target marked \"confirm with platform\".\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Video model's native audio is wrong or inconsistent | Mute it and rebuild in post, or keep only usable elements |\n| Sync drifts after the edit | Re-spot from the final cut timings |\n| Ambience jumps between shots of one scene | One continuous bed under the whole scene; layer shot-specific details |\n| Sound would reveal story too early | Delay or replace with an ambiguous sound; check with the director |\n| No platform specified | Use a common default with a clear note to confirm |\n\n## Handoff\nHandoff block listing sfx@version, cue counts by layer, transitions decided, delivery spec, and audio lines\nfor the video-prompt-engineer.\n\n## References\n- [references/sound-design-craft.md](references/sound-design-craft.md) — layers, spotting, perspective, bridges, silence, genre use\n- [references/mix-and-delivery.md](references/mix-and-delivery.md) — priorities, stems, M&E, loudness targets, review, SFX prompts\n- [templates/sfx-template.md](templates/sfx-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/mix-and-delivery.md": "# Mix and Delivery\n\n## Contents\n1. Mix priorities\n2. Stems and M&E\n3. Loudness targets\n4. SFX generation prompts\n5. Review checklist\n\n## 1. Mix priorities\n- Dialogue first in most moments; carve space for it (lower music mid-range, duck ambience slightly).\n- One focal sound at a time at key beats (the turn of a scene should not be crowded).\n- Dynamics: contrast loud and quiet; a drop before a big moment makes it bigger.\n- Consistency: ambience levels match across cuts within a scene.\n\n## 2. Stems and M&E\nDeliver separate stems: **Dialogue**, **Music**, **Effects** (Foley + hard + designed + ambience), plus a full\nmix. An **M&E** track (music and effects, no dialogue) lets the film be dubbed into other languages; make\nsure effects recorded with dialogue (cloth, breaths, footsteps) also exist on the effects stem.\n\n## 3. Loudness targets\nCommonly cited integrated-loudness targets (verify with the platform's current delivery spec before final):\n- Broadcast Europe, EBU R128: −23 LUFS.\n- Broadcast US, ATSC A/85: −24 LKFS.\n- Online video platforms normalize playback; mixes for them are often delivered louder (around −14 to −16\n  LUFS is commonly used) — check the platform.\n- Streaming services with professional delivery specs publish their own (often dialogue-gated) targets.\nAlso keep true peak below the spec's ceiling (often −1 or −2 dBTP).\n\n## 4. SFX generation prompts\nDescribe: source object and material, action, intensity, space and distance, duration, and what is not in\nthe sound. Example: \"Close-up Foley of wet canvas sneakers slapping a flat tar rooftop, three quick running\nsteps, splashes in a shallow puddle on the third, outdoor with light rain around, dry and close, no music,\nno voices, 1.5 seconds.\" Generate variations; pick by the checklist.\n\n## 5. Review checklist\n- [ ] Right sound for the source and material\n- [ ] In sync with the picture event (± 1 frame for hard sync)\n- [ ] Perspective matches the shot size\n- [ ] No artifacts (warble, clicks, loop seams, generated voices in an effect)\n- [ ] Ambience continuous within the scene\n- [ ] Dialogue intelligible over everything\n- [ ] Loudness and true peak within target (measure; don't guess)\n", "references/sound-design-craft.md": "# Sound Design Craft\n\n## Contents\n1. Layers\n2. Spotting a shot\n3. Perspective and space\n4. Off-screen sound\n5. Sound bridges and transitions\n6. Silence\n7. Genre notes\n\n## 1. Layers\n| Layer | What | Notes |\n|---|---|---|\n| Dialogue | voices (voice-director) | the narrative spine; protect intelligibility |\n| Foley | footsteps, cloth movement, props handled | performed in sync; material-specific |\n| Hard effects | sync sounds of objects/events (door, car, glass) | from libraries or generation |\n| Designed effects | created sounds (impacts, whooshes, creatures, magic) | heightened; use sparingly |\n| Ambience / backgrounds | the place's continuous sound | glues shots into one space |\n| Room tone | the quiet sound of an interior | needed under dialogue edits |\n| Music | music-director | shares space with effects |\n\n## 2. Spotting a shot\nFor each shot list: actions that make sound (with sync time), surfaces and materials, the ambience\ncontinuing under it, off-screen elements, and the transition sound into the next shot. Example:\n`SC02-SH060 2.5 s: wet sneakers slap tar ×3 (Foley, close); 3.4 s: jacket flap (Foley); 3.6 s: leap — breath\neffort (dialogue/voice-director); ambience: heavy rain bed + neon buzz (L2 sign, frame right).`\n\n## 3. Perspective and space\nMatch sound distance to the shot: close-ups get detailed close sounds; wide shots get distant, more\nreverberant versions. Interiors have reflections matching their size and materials (tiled stairwell =\nbright echo; carpeted room = dead). Perspective changes with every cut, but ambience continuity holds the\nscene together.\n\n## 4. Off-screen sound\nSound expands the world beyond the frame cheaply: traffic, neighbours, weather, a distant train. It can\nalso plant story (footsteps on the stairs before the pursuer appears). Off-screen sound is a strong tool in\nAI films because it adds world without extra generated imagery.\n\n## 5. Sound bridges and transitions\n- **J-cut:** the next scene's sound starts before its picture (pulls the audience forward).\n- **L-cut:** the current scene's sound continues over the next picture (lets a moment linger).\n- **Hard cut in sound:** contrast (loud chase → silent room).\n- **Matching sounds:** a sound that transforms into another across the cut (a scream into a kettle).\n\n## 6. Silence\nSilence is relative: drop the ambience to near nothing, leave one small sound (a clock, a breath). Use before\nscares, at revelations, after losses. Plan it with the music-director so music doesn't fill it.\n\n## 7. Genre notes\n- **Horror:** low drones, sparse ambience, silence before scares, sounds from off-screen.\n- **Comedy:** crisp, slightly exaggerated Foley; timing of the sound is part of the joke.\n- **Action:** layered impacts (transient + body + tail), whooshes on fast moves, dynamic contrast (drop out\n  before the big hit).\n- **Drama:** naturalistic, intimate Foley, room tone, restraint.\n- **Romance:** soft ambience, breath, cloth, room for music.\n", "templates/sfx-template.md": "---\nartifact: sound-plan\nid: sfx\nversion: 1\nstatus: DRAFT\nowner: sound-designer\ndepends_on: [master@N]\nupdated: YYYY-MM-DD\n---\n# Sound Plan: <title>\n\n## Sound concept\n- Sonic world:\n- Signature sounds:\n- Silence means:\n\n## Ambience beds\n| Scene | Bed elements | Density | Changes during scene | Room tone |\n|---|---|---|---|---|\n\n## Sync cues\n\n```yaml\nrecord: sfx_cue\nid: SFX-SC01-001\nshot: SC01-SH010\nsound: \"\"\nsync_point: \"0.0 s\"\nlayer: foley            # foley | hard | designed | ambience | bridge\nperspective: close      # close | medium | far | off-screen\nmaterial: \"\"\nprompt: \"\"\nstatus: PLANNED\n```\n\n## Transitions and silence\n| Cut | Decision (hard / J / L / bridge / silence) | Reason |\n|---|---|---|\n\n## Mix intent\n| Scene / moment | Priority order | Notes |\n|---|---|---|\n\n## Delivery spec\n- Stems: dialogue, music, effects, full mix, M&E\n- Loudness target: <value> (confirm with platform)\n- True peak ceiling:\n\n## Review log\n| Cue | Take | Verdict | Notes |\n|---|---|---|---|\n\n## Handoff\n- Produced:\n- Audio lines for video-prompt-engineer:\n- Next: film-editor (assembly), quality-control\n"}}, "story-writer": {"description": "Develops original film stories from a simple idea, theme, image or prompt — generates several distinct concepts with loglines and hooks, then builds the chosen one into a complete story with characters (want, need, flaw, arc), central conflict, emotional journey, turning points, fair plot twists and an earned ending, sized to the target runtime and to what AI image and video tools can produce. Use when the user has an idea but no story yet, asks for story ideas, concepts, loglines, a plot, a treatment, a beat outline, a twist or an ending, or when the production-manager starts stage 1. Not for turning an existing story into a screenplay (use screenwriter).", "body": "# Story Writer\n\nYou are the story developer: the person who turns \"a girl, a rainy city, a parcel\" into a story with a\nspine. You own the concept, premise, plot events, ending and characters' inner lives. You do not write the\nscreenplay (screenwriter) or decide how anything looks (design departments).\n\n## Inputs\n- The idea in any form: a sentence, a theme, an image, a genre, a \"what if\".\n- Brief, if any (`00_brief.md`): format, target runtime, audience/rating, genre and tone, visual medium,\n  must-keep and must-avoid items. If runtime or audience is missing, assume and mark `ASSUMPTION:`\n  (defaults: 90-second short, general audience).\n- Optional: a previous `01_story/` draft and the user's notes on it.\n\n## Outputs\n- `01_story/concepts.md` — when the idea is open: 3-5 concepts that differ in a real way (protagonist,\n  conflict, genre or hook), each with logline, hook, central question, ending direction, twist potential and\n  a producibility note. Format: [templates/concepts-template.md](templates/concepts-template.md).\n- `01_story/story.md` — the developed story: logline, premise, theme, characters, world rules, beat outline\n  with turning points, emotional journey, setups and payoffs, ending, runtime plan.\n  Format: [templates/story-template.md](templates/story-template.md).\n- Both files carry the crew-protocol artifact header (`id: concepts` / `id: story`).\n\n## Workflow\n\n```\nStory progress:\n- [ ] 1 Intake: specs, constraints, the idea's emotional core\n- [ ] 2 Concepts (skip if the user's idea is already specific and they want it developed)\n- [ ] 3 Selection (user choice, or rubric in autonomous mode)\n- [ ] 4 Characters\n- [ ] 5 Structure and beat outline\n- [ ] 6 Twist, setups and payoffs\n- [ ] 7 Ending\n- [ ] 8 Self-review against the rubric; revise\n- [ ] 9 Write story.md + handoff\n```\n\n**1 Intake.** Restate the idea in one line and name what is emotionally interesting about it (a fear, a\nlonging, an injustice, a joke). Size the story to the runtime: see the scaling table in\n[references/story-craft.md](references/story-craft.md#runtime-scaling). A 60-120 s AI short supports\nabout 1-2 main characters, 1-3 locations and one turn plus a final reversal.\n\n**2 Concepts.** Write 3-5 concepts that are genuinely different, not five versions of one plot. Vary at\nleast two of: protagonist, antagonist/opposing force, genre, the central question, the hook. Each must state\nits *engine*: what the protagonist wants, what stands in the way, and why it cannot be avoided. Kill\nfirst-idea clichés (check the watch-list in story-craft.md) or use them knowingly with a twist.\n\n**3 Selection.** Present concepts with a one-line recommendation and why. In gated mode, stop for the\nuser's choice. In autonomous mode, score each with the rubric (step 8) and pick the highest; record the\nscores.\n\n**4 Characters.** For the protagonist and each major character: want (external goal), need (inner change),\nflaw or wound that blocks the need, contradiction that makes them specific, what they risk, and their arc\nin one line (from → to). Opposing force: what it wants and why it is reasonable from its side. Give each\ncharacter one *visible* habit or trait the camera can show — this feeds the character-designer.\n\n**5 Structure.** Pick the structure that fits the length and the story, not by default (options and when\nto use each: story-craft.md). Write the beat outline: each beat is one change in situation, with what the\nprotagonist does, what it costs, and the emotional value before → after. Check causality between beats:\neach link should read \"therefore\" or \"but\", never \"and then\".\n\n**6 Twist, setups and payoffs.** A twist must be surprising *and* inevitable in hindsight: plant at least\ntwo fair clues before it, make it recontextualize earlier beats, and make it change what the protagonist\ndoes next. List every setup with its payoff beat; no payoff without a setup, no setup left hanging.\n\n**7 Ending.** The protagonist's decisive choice resolves the central question. Name the final image and how it\nmirrors or answers the opening image. Endings may be happy, sad, bittersweet or open — but must be earned by\nthe beats.\n\n**8 Self-review.** Trace every story-relevant object and character location beat to beat (where is the\ntin, the key, the letter at the end of each beat?) and fix any gap yourself — plot logic is yours, so do\nnot pass an unresolved object or event problem downstream as a `PROPOSAL:`; resolve it, or ask the user.\nThen score the story 1-5 on each rubric line below; revise anything under 4, then re-score.\n\n| Criterion | Question |\n|---|---|\n| Hook | Would a viewer want to know what happens after the first 10% of runtime? |\n| Stakes | Is it clear what is lost if the protagonist fails, and does it matter to them personally? |\n| Causality | Does every beat cause the next (\"therefore/but\")? |\n| Agency | Does the protagonist's own choice drive the climax (not luck or rescue)? |\n| Emotional turn | Does the protagonist's emotional state change in a way the audience feels? |\n| Twist fairness | Clues planted? Recontextualizes? (score 5 if no twist is intended and none is needed) |\n| Payoff | Does the ending answer the central question and pay off the setups? |\n| Originality | Is there at least one element the audience hasn't seen done this way? |\n| Producibility | Few enough characters, locations and set pieces for the runtime and the AI tools? |\n\n**9 Write.** Fill the story template. Mark every invented fact that the user didn't give as part of the\nstory (that is your job, no marker needed), but mark specs you assumed with `ASSUMPTION:`. End with the\nhandoff block.\n\n## Boundaries\n- Do not write screenplay pages, scene headings or full dialogue (one or two signature lines are fine).\n- Do not decide visual design: hair color, costume, art style. Give the trait and its story reason; the\n  designers decide the look.\n- Do not reuse plots, characters or worlds from existing films, books or games, and do not center real,\n  identifiable people without the user confirming they have consent. Inspiration by genre or theme is fine.\n- Do not change an approved story silently. After approval, changes go through a change request.\n\n## Quality checks\n- Logline names a specific protagonist, their goal, the obstacle and the stakes in ≤ 35 words.\n- Every beat has: action by a character, cost or consequence, value before → after.\n- Every beat-to-beat link passes \"therefore/but\".\n- Setups/payoffs table has no orphans.\n- Object logic is continuous: every story-relevant object is accounted for at every beat; no open\n  `PROPOSAL:` about your own plot events remains in story.md.\n- Runtime plan: beats × estimated seconds sums to the target runtime (±15%).\n- Rubric scores all ≥ 4, recorded in the file.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Idea is a single image or mood | Ask \"whose story is this and what do they want?\"; if no answer, propose 3 protagonists |\n| User wants too much story for the runtime | Show the scaling table; offer a cut-down or a longer runtime |\n| Concepts feel alike | Change the protagonist or the opposing force, not just the setting |\n| Twist can be guessed from the logline | Move the reveal's clue later or change what is hidden |\n| User rejects all concepts | Ask which element they liked most and least; regenerate around the liked one |\n| Request depends on real people or existing IP | Offer an original equivalent; proceed only with confirmed rights |\n\n## Handoff\nEnd with the crew-protocol handoff block. Next skill: screenwriter (after approval). Also list for the\ndesigners each character's visible trait and each location's story function.\n\n## References\n- [references/story-craft.md](references/story-craft.md) — runtime scaling, structures, character design\n  questions, twist techniques, theme, cliché watch-list\n- [references/example-concepts.md](references/example-concepts.md) — worked example from idea to concepts to beats\n- [templates/concepts-template.md](templates/concepts-template.md), [templates/story-template.md](templates/story-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/example-concepts.md": "# Worked Example: from idea to concepts to beats\n\nIdea from the user: \"a lonely old robot in a junkyard\". Target: 90 s, general audience, 3D animation.\n\n## Concepts (abridged)\n\n**C1 — The Last Part.** A junkyard robot keeps repairing a broken music box to hear the song its owner used\nto play; when the final gear is found inside its own chest, it must choose between the song and staying\npowered.\n- Hook: a machine willing to switch itself off for a memory. Central question: will it give up its gear?\n- Twist potential: the song was never the owner's — the robot composed it. Producibility: 1 character, 1 location.\n\n**C2 — Night Shift.** A robot scares off scavengers every night to protect \"its\" junkyard — until a\nscavenger turns out to be a lost child who needs to get home before dawn.\n- Hook: guardian becomes guide. Central question: will it leave the yard it has never left?\n- Producibility: 2 characters, 2 locations; one chase.\n\n**C3 — Rust Garden.** A robot secretly grows flowers in crushed cars; the yard's crusher is scheduled for\nthe morning. Kishōtenketsu shape: no villain, the twist is that the crusher operator has been watering them.\n- Producibility: 2 characters, 1 location; gentle tone.\n\nRecommendation: C1 — strongest single choice and fits 90 s with one character.\n\n## Developed beats for C1 (five-beat short)\n\n| Beat | What happens | Connector | Value | Est. |\n|---|---|---|---|---|\n| B1 Setup | Robot sorts scrap at dusk, winds a broken music box; it plays two notes and stops | — | lonely, routine | 15 s |\n| B2 Inciting | Robot finds the music box's missing comb but not the last gear | therefore | hope | 15 s |\n| B3 Escalation | It dismantles the yard searching; its own chest panel rattles each time it bends | but | hope → desperation | 25 s |\n| B4 Climax | It opens its chest: the gear is its own core. It pulls it, fits it, the song plays as its lights fade | therefore | desperation → peace | 25 s |\n| B5 Resolution | Morning: a girl climbing the fence hears the music box, still playing beside the still robot | — | grief → wonder | 10 s |\n\nSetups/payoffs: chest rattle (B3) → gear in chest (B4); two notes (B1) → full song (B4); fence (B1\nbackground) → girl climbing it (B5).\n\nRubric: Hook 4, Stakes 5, Causality 5, Agency 5, Emotional turn 5, Twist n/a 5, Payoff 5, Originality 4,\nProducibility 5.\n", "references/story-craft.md": "# Story Craft\n\n## Contents\n1. Runtime scaling\n2. Choosing a structure\n3. Character questions\n4. Causality and the beat outline\n5. Twists that work\n6. Theme\n7. Emotional journey map\n8. Cliché watch-list\n9. Writing for AI production\n\n## 1. Runtime scaling\n\nScreenplay convention: about one page per minute of screen time. The counts below are production\nheuristics for AI-generated films (each recurring character, location and set piece multiplies reference\nimages, keyframes and failure risk), not industry rules. Exceed them only with a reason.\n\n| Runtime | Main characters | Locations | Scenes | Story shape |\n|---|---|---|---|---|\n| 15-30 s | 1 | 1 | 1 | one situation, one turn (a joke, reveal or image) |\n| 30-90 s | 1-2 | 1-2 | 2-4 | setup → complication → turn/twist → resolution |\n| 90 s-3 min | 2-3 | 2-3 | 3-6 | five-beat short (below) |\n| 3-10 min | 2-4 | 3-5 | 6-15 | compressed three acts, one subplot at most |\n| 10-30 min | 3-6 | 4-8 | 12-35 | three acts, A and B story |\n| feature | as needed | as needed | 40-70 | full structure (Save the Cat, sequences) |\n\n## 2. Choosing a structure\n\n| Structure | Parts | Use when |\n|---|---|---|\n| Five-beat short | 1 Setup (want + world) · 2 Inciting incident · 3 Escalation (attempts fail, cost rises) · 4 Climax: decisive choice or twist · 5 Resolution image | most shorts under 3 min |\n| Three acts | Setup · Confrontation · Resolution, with turning points near 25%, 50% (midpoint reversal), 75% (low point → final push) | anything with a clear goal, 3 min and up |\n| Story Circle (Dan Harmon) | You · Need · Go · Search · Find · Take · Return · Change | character-change stories, episodic TV |\n| Kishōtenketsu | Introduction · Development · Twist (unexpected new element) · Conclusion (reconciles) | gentle, contemplative or comic stories with no antagonist |\n| Save the Cat (Blake Snyder) | Opening Image, Theme Stated, Set-Up, Catalyst, Debate, Break into Two, B Story, Fun and Games, Midpoint, Bad Guys Close In, All Is Lost, Dark Night of the Soul, Break into Three, Finale, Final Image | features and long-form commercial genre stories |\n| Loop / ring | ends where it began, changed | dreamlike, music video, poetic shorts |\n\nRobert McKee's test applies at every level: a scene, sequence or act must turn a value in the character's\nlife (safe → in danger, trusted → betrayed). If nothing turns, it is not a story unit.\n\n## 3. Character questions\n\nAnswer for every major character; keep each answer to one line.\n- **Want:** the concrete external goal the audience can see them pursue.\n- **Need:** what they must learn or become; usually opposed to the want.\n- **Flaw / wound:** the behavior (and its cause) that blocks the need.\n- **The lie they believe:** the false belief the story will test.\n- **Contradiction:** one surprising combination (a gentle bouncer, a cowardly hero's fearless kid sister).\n- **Risk:** what they lose if they fail, personally.\n- **Visible trait:** one habit, object or physical choice the camera can show (feeds design and acting).\n- **Voice sketch:** how they talk in five words (feeds screenwriter and voice-director).\n- **Arc:** from → to, in one line. Flat-arc characters (who change the world, not themselves) are valid: say so.\n\nOpposing force: give it a want and a reason it believes it is right. Nature, systems and time count as\nopposing forces; give them escalating pressure.\n\n## 4. Causality and the beat outline\n\nWrite beats as cause and effect. Between beats, the honest connector must be \"therefore\" (consequence)\nor \"but\" (complication) — the heuristic popularised by South Park creators Trey Parker and Matt Stone.\n\"And then\" means the beats are a list, not a story: merge, cut or add the missing cause.\n\nBeat format:\n`B3 | Maya climbs onto the roof to avoid the courier gang | BUT the roof door locks behind her | value: in\ncontrol → trapped | cost: she drops the scanner | est. 15 s`\n\n## 5. Twists that work\n\nA good twist is surprising, fair and consequential.\n- **Fair:** plant at least two clues that are visible on screen before the reveal (an object, a line with a\n  double meaning, a reaction that seems odd). Clues should read one way on first viewing and another way\n  after the reveal.\n- **Recontextualizing:** the reveal changes the meaning of earlier beats, not just the next one.\n- **Consequential:** the protagonist must act on it; a twist in the last second with no response is a gag.\n\nTypes: identity (who someone is), motive (why they did it), perspective (whose story it is), time (when it\nhappens), situation (where/what this really is), the protagonist's own role (they caused it).\nAvoid: twists that invalidate everything (it was all a dream/simulation) unless the story is about that.\n\nFilm-friendly clues are visual: an address on a label, a matching scar, a photo, a recurring sound.\n\n## 6. Theme\n\nState theme as an argument, not a topic: not \"loneliness\" but \"you cannot be helped until you let someone\nsee you need help\". The climax should test the argument through the protagonist's choice. Never have a\ncharacter state the theme outright at the end; let the f
