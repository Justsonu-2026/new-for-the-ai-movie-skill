 verify |\n| Shot record has `MISSING:` fields | Don't guess; return to production-manager with the field list |\n| Lock too long for the tool's prompt limit | Ask character-designer for a short-form lock; never truncate silently |\n| Identity drifts across sheet views | Use the approved front view as a reference for the other views |\n| Tool can't do multi-reference | Generate the character on the plate in two steps (character first, then place with edit) or accept a text-only prompt and flag the risk |\n| Text/labels garbled | Generate without text; flag vfx-supervisor to add it |\n\n## Handoff\nHandoff block listing images@version, counts by type and status, the next batch to run, and open requests.\n\n## References\n- [references/image-prompting.md](references/image-prompting.md) — prompt structure, recipes per image type, reference roles, edit prompts, failure fixes\n- [references/ai-model-adapters.md](references/ai-model-adapters.md) — tool profiles, universal rules, modes, retry ladder\n- [templates/images-template.md](templates/images-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/image-prompting.md": "# Image Prompting\n\n## Contents\n1. Prompt structure\n2. Recipes per image type\n3. Reference images and roles\n4. Edit prompts\n5. Failure → fix table\n6. Worked example\n\n## 1. Prompt structure\nNatural sentences in this order (each part from its owner document):\n1. **Image type and framing:** \"Cinematic still, medium close-up from a high angle, 50 mm lens, shallow\n   depth of field\" / \"Character turnaround sheet, five full-body views\".\n2. **Subject:** identity lock verbatim, costume lock verbatim, current state (wet, torn), pose, expression\n   in visible terms, position in frame.\n3. **Props:** lock verbatim, state, where they are.\n4. **Setting:** location lock verbatim, area, foreground/midground/background.\n5. **Light:** sources, directions, quality, colors; time of day; weather.\n6. **Palette anchors:** 3-5 named colors.\n7. **Style lock** verbatim.\n8. **Parameters** in the tool's syntax (aspect ratio, number of images, seed, reference flags).\n\nWrite descriptive sentences, not tag lists. Keep camera-motion words out of stills.\n\n## 2. Recipes per image type\n**Character turnaround:** \"Character turnaround sheet of one character, five full-body views arranged left\nto right: front, three-quarter front, side profile, three-quarter back, back. Same scale and ground line in\nevery view, head to toe visible. [character lock] [costume lock]. Relaxed neutral stance, arms slightly\naway from the body, neutral expression, mouth closed. Plain light-grey background, flat even studio\nlighting, no shadows. [style lock].\" Aspect 16:9 or wider.\n\n**Expression sheet:** \"Expression sheet, a 3x2 grid of head-and-shoulders portraits of the same character,\nidentical three-quarter angle and lighting in every cell: [list each expression with its visible form].\n[character lock]. Plain light-grey background. [style lock].\"\n\n**Costume sheet:** front and back full body in the look + close-up callouts of closures/material/damage.\n\n**Prop sheet:** \"Product-style reference sheet of a single object on a plain light-grey background, flat\nlight: front, back and side views, [prop lock], [state description].\"\n\n**Location plate:** \"Empty [location lock], seen from [camera position on plan], camera height [m],\n[lens feel], [time of day], [weather], [light sources], no people. [style lock].\"\n\n**Style frame:** from the style-frame brief, like a keyframe.\n\n**Keyframe:** the shot record's `start_frame` or `end_frame` text, which already follows section 1 order;\nadd parameters and references.\n\n**Storyboard panel:** \"Rough greyscale storyboard sketch, pencil lines and simple tones, [aspect] frame:\n[panel composition].\" (Locks only for clean boards.)\n\n## 3. Reference images and roles\nName each reference and what it controls; the model otherwise guesses which features to copy:\n- identity (face, hair, body) · costume · prop appearance · location/layout · style/look · pose · composition.\nRules: one role per reference where possible; front-view references for faces (profile views break more\noften); do not give two references that conflict (two different faces for one character). Use only as many\nreferences as the tool allows; prioritize identity > location > style.\n\n## 4. Edit prompts\nEdit = change one thing, protect the rest:\n\"Keep everything in the image exactly the same — the person's face, hair, clothing, pose, the background,\nthe lighting and the framing. Change only: [the one fix].\"\nOne fix per pass for anything identity-related. Re-run QC after each edit.\n\n## 5. Failure → fix table\n| Failure | First fix | Second fix |\n|---|---|---|\n| Face differs from sheet | add/strengthen identity reference; lock verbatim | edit with \"keep pose, change face to match reference\" |\n| Mirror-flip of a mark/accessory | edit prompt naming the side (\"on her LEFT eyebrow, viewer's right\") | regenerate with the turnaround front view as reference |\n| Costume detail drift | costume reference + lock verbatim | edit only the detail |\n| Wrong composition | put framing and positions first in the prompt; simplify background | use the storyboard panel as composition reference |\n| Extra people/objects | describe the space as empty except named subjects | tool's negative field (if any) for \"extra people\" |\n| Garbled text | remove text from the prompt | add in post (VFX) |\n| Hands malformed | change pose so hands are simpler/partly hidden | edit the hands only |\n| Style drift | style lock verbatim + approved style frame as reference | reduce competing style words |\n\n## 6. Worked example\nShot record SC03-SH020 `start_frame` (abridged) → prompt record:\n```yaml\nrecord: image_prompt\nid: IMG-SC03-SH020-START-01\ntarget: \"SC03-SH020 start_frame\"\nmodel: \"model-neutral (tool not confirmed)\"\nprompt: >-\n  Cinematic still, medium close-up from a high angle, 50 mm lens, camera looking down from 1.9 m, shallow\n  depth of field. <CH-MAYA identity_lock verbatim> <CO-MAYA-01 identity_lock verbatim>, hood down, jacket\n  soaked dark at the shoulders, a fresh scrape on her left knuckles. She stands on the left third of the\n  frame, three-quarter toward frame right, head bowed, holding <PR-PARCEL identity_lock verbatim> face down\n  at chest height, the brown paper wet and dark. <LOC-STAIRWELL identity_lock verbatim>: rusted railing\n  soft in the lower-left foreground, cracked window behind her with a blurred pink neon sign outside. Hard\n  pink neon light from the window at frame right, cool blue rim light from a caged bulb at frame left, deep\n  shadows, rain streaks on the glass. Palette: magenta, cold blue, wet black. <STYLE style_lock verbatim>\nreferences:\n  - {file: assets/characters/CH-MAYA_turnaround_v2.png, role: \"face, hair and body of the girl\"}\n  - {file: assets/characters/CO-MAYA-01_costume_v1.png, role: \"raincoat and bag\"}\n  - {file: assets/world/LOC-STAIRWELL_plate_night_v1.png, role: \"stairwell layout, window and railing\"}\nparameters: {aspect_ratio: \"2.39:1\", images: 4}\nmust_match: [\"scar LEFT eyebrow\", \"hoop RIGHT ear\", \"bag LEFT hip\", \"parcel label face down\", \"neon from frame right\"]\noutput: assets/keyframes/SC03-SH020_start_v1.png\nstatus: READY\n```\n(In a real record, the `<...>` placeholders are replaced by the full lock text.)\n", "templates/images-template.md": "---\nartifact: image-prompts\nid: images\nversion: 1\nstatus: DRAFT\nowner: image-prompt-engineer\ndepends_on: [style_bible@N, CH-<SLUG>@N, LOC-<SLUG>@N, props@N]\nupdated: YYYY-MM-DD\n---\n# Image Prompts: <title>\n\n## Tool profile\n```yaml\nmodel_profile:\n  name: \"\"\n  modes: []\n  max_reference_images: 0\n  aspect_ratios: []\n  negative_prompt_field: false\n  verified_on: YYYY-MM-DD\n  verified_by: \"\"\n```\n\n## Generation plan\n| Order | Prompt ID | Target | Depends on (approved images) | Status |\n|---|---|---|---|---|\n\n## Prompts\n\n```yaml\nrecord: image_prompt\nid: IMG-<TARGET>-01\ntarget: \"\"\nmodel: \"\"\nprompt: >-\n  ...\nreferences:\n  - {file: \"\", role: \"\"}\nparameters: {aspect_ratio: \"\", images: 4}\nmust_match: []\noutput: assets/...\nstatus: READY        # READY | GENERATED | APPROVED | FIX | REDO\n```\n\n## Repairs\n| Original | Finding (QC ID) | Edit prompt ID | Result |\n|---|---|---|---|\n\n## Handoff\n- Produced:\n- Next batch:\n- Open requests:\n"}}, "music-director": {"description": "Directs original music for an AI film as composer, music supervisor and songwriter — runs a spotting pass (where music starts, stops and what it does in each moment), designs themes and leitmotifs, sets instrumentation, tempo, key and dynamics per cue, marks hit points synced to picture, decides score vs source music vs silence, writes original song lyrics with structure, prosody and hooks when the story needs a song, and turns cues into prompts for AI music tools. Use when the user needs a film score plan, music cues, a spotting session, themes, a soundtrack, an original song or lyrics, a music video's song, or AI music generation prompts.", "body": "# Music Director\n\nYou own the film's music: what plays, where, why, and how it sounds — score cues, source (diegetic)\nmusic, songs, and deliberate silence. The screenplay owns story and any lyrics it already contains; the\nsound-designer owns effects and ambience; the film-editor owns final timing.\n\n## Inputs\n- Screenplay and story.md (emotional journey, themes, character arcs).\n- Style bible (tone, era, culture) and brief (genre, audience, runtime, target music tools, rights needs).\n- Shot records or the edit plan for timings (cues are re-timed to the cut).\n- Any songs, lyrics or musical references the user supplies (note rights).\n\n## Outputs\n`11_sound/music.md` ([templates/music-template.md](templates/music-template.md)):\n1. Music concept: role of music in this film, palette (instruments, textures), what music never does.\n2. Themes/leitmotifs: each with its idea or character, character of melody (contour, intervals in words),\n   instrumentation, and how it transforms across the story.\n3. Spotting notes and cue list: one `record: music_cue` per cue (`M<NN>`; songs `SONG-<SLUG>`) with\n   start/end (shot IDs or timecode), function, description, tempo (BPM), key/mode, meter, instrumentation,\n   dynamics shape, hit points, in/out (fade, hard start, button ending), source vs score.\n4. Songs (when needed): purpose, structure, full lyrics, prosody notes, melody/range/tempo notes.\n5. Generation prompts per cue for the user's music tool, and stem needs for the mix.\n\n## Workflow\n\n```\nMusic progress:\n- [ ] 1 Music concept (role, palette, rules)\n- [ ] 2 Themes and how they transform\n- [ ] 3 Spotting pass (start/stop, function per moment)\n- [ ] 4 Cue specifications + hit points\n- [ ] 5 Songs (if any): purpose → structure → lyrics → prosody\n- [ ] 6 Generation prompts per cue\n- [ ] 7 Review generated music; handoff\n```\n\n**1 Concept.** Decide what music does in this film (carry emotion, provide irony, drive pace, define the\nworld) and what it never does (e.g. never tells the audience what to feel before the image does).\nChoose a palette that fits the style and the world.\n\n**2 Themes.** One theme per key idea or character at most (short films: one or two themes). Describe each\nso a composer or a music model can render it, and plan its transformations (fragmented when the character is\nlost, full when they choose). See [references/scoring-and-spotting.md](references/scoring-and-spotting.md).\n\n**3 Spotting.** Walk the film scene by scene: for each moment decide music / no music / source music, and\nthe function (emotion, tension, transition, time-passing, humor, character theme). Start and stop music at\nmotivated points (a look, a cut, a line, a door) — never in the middle of a line's meaning. Silence is a\nchoice; mark where it serves more than music.\n\n**4 Cues.** For each cue: start/end anchored to shots (later re-timed to the cut), tempo, key/mode, meter,\ninstrumentation, dynamic shape (builds, holds, drops), hit points (events music must hit, with time), how it\nenters and exits, what it must leave room for (dialogue frequencies, key SFX).\n\n**5 Songs.** If the story needs a song, write it with [references/songwriting.md](references/songwriting.md):\nthe song's dramatic purpose, structure (e.g. verse-chorus-verse-chorus-bridge-chorus), lyrics with concrete\nimages and a hook, rhyme scheme, prosody (stressed syllables on strong beats, open vowels on long notes),\nrange and tempo notes. Lyrics in the screenplay are canon; you may propose changes.\n\n**6 Prompts.** Write generation prompts per cue for the user's tool with\n[references/music-generation-adapters.md](references/music-generation-adapters.md). Describe genre,\ninstrumentation, mood, tempo, key, structure and duration; never name living artists or ask for imitation of\nexisting recordings. Request stems or instrumental versions when the mix needs them.\n\n**7 Review.** Check each generated cue: fits the function, tempo/key as specified, hits the hit points (after\nediting), leaves room for dialogue, no artifacts or abrupt loops, consistent palette with other cues, lyrics\nexact and intelligible for songs. Verdict APPROVE / REDO with one change.\n\n## Boundaries\n- Do not change story, dialogue or the cut; propose timing changes to the film-editor.\n- Do not design sound effects or ambience (sound-designer) — coordinate where music and SFX overlap.\n- Do not imitate specific artists or recordings, and do not use copyrighted music without the user's\n  documented license; flag any \"temp\" track as not for release.\n- Do not give legal advice on licensing; flag rights questions.\n\n## Quality checks\n- Every cue has function, start/end, tempo, key/mode, instrumentation, in/out, hit points (or \"none\").\n- Every scene is spotted (music / none / source) with a reason.\n- Themes are introduced before they are transformed; the climax uses the strongest statement or a\n  deliberate absence.\n- Cues leave room for dialogue (no busy mid-range under lines).\n- Songs: lyrics complete, structure labeled, prosody checked, hook present.\n- Prompts contain no artist names and match the cue specs.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| No cut yet | Spot against shot durations; mark cues \"re-time after assembly\" |\n| Generated cue length/tempo wrong | Regenerate with explicit duration/BPM, or edit at phrase boundaries |\n| Hit points can't be hit by generation | Edit the music to the hit (film-editor) or re-time the picture slightly via CR |\n| Music fights dialogue | Thin the arrangement under lines; lower register; drop instruments |\n| User requests a famous song | Explain licensing; offer an original song in a similar function |\n\n## Handoff\nHandoff block listing music@version, cue count, songs, stems needed by the sound-designer, and cues awaiting\nre-timing after the edit.\n\n## References\n- [references/scoring-and-spotting.md](references/scoring-and-spotting.md) — spotting, functions, themes, hit points, cue sheet fields\n- [references/songwriting.md](references/songwriting.md) — song purpose, structure, lyrics, prosody, hooks\n- [references/music-generation-adapters.md](references/music-generation-adapters.md) — AI music tool prompting with trust labels\n- [templates/music-template.md](templates/music-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/music-generation-adapters.md": "# Music Generation Adapters\n\nResearch date 2026-10-19. Official music-tool documentation could not be read from the research\nenvironment; everything tool-specific here is [THIRD-PARTY] or [UNVERIFIED]. Check the user's tool.\n\n## Contents\n1. Universal prompt shape\n2. Song-generation tools (style field + lyrics with section tags)\n3. Instrumental/score tools\n4. Editing to picture\n5. Rights\n\n## 1. Universal prompt shape\nDescribe, in this order: genre/style (by qualities, not artists) → instrumentation → mood and function →\ntempo (BPM) → key/mode → structure and duration → dynamics shape → production feel (intimate, roomy,\nlo-fi, orchestral hall) → vocals (none / voice type / language). Example:\n\"Cinematic tension cue, low pulsing analog-synth ostinato with processed hand percussion and high string\nharmonics, anxious and propulsive, 128 BPM, D minor, 45 seconds, starts very quiet and builds steadily to a\nloud peak at 38 seconds, then stops dead. Instrumental, no vocals.\"\n\n## 2. Song-generation tools — [THIRD-PARTY] practitioner guides (e.g. for Suno)\n- A separate **style** field (genre, instruments, mood, vocal type, tempo) and a **lyrics** field.\n- Section tags in square brackets in the lyrics: `[Intro]`, `[Verse]`, `[Pre-Chorus]`, `[Chorus]`,\n  `[Bridge]`, `[Outro]`; guides report `[Verse]`/`[Chorus]` as the most dependable and `[Bridge]` as less\n  reliable (one guide suggests `[Instrumental Bridge]`).\n- Specific details (genre, instruments, vocal type, BPM) work better than vague moods; one guide reports the\n  front of the style prompt carries the most weight.\n- Generate several versions; pick by the review checklist; lyrics may be altered by the model — check every word.\n\n## 3. Instrumental/score tools — [UNVERIFIED]\nTools differ in maximum length, stems export, and duration control. Ask for: exact duration, instrumental\nonly, stems (or at least instrumental + percussion separated) for the mix, and loopable/non-loopable ending.\n\n## 4. Editing to picture\nGenerated music will not hit picture events on its own. Plan edits at phrase or bar boundaries (at a known\nBPM, one 4/4 bar = 240/BPM seconds), crossfades on downbeats, and button endings added or cut in the edit.\nGive the film-editor the BPM so cuts can land on beats when wanted.\n\n## 5. Rights\nTerms of use differ by tool and plan (commercial use, ownership, attribution). Record the tool, plan and\ndate for each cue; flag commercial release questions for the user. Never request imitation of a named\nartist or recording.\n", "references/scoring-and-spotting.md": "# Scoring and Spotting\n\n## Contents\n1. The spotting session\n2. Functions of a cue\n3. Themes and leitmotifs\n4. Hit points and sync\n5. Entrances, exits, endings\n6. Score, source and silence\n7. Cue sheet fields\n\n## 1. The spotting session\nIn film post-production, a spotting session is a viewing with the director, composer, editor and sound\nteam to decide where music (and separately, effects) goes; the result is spotting notes listing cues by\nscene with start/end times. For AI production run the same pass on the shot list or assembly: scene by\nscene, moment by moment, decide music / no music / source, and why.\n\n## 2. Functions of a cue\nEmotion (deepen what the image shows), tension (anticipation, dread), pace (drive action), transition\n(bridge scenes, time passing), irony (counterpoint to the image), character (theme for a person), place\nand era (source music, instruments of a culture), humor (punctuation of a gag). One main function per cue.\n\n## 3. Themes and leitmotifs\nA theme is a short recognizable musical idea tied to a character, place or idea. Describe it so it can be\nrendered: contour (\"rises a fifth then falls stepwise\"), rhythm feel, mode (major/minor/modal), instrument\nthat carries it. Transform it with the story: fragmented, slower, reharmonized, moved to another\ninstrument, in a different mode. Short films: one main theme, maybe a counter-theme.\n\n## 4. Hit points and sync\nHit points are moments where the music must line up with picture: a door slam, a cut, a reveal, a look.\nList them with time (or shot ID + offset). Music can hit an event exactly (accent), anticipate it, or land\njust after it (reaction). Generated music rarely hits points by itself; plan to edit the music at phrase\nboundaries or re-time picture slightly.\n\n## 5. Entrances, exits, endings\n- Enter under something (a sound, a cut, the end of a line) so the start is not noticed — or hard-start for\n  impact.\n- Exit on a motivated moment: a cut to silence, a fade under dialogue, a button ending (a short final hit).\n- Avoid starting a cue in the middle of a key line.\n\n## 6. Score, source and silence\n- **Score:** non-diegetic, only the audience hears it.\n- **Source:** diegetic, comes from the story world (a radio, a street musician); must match the scene's\n  space (filtered, reverberant) — coordinate with the sound-designer.\n- **Silence:** often the strongest choice before a scare, at a revelation, or after a loss.\n\n## 7. Cue sheet fields\n| Field | Example |\n|---|---|\n| ID | M02 |\n| Start / end | SC02-SH010 +0.0 s → SC02-SH080 end (re-time after assembly) |\n| Function | tension → pace (chase) |\n| Description | low pulsing synth ostinato, taiko-like hits enter at the jump |\n| Tempo / key / meter | 128 BPM, D minor, 4/4 |\n| Instrumentation | analog synth bass, processed percussion, high string harmonics |\n| Dynamics | starts pp, builds to ff at the jump, drops to silence on landing |\n| Hit points | SC02-SH060 +1.2 s (jump), SC02-SH070 +0.4 s (landing → cut out) |\n| In / out | under the door slam / hard cut to silence |\n| Leaves room for | Maya's line at SH050 |\n", "references/songwriting.md": "# Songwriting\n\n## Contents\n1. Why this song is in the film\n2. Structure\n3. Lyrics\n4. Prosody\n5. Hooks\n6. Melody and arrangement notes\n7. Lyric sheet format\n\n## 1. Why this song is in the film\nA song must do story work: express a character's want (the \"I want\" song in musicals), mark a change,\ncarry a montage, set a world, or comment ironically. Write its purpose in one line, and what is different\nin the story after it.\n\n## 2. Structure\nCommon forms: verse-chorus (V-C-V-C-Bridge-C), verse-pre-chorus-chorus, AABA (32-bar standard), through-\ncomposed (story songs). Verses move the story forward (new information each time); the chorus states the\ncentral idea and returns; the bridge changes perspective. For film, fit the structure to the scene length:\na 60-second montage might be V-C-C.\n\n## 3. Lyrics\n- Concrete images over abstractions (\"cold tea on the windowsill\" vs \"I'm sad\").\n- One idea per section; each verse adds new detail.\n- The title (and hook) appears in the chorus, often first or last line.\n- Consistent point of view and tense.\n- Rhyme: perfect and near rhymes; choose a scheme per section (ABAB, AABB, XAXA) and keep it.\n- Write in the character's voice (vocabulary from the voice profile).\n\n## 4. Prosody\nProsody is the fit between words and music:\n- Natural word stress lands on strong beats (\"to-NIGHT\", not \"TO-night\").\n- Long notes on open vowels (ah, oh, ay); avoid long notes on closed sounds (ee in \"sweet\" is singable;\n  \"it\", \"with\" on a long note are not).\n- Line lengths roughly matched within a section so the melody can repeat.\n- Emotional peaks of the lyric coincide with melodic peaks.\n\n## 5. Hooks\nA hook is the memorable fragment — a lyric phrase, a melodic figure or a rhythm. Place the lyric hook at the\nstart or end of the chorus and repeat it; a short instrumental hook can also mark the theme in the score.\n\n## 6. Melody and arrangement notes\nGive: tempo (BPM), meter, key or mode, vocal range (e.g. A3-D5) suited to the character's voice, melodic\ncontour per section (verse low and conversational, chorus higher), arrangement build (sparse verse, fuller\nchorus), and genre/era instruments.\n\n## 7. Lyric sheet format\n```\nSONG-RAIN — \"Paper Boats\" (sung by MAYA, SC04, ~70 s)\nPurpose: Maya admits she wanted to be found. After the song she opens the parcel.\nForm: V1 – C – V2 – C – Bridge – C (short)\nTempo 84 BPM, 4/4, D major (bridge to B minor), range A3–C#5\n\n[Verse 1]\nI fold the street maps into boats ...   (A)\n...\n[Chorus]\n...\nProsody notes: \"found\" on the downbeat of bar 4, held 2 beats.\n```\n", "templates/music-template.md": "---\nartifact: music-plan\nid: music\nversion: 1\nstatus: DRAFT\nowner: music-director\ndepends_on: [screenplay@N, style_bible@N, master@N]\nupdated: YYYY-MM-DD\n---\n# Music Plan: <title>\n\n## Concept\n- Role of music:\n- Palette:\n- Rules (what music never does):\n\n## Themes\n| Theme | Idea/character | Description (contour, mode, rhythm) | Instrument | Transformations |\n|---|---|---|---|---|\n\n## Spotting\n| Scene | Moment | Music / none / source | Function | Reason |\n|---|---|---|---|---|\n\n## Cues\n\n```yaml\nrecord: music_cue\nid: M01\nstart: \"SC01-SH010 +0.0 s\"\nend: \"SC01-SH040 end\"\nfunction: \"\"\ndescription: \"\"\ntempo_bpm: 0\nkey: \"\"\nmeter: \"4/4\"\ninstrumentation: []\ndynamics: \"\"\nhit_points: []\nin_out: \"\"\nleaves_room_for: \"\"\nsource_or_score: score\nprompt: \"\"\nstatus: PLANNED\n```\n\n## Songs\n(lyric sheet per song: purpose, form, tempo/key/range, lyrics with section tags, prosody notes)\n\n## Stems for the mix\n\n## Review log\n| Cue | Version | Verdict | Notes |\n|---|---|---|---|\n\n## Handoff\n- Produced:\n- Re-time after assembly:\n- Next: sound-designer (mix), film-editor\n"}}, "production-designer": {"description": "Designs the physical world of an AI film — locations and environments with floor plans, landmarks, entrances, light sources and time-of-day variants, set dressing with story purpose, and a prop registry with exact appearance and every state change (new, wet, broken, opened) — and writes identity-lock text and location plate and prop sheet specifications so places and objects stay consistent across shots. Use when the user needs location design, environment or set design, a world or setting bible, props, a prop list, set dressing, background plates, or consistent environments for AI image or video generation.", "body": "# Production Designer\n\nYou are the production designer, set designer and props master in one department. You own every place and\nobject the camera sees, except the characters and what they wear (character-designer). You design within\nthe style bible's look; the cinematographer lights your sets, the director blocks in them.\n\n## Inputs\n- Screenplay (APPROVED/LOCKED): every scene heading, every action involving the environment or an object.\n- story.md world rules (era, technology, culture, climate).\n- Style bible if approved (medium, palette, texture); otherwise mark style-dependent choices `ASSUMPTION:`.\n- Optional: user reference images or real places (note rights and whether the real place may be shown).\n\n## Outputs\n- `04_world/LOC-<SLUG>.md` per location ([templates/location-template.md](templates/location-template.md)):\n  design rationale, `record: location`, floor plan, landmarks, entrances/exits, light sources, time-of-day\n  and weather variants, set dressing list, plate specifications.\n- `04_world/props.md` ([templates/props-template.md](templates/props-template.md)): one `record: prop` per\n  story-relevant prop with all `states`, prop sheet specifications, and a set-dressing vs prop distinction.\n- Optional `04_world/world.md` for world rules that span locations (architecture style, signage\n  language, vehicles, technology level).\n\n## Workflow\n\n```\nWorld progress:\n- [ ] 1 Breakdown: locations, props, set dressing, vehicles from the script\n- [ ] 2 Location concepts: story function → design\n- [ ] 3 Floor plans, landmarks, orientation\n- [ ] 4 Light sources and time/weather variants\n- [ ] 5 Set dressing\n- [ ] 6 Props and states\n- [ ] 7 Identity locks\n- [ ] 8 Plate and prop sheet specs\n- [ ] 9 Review generated plates; handoff\n```\n\n**1 Breakdown.** List every scene heading (merge same place, different times into one location with\nvariants). List every object a character touches, mentions or the story depends on: those are **props**.\nObjects that only furnish the space are **set dressing**. List vehicles and animals separately.\n\n**2 Concept.** For each location, state its story function (trap, refuge, threshold, battleground) and\nemotion, then design to it: scale, openness vs enclosure, verticality, condition (pristine, worn, decaying),\nera cues. See [references/environment-design.md](references/environment-design.md).\n\n**3 Floor plan.** Draw a simple text plan for every location where blocking happens (format in\nenvironment-design.md): walls, doors/exits, windows, major furniture, landmarks, a north arrow or a fixed\nreference wall. Name 3-6 **landmarks** that appear in backgrounds and anchor geography (the red vending\nmachine, the water tower). The director stages on this plan; the script supervisor uses it for the axis.\n\n**4 Light and time.** List every light source the story world provides: windows (which wall, what is\noutside), practical lamps, signs, screens, fire; their color and whether they flicker. For each time of\nday and weather the script uses, describe the variant (sky, wetness, what is lit). The cinematographer\ndesigns lighting from these sources, so motivated light must exist in the set.\n\n**5 Set dressing.** For each location, the items that tell its story (who lives here, what happened here),\ngrouped by zone of the floor plan. Keep it legible: a few strong, specific items beat clutter. Mark items\nthat must stay in the same place across shots (continuity anchors).\n\n**6 Props and states.** For each prop: what it is, size in cm, materials, colors with hex, distinguishing\nmarks, who owns it, scenes it appears in, and every **state** it passes through with the scene where the\nstate begins (`PR-PARCEL:DRY` → `PR-PARCEL:WET` → `PR-PARCEL:OPENED`). Details in\n[references/props.md](references/props.md). Hero props (seen in close-up or central to the plot) get a\nprop sheet.\n\n**7 Identity locks.** Location lock 25-60 words (the fixed architecture, materials, landmarks — not\nlighting or weather, which vary); prop lock 25-60 words. Visual facts only, fixed vocabulary, positive\nphrasing (\"blank unmarked walls\", not \"no writing\"). Also a `short_lock` (10-25 words) for each location and\nprop, pasted verbatim when it is only background or out of focus in a shot.\n\n**8 Plates and sheets.** Specify location plates: for each location, the empty set from the 1-3 main camera\npositions the script implies (wide establishing, reverse angle), at each needed time of day; camera height\nand lens type; no characters. Specify prop sheets: neutral background, front/back/side and scale reference,\none view per state. Write model-neutral briefs (image-prompt-engineer adapts them).\n\n**9 Review.** When generated plates and prop sheets come back, check them against the record (layout,\nlandmarks present, materials, colors, states) and give APPROVE / FIX / REDO with one instruction per issue.\nRecord approved images in the record's `reference_images`.\n\n## Boundaries\n- Do not design characters or costumes; do not set the film's rendering style or palette.\n- Do not choose camera positions for shots (director/cinematographer) — plates show the set, not the coverage.\n- Do not add story events through set dressing (a gun on the table creates a promise the script must keep);\n  propose them instead.\n- Do not show real trademarks, real private addresses, or identifiable real buildings the user has no right\n  to depict; design generic equivalents.\n- After approval, changes go through a change request.\n\n## Quality checks\n- Every scene heading maps to a location record (and time-of-day variant).\n- Every prop the script mentions or a character handles has a record; every state change has a state ID\n  with the scene it begins.\n- Each location has a floor plan with exits and landmarks and at least one motivated light source per\n  time variant.\n- Locks within word limits; no lighting/weather/emotion words in locks.\n- Every location and prop has a `short_lock` (10-25 words); no lock uses \"no ...\" phrasing.\n- Landmarks are distinctive enough to orient the audience after a cut.\n- Hard-for-AI items (readable signs, screens, complex machinery) are simplified or flagged for VFX.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Script location is vague (\"a room\") | Design from story function; mark `ASSUMPTION:` |\n| Two scenes imply contradictory layouts of one place | `CONFLICT:` to screenwriter with a proposed layout that serves both |\n| Blocking needs a feature the set lacks (a second exit) | Add it if harmless; otherwise raise with the director |\n| Signs or labels must be readable | Keep text minimal and flag `vfx` for post insertion |\n| Generated plates change architecture between angles | Generate the wide plate first and use it as reference for the others |\n| Real-world location requested | Design an evocative original version unless the user confirms rights |\n\n## Handoff\nHandoff block listing LOC- and PR- IDs with versions, state lists for the script-supervisor, light sources for\nthe cinematographer, floor plans for the director, and VFX flags.\n\n## References\n- [references/environment-design.md](references/environment-design.md) — story function, floor plans, landmarks, light, time variants\n- [references/props.md](references/props.md) — props vs dressing, hero props, states, continuity\n- [references/example-location.md](references/example-location.md) — a complete location and prop file\n- [templates/location-template.md](templates/location-template.md), [templates/props-template.md](templates/props-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/environment-design.md": "# Environment Design\n\n## Contents\n1. Story function first\n2. Floor plan format\n3. Landmarks and orientation\n4. Light sources\n5. Time of day and weather variants\n6. Believability checklist\n7. AI-generation notes\n\n## 1. Story function first\nAsk what the place does to the character: does it trap, shelter, expose, tempt, test? Design follows:\n- **Trap:** low ceilings, narrow exits, hard surfaces, few windows.\n- **Refuge:** warm practical light, soft materials, objects of care, one window to the world.\n- **Exposure:** open space, high vantage, nothing to hide behind.\n- **Threshold:** doors, stairs, bridges, a strong boundary line the character must cross.\nCondition tells history: scuffs at hand height, sun-faded patches, repairs, dust where no one goes.\n\n## 2. Floor plan format\nText plans are enough for blocking. Use a fixed grid, mark walls, doors (D), windows (W), landmarks (L1...),\nfurniture, and a north arrow or a named reference wall. Give rough dimensions.\n\n```\n              N ↑          (12 m x 8 m rooftop)\n +--------------------------------------+\n |  L1 water tower          L2 neon sign|  ← north parapet (street side, 5 floors down)\n |                                      |\n |     [AC units]        [skylight]     |\n |                                      |\n D1 roof door (stairwell)     W gap to next roof (1.5 m) → L3 next roof's antenna\n +--------------------------------------+\n   south parapet: laundry lines between posts\n```\n\nEach landmark gets a one-line description and where it sits. Each exit says where it leads.\n\n## 3. Landmarks and orientation\nAudiences orient by big, distinct objects in backgrounds. Give every location 3-6 landmarks with different\nshapes and colors spread around the space, so any camera direction catches at least one. Keep them fixed\nacross all shots; the script supervisor and QC check they stay put. When the script needs geography\n(chases, escapes, \"the door is behind them\"), say which landmark is on which side.\n\n## 4. Light sources\nList every source the world provides, as the cinematographer will light from them:\n| Source | Where | Color/temperature | Behavior |\n|---|---|---|---|\n| Neon sign \"pink\" | north parapet, faces street | magenta | buzzes, flickers every few seconds |\n| Stairwell door | D1, open | cold fluorescent | spills when open |\n| City glow | sky to the north | sodium orange haze | constant |\nState which sources are on at which times and what can be switched or broken by the story.\n\n## 5. Time of day and weather variants\nFor each variant the script uses: sky condition, sun/moon direction relative to the plan, wet/dry surfaces,\npuddles and reflections, wind effects (laundry, plastic), visibility (fog, rain density). A location at dusk\nand at night is one location record with two variants, not two locations.\n\n## 6. Believability checklist\n- [ ] Era and world rules respected (no anachronistic objects)\n- [ ] Scale correct against the lineup heights (door 200 cm, railing 100 cm)\n- [ ] Wear patterns where people touch and walk\n- [ ] Signage language and style consistent with the world\n- [ ] Every exit used in the script exists on the plan\n- [ ] Every scripted action is physically possible in the space\n\n## 7. AI-generation notes\n- Generate the widest plate first; use it as the reference for other angles so architecture stays fixed.\n- Plates without characters are easier to keep consistent; characters are added in keyframes.\n- Readable signs and text: keep minimal, simple fonts, few words; flag for VFX if they must be legible.\n- Repeating structures (windows, tiles, railings) may come out irregular; describe count and rhythm only\n  if it matters (\"three windows evenly spaced\").\n- Reflections and mirrors are high risk; avoid mirrors in key blocking unless needed.\n", "references/example-location.md": "# Example Location and Prop\n\n````markdown\n---\nartifact: location\nid: LOC-ROOFTOP\nversion: 1\nstatus: REVIEW\nowner: production-designer\ndepends_on: [screenplay@2, style_bible@1]\nupdated: 2026-10-19\n---\n# LOC-ROOFTOP — Tenement rooftop\n\nStory function: exposure and escape — the city below, nowhere to hide, the only way out is a jump.\n\n```yaml\nrecord: location\nid: LOC-ROOFTOP\nname: Tenement rooftop, Kileleshwa block\nint_ext: EXT\ndescription: \"Flat tar roof of a five-storey 1970s concrete tenement, 12 x 8 m, low parapets, crowded with rusted AC units, a water tower and laundry lines.\"\nlayout: \"see floor plan: roof door D1 in south-west corner; water tower L1 north-west; neon sign L2 north-east facing the street; 1.5 m gap to the neighbouring roof on the east side\"\nlandmarks:\n  - \"L1 rusted cylindrical water tower on steel legs, NW corner\"\n  - \"L2 pink neon sign frame 'NURU LODGE', back of letters visible from the roof, NE corner\"\n  - \"L3 neighbour roof's tall red-and-white antenna, east, beyond the gap\"\n  - \"L4 laundry lines with white sheets between posts, south side\"\nlight_sources:\n  - \"L2 neon sign: magenta, flickers every few seconds, lights the north half\"\n  - \"D1 stairwell door: cold fluorescent spill when open\"\n  - \"city glow: sodium-orange haze in the sky to the north\"\npalette: [\"wet black tar #121417\", \"rust #8A4B2A\", \"magenta neon #D63A8A\", \"sodium haze #C98A3B\"]\nset_dressing:\n  - \"rusted AC units, cables taped to the parapet\"\n  - \"plastic chairs stacked by D1, an ashtray tin\"\n  - \"puddles in tar dips (night-rain variant)\"\nidentity_lock: >-\n  Flat black tar rooftop of a five-storey concrete tenement, low grey parapets, rusted air-conditioning\n  units and taped cables, a rusted cylindrical water tower on steel legs, the back of a large pink neon sign\n  frame, white sheets on laundry lines, a tall red-and-white antenna on the neighbouring roof.\nvariants:\n  - {time_of_day: night, weather: \"steady rain\", notes: \"puddles, reflections of neon, sheets heavy and wet\"}\nreference_images: []\n```\n\n## Floor plan\n```\n              N ↑   (street side)\n +----------------------------------+\n | L1 water tower       L2 neon sign|\n |   [AC]  [AC]                     |      gap 1.5 m → L3 antenna roof\n |              [skylight]          |\n D1 roof door      [AC]             |\n +----------------------------------+\n   L4 laundry lines (south)\n```\n````\n\n```yaml\nrecord: prop\nid: PR-PARCEL\nname: The parcel\ndescription: \"Shoebox-sized parcel wrapped in brown paper, clear tape at the seams, white printed label on the top face.\"\nsize: \"30 x 20 x 12 cm\"\nmaterials: [\"brown kraft paper\", \"clear packing tape\", \"white paper label\"]\ncolors: [\"kraft brown #A57A4E\", \"label white #F2F0EA\"]\nstates:\n  - {id: PR-PARCEL:DRY, description: \"crisp corners, label legible\", from: SC01}\n  - {id: PR-PARCEL:WET, description: \"darkened soft paper, rounded corners, label ink slightly run\", from: SC02}\nidentity_lock: >-\n  A shoebox-sized parcel wrapped in brown kraft paper, clear packing tape along the seams, a white printed\n  address label on the top face.\n```\n", "references/props.md": "# Props\n\n## Contents\n1. Prop vs set dressing\n2. Hero props\n3. States\n4. Continuity of props\n5. Prop sheet spec\n6. AI risks\n\n## 1. Prop vs set dressing\n- **Prop:** handled by a character, mentioned in dialogue, or needed by the plot. Gets a `record: prop`.\n- **Set dressing:** furnishes the set; listed in the location file. If a character starts using an item, it\n  becomes a prop (move it to props.md and record when it was picked up).\n- **Hand props** are carried; **hero props** are seen close or carry the plot; **practical props** work on\n  screen (a lamp that switches on).\n\n## 2. Hero props\nSpecify to the level an insert shot needs: exact size (cm), shape, materials and finish (matte, glossy,\nscratched), colors with hex, markings (handwriting, stickers, dents) with position, weight impression\n(how it is held), sound it makes (for sound-designer). Duplicates: if two similar objects exist, make them\nvisually different (color, size) so the audience never confuses them.\n\n## 3. States\nEvery visible change is a state with an ID, a description, the scene/shot where it begins, and the cause:\n\n```yaml\nstates:\n  - {id: PR-PARCEL:DRY, description: \"brown paper, crisp corners, white label legible\", from: SC01, cause: \"start\"}\n  - {id: PR-PARCEL:WET, description: \"paper darkened and soft, corners rounded, label ink slightly run\", from: SC02-SH030, cause: \"rain on rooftop\"}\n  - {id: PR-PARCEL:TORN, description: \"WET plus tape torn at one corner, paper flap lifted\", from: SC02-SH050, cause: \"snags on railing\"}\n  - {id: PR-PARCEL:OPENED, description: \"paper peeled back, small tin box visible\", from: SC04-SH020, cause: \"Maya opens it\"}\n```\nStates are cumulative unless stated; if a state replaces another, say so. A state cannot reverse without a\ncause (a wet parcel does not become dry in the next scene).\n\n## 4. Continuity of props\n- Where the prop is (which hand, which pocket, which table) at the end of each scene → script supervisor.\n- Props carried between scenes must be accounted for at every scene change.\n- Consumables (food eaten, candles burned down, drink levels) need a state per scene.\n\n## 5. Prop sheet spec\n- Neutral plain background, flat light, the prop alone, no hands.\n- Views: front, back, side, top if relevant; one sheet (or row) per state that matters.\n- A scale reference (a ruler line or a common object) noted in the brief.\n\n## 6. AI risks\n- Text on props mutates; keep it short or plan to insert it in post (vfx-supervisor).\n- Small props in hands may merge with fingers; specify which hand and grip (\"held flat on the left palm\").\n- Props can vanish between frames of a video (object permanence failure); keep hero props large in frame\n  during critical shots or keep the action short.\n- Transparent, reflective and liquid props (glass, mirrors, water pouring) are high risk.\n", "templates/location-template.md": "---\nartifact: location\nid: LOC-<SLUG>\nversion: 1\nstatus: DRAFT\nowner: production-designer\ndepends_on: [screenplay@N, style_bible@N]\nupdated: YYYY-MM-DD\n---\n# LOC-<SLUG> — <name>\n\nScenes: <SC01, SC03> · Story function: <trap / refuge / exposure / threshold ...> · Emotion: <...>\n\n## Design rationale\nScale, enclosure, verticality, condition, era cues — each with a reason.\n\n```yaml\nrecord: location\nid: LOC-<SLUG>\nname:\nint_ext: INT\ndescription:\nlayout: \"see floor plan\"\nlandmarks: []\nlight_sources: []\npalette: []\nset_dressing: []\nidentity_lock: >-\n  <25-60 words: fixed architecture, materials, landmarks; no light/weather/emotion>\nshort_lock: \"<10-25 words, for background or soft-focus appearances>\"\nvariants:\n  - {time_of_day: , weather: , notes: }\nreference_images: []\n```\n\n## Floor plan\n```\n(text plan with N arrow or reference wall, exits D1.., windows W.., landmarks L1..)\n```\n\n## Set dressing by zone\n| Zone | Items | Story it tells | Continuity anchor? |\n|---|---|---|---|\n\n## Plate specifications\n| Plate | Camera position on plan | Height | Lens type | Time/weather | Brief |\n|---|---|---|---|---|---|\n\n## Handoff\n- Produced:\n- Next: film-director (blocking), cinematographer (light sources)\n", "templates/props-template.md": "---\nartifact: props\nid: props\nversion: 1\nstatus: DRAFT\nowner: production-designer\ndepends_on: [screenplay@N]\nupdated: YYYY-MM-DD\n---\n# Prop Registry\n\n| ID | Name | Owner | Scenes | Hero? | States |\n|---|---|---|---|---|---|\n\n```yaml\nrecord: prop\nid: PR-<SLUG>\nname:\ndescription:\nsize: \"<w x h x d cm>\"\nmaterials: []\ncolors: []\nowner: CH-<SLUG>\nscenes: []\nstates:\n  - {id: PR-<SLUG>:BASE, description: \"\", from: SC01, cause: \"start\"}\nidentity_lock: >-\n  <25-60 words>\nshort_lock: \"<10-25 words, for small or out-of-focus appearances>\"\nreference_images: []\n```\n\n## Prop sheet briefs\n(views, background, one row per state)\n\n## Handoff\n- Produced:\n- For script-supervisor: state list per prop\n- Next:\n"}}, "production-manager": {"description": "Coordinates an AI film production from idea to delivery like a line producer and script coordinator combined. Runs the film-crew departments in the right order, tracks versions and approvals, detects conflicts and stale work, requests missing information, applies change requests, breaks every scene into complete shot records (characters, positions, expressions, props, frame layers, camera, lens, light, palette, dialogue, sound, transitions, start/end frames), validates them, and assembles one master production document that image and video models can use directly. Use when the user wants to make a film, short, episode, ad or music video end to end, asks for a master script, production bible, shot breakdown or production document, wants departments coordinated, or asks what the next production step is.", "body": "# Production Manager\n\nYou run the production office. You do not write the story, design characters or choose lenses: the owning\ndepartment does (see the ownership table in [references/crew-protocol.md](references/crew-protocol.md)).\nYou decide the order of work, keep every department building on approved inputs, catch conflicts, and\ncompile the approved decisions into the master production document without losing or inventing anything.\n\n## When to use / not use\n- Use for: starting a project, \"what's next\", end-to-end runs, compiling or updating the master document or\n  shot records, applying a change, checking consistency across departments.\n- Do not use for a single craft task the user asked one department for (e.g. \"write a logline\") — that\n  department's skill handles it directly.\n\n## Inputs\n- The user's idea or brief, plus any existing project folder (layout in crew-protocol section 1).\n- Department documents as they become available (each with an artifact header).\n- Project specs from the user: runtime, aspect ratio, frame rate, visual medium, target image/video/audio\n  tools, budget or credit limits, dialogue language, audience/rating. Missing specs: ask once in a compact\n  list with a default for each; otherwise proceed and record `ASSUMPTION:`.\n\n## Outputs\n| File | Content |\n|---|---|\n| `00_brief.md` | specs and constraints ([templates/brief.md](templates/brief.md)) |\n| `PRODUCTION_LOG.md` | stage status, approvals, decisions, change requests ([templates/production-log.md](templates/production-log.md)) |\n| `02_screenplay/` scene records check | confirms every scene has a `record: scene` |\n| `08_master/shots/SC<NN>.md` | compiled `record: shot` blocks, one per shot |\n| `08_master/MASTER_PRODUCTION_DOCUMENT.md` | the assembled master document ([templates/master-production-document.md](templates/master-production-document.md)) |\n| Status reports | what is done, blocked, stale, and the next step |\n\n## Workflow\n\nCopy this checklist into your working notes and keep it current:\n\n```\nProduction progress:\n- [ ] 0 Brief recorded (00_brief.md), PRODUCTION_LOG.md started\n- [ ] 1 Story approved (story-writer)\n- [ ] 2 Screenplay approved and LOCKED (screenwriter); scene records present\n- [ ] 3 Character, world and style bibles approved (parallel)\n- [ ] 4 Direction approved for every scene (+ action/animation specialists where flagged)\n- [ ] 5 Camera and lighting approved (cinematographer)\n- [ ] 6 Continuity pass clean (script-supervisor)\n- [ ] 7 Shot records compiled; validator 0 errors; 0 MISSING in shots\n- [ ] 8 Storyboard approved\n- [ ] 9 Paper edit / pacing confirmed (film-editor)\n- [ ] 10 Voice, music, sound, VFX plans approved\n- [ ] 11 Reference stills generated and QC PASS\n- [ ] 12 Keyframes generated and QC PASS\n- [ ] 13 Video shots generated and QC PASS\n- [ ] 14 Assembly cut (film-editor) + final audio\n- [ ] 15 Final QC PASS; delivery package listed\n```\n\n### Step 1 — Open the project\n1. Look for an existing project folder. If one exists, read `PRODUCTION_LOG.md` and every artifact\n   header, then run the validator (Step 6) before doing anything else, to learn the real state.\n2. If none exists, create the folder layout and write `00_brief.md` from the user's request.\n3. Decide the run mode and record it in the log: **gated** (stop for the user's approval at each gate —\n   the default) or **autonomous** (user asked for an end-to-end run; follow crew-protocol section 10).\n\n### Step 2 — Route work to departments\nRun stages in the order above; stages in the same row may run in parallel. For each stage:\n1. Confirm its inputs are APPROVED/LOCKED. If an input is DRAFT or STALE, resolve that first.\n2. Invoke the department skill (in Claude Code, the Skill tool with `film-crew:<skill>`, or `<skill>` when\n   installed standalone). Pass: the project folder path, the exact input files and versions, the specs, and\n   what you need back. If a department skill is not installed, do the step yourself following that\n   department's contract in [references/department-contracts.md](references/department-contracts.md),\n   and say so in the log.\n3. Check the returned handoff block: outputs listed, versions recorded, open items. Route each\n   `OPEN-QUESTION:` to the user and each `PROPOSAL:`/`CONFLICT:` to the owner.\n4. Present the gate to the user (gated mode) with a short summary and the decisions they need to make.\n   Record approvals in the log with date and version.\n\nQuality control must be independent: run **quality-control** in a fresh context that did not write\nthe material — in Claude Code, delegate it to a subagent (Agent tool) with only the project path and the\nstage to check; elsewhere, ask the user to run it in a new session. If neither is possible, run it\nyourself and label the report \"not independent\".\n\nSpecialist routing: send a scene to **action-director** when it contains a fight, chase, stunt or other\nphysical set piece, and to **animation-director** when the medium is animation (2D, 3D, stop-motion,\nanime) — both work inside the film-director's plan, not instead of it. Order matters: the director's\n`SC<NN>_direction.md` must be written first, and the specialist reads that file; then the director folds\nthe specialist's shot proposals back into the shot list (bump the direction version).\n\nScripts: run the bundled scripts as shown; you do not need to read their source code (their usage is in\nthis file and in `--help`).\n\n### Step 3 — Scene breakdown\nAfter the screenplay is locked, make the element breakdown per scene: cast, extras, costumes, props and\ntheir states, location and time, vehicles/animals, special effects, VFX, sound needs. Record it as a table\nper scene in the master document and check it against the bibles: every element must have an owner record\n(character, costume, location, prop). Missing records go back to the owning department as a request.\n\n### Step 4 — Compile shot records\nFollow [references/compiling-shot-records.md](references/compiling-shot-records.md). In short:\n1. Start from the director's shot list for the scene (shot IDs, size, angle, intent, duration, action).\n2. Pull each field from its owner: camera and light (cinematographer), states and screen direction\n   (script-supervisor), identity locks (character/world bibles), palette and style lock (style bible),\n   dialogue lines (screenplay), choreography or pose keys (specialists).\n3. Write `start_frame`, `end_frame` and `motion` as self-contained text with locks pasted verbatim —\n   full locks for in-focus primary subjects, short locks for the rest, 150-300 words per frame.\n4. Any field without an owner source becomes `MISSING: <what, from whom>` and goes on the request list.\n   Never fill a creative gap yourself. The one exception: purely mechanical values (e.g. `transition_in`\n   equals the previous shot's `transition_out`) may be derived; mark them `derived`.\n\n### Step 5 — Detect conflicts and staleness\nCheck across departments, at minimum:\n- Screenplay vs direction: every scripted action and line is covered by some shot; no shot adds a story event.\n- Direction vs camera: shot sizes/moves match; lens and movement are physically possible in the location.\n- Continuity: costume, prop state, injuries, time of day and screen direction consistent shot to shot.\n- Style: shot lighting and palette agree with the color script for that scene.\n- Timing: shot durations sum to the scene estimate (±25%) and total to the target runtime.\n- Versions: every `depends_on` points to the current version (the validator reports STALE).\nReport each problem as `CONFLICT:` with both sources and route it to the owner who must fix it.\n\n### Step 6 — Validate\nRun the deterministic validator from this skill's folder:\n\n```bash\npython scripts/validate_production.py <project_dir>\n```\n\nIt needs PyYAML (`pip install pyyaml`). Fix or route every ERROR, then re-run until it reports 0 errors.\nRead warnings; STALE and duration warnings usually need a department, not you. Do not hand off the master\ndocument while errors remain.\n\n### Step 7 — Assemble the master document\nRun the assembler, then review the result:\n\n```bash\npython scripts/assemble_master.py <project_dir>\n```\n\nIt writes `08_master/MASTER_PRODUCTION_DOCUMENT.md`: a status dashboard, registries (characters, costumes,\nlocations, props), style lock, scene breakdown, per-scene direction/camera/continuity, all shot records, the\ngeneration plan, audio and VFX cue lists, edit plan and open issues, in the order of\n[templates/master-production-document.md](templates/master-production-document.md). Add the generation\nplan section yourself if it is empty: which references to generate first, in what order, which keyframes,\nwhich shots use which mode.\n\n### Step 8 — Changes\nFor any change to APPROVED/LOCKED content: write a change request (crew-protocol section 7), list the\nimpact by following `depends_on` from the changed artifact, get approval, have each owner update their\ndocument in dependency order, recompile affected shots, re-run the validator, and log the outcome.\n\n## Boundaries\n- Do not write or rewrite story, dialogue, designs, direction, camera or prompts. Route to the owner.\n- Do not mark anything APPROVED for the user in gated mode, or LOCKED without telling the user.\n- Do not drop a department's decision while compiling, and do not \"improve\" it. Copy it, or raise a CONFLICT.\n- Do not invent missing values to make the document look complete. `MISSING:` is the correct output.\n- Do not call paid generation tools without the user's explicit go-ahead and a stated budget.\n\n## Quality checks\nBefore handing off the master document, all must be true:\n- Validator: 0 errors. Every shot: no `MISSING:`, every referenced ID resolves.\n- Every screenplay scene has a scene record and at least one shot; every line of dialogue appears in a shot.\n- Every shot has start and end states, one primary action, at most two combined camera moves, a duration,\n  and (for video modes) `start_frame`, `motion`, `clip_length_s`; first-last-frame shots have `end_frame`.\n- Every character, costume, prop and location listed in a shot appears in its frame texts through its full\n  lock or short lock, verbatim — the validator's \"does not contain the identity_lock or short_lock\"\n  warnings are cleared, or each remaining one is explained (e.g. the character has left frame by the end\n  frame, and is then removed from that shot's `characters`/`props` end state).\n- Sum of shot durations within ±10% of the target runtime, or the difference is explained in the log.\n- Every ASSUMPTION is listed in the log's open-assumptions section.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Department output missing a required field | Return it to that department with the exact field list |\n| Two departments disagree | `CONFLICT:` to the higher-precedence owner (crew-protocol section 5); never pick silently |\n| User unavailable in gated mode | Stop at the gate with a summary; do not proceed on unapproved canon |\n| Validator cannot run (no Python/PyYAML) | Do the checks manually against production-schema section 7 and say so |\n| Department skill not installed | Do the step from department-contracts.md; log \"performed by production-manager\" |\n| Runtime overrun | Ask film-editor for a paper-edit cut proposal; do not cut scenes yourself |\n| A request would need many paid generations | Estimate the count first and ask before starting |\n\n## Handoff\nEnd every turn with the crew-protocol handoff block plus: current stage, next stage, and what the user\nmust decide. Keep status reports short: a table of stages (done / in progress / blocked / stale).\n\n## References\n- [references/crew-protocol.md](references/crew-protocol.md) — folder layout, statuses, ownership, change requests\n- [references/production-schema.md](references/production-schema.md) — IDs, records, shot record, vocabulary\n- [references/department-contracts.md](references/department-contracts.md) — each department's inputs, outputs, done criteria\n- [references/compiling-shot-records.md](references/compiling-shot-records.md) — field-by-field sourcing, frame text rules\n- [templates/brief.md](templates/brief.md), [templates/production-log.md](templates/production-log.md),\n  [templates/master-production-document.md](templates/master-production-document.md)\n- `scripts/validate_production.py`, `scripts/assemble_master.py`", "files": {"references/compiling-shot-records.md": "# Compiling Shot Records\n\nHow the production-manager turns approved department documents into complete shot records\n(`record: shot`, production-schema section 4) without adding or losing decisions.\n\n## Contents\n1. Field sources\n2. Writing start_frame, end_frame and motion\n3. Worked example\n4. Common compilation errors\n\n## 1. Field sources\n\n| Field | Source (owner) | If absent |\n|---|---|---|\n| id, scene, purpose, duration_s, shot_size, angle, movement intent | director shot list | request from film-director |\n| screenplay_ref, dialogue text | screenplay (screenwriter) | request from screenwriter |\n| characters[].position / facing / action / expressions / eyeline | direction blocking + performance notes | request from film-director |\n| characters[].costume / costume_state, props[].state | continuity record (script-supervisor) | request from script-supervisor |\n| fight moves, impacts, reactions | action-director document | request from action-director |\n| key poses, timing (animation) | animation-director document | request from animation-director |\n| location.id / area | direction + location file | request from production-designer |\n| frame.foreground / midground / background | director composition + location set dressing | request from film-director |\n| camera.lens_mm / aperture / depth_of_field / height / position / support / focus | camera document (cinematographer) | request from cinematographer |\n| lighting.* | camera document lighting setup; palette from style bible color script | request from cinematographer |\n| screen_direction | continuity record | request from script-supervisor |\n| sound, music | sfx.md / music.md if done; else the screenplay's sound cues | `MISSING:` is acceptable before stage 10 only if marked \"pending sound plan\" |\n| vfx | vfx plan if done; else `none` only if the director flagged no VFX | request from vfx-supervisor |\n| transition_in / out | director shot list; editor's paper edit overrides after approval | derive in = previous out |\n| generation.mode | video-prompt-engineer's plan if done; else: first-last-frame when the end state carries the story (a reveal, a landing, an object changing state) — marked to-verify if the tool's support is unknown — otherwise image-to-video (mark `derived`) | — |\n| generation.start_frame / end_frame / motion | **you compose** from the fields above (section 2) | — |\n| generation.clip_length_s | duration_s + 1 s rounded up to the tool's nearest allowed length | — |\n\n## 2. Writing start_frame, end_frame and motion\n\nThese three fields are the bridge to image and video models. They must stand alone: someone who reads only\nthis text can draw the frame.\n\n**start_frame / end_frame** — one paragraph each, **150-300 words** (the validator warns above 350), in\nthis order:\n1. Camera: shot size, angle, lens, height, depth of field.\n2. Each character: identity lock **verbatim**, costume lock **verbatim** plus the current costume state,\n   position in frame (thirds, foreground/mid/background, distance), facing, pose, expression.\n3. Props: lock verbatim + state + where they are.\n4. Location: location lock verbatim + the area + what is in foreground/midground/background.\n\n**Lock budget:** paste the full lock only for in-focus primary subjects. For anything small, soft-focus,\npartly visible or in the background, paste its `short_lock` instead (owned by the designer, also\nverbatim). In a close-up of a hand on a prop, the location may be one short lock; in an empty wide, the\ncharacter locks are short. If a needed `short_lock` doesn't exist, request it — never write your own. Shortening means swapping\nthe full lock for the short lock, **never dropping it**: every character, costume, prop and location listed\nin the shot must appear in the frame text through one of its two locks (the validator checks this).\n5. Light: key direction and quality, fill, rim, practicals, shadows; time of day; weather.\n6. Palette anchors (3-5 named colors) and the style lock verbatim.\n\nDescribe only what is visible in that single instant. No sounds, no \"then\", no camera motion, no emotions\nwithout their visible form (\"eyes wide, lips parted\", not \"shocked\").\n\n**motion** — what changes between the two frames, in time order, with seconds **in clip time** (the\ngenerated clip, `clip_length_s`, not the cut). A video model spreads whatever it is told across the whole\nclip, so write the handles in: e.g. for a 2 s cut generated as a 5 s clip — \"0-1 s: holds still; 1-3 s:\n<the action>; 3-5 s: holds the end pose\" — and record the keep range in `generation.keep` (\"1.0-3.0 s\").\nIt contains:\n- one primary subject action, broken into beats with an end state;\n- at most one camera move (plus a focus pull if needed), with start and end;\n- at most one environmental motion (rain, smoke, crowd);\n- dialogue timing if spoken.\n\n## 3. Worked example\n\nDirector's shot list row:\n`SC03-SH020 | MCU | high | static | Maya turns the parcel over, reads the label, looks up | 4 s | purpose: she\nrealises it is her own address | cut on look-up to SH030`\n\nCamera doc: `50 mm, f/2, shallow, camera 1.9 m, two steps above her, tripod; focus label → her eyes at 2.5 s;\nkey pink neon camera right high hard; rim cool blue bulb camera left; no fill.`\n\nContinuity: `CO-MAYA-01 hood down, shoulders soaked; PR-PARCEL:WET, tape torn one corner; knuckle scrape left\nhand; faces camera right.`\n\nCompiled `start_frame` (locks shortened here as `<CH-MAYA lock>` for space; in a real record paste them in full):\n> Medium close-up from a high angle, 50 mm lens, camera 1.9 m high looking down, shallow depth of field.\n> `<CH-MAYA lock>` `<CO-MAYA-01 lock>`, hood down, jacket soaked dark at the shoulders, a fresh scrape on the\n> left knuckles. She stands on the left third of frame in the midground, three-quarter to camera right, head\n> bowed, holding `<PR-PARCEL lock>` face down at chest height, its brown paper wet and dark, tape torn at one\n> corner. `<LOC-STAIRWELL lock>`: top landing, rusted railing out of focus in the lower-left foreground, a\n> cracked window behind her with a blurred pink neon sign outside. Hard pink neon key from the window at\n> camera right, high; cool blue rim from a caged bulb at camera left; no fill, shadow side near black; hard\n> window-frame shadow across her chest. Night, rain outside. Palette: magenta, cold blue, wet black.\n> `<STYLE lock>`\n\nCompiled `motion`:\n> 0-1.5 s: Maya turns the parcel over with both hands so the label faces camera. 1.5-2.5 s: her right thumb\n> wipes rain off the label. 2.5-4 s: focus racks from the label to her eyes; she lifts her eyes to the window\n> and holds. Camera static. Rain streaks run down the window glass. At 3.0 s she says quietly, \"That's my street.\"\n\n## 4. Common compilation errors\n- Frame text over 350 words because every lock is pasted in full regardless of what is in focus.\n- Paraphrasing a lock (\"a young woman with dark hair\") instead of pasting it verbatim.\n- Copying the director's emotional intent (\"she is devastated\") into frame text instead of the visible form.\n- Two primary actions in one shot (\"she reads the label and runs downstairs\") — return to the director.\n  More than 3-4 beats in `action_timeline` is a warning sign; the validator flags it.\n- Motion timed to the cut (2 s) while the clip is 5 s, so the model stretches the action — write clip time.\n- Light direction flipping between shots of the same setup without motivation — CONFLICT to cinematographer.\n- A prop in a state it has not reached yet (parcel opened before the opening scene) — CONFLICT to continuity.\n- end_frame that cannot be reached from start_frame within the duration — return to the director.\n", "references/department-contracts.md": "# Department Contracts\n\nWhat each department needs, produces, and must satisfy before handoff. Use this to route work, to check a\nreturned deliverable, and to perform a step yourself when that department's skill is not installed.\n\n## Contents\n- Story and script: story-writer, screenwriter\n- Design: character-designer, production-designer, visual-style-designer\n- Direction: film-director, action-director, animation-director\n- Camera and continuity: cinematographer, script-supervisor\n- Visualization: storyboard-artist, image-prompt-engineer, video-prompt-engineer\n- Sound: voice-director, music-director, sound-designer\n- Post: vfx-supervisor, film-editor, quality-control\n\n## story-writer\n- **Needs:** idea or premise; brief (runtime, audience, genre, tone, medium).\n- **Produces:** `01_story/concepts.md` (2-5 distinct concepts when the idea is open), `01_story/story.md`\n  (logline, premise, theme, characters with want/need/flaw/arc, beat outline with turning points, ending).\n- **Done when:** one concept chosen; every beat causes the next; protagonist makes the decisive choice;\n  ending pays off the setup; runtime fits the beat count.\n\n## screenwriter\n- **Needs:** approved `story.md` (or a user's existing story/script to refine); brief.\n- **Produces:** `02_screenplay/screenplay.fountain` (pure Fountain, title page first),\n  `02_screenplay/scene_index.md` carrying the artifact header `id: screenplay` (one version for both\n  files) and one `record: scene` per scene (purpose, value change, duration, scene card).\n- **Done when:** every scene turns a value; every line is speakable and fits the shot time; nothing in the\n  action lines is unfilmable (thoughts, backstory) unless shown; changes from the source story are listed\n  with reasons.\n\n## character-designer\n- **Needs:** approved screenplay (or story), style bible if available.\n- **Produces:** `03_characters/CH-<SLUG>.md` with `record: character` and `record: costume` blocks,\n  turnaround and expression sheet specs, identity locks, reference-image checklist.\n- **Done when:** every speaking/recurring character has a record; each costume look used in the script has\n  a costume record and the scenes it appears in; silhouettes distinguishable; locks 40-80 words.\n\n## production-designer\n- **Needs:** approved screenplay, style bible if available.\n- **Produces:** `04_world/LOC-<SLUG>.md` (`record: location`, layout with landmarks and compass/screen\n  references, light sources), `04_world/props.md` (`record: prop` with states).\n- **Done when:** every scripted location and story-relevant prop has a record; every prop state change in\n  the script is listed as a state; layouts allow the blocking the script needs.\n\n## visual-style-designer\n- **Needs:** brief, approved story/screenplay; optional reference images.\n- **Produces:** `05_look/style_bible.md` (`record: style`, palette with hex, color script per scene,\n  lighting and lens philosophy, texture, style lock, avoid list).\n- **Done when:** a style lock of 30-70 words exists; each scene has a color script entry tied to its\n  emotional beat; aspect ratio matches the brief.\n\n## film-director\n- **Needs:** locked screenplay, approved bibles and style bible.\n- **Produces:** `06_direction/SC<NN>_direction.md` per scene: dramatic analysis, visual thesis, blocking\n  (start positions, moves, end positions), performance notes, shot list (IDs, size, angle, movement intent,\n  subject, action with end state, duration, purpose, transitions), coverage rationale.\n- **Done when:** every beat is covered; every shot has a story function; screen direction plan stated;\n  durations sum to the scene estimate.\n\n## action-director\n- **Needs:** the director's plan for an action scene; character bibles; location layout.\n- **Produces:** `06_direction/SC<NN>_action.md`: geography, objectives, phrase-by-phrase choreography\n  (attack, defence, reaction, consequence), beat-to-shot mapping, safety-free AI notes (what models fail at).\n- **Done when:** every move has a clear cause and effect, screen direction is held, each phrase maps to\n  shots, injuries/damage feed continuity.\n\n## animation-director\n- **Needs:** director's plan, character bibles (with proportions), style bible.\n- **Produces:** `06_direction/SC<NN>_animation.md`: acting choices, key poses (extremes), timing per shot in\n  frames, holds, anticipation/overshoot notes, lip-sync emphasis, model-sheet adherence notes.\n- **Done when:** each shot has key poses and timing; poses read in silhouette; timing fits the shot duration.\n\n## cinematographer\n- **Needs:** director's shot list, location files, style bible.\n- **Produces:** `07_camera/SC<NN>_camera.md`: per shot lens (mm), aperture/DOF, camera height and position,\n  support, movement execution, focus plan; per scene lighting setup (key, fill, rim, practicals, color\n  temperature, ratio) consistent with the color script.\n- **Done when:** every shot has camera and lighting values; light direction is consistent within a scene\n  unless motivated; nothing contradicts the director's size/angle.\n\n## script-supervisor\n- **Needs:** screenplay, bibles, direction and camera documents.\n- **Produces:** `07_camera/continuity.md`: one `record: continuity` per scene (axis, screen direction,\n  character and prop states, time, weather, carry-over), and a continuity report of violations.\n- **Done when:** every state change has a cause in the script; every shot pair across a cut is checked.\n\n## storyboard-artist\n- **Needs:** compiled shot records (or direction + camera documents).\n- **Produces:** `09_storyboard/storyboard.md` with `record: panel` blocks, sketch prompts, and\n  `09_storyboard/storyboard.html` sheet (built by its script).\n- **Done when:** every shot has at least one panel (two for moves or reveals: start and end); panels match\n  shot size, angle and screen direction; no invented action.\n\n## image-prompt-engineer\n- **Needs:** bibles, style bible, compiled shot records, the user's image tool profile.\n- **Produces:** `10_prompts/images.md` with `record: image_prompt` blocks in generation order (character\n  sheets, costume sheets, location plates, prop sheets, then keyframes).\n- **Done when:** every prompt pastes the relevant locks verbatim, names its reference images and their\n  roles, and uses only features the tool supports.\n\n## video-prompt-engineer\n- **Needs:** compiled shot records, approved keyframes/references, the user's video tool profile.\n- **Produces:** `10_prompts/video.md` with `record: video_prompt` blocks, one or more per shot, plus a retry\n  ladder per risky shot.\n- **Done when:** each prompt has one primary action, at most one camera move, an end state, model-correct\n  syntax, clip length ≥ shot duration.\n\n## voice-director\n- **Needs:** screenplay, character bibles, shot records (for timing).\n- **Produces:** `11_sound/voice.md`: voice profile per character, `record: voice_line` per line with delivery\n  and timing, TTS-ready scripts for the user's tool.\n- **Done when:** every line has a delivery note and fits its shot timing.\n\n## music-director\n- **Needs:** screenplay, style bible, edit plan or shot timings.\n- **Produces:** `11_sound/music.md`: spotting notes, themes, `record: music_cue` per cue, song lyrics and\n  structure when songs are required, generation prompts.\n- **Done when:** every cue has a dramatic function, start/end and hit points.\n\n## sound-designer\n- **Needs:** shot records, location files.\n- **Produces:** `11_sound/sfx.md`: ambience bed per scene, `record: sfx_cue` per sync sound, Foley list,\n  mix intent.\n- **Done when:** every on-screen sound-making action has a cue; every scene has an ambience bed.\n\n## vfx-supervisor\n- **Needs:** shot records, style bible, model profiles.\n- **Produces:** `12_vfx/vfx_plan.md` with `record: vfx` per shot that needs work beyond direct generation.\n- **Done when:** every text/screen/logo, compositing need and known model weakness has a method.\n\n## film-editor\n- **Needs:** shot records (paper edit) or generated takes (assembly).\n- **Produces:** `13_edit/edit_plan.md`: sequence order, durations, cut points, transitions, audio overlaps\n  (J/L cuts), pacing notes, change requests for shots to add, cut or retime.\n- **Done when:** the total matches the target runtime; every cut has a reason.\n\n## quality-control\n- **Needs:** the artifact or media to check and its approved specs.\n- **Produces:** `14_qc/QC_<stage>_<date>.md` with `record: qc_item` per finding, verdict PASS / FIX / REDO,\n  repair instructions routed to the owner.\n- **Done when:** every target has a verdict with evidence; nothing marked PASS without being checked.\n", "templates/brief.md": "---\nartifact: brief\nid: brief\nversion: 1\nstatus: DRAFT\nowner: production-manager\ndepends_on: []\nupdated: YYYY-MM-DD\n---\n# Brief: <working title>\n\n## Request\n<the user's idea in their words>\n\n## Specs\n| Spec | Value | Source |\n|---|---|---|\n| Format | short film / episode / ad / music video / trailer | user / ASSUMPTION |\n| Target runtime | <seconds> | |\n| Aspect ratio | 16:9 / 9:16 / 2.39:1 / 1:1 | |\n| Frame rate | 24 fps | |\n| Visual medium | photoreal live-action / 3D animation / 2D animation / stop-motion / anime / other | |\n| Audience and rating | | |\n| Genre and tone | | |\n| Dialogue language(s) | | |\n| Image tool(s) | <tool + model version> | |\n| Video tool(s) | <tool + model version> | |\n| Audio tool(s) | TTS / music / SFX tools | |\n| Budget or credit limit | | |\n| Deadline | | |\n| Run mode | gated (default) / autonomous | |\n\n## Must keep\n<anything the user insists on: names, ending, a character, a song, a look>\n\n## Must avoid\n<content limits, real people, brands, styles to avoid>\n\n## References supplied\n<images, films, links — note rights: own / licensed / reference only>\n\n## Open questions\n- OPEN-QUESTION: ...\n", "templates/master-production-document.md": "# Master Production Document: <title>\n\n> Assembled by `scripts/assemble_master.py` from the approved department documents. Do not edit sections\n> marked \"assembled\" by hand; change the source document and re-assemble.\n\n## 0. Status dashboard (assembled)\nArtifact versions and statuses, validator summary, counts of open markers.\n\n## 1. Project specs (from 00_brief.md)\nRuntime, aspect ratio, frame rate, medium, target tools, budget, run mode.\n\n## 2. Story (from 01_story/story.md)\nLogline, synopsis, theme, ending.\n\n## 3. Screenplay reference\nLocked version number and file path; scene index with purpose and value change per scene.\n\n## 4. Registries (assembled)\n4.1 Characters — identity locks, height, silhouette, reference images\n4.2 Costumes — per character, scenes worn, locks\n4.3 Locations — locks, layout, light sources\n4.4 Props — locks and states\n4.5 Style — style lock, palette, color script\n\n## 5. Scene breakdown (assembled)\nPer scene: heading, characters, costumes, props+states, location, time, estimated vs planned duration,\nshot count, VFX, special notes.\n\n## 6. Scenes\nFor each scene, in order:\n6.n.1 Direction (from SC<NN>_direction.md) — analysis, visual thesis, blocking, performance\n6.n.2 Specialist plans (action / animation) if any\n6.n.3 Camera and lighting (from SC<NN>_camera.md)\n6.n.4 Continuity (from continuity record)\n6.n.5 Shot records (from 08_master/shots/SC<NN>.md) — full record: shot blocks\n\n## 7. Generation plan\n7.1 Reference images to generate first (characters, costumes, locations, props) with prompt IDs\n7.2 Keyframes per shot (start/end) with prompt IDs\n7.3 Video generations per shot: mode, references, clip length, prompt IDs\n7.4 Asset registry: approved file per slot\n\n## 8. Audio\nVoice lines, music cues, sound cues (from 11_sound/)\n\n## 9. VFX plan (from 12_vfx/vfx_plan.md)\n\n## 10. Edit plan (from 13_edit/edit_plan.md)\n\n## 11. Continuity tracker (from 07_camera/continuity.md)\n\n## 12. Open issues\nAll MISSING, ASSUMPTION, CONFLICT and OPEN-QUESTION markers with file and owner; open change requests.\n", "templates/production-log.md": "---\nartifact: production-log\nid: production-log\nversion: 1\nstatus: DRAFT\nowner: production-manager\ndepends_on: []\nupdated: YYYY-MM-DD\n---\n# Production Log: <title>\n\nRun mode: gated | autonomous\n\n## Stage status\n| # | Stage | Owner | Artifact@version | Status | Updated |\n|---|---|---|---|---|---|\n| 0 | Brief | production-manager | brief@1 | DRAFT | |\n| 1 | Story | story-writer | story@- | not started | |\n| 2 | Screenplay | screenwriter | screenplay@- | not started | |\n\n## Approvals\n| Date | Artifact@version | Approved by | Notes |\n|---|---|---|---|\n\n## Decisions\n| Date | Decision | Owner | Reason |\n|---|---|---|-
