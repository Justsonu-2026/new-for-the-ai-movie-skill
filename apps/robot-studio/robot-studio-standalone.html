## Midjourney V7 — [THIRD-PARTY]\n- Omni Reference `--oref <image URL>` with weight `--ow 1-1000` (default 100) for a character or object;\n  V7 only. Style reference is a separate parameter (`--sref`). Practitioners report inconsistent identity\n  holding; check every result against the character sheet.\n\n### Prompt shapes for stills (all image models)\n- **Character turnaround sheet**: one character, neutral A-pose or relaxed stance, same scale in every view,\n  plain light-grey background, even flat studio lighting, views left to right: front, three-quarter front,\n  side (profile), three-quarter back, back; full body, head to toe in frame; no props in hands.\n- **Expression sheet**: head and shoulders only, same angle and lighting in every cell, grid with labels.\n- **Location plate**: empty of characters unless needed, camera height and lens stated, time of day and\n  light sources stated.\n- **Keyframe**: the shot's `start_frame` (or `end_frame`) text from the shot record, plus the style lock.\n\n## 5. Choosing a generation mode\n\n| Situation | Mode |\n|---|---|\n| Recurring character, controlled composition | image-to-video from an approved keyframe |\n| Shot must land on a precise final composition (reveal, match cut, hand-off to next shot) | first-last-frame |\n| Several recurring characters/settings, framing less critical | reference-to-video (ingredients/elements) |\n| Establishing shot, no recurring identity | text-to-video |\n| Continuous take longer than one clip | video-extend from the previous take |\n| Fix one region or attribute of an otherwise good take | video-edit or image-edit, one change per pass |\n| Text, logos, readable signs, UI screens | generate clean plate, add in post (vfx-supervisor) |\n\n## 6. Retry ladder\n\nChange one thing per retry, cheapest first:\n1. Re-roll the same prompt (variance is expected).\n2. Tighten the action: fewer beats, explicit end state, slower pace.\n3. Lock the camera (`static`) or simplify the move.\n4. Fix the input still (keyframe) instead of the video prompt.\n5. Remove competing elements: extra characters, busy background, second action.\n6. Shorten the clip length.\n7. Switch mode (text-to-video → image-to-video → first-last-frame).\n8. Split the shot into two shots (needs a change request to film-director and film-editor).\n", "crew-protocol.md": "# Film Crew Protocol\n\nShared operating rules for every skill in the film-crew system. Each skill carries a copy of this file\nso it works when installed alone. The canonical copy lives in `shared/crew-protocol.md`.\n\n## Contents\n1. Project folder layout\n2. Artifact header\n3. Status lifecycle\n4. Decision ownership\n5. Precedence of sources\n6. Markers\n7. Change requests\n8. Handoff block\n9. Standalone mode\n10. Approvals when running autonomously\n\n## 1. Project folder layout\n\nAll departments read and write one project folder. Use these paths exactly; create folders as needed.\n\n```\n<project>/\n  00_brief.md                      production-manager   project specs, runtime, aspect, targets\n  01_story/story.md                story-writer         approved story (treatment + beat outline)\n  01_story/concepts.md             story-writer         alternative concepts (not canon)\n  02_screenplay/screenplay.fountain screenwriter        the screenplay (canon once LOCKED), pure Fountain\n  02_screenplay/scene_index.md     screenwriter         header id `screenplay` (versions both files) + scene records\n  03_characters/CH-<SLUG>.md       character-designer   one character bible per character\n  04_world/LOC-<SLUG>.md           production-designer  one file per location\n  04_world/props.md                production-designer  prop registry\n  05_look/style_bible.md           visual-style-designer look, palette, color script, style lock\n  06_direction/SC<NN>_direction.md film-director (or action-/animation-director)\n  06_direction/SC<NN>_action.md    action-director      choreography (only action scenes)\n  06_direction/SC<NN>_animation.md animation-director   acting/timing (only animated work)\n  07_camera/SC<NN>_camera.md       cinematographer      lens, camera, lighting per shot\n  07_camera/continuity.md          script-supervisor    continuity bible + per-scene states\n  08_master/MASTER_PRODUCTION_DOCUMENT.md production-manager  compiled master document\n  08_master/shots/SC<NN>.md        production-manager   compiled shot records per scene\n  09_storyboard/storyboard.md      storyboard-artist    panels (+ storyboard.html sheet)\n  10_prompts/images.md             image-prompt-engineer\n  10_prompts/video.md              video-prompt-engineer\n  11_sound/voice.md                voice-director\n  11_sound/music.md                music-director\n  11_sound/sfx.md                  sound-designer\n  12_vfx/vfx_plan.md               vfx-supervisor\n  13_edit/edit_plan.md             film-editor\n  14_qc/QC_<stage>_<date>.md       quality-control\n  assets/                          generated or supplied media (see asset naming in production-schema.md)\n  PRODUCTION_LOG.md                production-manager   approvals, change requests, decisions\n```\n\n## 2. Artifact header\n\nEvery artifact file starts with YAML front matter:\n\n```yaml\n---\nartifact: character-bible          # kind of document\nid: CH-MAYA                        # stable ID (see production-schema.md)\nversion: 2                         # integer, +1 on every content change\nstatus: APPROVED                   # see lifecycle\nowner: character-designer          # the skill that owns the content\ndepends_on: [screenplay@3, style_bible@1]   # upstream artifact@version actually used\nupdated: 2026-10-19\n---\n```\n\n`depends_on` records the exact upstream versions the content was built from. It is how staleness is\ndetected: if `screenplay` is now at version 4, this artifact is STALE until reviewed.\n\n## 3. Status lifecycle\n\n| Status | Meaning | Who may set it |\n|---|---|---|\n| DRAFT | Work in progress, not for downstream use | owner |\n| REVIEW | Complete, waiting for approval | owner |\n| APPROVED | Accepted; downstream may build on it | user, or production-manager under an autonomy policy |\n| LOCKED | Approved and frozen; changes only through a change request | production-manager |\n| STALE | An upstream dependency changed after approval; must be re-checked | production-manager or any skill that detects it |\n| SUPERSEDED | Replaced by a newer version; kept for history | owner |\n\nDownstream skills build only on APPROVED or LOCKED inputs. If an input is DRAFT or STALE, say so\nand either stop or continue with every dependent decision marked `ASSUMPTION:`.\n\n## 4. Decision ownership\n\nOne owner per decision. A skill may *propose* outside its area but never *decide* outside it.\n\n| Decision | Owner |\n|---|---|\n| Runtime, aspect ratio, frame rate, delivery specs, target AI models, budget | user, recorded by production-manager |\n| Concept, premise, plot events, ending, character psychology (want, need, flaw, arc) | story-writer |\n| Screenplay text: scenes, action lines, dialogue, transitions | screenwriter |\n| Character identity and appearance: face, body, hair, costume looks, accessories | character-designer |\n| Locations, sets, environments, props, set dressing, vehicles | production-designer |\n| Look: rendering style, palette, color script, texture, lighting philosophy, style lock | visual-style-designer |\n| Blocking, performance, shot breakdown (count, size, angle, movement intent, duration), transitions | film-director |\n| Fight and stunt choreography, action geography | action-director |\n| Animation acting, key poses, timing charts | animation-director |\n| Lens, camera position/height/support, depth of field, lighting setup per shot | cinematographer |\n| Continuity record: axis, screen direction, states of costume/props/injuries/time per shot | script-supervisor |\n| Storyboard panel drawings/descriptions (render existing decisions) | storyboard-artist |\n| Image prompt wording per model | image-prompt-engineer |\n| Video prompt wording per model | video-prompt-engineer |\n| Voice casting profiles, line delivery, TTS scripts | voice-director |\n| Score, themes, songs, music cues | music-director |\n| Sound effects, ambience, Foley, mix intent | sound-designer |\n| VFX method per shot, element lists | vfx-supervisor |\n| Cut order, trims, pacing, transitions in the edit | film-editor |\n| QC verdicts (PASS / FIX / REDO) | quality-control |\n| Order of work, approvals, master document, asset registry, conflict routing | production-manager |\n\n## 5. Precedence of sources\n\nWhen two sources disagree, the higher one wins and the conflict is reported:\n\n1. Explicit user instruction in the current conversation\n2. LOCKED/APPROVED screenplay (story facts, dialogue)\n3. APPROVED character bibles, world files, style bible (identity and look)\n4. APPROVED direction and camera documents\n5. Continuity bible\n6. Everything downstream (storyboard, prompts, sound, edit)\n\nA downstream skill never \"fixes\" an upstream document silently. It raises a CONFLICT and, when the fix is\nclear, attaches a change request.\n\n## 6. Markers\n\nUse these exact prefixes so other skills and the validator can find them:\n\n- `ASSUMPTION:` a decision made without an approved source. Must be confirmed before LOCK.\n- `PROPOSAL:` a suggested change to someone else's decision. Not canon.\n- `OPEN-QUESTION:` information only the user or another owner can supply.\n- `CONFLICT:` two sources disagree. Name both sources and versions.\n- `MISSING:` a required field has no source. Never leave a required field blank or \"TBD\".\n\n## 7. Change requests\n\nAny change to APPROVED or LOCKED content goes through a change request recorded in `PRODUCTION_LOG.md`:\n\n```yaml\nid: CR-007\nrequested_by: film-editor\ntarget: screenplay@4            # what changes\nchange: \"Cut lines 3-4 of SC03; scene runs long and repeats SC02\"\nreason: \"Pacing: SC03 holds the same beat as SC02\"\nimpact: [SC03_direction@2, SC03 shots, voice.md lines L031-L032, edit_plan@1]\nstatus: PROPOSED                 # PROPOSED | APPROVED | REJECTED | APPLIED\n```\n\nWhen a CR is APPLIED, the owner bumps the version and every artifact listed in `impact` becomes STALE\nuntil its owner reviews it. The production-manager traces the impact list using `depends_on`.\n\n## 8. Handoff block\n\nEvery deliverable ends with a handoff block:\n\n```markdown\n## Handoff\n- Produced: CH-MAYA@2, CH-OWEN@1 (status REVIEW)\n- Built from: screenplay@3, style_bible@1\n- Open items: OPEN-QUESTION: Owen's age (script says \"teen\"; 15 assumed)\n- Conflicts: none\n- Next: production-designer, film-director may proceed once approved\n```\n\n## 9. Standalone mode\n\nIf there is no project folder, work from what the user gave you. Still assign IDs, still use the markers,\nstill end with a handoff block, and output in the same formats so the work can be dropped into a project\nfolder later without rewriting.\n\n## 10. Approvals when running autonomously\n\nIf the user asked for an end-to-end run without stopping, the production-manager may set APPROVED on\ntheir behalf. It must record each such approval in `PRODUCTION_LOG.md` as `approved_by: autonomy-policy`\nand list every `ASSUMPTION:` that was accepted, so the user can review them in one place. Never mark\nanything LOCKED under autonomy without telling the user.\n", "production-schema.md": "# Production Schema\n\nThe data contract shared by all film-crew skills: IDs, record formats, controlled vocabulary and asset\nnames. Records are YAML blocks inside Markdown files, so documents stay readable for people and\nparseable by `validate_production.py`. The canonical copy lives in `shared/production-schema.md`.\n\n## Contents\n1. Record blocks\n2. ID conventions\n3. Record types and required fields\n4. The shot record (full)\n5. Controlled vocabulary\n6. Asset naming\n7. Validation rules\n\n## 1. Record blocks\n\nA record is a fenced code block tagged `yaml` whose first key is `record:`.\n\n````markdown\n```yaml\nrecord: prop\nid: PR-PARCEL\nname: The parcel\n```\n````\n\nProse may surround records freely. Only blocks starting with `record:` are parsed. One record per block.\nNever write `TBD`, `TODO`, `?`, or an empty value in a required field: write `MISSING: <what is needed>`.\n\n## 2. ID conventions\n\nIDs are permanent. Never reuse or renumber an ID; retire it by setting `status: SUPERSEDED`.\n\n| Thing | Pattern | Example |\n|---|---|---|\n| Character | `CH-<SLUG>` | `CH-MAYA` |\n| Costume look | `CO-<CHARSLUG>-<NN>` | `CO-MAYA-01` |\n| Location | `LOC-<SLUG>` | `LOC-ROOFTOP` |\n| Prop | `PR-<SLUG>` | `PR-PARCEL` |\n| Prop state | `<PROP>:<STATE>` | `PR-PARCEL:WET` |\n| Scene | `SC<NN>` | `SC03` |\n| Shot | `SC<NN>-SH<NNN>`, numbered in tens | `SC03-SH020`; insert later as `SC03-SH025` |\n| Storyboard panel | `SB-<SHOT>-P<N>` | `SB-SC03-SH020-P1` |\n| Voice line | `VL-SC<NN>-<NNN>` | `VL-SC03-004` |\n| Music cue | `M<NN>` (songs `SONG-<SLUG>`) | `M03`, `SONG-RAIN` |\n| Sound cue | `SFX-SC<NN>-<NNN>` | `SFX-SC03-012` |\n| VFX shot | `VFX-<SHOT>` | `VFX-SC03-SH020` |\n| Image prompt | `IMG-<TARGET>-<NN>` | `IMG-SC03-SH020-START-01`, `IMG-CH-MAYA-TURN-01` |\n| Video prompt | `VID-<SHOT>-<NN>` | `VID-SC03-SH020-01` |\n| Change request | `CR-<NNN>` | `CR-007` |\n| QC item | `QC-<NNN>` | `QC-031` |\n\nSLUGs are uppercase ASCII letters, digits and hyphens.\n\n## 3. Record types and required fields\n\nRequired fields are listed; add any other useful fields.\n\n| record | Owner | Required fields |\n|---|---|---|\n| `character` | character-designer | id, name, role, age, height_cm, build, identity_lock, face, hair, skin, eyes, silhouette, distinguishing_features, default_costume, costumes, expression_range |\n| `costume` | character-designer | id, character, name, garments, materials, colors, accessories, condition_states, identity_lock |\n| `location` | production-designer | id, name, int_ext, description, layout, landmarks, light_sources, palette, set_dressing, identity_lock |\n| `prop` | production-designer | id, name, description, size, materials, colors, states, identity_lock |\n| `style` | visual-style-designer | id (`STYLE`), medium, aspect_ratio, palette, contrast, texture, lighting_philosophy, lens_philosophy, style_lock, avoid |\n| `scene` | screenwriter | id, heading, location, time_of_day, characters, summary, purpose, value_change, est_duration_s |\n| `shot` | production-manager (compiled) | see section 4 |\n| `panel` | storyboard-artist | id, shot, frame_moment, description, composition, camera_notes, duration_s |\n| `continuity` | script-supervisor | id (`CONT-SC<NN>`), scene, axis, screen_direction, character_states, prop_states, time_of_day, weather, carry_over |\n| `image_prompt` | image-prompt-engineer | id, target, model, prompt, references, parameters |\n| `video_prompt` | video-prompt-engineer | id, shot, model, mode, prompt, references, clip_length_s, parameters |\n| `voice_line` | voice-director | id, shot, character, line, delivery, timing |\n| `music_cue` | music-director | id, start, end, function, description |\n| `sfx_cue` | sound-designer | id, shot, sound, sync_point, layer |\n| `vfx` | vfx-supervisor | id, shot, problem, method, elements |\n| `qc_item` | quality-control | id, target, check, verdict, evidence |\n\n`identity_lock` / `style_lock` are short fixed paragraphs (character: 40-80 words; costume, location,\nprop: 25-60 words; style: 30-70 words) that are pasted **verbatim** into every image or video prompt that\nshows the thing. Paraphrasing a lock is the most common cause of identity drift. Characters, costumes,\nlocations and props also carry a `short_lock` (10-25 words, owned by the same designer) used verbatim when\nthe thing is small, soft-focus or secondary in a shot. Locks describe what is present (\"bare neck\",\n\"blank walls\"), never \"no ...\".\n\n## 4. The shot record (full)\n\nThe production-manager compiles one shot record per shot from the approved department documents. Every\nfield below is required unless marked optional. Each value comes from the department that owns it.\n\n```yaml\nrecord: shot\nid: SC03-SH020\nscene: SC03\nstatus: REVIEW\nversion: 1\ndepends_on: [screenplay@3, SC03_direction@2, SC03_camera@1, continuity@2, style_bible@1]\npurpose: \"Maya sees the address on the parcel is her own\"   # story function, one sentence\nscreenplay_ref: \"SC03, action line 4 to dialogue 'That's my street.'\"\nduration_s: 4.0                      # length in the cut\ncharacters:\n  - id: CH-MAYA\n    costume: CO-MAYA-01\n    costume_state: \"hood down, jacket soaked dark at shoulders\"\n    position: \"frame left third, midground, 1.5 m from camera\"\n    facing: \"three-quarter to camera right, head bowed to parcel\"\n    action: \"turns the parcel over in both hands; thumb wipes rain off the label\"\n    expression_start: \"brows pinched, mouth closed\"\n    expression_end: \"eyes widen, lips part\"\n    eyeline: \"down to label in her hands\"\nprops:\n  - id: PR-PARCEL\n    state: PR-PARCEL:WET\n    position: \"in Maya's hands at chest height\"\nlocation:\n  id: LOC-STAIRWELL\n  area: \"top landing, by the cracked window\"\n  time_of_day: night\n  weather: \"rain outside the window\"\nframe:\n  foreground: \"out-of-focus rusted railing, lower frame left\"\n  midground: \"Maya with parcel\"\n  background: \"cracked window, blurred pink neon sign outside\"\n  composition: \"Maya on left third, label at frame centre, headroom tight\"\ncamera:\n  shot_size: MCU\n  angle: high\n  height_m: 1.9\n  position: \"two steps above her on the stairs, looking down\"\n  lens_mm: 50\n  aperture: \"f/2\"\n  depth_of_field: shallow\n  focus: \"label, then rack to Maya's eyes at 2.5 s\"\n  movement: static\n  support: tripod\nlighting:\n  key: \"pink neon through window, camera right, high, hard\"\n  fill: \"none; shadow side falls to near black\"\n  rim: \"cool blue from stairwell bulb behind, camera left\"\n  practicals: \"neon sign outside window; caged bulb on wall\"\n  shadows: \"hard window-frame shadow across her chest\"\n  palette: [\"magenta #D63A8A\", \"cold blue #3A5CD6\", \"wet black #101216\"]\nscreen_direction: \"Maya faces camera right; axis Maya-window, camera stays on stair side\"\nstart_state: \"Maya holds the parcel face down; label not visible\"\nend_state: \"label faces camera, readable; Maya's eyes lifted toward the window\"\naction_timeline:\n  - \"0.0-1.5 s: turns the parcel over\"\n  - \"1.5-2.5 s: thumb wipes the label\"\n  - \"2.5-4.0 s: focus racks to her eyes; she looks up\"\ndialogue:\n  - {line_id: VL-SC03-004, character: CH-MAYA, text: \"That's my street.\", timing: \"3.0-3.8 s\", delivery: \"barely audible\"}\nsound: \"rain on window, distant traffic hiss, paper crinkle on the wipe (sfx-cues in 11_sound/sfx.md)\"\nmusic: \"M02 continues under; no new cue\"\nvfx: none                            # or VFX-SC03-SH020\ntransition_in: \"cut from SC03-SH010 (wide)\"\ntransition_out: \"cut on her look-up to SC03-SH030 (her POV of window)\"\ncontinuity:\n  - \"Parcel tape torn at one corner since SC02-SH040\"\n  - \"Left hand has a fresh scrape on the knuckles since SC02\"\ngeneration:\n  mode: first-last-frame              # see vocabulary\n  start_frame: \"<self-contained still description of the first frame, including identity locks>\"\n  end_frame: \"<self-contained still description of the last frame>\"\n  motion: \"<only what changes between the two frames, in time order>\"\n  clip_length_s: 5                    # generate longer than duration_s, trim in edit\n  keep: \"0.5-4.5 s\"                   # the part of the clip used in the cut (motion is timed in clip time)\n  risks: [\"text legibility on label: add label in post if unreadable (see VFX)\"]\n```\n\nRules for the compiled shot record:\n- `start_frame` and `end_frame` are complete still descriptions a person could draw without the rest\n ic-generation, sfx-generation.\n\n**Time of day:** dawn, morning, midday, afternoon, golden-hour, dusk (blue hour), night, pre-dawn.\n\n## 6. Asset naming\n\n```\nassets/characters/CH-MAYA_turnaround_v1.png\nassets/characters/CH-MAYA_expressions_v1.png\nassets/characters/CO-MAYA-01_costume_v1.png\nassets/world/LOC-ROOFTOP_plate_dusk_v2.png\nassets/world/PR-PARCEL_sheet_v1.png\nassets/storyboard/SB-SC03-SH020-P1_v1.png\nassets/keyframes/SC03-SH020_start_v3.png\nassets/keyframes/SC03-SH020_end_v3.png\nassets/video/SC03-SH020_take02.mp4\nassets/audio/VL-SC03-004_take01.wav\nassets/audio/M02_v1.wav\n```\n\nThe approved file for each slot is recorded in the asset registry inside the master document. Never\noverwrite an approved asset; write a new version.\n\n## 7. Validation rules\n\n`validate_production.py <project>` checks, and reports each failure with file and record ID:\n1. Every record block parses as YAML and has `record` and `id`.\n2. IDs are unique and match the patterns in section 2.\n3. Required fields are present and not empty, `TBD`, `TODO` or `?`.\n4. Every ID mentioned in a record resolves to an existing record.\n5. Shots: `duration_s` > 0; `camera.shot_size` and `camera.movement` use the controlled vocabulary;\n   `generation.mode` is a known mode; video modes have `start_state`, `end_state` and `motion`.\n6. Scenes: the sum of shot durations is within ±25% of the scene's `est_duration_s` (warning).\n7. Continuity: within one scene, a character keeps one costume unless a shot declares `costume_change: true`.\n8. Staleness: every `depends_on` entry `name@N` matches the current `version` of that artifact (warning).\n9. Locks (warnings): word counts, character lock without the name or garments, style lock without an aspect\n   ratio, no \"no ...\" phrasing; frame texts over 350 words; every character, costume, prop and location\n   listed in a shot appears in its frame texts through its full or short lock, pasted verbatim.\n10. Counts of `MISSING:`, `ASSUMPT // ---------- the isometric studio ----------
const TW = 30, TH = 15, WALL = 26;
const iso = (gx, gy) => ({ x: (gx - gy) * TW, y: (gx + gy) * TH });
const pts = (arr) => arr.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
const up = (p, hgt) => ({ x: p.x, y: p.y - hgt });

const Studio2D = (() => {
  let svg, layerFloor, layerObj, layerSign, layerOver;
  const robots = {}; // id -> {el, gx, gy, home:{gx,gy}, desk, paper, bubble, room}
  const roomGeo = {};
  let speed = 1;
  let follow = true;
  const cam = { cx: 0, cy: 380, w: 1760, tcx: 0, tcy: 380, tw: 1760 };
  let walkers = []; // active tweens
  let clickCb = null;
  let boardEl = null;
  let dusty = null;
  let crateCount = 0;

  function box(gx, gy, w, d, hgt, color, extra) {
    const top = [iso(gx, gy), iso(gx + w, gy), iso(gx + w, gy + d), iso(gx, gy + d)].map((p) => up(p, hgt));
    const left = [iso(gx, gy + d), iso(gx + w, gy + d), up(iso(gx + w, gy + d), hgt), up(iso(gx, gy + d), hgt)];
    const right = [iso(gx + w, gy), iso(gx + w, gy + d), up(iso(gx + w, gy + d), hgt), up(iso(gx + w, gy), hgt)];
    const g = s('g', { class: 'box ' + (extra || '') },
      s('polygon', { points: pts(left), fill: shade(color, -0.18) }),
      s('polygon', { points: pts(right), fill: shade(color, -0.32) }),
      s('polygon', { points: pts(top), fill: color }));
    g.dataset.depth = gx + w / 2 + gy + d / 2;
    return g;
  }
  // a flat group painted onto a +gy-facing vertical face whose top-left is (gx, gy) at height hgt
  function faceGroup(gx, gy, hgt) {
    const p = up(iso(gx, gy), hgt);
    return s('g', { transform: `matrix(1,0.5,0,1,${p.x.toFixed(1)},${p.y.toFixed(1)})` });
  }
  function addObj(el, depth) {
    el.dataset.depth = depth;
    const list = layerObj.children;
    let i = list.length;
    while (i > 0 && +list[i - 1].dataset.depth > depth) i--;
    layerObj.insertBefore(el, list[i] || null);

    const d = +el.dataset.depth;

  }

  function drawFloors() {
    // corridor
    const c = [iso(-2, -2), iso(30, -2), iso(30, 30), iso(-2, 30)];
    layerFloor.append(s('polygon', { points: pts(c), class: 'corridor' }));
    for (let k = -2; k <= 30; k += 2) {
      layerFloor.append(s('line', { x1: iso(k, -2).x, y1: iso(k, -2).y, x2: iso(k, 30).x, y2: iso(k, 30).y, class: 'corridor-line' }));

    }

        const g = s('g', {}, s('line', { x1: p.x, y1: p.y, x2: p.x, y2: p.y - 46, stroke: '#343a40', 'stroke-width': 2 }), s('rect', { x: p.x - 12, y: p.y - 62, width: 24, height: 17, rx: 2, fill: '#fff9db', stroke: '#495057' }));
        addObj(g, ox + oy + 7.8);
      } else if (d === 'monitor') {
        const x = ox + 5.6, y = oy + 6.0;
        const g = s('g', {}, box(x, y, 1.6, 0.9, 14, '#495057'));
        const p = up(iso(x + 0.8, y + 0.4), 14);
        g.append(s('rect', { x: p.x - 16, y: p.y - 22, width: 32, height: 19, rx: 2, fill: '#212529' }), s('rect', { class: 'screen-glow', x: p.x - 14, y: p.y - 20, width: 28, height: 15, fill: '#4dabf7' }));
        addObj(g, x + y + 1.3);
      } else if (d === 'reels') {
        const p = iso(ox + 1.6, oy + 6.6);
        const g = s('g', {}, ...[0, 1, 2].map((k) => s('ellipse', { cx: p.x, cy: p.y - k * 5, rx: 14, ry: 7, fill: k % 2 ? '#495057' : '#343a40', stroke: '#868e96', 'stroke-width': 0.8 })));
        addObj(g, ox + oy + 8.2);
      } else if (d === 'console') {
        const x = ox + 2.4, y = oy + 6.0;
        const g = s('g', {}, box(x, y, 3.2, 1.0, 12, '#343a40'));
        for (let k = 0; k < 8; k++) { const q = up(iso(x + 0.25 + k * 0.38, y + 0.5), 12); g.append(s('rect', { class: 'fader', x: q.x - 1.5, y: q.y - 4, width: 3, height: 5, fill: ['#ff6b6b', '#ffd43b', '#69db7c', '#4dabf7'][k % 4], style: `animation-delay:${k * 0.13}s` })); }
        addObj(g, x + y + 2.1);
      } else if (d === 'speaker') {
        const x = ox + 7.0, y = oy + 5.6;
        const g = s('g', {}, box(x, y, 0.8, 0.8, 34, '#212529'));
        const p = up(iso(x + 0.4, y + 0.8), 0);
        g.append(s('circle', { class: 'woofer', cx: p.x - 5, cy: p.y - 13, r: 5, fill: '#495057' }), s('circle', { cx: p.x - 5, cy: p.y - 26, r: 3, fill: '#495057' }));
        addObj(g, x + y + 0.8);
      } else if (d === 'easel') {
        const p = iso(ox + 1.4, oy + 6.4);
        const g = s('g', {}, s('line', { x1: p.x - 9, y1: p.y, x2: p.x, y2: p.y - 44, stroke: '#a0522d', 'stroke-width': 2 }), s('line', { x1: p.x + 9, y1: p.y, x2: p.x, y2: p.y - 44, stroke: '#a0522d', 'stroke-width': 2 }), s('rect', { x: p.x - 13, y: p.y - 40, width: 26, height: 20, fill: '#fff', stroke: '#495057' }), s('path', { d: `M${p.x - 10},${p.y - 24} l6,-8 l5,5 l4,-6 l5,9`, fill: 'none', stroke: '#51cf66', 'stroke-width': 1.4 }));
        addObj(g, ox + oy + 7.8);
      }
    }
  }

  function deskSpots(n) {
    if (n === 1) return [[4.4, 3.0]];
    if (n === 2) return [[2.6, 3.2], [5.6, 3.2]];
    return [[1.7, 2.6], [4.1, 3.0], [6.5, 3.4]];
  }

  function placeRobots() {
    for (const room of ROOMS) {
      const { ox, oy } = roomGeo[room.id];
      const spots = deskSpots(room.workers.length);
      room.workers.forEach((id, k) => {
        const [lx, ly] = spots[k];
        const gx = ox + lx, gy = oy + ly;
        const el = drawRobot(id);
        el.addEventListener('click', (e) => { e.stopPropagation(); clickCb && clickCb({ robot: id }); });
        const r = { id, el, gx, gy, home: { gx, gy }, room: room.id, meet: { gx: gx + 0.5, gy: gy + 2.1 } };
        robots[id] = r;
        moveTo(r, gx, gy);
        addObj(el, gx + gy);
        // desk with a paper that fills up while the robot writes
        const desk = box(gx - 0.75, gy + 0.55, 1.5, 0.75, 13, '#c08552', 'desk');
        const paperBase = up(iso(gx - 0.2, gy + 0.85), 13);
        const paper = s('g', { class: 'paper', transform: `translate(${paperBase.x.toFixed(1)} ${paperBase.y.toFixed(1)})` },
          s('polygon', { points: '0,0 14,7 6,11 -8,4', fill: '#fff', stroke: '#dee2e6', 'stroke-width': 0.6 }));
        const lines = s('g', { class: 'paper-lines' });
        for (let j = 0; j < 5; j++) lines.append(s('line', { x1: -5 + j * 1.6, y1: 3 + j * 0.8 - 0.2, x2: 5 + j * 1.6, y2: 8 + j * 0.8 - 0.2 - 4.5, stroke: '#868e96', 'stroke-width': 0.7, opacity: 0, transform: `translate(${j * 0.3} ${-j * 0.1})` }));
        paper.append(lines);
        desk.append(paper);
        r.paperLines = Array.from(lines.children);
        addObj(desk, gx + gy + 0.95);
      });
    }
    // coordinator's home is its own desk; give it a mug
    const c = robots[COORD];
    c.home = { gx: c.gx, gy: c.gy };
  }

  function moveTo(r, gx, gy) {
    r.gx = gx; r.gy = gy;
    const p = iso(gx, gy);
    r.x = p.x; r.y = p.y;
    r.el.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})${r.flip ? ' scale(-1 1)' : ''}`);
    r.el.dataset.depth = gx + gy + 0.01;
    if (r.bubble) positionBubble(r);
  }

  // ---- corridor routing (lines x,y in {-1,9,19,29}) ----
  const LINES = [-1, 9, 19, 29];
  function doorsOf(roomId) {
    const { ox, oy } = roomGeo[roomId];
    return [
      { door: [ox + 4, oy - 1], inside: [ox + 4, oy + 0.6] },
      { door: [ox - 1, oy + 4], inside: [ox + 0.6, oy + 4] },
      { door: [ox + 9, oy + 4], inside: [ox + 7.4, oy + 4] },
      { door: [ox + 4, oy + 9], inside: [ox + 4, oy + 7.4] },
    ];
  }
  function corridorPath(a, b) {
    // a and b lie on corridor lines; route through intersections (Manhattan on the grid)
    const onX = (p) => LINES.includes(p[0]);
    const onY = (p) => LINES.includes(p[1]);
    const cands = [];
    if (onX(a) && onX(b) && a[0] === b[0]) cands.push([a, b]);
    if (onY(a) && onY(b) && a[1] === b[1]) cands.push([a, b]);
    if (onX(a) && onY(b)) cands.push([a, [a[0], b[1]], b]);
    if (onY(a) && onX(b)) cands.push([a, [b[0], a[1]], b]);
    for (const L of LINES) {
      if (onX(a) && onX(b)) cands.push([a, [a[0], L], [b[0], L], b]);
      if (onY(a) && onY(b)) cands.push([a, [L, a[1]], [L, b[1]], b]);
    }
    const len = (path) => path.slice(1).reduce((acc, p, i) => acc + Math.abs(p[0] - path[i][0]) + Math.abs(p[1] - path[i][1]), 0);
    cands.sort((p, q) => len(p) - len(q));
    return cands[0] || [a, b];
  }
  function route(r, target) {
    const from = [r.gx, r.gy];
    const fromRoom = roomAt(r.gx, r.gy);
    const toRoom = roomAt(target[0], target[1]);
    if (fromRoom && fromRoom === toRoom) return [from, target];
    let best = null;
    const fromDoors = fromRoom ? doorsOf(fromRoom) : [{ door: snapToLine(from), inside: null }];
    const toDoors = toRoom ? doorsOf(toRoom) : [{ door: snapToLine(target), inside: null }];
    for (const fd of fromDoors) for (const td of toDoors) {
      const mid = corridorPath(fd.door, td.door);
      const path = [from, ...(fd.inside ? [fd.inside] : []), ...mid, ...(td.inside ? [td.inside] : []), target];
      const L = path.slice(1).reduce((acc, p, i) => acc + Math.hypot(p[0] - path[i][0], p[1] - path[i][1]), 0);
      if (!best || L < best.L) best = { path, L };
    }
    return best.path;
  }
  function snapToLine(p) {
    let best = null;
    for (const L of LINES) {
      const c1 = [L, clamp(p[1], -1, 29)], c2 = [clamp(p[0], -1, 29), L];
      for (const c of [c1, c2]) { const d = Math.hypot(c[0] - p[0], c[1] - p[1]); if (!best || d < best.d) best = { c, d }; }
    }
    return best.c;
  }
  function roomAt(gx, gy) {
    for (const room of ROOMS) { const { ox, oy } = roomGeo[room.id]; if (gx >= ox - 0.01 && gx <= ox + 8.01 && gy >= oy - 0.01 && gy <= oy + 8.01) return room.id; }
    return null;
  }

  function walk(id, target) {
    const r = robots[id];
    return new Promise((resolve) => {
      walkers = walkers.filter((w) => { if (w.r === r) { w.resolve(); return false; } return true; });
      const path = route(r, target);
      if (reducedMotion()) { moveTo(r, target[0], target[1]); resort(r.el); resolve(); return; }
      setState(id, 'walk');
      walkers.push({ r, path, seg: 0, t: 0, resolve });
    });
  }
  function stepWalkers(dt) {
    for (const w of walkers.slice()) {
      const { r, path } = w;
      let dist = dt * 5.2 * speed;
      while (dist > 0 && w.seg < path.length - 1) {
        const a = path[w.seg], b = path[w.seg + 1];
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 0.0001;
        const remain = L * (1 - w.t);
        if (dist >= remain) { dist -= remain; w.seg++; w.t = 0; continue; }
        w.t += dist / L;
        dist = 0;
      }
      if (w.seg >= path.length - 1) {
        const end = path[path.length - 1];
        moveTo(r, end[0], end[1]);
        resort(r.el);
        walkers.splice(walkers.indexOf(w), 1);
        setState(r.id, 'idle');
        w.resolve();
        continue;
      }
      const a = path[w.seg], b = path[w.seg + 1];
      const gx = a[0] + (b[0] - a[0]) * w.t, gy = a[1] + (b[1] - a[1]) * w.t;
      const dx = iso(b[0], b[1]).x - iso(a[0], a[1]).x;
      if (Math.abs(dx) > 0.5) r.flip = dx < 0;
      moveTo(r, gx, gy);
      resort(r.el);
    }
  }

  // ---- states, bubbles, particles ----
  const STATES = ['idle', 'walk', 'think', 'write', 'talk', 'happy', 'off', 'draw', 'listen'];
  function setState(id, st) {
    const r = robots[id];
    if (!r) return;
    for (const k of STATES) r.el.classList.remove('st-' + k);
    r.el.classList.add('st-' + st);
    r.state = st;
  }
  function wrap(text, n, maxLines) {
    const ws = String(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of ws) {
      if ((cur + ' ' + w).trim().length > n) { lines.push(cur.trim()); cur = w; } else cur += ' ' + w;
    }
    if (cur.trim()) lines.push(cur.trim());
    if (lines.length > maxLines) { const keep = lines.slice(-maxLines); keep[0] = '…' + keep[0]; return keep; }
    return lines;
  }
  function say(id, text, opts) {
    const r = robots[id];
    if (!r) return;
    opts = opts || {};
    clearBubble(id);
    const lines = wrap(text, opts.width || 26, opts.lines || 3);
    const wpx = Math.max(60, Math.min(180, Math.max(...lines.map((l) => l.length)) * 5.6 + 18));
    const hpx = lines.length * 11 + 12;
    const g = s('g', { class: 'bubble ' + (opts.kind || 'speech') });
    const body = s('g', { class: 'bubble-body' });
    if (opts.kind === 'thought') {
      body.append(s('circle', { cx: 4, cy: -6, r: 2.2, class: 'b-fill' }), s('circle', { cx: 9, cy: -13, r: 3.4, class: 'b-fill' }));
    } else {
      body.append(s('path', { d: 'M-4,-12 L2,-2 L6,-12 Z', class: 'b-fill' }));
    }
    body.append(s('rect', { x: -wpx / 2, y: -12 - hpx, width: wpx, height: hpx, rx: opts.kind === 'thought' ? hpx / 2.2 : 9, class: 'b-fill b-stroke' }));
    lines.forEach((l, k) => body.append(s('text', { x: 0, y: -12 - hpx + 15 + k * 11, 'text-anchor': 'middle', class: 'b-text' }, l)));
    g.append(body);
    r.bubble = g;
    layerOver.append(g);
    positionBubble(r);
    if (opts.ms) r.bubbleTimer = setTimeout(() => { if (r.bubble === g) clearBubble(id); }, opts.ms / speed);
    return g;
  }
  function positionBubble(r) { r.bubble.setAttribute('transform', `translate(${r.x.toFixed(1)} ${(r.y - 74).toFixed(1)})`); }
  function clearBubble(id) {
    const r = robots[id];
    if (!r || !r.bubble) return;
    clearTimeout(r.bubbleTimer);
    r.bubble.remove();
    r.bubble = null;
  }
  function fx(id, glyph) {
    const r = robots[id];
    if (!r || reducedMotion()) return;
    const set = ROBOTS[id].fx;
    const t = s('text', { class: 'particle', x: r.x + (Math.random() * 30 - 15), y: r.y - 60, 'font-size': 12, 'text-anchor': 'middle' }, glyph || set[Math.floor(Math.random() * set.length)]);
    layerOver.append(t);
    setTimeout(() => t.remove(), 2200);
  }
  function setPaper(id, level) {
    const r = robots[id];
    if (!r || !r.paperLines) return;
    const n = Math.round(clamp(level, 0, 1) * r.paperLines.length);
    r.paperLines.forEach((l, k) => l.setAttribute('opacity', k < n ? 1 : 0));
  }

  // ---- camera ----
  function aspect() { const b = svg.getBoundingClientRect(); return b.width > 0 ? b.height / b.width : 0.6; }
  function applyCam() {
    const hgt = cam.w * aspect();
    svg.setAttribute('viewBox', `${(cam.cx - cam.w / 2).toFixed(1)} ${(cam.cy - hgt / 2).toFixed(1)} ${cam.w.toFixed(1)} ${hgt.toFixed(1)}`);
  }
  function lookAt(cx, cy, w, instant) {
    cam.tcx = cx; cam.tcy = cy; cam.tw = clamp(w, 380, 2000);
    if (instant || reducedMotion()) { cam.cx = cx; cam.cy = cy; cam.w = cam.tw; applyCam(); }
  }
  function focusRoom(roomId, instant) {
    const { ox, oy } = roomGeo[roomId];
    const c = iso(ox + 4, oy + 4);
    const narrow = aspect() > 0.9;
    lookAt(c.x, c.y - 30, narrow ? 560 : 640, instant);
  }
  function overview(instant) { const a = aspect(); lookAt(0, 400, a > 0.9 ? 1150 : a > 0.62 ? 1700 : 1780, instant); }
  function focusRobot(id) {
    const r = robots[id];
    if (r) lookAt(r.x, r.y - 30, 760);
  }

  let lastT = 0;
  function loop(t) {
    const dt = Math.min(0.05, (t - (lastT || t)) / 1000);
    lastT = t;
    stepWalkers(dt);
    if (follow && walkers.length) { const w = walkers.find((x) => x.r.id === COORD) || walkers[0]; lookAt(w.r.x, w.r.y - 30, 820); }
    const k = 1 - Math.pow(0.0025, dt);
    cam.cx += (cam.tcx - cam.cx) * k; cam.cy += (cam.tcy - cam.cy) * k; cam.w += (cam.tw - cam.w) * k;
    applyCam();
    stepDusty(dt);
    requestAnimationFrame(loop);
  }

  // ---- Dusty, the corridor roomba ----
  function makeDusty() {
    const el = s('g', { class: 'dusty' }, s('ellipse', { cx: 0, cy: 0, rx: 11, ry: 5.5, fill: '#495057' }), s('ellipse', { cx: 0, cy: -3, rx: 10, ry: 5, fill: '#ced4da' }), s('circle', { class: 'antenna-ball', cx: 3, cy: -5, r: 1.6, fill: '#51cf66' }));
    dusty = { el, gx: 9, gy: 9, path: [], seg: 0, t: 0, wait: 2 };
    addObj(el, 18);
    const p = iso(9, 9);
    el.setAttribute('transform', `translate(${p.x} ${p.y})`);
  }
  function stepDusty(dt) {
    if (!dusty || reducedMotion()) return;
    if (!dusty.path.length) {
      dusty.wait -= dt;
      if (dusty.wait > 0) return;
      const onX = LINES.includes(dusty.gx);
      const L = LINES[Math.floor(Math.random() * 4)];
      const tgt = onX ? [dusty.gx, L] : [L, dusty.gy];
      if (tgt[0] === dusty.gx && tgt[1] === dusty.gy) { dusty.wait = 1; return; }
      dusty.path = [[dusty.gx, dusty.gy], tgt]; dusty.t = 0;
      return;
    }
    const [a, b] = dusty.path;
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    dusty.t += (dt * 1.6) / L;
    if (dusty.t >= 1) { dusty.gx = b[0]; dusty.gy = b[1]; dusty.path = []; dusty.wait = 2 + Math.random() * 5; }
    else { dusty.gx = a[0] + (b[0] - a[0]) * dusty.t; dusty.gy = a[1] + (b[1] - a[1]) * dusty.t; }
    const p = iso(dusty.gx, dusty.gy);
    dusty.el.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    dusty.el.dataset.depth = dusty.gx + dusty.gy;
    resort(dusty.el);
  }

  function init(svgEl) {
    svg = svgEl;
    svg.append(
      layerFloor = s('g', { class: 'layer-floor' }),
      layerObj = s('g', { class: 'layer-obj' }),
      layerSign = s('g', { class: 'layer-sign' }),
      layerOver = s('g', { class: 'layer-over' }));
    drawFloors();
    placeRobots();
    makeDusty();
    overview(true);
    // pan & zoom
    let drag = null;
    svg.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, cx: cam.tcx, cy: cam.tcy, moved: false }; });
    window.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const b = svg.getBoundingClientRect();
      const scale = cam.w / b.width;
      const dx = (e.clientX - drag.x) * scale, dy = (e.clientY - drag.y) * scale;
      if (Math.abs(dx) + Math.abs(dy) > 6 * scale) { drag.moved = true; setFollow(false); }
      if (drag.moved) lookAt(drag.cx - dx, drag.cy - dy, cam.tw, true);
    });
    window.addEventListener('pointerup', () => { drag = null; });
    svg.addEventListener('wheel', (e) => { e.preventDefault(); setFollow(false); lookAt(cam.tcx, cam.tcy, cam.tw * (e.deltaY > 0 ? 1.12 : 0.89)); }, { passive: false });
    new ResizeObserver(() => applyCam()).observe(svg);
    requestAnimationFrame(loop);
  }
  function setFollow(on) { follow = on; const b = document.getElementById('btnFollow'); if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false'); }

  function setCrew(enabled) {
    for (const id of Object.keys(robots)) {
      if (id === COORD) continue;
      if (!enabled.has(id)) setState(id, 'off');
      else if (robots[id].state === 'off' || !robots[id].state) setState(id, 'idle');
    }
  }
  function updateBoard(stages) {
    if (!boardEl) return;
    boardEl.replaceChildren();
    stages.forEach((st, k) => {
      const col = k % 11, row = Math.floor(k / 11);
      const color = { done: '#40c057', working: '#fab005', review: '#4dabf7', error: '#fa5252', stale: '#ff922b', skipped: '#dee2e6' }[st.status] || '#adb5bd';
      boardEl.append(s('circle', { cx: 4 + col * 8.6, cy: 4 + row * 10, r: 3, fill: color, class: st.status === 'working' ? 'pulse' : '' }));
    });
  }
  function addCrate(label) {
    const { ox, oy } = roomGeo.dock;
    const k = crateCount++;
    const x = ox + 3.2 + (k % 3) * 1.0, y = oy + 4.6 + Math.floor(k / 3) % 3 * 1.0;
    const g = box(x, y, 0.8, 0.8, 14, '#e9c46a', 'crate');
    const p = up(iso(x + 0.4, y + 0.4), 14);
    g.append(s('text', { x: p.x, y: p.y + 2, 'font-size': 7, 'text-anchor': 'middle' }, label));
    addObj(g, x + y + 0.8);
    if (!reducedMotion()) g.classList.add('drop-in');
  }
  function spotOf(id) { return robots[id] ? robots[id].meet : null; }
  return {
    init, walk, setState, say, clearBubble, fx, setPaper, focusRoom, overview, focusRobot, setFollow,
    isFollowing: () => follow, setCrew, updateBoard, addCrate, spotOf,
    robot: (id) => robots[id], onClick: (cb) => { clickCb = cb; }, setSpeed: (v) => { speed = v; },
    zoom: (f) => { setFollow(false); lookAt(cam.tcx, cam.tcy, cam.tw * f); },
  };
})();

// ---------- capabilities and saving ----------
const CL = (window.claude && typeof window.claude.use === 'function') ? window.claude : null;
const useCap = (name) => (CL ? CL.use(name).catch(() => null) : Promise.resolve(null));

const Store = (() => {
  let db = null, uid = null, mode = 'memory';
  const memory = {};
  const chains = {};
  const serial = (key, fn) => (chains[key] = (chains[key] || Promise.resolve()).then(fn, fn));

  async function init() {
    const [dbNs, userNs] = await Promise.all([useCap('db'), useCap('user')]);
    if (dbNs && userNs) {
      try { uid = await userNs.id(); } catch (e) { uid = null; }
      if (uid) { db = dbNs; mode = 'db'; return mode; }
    }
    try { localStorage.setItem('rfs:probe', '1'); localStorage.removeItem('rfs:probe'); mode = 'local'; } catch (e) { mode = 'memory'; }
    return mode;
  }
  const base = () => db.doc(`data/users/${uid}/studio`);
  const projRef = (pid) => base().collection('projects').doc(pid);

  function metaOf(p) {
    const stages = {};
    for (const [k, v] of Object.entries(p.stages)) {
      stages[k] = { status: v.status, version: v.version || 0, startedAt: v.startedAt || null, endedAt: v.endedAt || null, words: v.words || 0, error: v.error || null, revisionOf: v.revisionOf || null };
    }
    return {
      id: p.id, title: p.title, created: p.created, updated: Date.now(), settings: p.settings, stages,
      chat: p.chat.slice(-80).map((m) => ({ ...m, text: String(m.text).slice(0, 4000) })),
      notes: p.notes.slice(-60), crs: p.crs.slice(-40), uploads: p.uploads.map((u) => ({ id: u.id, name: u.name, kind: u.kind, size: u.size })),
      progress: progressOf(p),
    };
  }
  function progressOf(p) {
    const on = STAGE_ORDER.filter((id) => p.stages[id] && p.stages[id].status !== 'skipped' && p.settings.crew[id] !== false);
    const done = on.filter((id) => p.stages[id].status === 'done').length;
    return { done, total: on.length };
  }

  async function saveProject(p, stageIds) {
    const meta = metaOf(p);
    if (mode === 'db') {
      const jobs = [serial('meta:' + p.id, () => projRef(p.id).set(meta))];
      for (const sid of stageIds || []) {
        const st = p.stages[sid];
        jobs.push(serial('st:' + p.id + sid, () => projRef(p.id).collection('stages').doc(sid).set({ md: String(st.md || '').slice(0, 200000), data: st.data || null })));
        if (st.sketches) jobs.push(serial('sk:' + p.id + sid, () => projRef(p.id).collection('sketches').doc(sid).set({ list: st.sketches.slice(0, 40) })));
      }
      for (const u of p.uploads) if (!u.saved) {
        u.saved = true;
        jobs.push(serial('up:' + u.id, () => projRef(p.id).collection('uploads').doc(u.id).set({ name: u.name, kind: u.kind, size: u.size || 0, text: u.text || null, dataUrl: u.dataUrl || null })));
      }
      await Promise.allSettled(jobs);
      return;
    }
    const full = { ...meta, stageData: {}, uploadData: p.uploads };
    for (const [k, v] of Object.entries(p.stages)) full.stageData[k] = { md: v.md || '', data: v.data || null, sketches: v.sketches || null };
    if (mode === 'local') {
      try {
        localStorage.setItem('rfs:p:' + p.id, JSON.stringify(full));
        const idx = JSON.parse(localStorage.getItem('rfs:index') || '{}');
        idx[p.id] = { id: p.id, title: p.title, updated: meta.updated, progress: meta.progress };
        localStorage.setItem('rfs:index', JSON.stringify(idx));
        return;
      } catch (e) { /* quota: fall through to memory */ }
    }
    memory[p.id] = full;
  }

  async function listProjects() {
    if (mode === 'db') {
      try {
        const snap = await base().collection('projects').orderBy('updated', 'desc').limit(30).get();
        return snap.docs.map((d) => { const v = d.data(); return { id: d.id, title: v.title, updated: v.updated, progress: v.progress }; });
      } catch (e) { return []; }
    }
    if (mode === 'local') {
      try { return Object.values(JSON.parse(localStorage.getItem('rfs:index') || '{}')).sort((a, b) => b.updated - a.updated); } catch (e) { return []; }
    }
    return Object.values(memory).map((v) => ({ id: v.id, title: v.title, updated: v.updated, progress: v.progress }));
  }

  async function loadProject(pid) {
    let meta, stageData = {}, uploads = [];
    if (mode === 'db') {
      const snap = await projRef(pid).get();
      if (!snap.exists) return null;
      meta = snap.data();
      const [st, sk, up] = await Promise.all(['stages', 'sketches', 'uploads'].map((c) => projRef(pid).collection(c).get().catch(() => ({ docs: [] }))));
      for (const d of st.docs) stageData[d.id] = { ...(stageData[d.id] || {}), ...d.data() };
      for (const d of sk.docs) stageData[d.id] = { ...(stageData[d.id] || {}), sketches: d.data().list };
      uploads = up.docs.map((d) => ({ id: d.id, ...d.data(), saved: true }));
    } else {
      let full = memory[pid];
      if (!full && mode === 'local') { try { full = JSON.parse(localStorage.getItem('rfs:p:' + pid) || 'null'); } catch (e) { full = null; } }
      if (!full) return null;
      meta = full; stageData = full.stageData || {}; uploads = full.uploadData || [];
    }
    const p = JSON.parse(JSON.stringify(meta));
    for (const id of STAGE_ORDER) {
      p.stages[id] = { ...(p.stages[id] || { status: 'waiting' }), ...(stageData[id] || {}) };
      if (p.stages[id].status === 'working') p.stages[id].status = 'waiting';
    }
    p.uploads = uploads.map((u) => ({ ...u, blob: u.dataUrl ? dataUrlToBlob(u.dataUrl) : null }));
    p.chat = p.chat || []; p.notes = p.notes || []; p.crs = p.crs || [];
    return p;
  }

  async function deleteProject(pid) {
    if (mode === 'db') {
      const ref = projRef(pid);
      for (const c of ['stages', 'sketches', 'uploads']) {
        const snap = await ref.collection(c).get().catch(() => ({ docs: [] }));
        await Promise.allSettled(snap.docs.map((d) => ref.collection(c).doc(d.id).delete()));
      }
      await ref.delete().catch(() => {});
      return;
    }
    delete memory[pid];
    if (mode === 'local') {
      try {
        localStorage.removeItem('rfs:p:' + pid);
        const idx = JSON.parse(localStorage.getItem('rfs:index') || '{}');
        delete idx[pid];
        localStorage.setItem('rfs:index', JSON.stringify(idx));
      } catch (e) { /* ignore */ }
    }
  }
  return { init, saveProject, listProjects, loadProject, deleteProject, progressOf, mode: () => mode };
})();

function dataUrlToBlob(url) {
  try {
    const [head, b64] = url.split(',');
    const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  } catch (e) { return null; }
}

const Keys = (() => {
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const write = (k, v) => { try { if (v) localStorage.setItem(k, JSON.stringify(v)); else localStorage.removeItem(k); } catch (e) { /* storage blocked */ } };
  // keys live only in this browser: per film, with an optional default for every film; never saved to the account or exports
  function get(pid) {
    const own = pid ? read('rfs:keys:' + pid) : null;
    return own || read('rfs:keys:default') || {};
  }
  function set(pid, obj, asDefault) {
    if (pid) write('rfs:keys:' + pid, obj);
    if (asDefault) write('rfs:keys:default', obj);
  }
  function key(pid, provider) { const k = get(pid)[provider]; return k && k.key ? k : null; }
  return { get, set, key, isDefault: () => !!read('rfs:keys:default') };
})();

const Brain = (() => {
  let sampleFn = null;
  let mode = null;
  let Sdk = null;
  let pidFn = () => null;
  async function init(getPid) {
    pidFn = getPid || pidFn;
    sampleFn = await useCap('sample');
    mode = sampleFn ? 'claude' : 'api';
    return mode;
  }
  const ready = () => mode === 'claude' || !!Keys.key(pidFn(), 'anthropic');
  async function client() {
    const k = Keys.key(pidFn(), 'anthropic');
    if (!k) throw { code: 'no_brain', message: 'Add an Anthropic API key on the 🔑 Keys page.' };
    if (!Sdk) {
      try { const m = await import(SDK_URL); Sdk = m.default || m.Anthropic; }
      catch (e) { throw { code: 'network_blocked', message: 'Could not load the Anthropic SDK.' }; }
    }
    return new Sdk({ apiKey: k.key, dangerouslyAllowBrowser: true });
  }
  async function toBase64(blob) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    let s2 = '';
    for (let i = 0; i < buf.length; i += 0x8000) s2 += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return btoa(s2);
  }
  function mapError(e) {
    if (e && e.code) return e;
    const status = e && e.status;
    if (e && e.name === 'AbortError') return { code: 'cancelled' };
    if (status === 401 || status === 403) return { code: 'bad_key', message: 'The Anthropic key was rejected.' };
    if (status === 429) return { code: 'rate_limited' };
    if (status === 400) return { code: 'invalid_request', message: String(e.message || '').slice(0, 300) };
    if (status >= 500) return { code: 'upstream_error' };
    return { code: 'network_blocked', message: String((e && e.message) || e).slice(0, 200) };
  }
  async function apiSample(input, opts) {
    const c = await client();
    const tier = opts.modelTier || 'default';
    const model = API_MODELS[tier];
    const imgs = opts.images ? Array.from(opts.images) : [];
    const turns = typeof input === 'string' ? [{ role: 'user', content: input }] : input;
    const messages = [];
    for (const t of turns) {
      const last = messages[messages.length - 1];
      if (last && last.role === t.role) last.content += '\n\n' + t.content; else messages.push({ role: t.role, content: t.content });
    }
    if (imgs.length) {
      const lastUser = messages[messages.length - 1];
      const blocks = [];
      for (const b of imgs) blocks.push({ type: 'image', source: { type: 'base64', media_type: b.type || 'image/jpeg', data: await toBase64(b) } });
      blocks.push({ type: 'text', text: lastUser.content });
      lastUser.content = blocks;
    }
    const body = { model, max_tokens: 32000, messages, output_config: { effort: API_EFFORT[tier] } };
    if (model !== 'claude-haiku-5-5') { body.betas = ['server-side-fallback-2026-07-01']; body.fallbacks = 'default'; }
    let text = '';
    try {
      const stream = c.beta.messages.stream(body, { signal: opts.signal });
      for await (const ev of stream) {
        if (ev.type === 'content_block_delta' && ev.delta.type === 'text_delta') {
          text += ev.delta.text;
          if (opts.onText) opts.onText({ text, delta: ev.delta.text });
        }
      }
      const fin = await stream.finalMessage();
      if (fin.stop_reason === 'refusal') throw { code: 'refused' };
      if (!text.trim()) throw { code: 'empty_completion' };
      return { text, truncated: fin.stop_reason === 'max_tokens', modelTierApplied: tier };
    } catch (e) { const m = mapError(e); if (text) m.text = text; throw m; }
  }
  async function sample(input, opts) {
    opts = opts || {};
    if (mode === 'claude') return sampleFn(input, opts);
    return apiSample(input, opts);
  }
  async function json(input, opts) {
    if (mode === 'claude') return sampleFn.json(input, opts);
    const { text } = await apiSample(input, opts || {});
    const parsed = extractJsonBlock(text) || (() => { const a = text.indexOf('{'), b = text.lastIndexOf('}'); try { return JSON.parse(text.slice(a, b + 1)); } catch (e) { return null; } })();
    if (!parsed) throw { code: 'invalid_json', text };
    return parsed;
  }
  async function limits() {
    if (mode === 'claude') return sampleFn.limits ? sampleFn.limits().catch(() => null) : null;
    return { maxPromptBytes: 900000, images: { maxCount: 8, mediaTypes: ['image/jpeg', 'image/png', 'image/webp', 'image/gif'] } };
  }
  return { init, ready, sample, json, limits, mode: () => mode };
})();

// ---------- image and video generation with the user's own keys ----------
const Gen = (() => {
  const SIZE = { '16:9': ['1536x1024', 'landscape_16_9'], '9:16': ['1024x1536', 'portrait_16_9'], '1:1': ['1024x1024', 'square_hd'], '2.39:1': ['1536x1024', 'landscape_16_9'], '4:5': ['1024x1536', 'portrait_4_3'] };
  async function call(url, init) {
    let r;
    try { r = await fetch(url, init); }
    catch (e) { throw { code: 'network_blocked', message: Brain.mode() === 'claude' ? 'claude.ai blocks this page from reaching outside services. Use 📥 Take the studio home and open it on your computer — your keys work there.' : 'The request could not reach the provider (network or CORS).' }; }
    if (!r.ok) { let msg = ''; try { msg = (await r.text()).slice(0, 400); } catch (e) { /* ignore */ } throw { code: r.status === 401 || r.status === 403 ? 'bad_key' : 'provider_error', message: `${r.status}: ${msg}` }; }
    return r;
  }
  const pause = (ms, signal) => new Promise((res, rej) => { const t = setTimeout(res, ms); if (signal) signal.addEventListener('abort', () => { clearTimeout(t); rej({ code: 'cancelled' }); }, { once: true }); });
  async function image(provider, k, prompt, aspect) {
    const sz = SIZE[aspect] || SIZE['16:9'];
    if (provider === 'openai') {
      const r = await call('https://api.openai.com/v1/images/generations', { method: 'POST', headers: { Authorization: 'Bearer ' + k.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ model: k.imageModel || 'gpt-image-1', prompt, size: sz[0], n: 1 }) });
      const j = await r.json(); const d = j.data && j.data[0];
      return { url: d && (d.b64_json ? 'data:image/png;base64,' + d.b64_json : d.url) };
    }
    if (provider === 'google') {
      const r = await call(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(k.imageModel || 'gemini-2.5-flash-image')}:generateContent`, { method: 'POST', headers: { 'x-goog-api-key': k.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: `${prompt}\nAspect ratio ${aspect}.` }] }] }) });
      const j = await r.json();
      const part = ((((j.candidates || [])[0] || {}).content || {}).parts || []).find((p) => p.inlineData || p.inline_data);
      const d = part && (part.inlineData || part.inline_data);
      if (!d) throw { code: 'provider_error', message: 'No image in the response.' };
      return { url: `data:${d.mimeType || d.mime_type || 'image/png'};base64,${d.data}` };
    }
    if (provider === 'fal') {
      const r = await call('https://fal.run/' + (k.imageModel || 'fal-ai/flux/dev'), { method: 'POST', headers: { Authorization: 'Key ' + k.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, image_size: sz[1] }) });
      const j = await r.json();
      return { url: j.images && j.images[0] && j.images[0].url };
    }
    throw { code: 'provider_error', message: 'Unknown provider' };
  }
  async function video(provider, k, prompt, aspect, seconds, onStatus, signal) {
    if (provider === 'fal') {
      const model = k.videoModel || 'fal-ai/kling-video/v2.1/standard/text-to-video';
      const head = { Authorization: 'Key ' + k.key, 'Content-Type': 'application/json' };
      const sub = await (await call('https://queue.fal.run/' + model, { method: 'POST', headers: head, body: JSON.stringify({ prompt, aspect_ratio: aspect === '2.39:1' ? '16:9' : aspect, duration: String(seconds <= 5 ? 5 : 10) }) })).json();
      for (let k2 = 0; k2 < 120; k2++) {
        await pause(5000, signal);
        const st = await (await call(sub.status_url, { headers: head })).json();
        onStatus && onStatus(`fal: ${st.status}${st.queue_position != null ? ' · queue ' + st.queue_position : ''}`);
        if (st.status === 'COMPLETED') { const res = await (await call(sub.response_url, { headers: head })).json(); return { url: (res.video && res.video.url) || (res.videos && res.videos[0] && res.videos[0].url) }; }
        if (st.status === 'FAILED' || st.status === 'ERROR') throw { code: 'provider_error', message: 'fal reported a failure.' };
      }
      throw { code: 'provider_error', message: 'Timed out waiting for fal.' };
    }
    if (provider === 'openai') {
      const head = { Authorization: 'Bearer ' + k.key, 'Content-Type': 'application/json' };
      const size = aspect === '9:16' ? '720x1280' : '1280x720';
      const job = await (await call('https://api.openai.com/v1/videos', { method: 'POST', headers: head, body: JSON.stringify({ model: k.videoModel || 'sora-2', prompt, size, seconds: String(seconds <= 4 ? 4 : seconds <= 8 ? 8 : 12) }) })).json();
      for (let k2 = 0; k2 < 120; k2++) {
        await pause(5000, signal);
        const st = await (await call('https://api.openai.com/v1/videos/' + job.id, { headers: head })).json();
        onStatus && onStatus(`OpenAI: ${st.status}${st.progress != null ? ' ' + st.progress + '%' : ''}`);
        if (st.status === 'completed') { const blob = await (await call(`https://api.openai.com/v1/videos/${job.id}/content`, { headers: head })).blob(); return { url: URL.createObjectURL(blob), blob }; }
        if (st.status === 'failed') throw { code: 'provider_error', message: (st.error && st.error.message) || 'OpenAI reported a failure.' };
      }
      throw { code: 'provider_error', message: 'Timed out waiting for OpenAI.' };
    }
    if (provider === 'google') {
      const base = 'https://generativelanguage.googleapis.com/v1beta/';
      const head = { 'x-goog-api-key': k.key, 'Content-Type': 'application/json' };
      const op = await (await call(`${base}models/${encodeURIComponent(k.videoModel || 'veo-3.0-generate-001')}:predictLongRunning`, { method: 'POST', headers: head, body: JSON.stringify({ instances: [{ prompt }], parameters: { aspectRatio: aspect === '9:16' ? '9:16' : '16:9' } }) })).json();
      for (let k2 = 0; k2 < 120; k2++) {
        await pause(6000, signal);
        const st = await (await call(base + op.name, { headers: head })).json();
        onStatus && onStatus(st.done ? 'Google: done' : 'Google: generating…');
        if (st.error) throw { code: 'provider_error', message: st.error.message };
        if (st.done) {
          const sm = (((st.response || {}).generateVideoResponse || {}).generatedSamples || [])[0];
          const uri = sm && sm.video && sm.video.uri;
          if (!uri) throw { code: 'provider_error', message: 'No video in the response.' };
          const blob = await (await call(uri, { headers: { 'x-goog-api-key': k.key } })).blob();
          return { url: URL.createObjectURL(blob), blob };
        }
      }
      throw { code: 'provider_error', message: 'Timed out waiting for Google.' };
    }
    throw { code: 'provider_error', message: 'Unknown provider' };
  }
  async function test(provider, k) {
    if (provider === 'anthropic') { await Brain.sample('Reply with the single word: ready', { modelTier: 'quick' }); return 'Claude answered.'; }
    if (provider === 'openai') { await call('https://api.openai.com/v1/models', { headers: { Authorization: 'Bearer ' + k.key } }); return 'Key works.'; }
    if (provider === 'google') { await call('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1', { headers: { 'x-goog-api-key': k.key } }); return 'Key works.'; }
    return 'fal has no free test call; it is checked on the first generation.';
  }
  return { image, video, test };
})();

  function drawBoard() {
    if (!boardCanvas) return;
    const x = boardCanvas.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, 1024, 512);
    x.fillStyle = '#212529'; x.font = 'bold 54px Fredoka, sans-serif'; x.fillText('MISSION BOARD', 40, 70);
    const n = boardStages.length;
    const done = boardStages.filter((s2) => s2.status === 'done').length;
    x.font = '34px Nunito, sans-serif'; x.fillStyle = '#495057'; x.fillText(n ? `${done} of ${n} stages done` : 'Waiting for a pitch…', 40, 120);
    boardStages.forEach((s2, k) => {
      const cx = 70 + (k % 11) * 88, cy = 210 + Math.floor(k / 11) * 120;
      x.beginPath(); x.arc(cx, cy, 30, 0, 7);
      x.fillStyle = { done: '#40c057', working: '#fab005', review: '#4dabf7', error: '#fa5252', stale: '#ff922b', skipped: '#dee2e6' }[s2.status] || '#e9ecef'; x.fill();
      x.font = '30px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(STAGE[s2.id].icon, cx, cy + 2); x.textAlign = 'left'; x.textBaseline = 'alphabetic';
    });
    boardTex.needsUpdate = true;
  }
  function drawScreen(id, text, level) {

    else {
      x.fillStyle = '#c5f6fa'; x.font = '13px monospace';
      const words2 = text.split(/\s+/);
      const lines = []; let cur = '';
      for (const w of words2) { if ((cur + ' ' + w).length > 30) { lines.push(cur); cur = w; } else cur += (cur ? ' ' : '') + w; }
      lines.push(cur);
      lines.slice(-7).forEach((l, k) => x.fillText(l, 8, 42 + k * 16));
    }

    r.screenTex.needsUpdate = true;
  }

const W = (() => {
  let use3d = false, inited = false;
  let speed = 1, click = null;
  const pick = () => (use3d ? World : Studio2D);
  const api = {};
  // calls made before the world is ready are dropped (walks resolve at once)
  for (const k of ['setState', 'say', 'clearBubble', 'fx', 'setCrew', 'updateBoard', 'addCrate', 'robot', 'isFollowing', 'setFollow', 'zoom']) api[k] = (...a) => (inited ? pick()[k](...a) : (k === 'isFollowing' ? true : null));
  api.onClick = (cb) => { click = cb; if (inited) pick().onClick(cb); };
  api.setSpeed = (v) => { speed = v; if (inited) pick().setSpeed(v); };
  api.setPaper = (id, level, text) => (!inited ? null : use3d ? World.setPaper(id, level, text) : Studio2D.setPaper(id, level));
  api.goToRobot = (id, target) => (!inited ? Promise.resolve() : use3d ? World.goToRobot(id, target) : Studio2D.walk(id, [Studio2D.spotOf(target).gx, Studio2D.spotOf(target).gy]).then(() => Studio2D.isFollowing() && Studio2D.focusRoom(ROOM_OF[target])));

  api.event = (n, d) => { if (inited && use3d) World.event(n, d); };

    use3d = await World.init(container);

    inited = true;
