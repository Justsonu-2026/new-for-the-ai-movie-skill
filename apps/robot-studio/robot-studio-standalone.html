<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Robo Film Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f1ea; --surface: #ffffff; --surface-2: #f8f6f1; --ink: #23263a; --muted: #6b6f80; --line: #e4dfd3;
  --brand: #ff6b4a; --brand-ink: #ffffff; --brand-2: #6c5ce7; --ok: #2f9e44; --warn: #e67700; --err: #e03131; --info: #1c7ed6;
  --chip: #efeadf; --shadow: 0 6px 24px rgba(35, 38, 58, .10); --radius: 16px;
  --studio-bg: #dfe8f3; --corridor: #cfd6e2; --corridor-line: #bcc5d4;
  --bubble: #ffffff; --bubble-line: #23263a; --wall-a: .92; --wall-b: .82;
  --f-violet: #e9e1ff; --f-pink: #ffe1ec; --f-red: #ffe3dc; --f-sand: #f6ead2; --f-gold: #fff1c7; --f-blue: #dcecff; --f-slate: #e3e7ee; --f-amber: #ffefd6; --f-lime: #ebf7d2;
  --w-violet: #b8a6f2; --w-pink: #f5a6c2; --w-red: #f4a593; --w-sand: #e0c89a; --w-gold: #f2cf67; --w-blue: #9ec6f5; --w-slate: #b8c0cc; --w-amber: #f5c58a; --w-lime: #bfe08a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14151f; --surface: #1d1f2c; --surface-2: #232636; --ink: #eceef6; --muted: #a2a6ba; --line: #333749;
    --brand: #ff7a5c; --brand-2: #9b8cff; --chip: #2a2d3e; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    --studio-bg: #10131d; --corridor: #20263a; --corridor-line: #2b3350; --bubble: #fdfdfd; --bubble-line: #11131c;
    --f-violet: #3a3260; --f-pink: #4f2e40; --f-red: #4e2f2c; --f-sand: #47402f; --f-gold: #4d4426; --f-blue: #26395a; --f-slate: #333a48; --f-amber: #4a3b27; --f-lime: #36472a;
    --w-violet: #5b4c99; --w-pink: #87476a; --w-red: #874a3f; --w-sand: #7a6744; --w-gold: #8a7430; --w-blue: #36588e; --w-slate: #525c6f; --w-amber: #84603a; --w-lime: #557039;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14151f; --surface: #1d1f2c; --surface-2: #232636; --ink: #eceef6; --muted: #a2a6ba; --line: #333749;
  --brand: #ff7a5c; --brand-2: #9b8cff; --chip: #2a2d3e; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  --studio-bg: #10131d; --corridor: #20263a; --corridor-line: #2b3350; --bubble: #fdfdfd; --bubble-line: #11131c;
  --f-violet: #3a3260; --f-pink: #4f2e40; --f-red: #4e2f2c; --f-sand: #47402f; --f-gold: #4d4426; --f-blue: #26395a; --f-slate: #333a48; --f-amber: #4a3b27; --f-lime: #36472a;
  --w-violet: #5b4c99; --w-pink: #87476a; --w-red: #874a3f; --w-sand: #7a6744; --w-gold: #8a7430; --w-blue: #36588e; --w-slate: #525c6f; --w-amber: #84603a; --w-lime: #557039;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, .brand-name { font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; font-weight: 600; letter-spacing: .1px; }
code, pre, .prompt-text { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

#app { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100dvh; padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); gap: 10px; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: transform .12s, box-shadow .12s, background .12s; white-space: nowrap; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.big { padding: 11px 22px; font-size: 16px; }
.btn.icon { padding: 7px 11px; font-size: 18px; }
.btn.danger { color: var(--err); border-color: var(--err); }
.chip-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.chip-btn[aria-pressed="true"] { background: var(--brand-2); color: #fff; border-color: transparent; }
:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.brand-logo { font-size: 28px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-size: 20px; line-height: 1.1; }
.project-title { border: 0; background: none; padding: 0; text-align: left; color: var(--muted); cursor: pointer; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
.project-title:hover { color: var(--brand); }
.progress-pill { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 999px; padding: 5px 14px 5px 6px; box-shadow: var(--shadow); }
.ring { width: 36px; height: 36px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--chip); stroke-width: 4; }
.ring-fg { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .6s; }
.progress-text { display: flex; flex-direction: column; line-height: 1.15; }
.progress-text span { font-weight: 800; font-size: 14px; }
.progress-text small { color: var(--muted); font-size: 12px; }
.onair { font: 700 11px 'Fredoka', sans-serif; letter-spacing: 1px; padding: 3px 8px; border-radius: 6px; background: var(--chip); color: var(--muted); }
.onair.lit { background: #e03131; color: #fff; box-shadow: 0 0 12px #ff6b6b; animation: onair 1.6s ease-in-out infinite; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* command bar */
.command { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 6px; border: 2px dashed transparent; transition: border-color .15s; }
body.dragging .command { border-color: var(--brand-2); }
.command-row { display: flex; gap: 8px; align-items: flex-end; }
.command textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; background: var(--surface-2); min-height: 42px; max-height: 140px; }
.attach-btn { cursor: pointer; }
.cmd-hint { font-size: 12.5px; color: var(--muted); padding: 0 4px; }
.attach-row { display: flex; gap: 6px; flex-wrap: wrap; }
.attach-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 10px; padding: 3px 4px 3px 3px; font-size: 12.5px; max-width: 220px; }
.attach-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 7px; }
.attach-ico { width: 28px; height: 28px; display: grid; place-items: center; }
.attach-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: none; cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted); padding: 0 4px; }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 430px); gap: 10px; min-height: 0; }
.studio-wrap { position: relative; background: var(--studio-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); min-height: 300px; }
#studio { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#studio:active { cursor: grabbing; }
.hud { position: absolute; display: flex; gap: 6px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-tl { top: 10px; left: 10px; right: 50%; }
.hud-tr { top: 10px; right: 10px; flex-wrap: wrap; justify-content: flex-end; max-width: 55%; }
.hud-bl { bottom: 10px; left: 10px; right: 10px; }
.hud-stage { background: var(--surface); border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-card { position: absolute; left: 10px; bottom: 10px; width: min(340px, calc(100% - 20px)); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
.room-card .x { position: absolute; top: 6px; right: 6px; }
.rc-head { display: flex; gap: 10px; align-items: center; }
.rc-head > div { display: flex; flex-direction: column; }
.rc-head code { font-size: 11.5px; color: var(--brand-2); }
.rc-desc { font-size: 13px; color: var(--muted); margin: 8px 0; }
.rc-stages { display: flex; flex-wrap: wrap; gap: 6px; }

/* studio drawing */
.corridor { fill: var(--corridor); }
.corridor-line { stroke: var(--corridor-line); stroke-width: 1; }
.room-floor { cursor: pointer; }
.room-floor .floor { stroke: rgba(0,0,0,.08); stroke-width: 1.5; }
.room-floor .tile { stroke: rgba(0,0,0,.06); stroke-width: 1; }
.room-floor .floor-glow { fill: transparent; transition: fill .2s; }
.room-floor:hover .floor-glow { fill: rgba(255,255,255,.18); }
.f-violet .floor, .sign-bg.f-violet { fill: var(--f-violet); } .wall.f-violet { fill: var(--w-violet); }
.f-pink .floor, .sign-bg.f-pink { fill: var(--f-pink); } .wall.f-pink { fill: var(--w-pink); }
.f-red .floor, .sign-bg.f-red { fill: var(--f-red); } .wall.f-red { fill: var(--w-red); }
.f-sand .floor, .sign-bg.f-sand { fill: var(--f-sand); } .wall.f-sand { fill: var(--w-sand); }
.f-gold .floor, .sign-bg.f-gold { fill: var(--f-gold); } .wall.f-gold { fill: var(--w-gold); }
.f-blue .floor, .sign-bg.f-blue { fill: var(--f-blue); } .wall.f-blue { fill: var(--w-blue); }
.f-slate .floor, .sign-bg.f-slate { fill: var(--f-slate); } .wall.f-slate { fill: var(--w-slate); }
.f-amber .floor, .sign-bg.f-amber { fill: var(--f-amber); } .wall.f-amber { fill: var(--w-amber); }
.f-lime .floor, .sign-bg.f-lime { fill: var(--f-lime); } .wall.f-lime { fill: var(--w-lime); }
.wall-a { opacity: var(--wall-a); } .wall-b { opacity: var(--wall-b); }
.wall-cap { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 2.5; stroke-linecap: round; }
.sign { cursor: pointer; }
.sign-bg { stroke: rgba(0,0,0,.15); stroke-width: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
.sign-text { font: 600 12px 'Fredoka', sans-serif; fill: var(--ink); }
.spot-pool { fill: rgba(255, 236, 153, .45); }
.neon { fill: #f783ac; font-family: 'Fredoka', sans-serif; font-weight: 700; animation: neon 3s infinite; }
.robot { cursor: pointer; }
.robot .shadow { fill: rgba(0,0,0,.18); }
.robot .belly { dominant-baseline: middle; }
.zzz { opacity: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; fill: var(--muted); }
.st-off .zzz { opacity: 1; animation: zzz 2.4s ease-in-out infinite; }
.bubble .b-fill { fill: var(--bubble); }
.bubble .b-stroke { stroke: var(--bubble-line); stroke-width: 1.3; }
.bubble.thought .b-stroke { stroke-dasharray: 3 2; }
.bubble .b-text { font: 700 9.5px 'Nunito', sans-serif; fill: #23263a; }
.bubble.thought .b-text { font-style: italic; fill: #495057; }
.bubble-body { animation: pop .25s ease-out; transform-origin: 0 0; }
.particle { animation: floatUp 2.2s ease-out forwards; pointer-events: none; }

/* robot animation states (origins are in robot-local px) */
.robot .bob { animation: bob 2.8s ease-in-out infinite; }
.robot .arm-r { transform-origin: 12px -28px; }
.robot .arm-l { transform-origin: -12px -28px; }
.robot .head { transform-origin: 0 -36px; }
.robot .eye { transform-box: fill-box; transform-origin: center; animation: blinkEye 5s infinite; }
.robot .mouth { transform-box: fill-box; transform-origin: center; }
.robot .leg { transform-box: fill-box; transform-origin: center; }
.robot .antenna-ball { transform-box: fill-box; transform-origin: center; }
.st-walk .bob { animation: walkbob .34s ease-in-out infinite; }
.st-walk .leg-l { animation: legA .34s ease-in-out infinite; }
.st-walk .leg-r { animation: legB .34s ease-in-out infinite; }
.st-walk .arm-l { animation: swingA .34s ease-in-out infinite; }
.st-walk .arm-r { animation: swingB .34s ease-in-out infinite; }
.st-write .arm-r { animation: scribble .3s ease-in-out infinite alternate; }
.st-draw .arm-r { animation: scribble .18s ease-in-out infinite alternate; }
.st-draw .arm-l { animation: swingA 1.2s ease-in-out infinite; }
.st-write .eyes, .st-draw .eyes { transform: translate(0, 1.5px); }
.st-think .head { animation: tilt 1.8s ease-in-out infinite; }
.st-think .eyes { transform: translate(1.5px, -1.6px); }
.st-think .arm-l { transform: rotate(55deg); }
.st-write .antenna-ball, .st-think .antenna-ball, .st-draw .antenna-ball { animation: antenna .55s ease-in-out infinite alternate; }
.st-talk .mouth { animation: talk .2s ease-in-out infinite alternate; }
.st-talk .arm-l { animation: wave .5s ease-in-out infinite alternate; }
.st-listen .head { transform: rotate(-8deg); }
.st-happy .bob { animation: hop .5s ease-in-out 4; }
.st-happy .eye { transform: scaleY(.3); animation: none; }
.st-happy .arm-l, .st-happy .arm-r { transform: rotate(var(--r, 0)); }
.st-happy .arm-l { --r: 70deg; } .st-happy .arm-r { --r: -70deg; }
.st-off { opacity: .6; }
.st-off .eye { transform: scaleY(.15); animation: none; }
.st-off .bob { animation: none; }
.bounce-ball { transform-box: fill-box; transform-origin: center; animation: ballBounce .9s cubic-bezier(.5,0,.5,1) infinite; }
.rec-dot { animation: blinkDot 1.2s steps(2) infinite; }
.wand-star { animation: sparkle 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.fader { animation: fader 1.1s ease-in-out infinite alternate; }
.woofer { transform-box: fill-box; transform-origin: center; animation: woofer .5s ease-in-out infinite alternate; }
.screen-glow { animation: screen 3s ease-in-out infinite; }
.pulse { animation: blinkDot 1s steps(2) infinite; }
.dusty .antenna-ball { animation: blinkDot 1s steps(2) infinite; }
.crate.drop-in { animation: dropIn .6s cubic-bezier(.3,1.6,.6,1); }
.avatar { flex: none; overflow: visible; }
.avatar .bob, .avatar .eye { animation: none; }
.avatar .robot { cursor: default; }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
@keyframes walkbob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes legA { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes legB { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(0); } }
@keyframes swingA { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-18deg); } }
@keyframes swingB { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
@keyframes scribble { from { transform: rotate(-24deg); } to { transform: rotate(8deg); } }
@keyframes tilt { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
@keyframes antenna { from { transform: scale(1); fill-opacity: 1; } to { transform: scale(1.5); fill-opacity: .55; } }
@keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(2.6); } }
@keyframes wave { from { transform: rotate(10deg); } to { transform: rotate(60deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } }
@keyframes blinkEye { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
@keyframes zzz { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-4px); opacity: .4; } }
@keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-44px); opacity: 0; } }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes ballBounce { 0%, 100% { transform: translateY(0) scale(1.2, .8); } 50% { transform: translateY(-14px) scale(.9, 1.1); } }
@keyframes blinkDot { 50% { opacity: 0; } }
@keyframes sparkle { 0%, 100% { transform: scale(.8) rotate(0); } 50% { transform: scale(1.35) rotate(20deg); } }
@keyframes fader { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes woofer { from { transform: scale(1); } to { transform: scale(1.2); } }
@keyframes screen { 0%, 100% { fill: #4dabf7; } 33% { fill: #da77f2; } 66% { fill: #69db7c; } }
@keyframes neon { 0%, 92%, 100% { opacity: 1; } 94% { opacity: .3; } 96% { opacity: 1; } 98% { opacity: .4; } }
@keyframes onair { 50% { box-shadow: 0 0 2px #ff6b6b; } }
@keyframes dropIn { from { transform: translateY(-60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* side panel */
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); }
.tab { flex: 1; border: 0; background: none; padding: 8px 6px 10px; font-weight: 800; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0; }
.tab.active { color: var(--ink); border-bottom-color: var(--brand); }
.tab-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chat-tools { padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13.5px; }
.chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msg { display: flex; gap: 8px; align-items: flex-start; max-width: 100%; }
.msg.me { justify-content: flex-end; }
.msg-body { background: var(--surface-2); border-radius: 14px 14px 14px 4px; padding: 7px 11px; max-width: 86%; overflow-wrap: anywhere; }
.msg.me .msg-body { background: var(--brand-2); color: #fff; border-radius: 14px 14px 4px 14px; }
.msg.err .msg-body { border: 1px solid var(--err); }
.msg-name { font: 600 12.5px 'Fredoka', sans-serif; color: var(--brand-2); }
.msg-name .to { color: var(--muted); font-weight: 500; }
.msg.team { opacity: .85; }
.msg.team .msg-body { background: transparent; border: 1px dashed var(--line); padding: 4px 9px; font-size: 13px; }
body.hide-team .msg.team { display: none; }
.msg-text { font-size: 14px; }
.msg .btn { margin-top: 6px; }
.quick-row { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 42px; }
.review-card { border-top: 2px solid var(--brand); padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; max-height: 55%; overflow-y: auto; }
.review-head { display: flex; gap: 8px; align-items: center; }
.review-head > div { display: flex; flex-direction: column; }
.review-head small { color: var(--muted); }
.review-excerpt { font-size: 13px; color: var(--muted); white-space: pre-line; max-height: 110px; overflow: hidden; mask-image: linear-gradient(#000 70%, transparent); -webkit-mask-image: linear-gradient(#000 70%, transparent); }
.review-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.review-card textarea { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--surface); resize: vertical; }

.preview-bar { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.preview-bar select { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--surface-2); }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg-btn { border: 0; background: none; padding: 4px 10px; border-radius: 999px; font-weight: 800; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.preview { flex: 1; overflow-y: auto; padding: 12px 14px 20px; }
.doc-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; position: sticky; top: -12px; background: var(--surface); padding: 6px 0; z-index: 1; }
.doc-head > div:nth-child(2) { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.doc-head small { color: var(--muted); }
.doc { font-size: 14px; overflow-wrap: anywhere; }
.doc.live::after { content: '▍'; animation: blinkDot .8s steps(2) infinite; color: var(--brand); }
.doc h2, .doc h3 { margin: 1.1em 0 .4em; line-height: 1.25; }
.doc h2 { font-size: 20px; } .doc h3 { font-size: 17px; } .doc h4, .doc h5, .doc h6 { font-size: 15px; margin: 1em 0 .3em; }
.doc p { margin: .5em 0; }
.doc ul, .doc ol { padding-left: 1.3em; margin: .4em 0; }
.doc blockquote { margin: .6em 0; padding: 4px 12px; border-left: 4px solid var(--brand-2); background: var(--surface-2); border-radius: 0 8px 8px 0; }
.doc hr { border: 0; border-top: 1px dashed var(--line); margin: 1.2em 0; }
.doc code { background: var(--chip); padding: 1px 5px; border-radius: 5px; }
.codeblock { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: .6em 0; }
.code-head { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px; background: var(--chip); font-size: 12px; color: var(--muted); }
.copy-btn { border: 0; background: none; cursor: pointer; font-weight: 800; color: var(--brand-2); }
.codeblock pre { margin: 0; padding: 10px; overflow-x: auto; background: var(--surface-2); max-height: 420px; }
.table-wrap { overflow-x: auto; margin: .6em 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 800; }
.marker { font: 700 10.5px 'Fredoka', sans-serif; letter-spacing: .4px; padding: 1px 6px; border-radius: 5px; background: var(--chip); }
.m-MISSING, .m-CONFLICT { background: #ffe3e3; color: #c92a2a; }
.m-OPEN-QUESTION { background: #fff3bf; color: #a35d00; }
.m-ASSUMPTION { background: #e7f5ff; color: #1864ab; }
.m-PROPOSAL { background: #f3f0ff; color: #5f3dc4; }
.task .box { margin-right: 4px; }
.md-svg svg, .sketch svg { width: 100%; height: auto; display: block; background: #fff; border-radius: 8px; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.empty-ico { font-size: 40px; }
.empty b { display: block; color: var(--ink); font-size: 16px; }

/* boards */
.board { display: flex; flex-direction: column; gap: 10px; }
.board-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.board h3 { margin: 0; }
.lead { font-size: 15.5px; font-weight: 700; margin: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card p { margin: 0; font-size: 13.5px; }
.card small { color: var(--muted); }
.tag { font: 600 11px 'JetBrains Mono', monospace; background: var(--chip); padding: 1px 6px; border-radius: 6px; align-self: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.beats { display: flex; flex-direction: column; gap: 6px; }
.beat { display: grid; grid-template-columns: 28px 1fr; column-gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 7px 9px; }
.beat-n { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; background: var(--brand-2); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.beat p { margin: 0; font-size: 13.5px; }
.dots { display: flex; gap: 4px; }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
.lock { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; position: relative; }
.lock > span { font: 700 10.5px 'Fredoka', sans-serif; text-transform: uppercase; letter-spacing: .5px; color: var(--brand-2); }
.lock > .btn { position: absolute; top: 2px; right: 2px; }
.lock p { font-size: 13px; margin: 2px 0 0; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.swatch { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.swatch .sw { height: 54px; border-radius: 10px; background: var(--c); border: 1px solid rgba(0,0,0,.12); }
.swatch small { color: var(--muted); }
.sect h4 { margin: 4px 0; }
.sect ul { margin: 0; padding-left: 1.2em; font-size: 13.5px; }
details.shot { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
details.shot summary { cursor: pointer; font-weight: 700; }
details.shot > * + * { margin-top: 6px; }
.sb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.sb-panel { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.sb-panel figcaption { font-size: 12.5px; }
.sb-panel q { display: block; color: var(--muted); }
.sb-panel .sketch svg, .ph-panel { border: 2px solid var(--ink); border-radius: 6px; }
.ph-panel { aspect-ratio: 16 / 9; background: linear-gradient(135deg, var(--a), var(--b)); border-radius: 6px; position: relative; display: flex; align-items: flex-end; padding: 6px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 12px; overflow: hidden; }
.ar-9-16 .ph-panel { aspect-ratio: 9 / 16; } .ar-1-1 .ph-panel { aspect-ratio: 1; } .ar-2-39-1 .ph-panel { aspect-ratio: 2.39; } .ar-4-5 .ph-panel { aspect-ratio: 4 / 5; }
.ph-size { position: absolute; top: 6px; left: 6px; font: 700 11px 'Fredoka', sans-serif; background: rgba(0,0,0,.35); padding: 1px 6px; border-radius: 5px; }
.timeline { display: flex; height: 38px; border-radius: 8px; overflow: hidden; gap: 2px; }
.tl-clip { background: hsl(var(--h) 70% 62%); color: #fff; font: 700 10px 'JetBrains Mono', monospace; display: grid; place-items: center; overflow: hidden; min-width: 0; }
.vline { display: flex; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 6px 8px; }
.vline p { margin: 2px 0; }
.prompt-text { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 4px 0; max-height: 180px; overflow-y: auto; }
.prompt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.gen-out { display: flex; flex-direction: column; gap: 6px; }
.gen-img { max-width: 100%; border-radius: 10px; }
.verdict { font: 700 18px 'Fredoka', sans-serif; padding: 8px 12px; border-radius: 12px; }
.verdict.ok { background: #d3f9d8; color: #2b8a3e; }
.verdict.warn { background: #fff3bf; color: #a35d00; }

/* animatic */
.anim-stage { position: relative; aspect-ratio: 16 / 9; background: #111; border-radius: 12px; overflow: hidden; display: grid; }
.anim-stage.ar-9-16 { aspect-ratio: 9 / 16; max-height: 60vh; margin: 0 auto; } .anim-stage.ar-1-1 { aspect-ratio: 1; } .anim-stage.ar-2-39-1 { aspect-ratio: 2.39; } .anim-stage.ar-4-5 { aspect-ratio: 4 / 5; }
.anim-stage > .sketch, .anim-stage > .ph-panel { width: 100%; height: 100%; border: 0; border-radius: 0; animation: kenburns 6s ease-out; }
.anim-stage .sketch svg { height: 100%; border-radius: 0; }
.anim-sub { position: absolute; bottom: 8%; left: 6%; right: 6%; text-align: center; color: #fff; font-weight: 800; text-shadow: 0 2px 4px #000, 0 0 2px #000; }
.anim-id { position: absolute; top: 8px; right: 10px; font: 600 11px 'JetBrains Mono', monospace; color: #fff; background: rgba(0,0,0,.45); padding: 1px 6px; border-radius: 5px; }
.anim-bar { height: 5px; background: var(--chip); border-radius: 3px; margin: 8px 0; position: relative; overflow: hidden; }
.anim-bar::after { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: var(--brand); transition: width .3s; }
.anim-cap { font-size: 13.5px; color: var(--muted); min-height: 2.6em; }
.anim-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
@keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1); } }

/* pipeline */
.run-controls { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; border-bottom: 1px solid var(--line); }
.run-controls select { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; background: var(--surface-2); min-width: 0; max-width: 100%; }
.pipeline { list-style: none; margin: 0; padding: 6px 8px 16px; overflow-y: auto; flex: 1; }
.pl-row { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 12px; }
.pl-row + .pl-row { border-top: 1px dashed var(--line); }
.pl-n { width: 20px; text-align: right; color: var(--muted); font-size: 12px; font-weight: 800; }
.pl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pl-main small { color: var(--muted); }
.err-txt { color: var(--err) !important; }
.pl-act { display: flex; gap: 2px; }
.s-working { background: color-mix(in srgb, var(--warn) 12%, transparent); }
.s-review { background: color-mix(in srgb, var(--info) 12%, transparent); }
.s-error { background: color-mix(in srgb, var(--err) 12%, transparent); }
.s-off { opacity: .5; }
.empty-li { color: var(--muted); padding: 20px; text-align: center; }

/* tracker */
.tracker { display: flex; gap: 0; overflow-x: auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px 10px; align-items: center; scrollbar-width: thin; }
.trk { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; cursor: pointer; padding: 0 4px; width: 84px; flex: none; color: var(--muted); }
.trk-ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); font-size: 16px; border: 2px solid transparent; z-index: 1; transition: transform .2s; }
.trk-t { font-size: 11px; font-weight: 800; white-space: nowrap; max-width: 80px; overflow: hidden; text-overflow: ellipsis; }
.trk-line { position: absolute; top: 16px; left: calc(50% + 17px); width: calc(100% - 34px); height: 3px; background: var(--chip); }
.trk.s-done .trk-ico { background: #d3f9d8; border-color: var(--ok); }
.trk.s-done .trk-line { background: var(--ok); }
.trk.s-done { color: var(--ink); }
.trk.s-working .trk-ico { background: #fff3bf; border-color: var(--warn); transform: scale(1.15); animation: wiggle 1s ease-in-out infinite; }
.trk.s-working { color: var(--ink); }
.trk.s-review .trk-ico { background: #d0ebff; border-color: var(--info); transform: scale(1.15); }
.trk.s-error .trk-ico { background: #ffe3e3; border-color: var(--err); }
.trk.s-stale .trk-ico { background: #ffe8cc; border-color: var(--warn); border-style: dashed; }
.trk.s-skipped { opacity: .45; }
@keyframes wiggle { 0%, 100% { transform: scale(1.15) rotate(-6deg); } 50% { transform: scale(1.15) rotate(6deg); } }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(20, 21, 31, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 18px 20px; animation: pop .2s ease-out; }
.modal.wide { width: min(820px, 100%); }
.modal h2 { margin: 0 0 4px; }
.modal input[type=text], .modal textarea, .modal select { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; background: var(--surface-2); }
.wiz-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.wiz-head p { margin: 0; }
.wiz-steps { display: flex; list-style: none; padding: 0; margin: 0 0 14px; gap: 6px; flex-wrap: wrap; }
.wiz-steps li { flex: 1; text-align: center; padding: 6px 4px; border-radius: 999px; background: var(--chip); font-weight: 800; font-size: 13px; color: var(--muted); cursor: pointer; min-width: 80px; }
.wiz-steps li.on { background: var(--brand); color: #fff; }
.wiz-steps li.done { background: #d3f9d8; color: #2b8a3e; }
.wiz-body { display: flex; flex-direction: column; gap: 12px; }
.wiz-body h4 { margin: 6px 0 0; }
.wiz-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-weight: 800; font-size: 13.5px; }
.field-hint { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dice-row { display: flex; gap: 6px; flex-wrap: wrap; }
.wiz-uploads { font-size: 13px; color: var(--muted); }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.choice { text-align: left; border: 2px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 9px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; transition: border-color .12s, transform .12s; }
.choice:hover { transform: translateY(-1px); }
.choice.on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, var(--surface)); }
.choice small { color: var(--muted); font-size: 12px; }
.crew-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.crew-card { position: relative; border: 2px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; opacity: .55; filter: grayscale(.7); transition: all .15s; }
.crew-card.on { opacity: 1; filter: none; border-color: var(--ok); }
.crew-card.locked { border-color: var(--brand); cursor: default; }
.crew-card b { font-size: 13px; line-height: 1.2; }
.crew-card small { font-size: 11px; color: var(--muted); line-height: 1.2; }
.crew-check { position: absolute; top: 4px; right: 6px; font-weight: 900; color: var(--ok); }
.gate-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 10px; background: var(--surface-2); border-radius: 12px; padding: 10px; }
.gate-list b { grid-column: 1 / -1; }
.fineprint { font-size: 12px; color: var(--muted); margin: 0; }
.proj-list { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
.proj-list li { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
.proj-list li > div:first-child { display: flex; flex-direction: column; min-width: 0; }
.proj-list small { color: var(--muted); }
.row { display: flex; gap: 6px; }
.export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 10px; }
.export-item { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 34px 1fr; column-gap: 8px; }
.export-item:disabled { opacity: .45; cursor: not-allowed; }
.export-item:hover:not(:disabled) { border-color: var(--brand); }
.ex-ico { grid-row: span 2; font-size: 24px; }
.export-item small { color: var(--muted); }
.issue-list { padding-left: 1em; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 800; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.sr-copy { position: fixed; left: -9999px; }

/* phone and tablet */
@media (max-width: 960px) {
  #app { height: auto; min-height: 100dvh; grid-template-rows: auto auto auto auto; }
  .layout { grid-template-columns: 1fr; }
  .studio-wrap { height: 46vh; min-height: 280px; }
  .panel { height: 72vh; }
  .hide-sm { display: none; }
  .hud-tl { right: 10px; top: 52px; }
  .hud-tr { max-width: 100%; }
}
@media (max-width: 560px) {
  .grid2 { grid-template-columns: 1fr; }
  .progress-pill { order: 3; width: 100%; }
  .brand-name { font-size: 18px; }
  .project-title { max-width: 60vw; }
  .cmd-hint { display: none; }
  .modal { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ===== v2: pages, 3D stage, lobby, screening, keys ===== */
#app { grid-template-rows: auto auto minmax(0, 1fr) auto; }
.nav { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 999px; box-shadow: var(--shadow); flex-wrap: wrap; }
.nav-btn { border: 0; background: none; padding: 7px 12px; border-radius: 999px; font-weight: 800; cursor: pointer; color: var(--muted); position: relative; white-space: nowrap; }
.nav-btn.on { background: var(--ink); color: var(--bg); }
.nav-btn .badge { position: absolute; top: -2px; right: -2px; background: var(--brand); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 5px; }
.command { padding: 8px 10px; }
.pages { min-height: 0; position: relative; }
.page { height: 100%; min-height: 0; overflow-y: auto; }
#page-cabin, #page-studio { overflow: hidden; }
.cabin { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 10px; height: 100%; }
.slot { position: relative; background: #1b1e2b; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); min-height: 320px; height: 100%; }
.stage3d { position: fixed; left: -9999px; top: 0; width: 640px; height: 360px; }
.slot .stage3d { position: absolute; inset: 0; left: 0; width: auto; height: auto; }
.world-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
.studio2d { width: 100%; height: 100%; display: block; background: var(--studio-bg); }
.slot .hud { z-index: 3; }
.hint { background: rgba(0,0,0,.55); color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.w-overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.w-tag { position: absolute; left: 0; top: 0; background: rgba(35,38,58,.78); color: #fff; font: 700 11px Fredoka, sans-serif; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.w-bubble { position: absolute; left: 0; top: 0; max-width: 230px; background: #fff; color: #23263a; border: 2px solid #23263a; border-radius: 14px; padding: 5px 10px; font: 700 12.5px/1.3 Nunito, sans-serif; box-shadow: 0 3px 10px rgba(0,0,0,.25); animation: pop .2s ease-out; }
.w-bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; background: #fff; border-right: 2px solid #23263a; border-bottom: 2px solid #23263a; transform: translateX(-50%) rotate(45deg); }
.w-bubble.thought { border-style: dashed; font-style: italic; color: #495057; border-radius: 22px; }
.w-bubble.thought::after { width: 8px; height: 8px; border-radius: 50%; border: 2px dashed #23263a; bottom: -12px; transform: translateX(-50%); }
.w-flash { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 2; }
.w-flash.flash { animation: cutflash .35s ease-out; }
@keyframes cutflash { 0% { opacity: .55; } 100% { opacity: 0; } }
.chat-panel .chat-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; }
.cam-bar { gap: 6px; align-items: center; }
.cam-btn { border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; cursor: pointer; background: rgba(255,255,255,.92); color: #23263a; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.cam-btn.on { background: var(--brand-2); color: #fff; }
.cam-bar select { border-radius: 999px; border: 0; padding: 6px 10px; font-weight: 700; max-width: 220px; background: rgba(255,255,255,.92); color: #23263a; }
.live-box { position: absolute; left: 10px; bottom: 10px; width: min(380px, calc(100% - 20px)); background: rgba(255,255,255,.95); color: #23263a; border-radius: 14px; padding: 8px 10px; z-index: 3; box-shadow: var(--shadow); }
.live-head { display: flex; gap: 6px; align-items: center; }
.live-head b { flex: 1; font-size: 13px; }
.live-text { font: 12px/1.45 'JetBrains Mono', monospace; color: #495057; max-height: 5.8em; overflow: hidden; margin-top: 4px; }
.room-card { z-index: 4; left: auto; right: 10px; bottom: 10px; }
.slot.big { height: 100%; }
/* lobby */
.lobby { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; padding-bottom: 12px; }
.lobby .hero { grid-column: 1 / -1; display: flex; gap: 16px; align-items: center; background: linear-gradient(120deg, color-mix(in srgb, var(--brand-2) 18%, var(--surface)), color-mix(in srgb, var(--brand) 14%, var(--surface))); border-radius: var(--radius); padding: 14px 18px; }
.lobby .hero h1 { margin: 0; font-size: 28px; }
.lobby .hero p { margin: 4px 0 0; color: var(--muted); }
.card.newfilm { grid-row: span 2; }

<script type="application/json" id="skillData">{"skills": {"action-director": {"description": "Designs action sequences for AI film like a fight coordinator and second-unit action director — the story of the fight or chase, geography on the set plan, move-by-move choreography in phrases (action, reaction, consequence), momentum swings, character-specific fighting styles, impacts and reactions, chase routes and obstacles, injuries and damage for continuity, and a mapping of every phrase to short, generatable shots with clear screen direction. Use when a scene contains a fight, brawl, martial arts, sword or weapon combat, chase, escape, stunt, fall, crash or other physical set piece, or when the user asks for fight choreography, action design, a chase sequence or stunt planning.", "body": "# Action Director\n\nYou design the action inside the film-director's plan for a scene. You own the choreography: who does\nwhat to whom, move by move, where in the space, and how each move reads on camera. The film-director keeps\nthe scene's purpose, the overall shot slots and the final say on coverage; the cinematographer sets lenses\nand light; the script supervisor tracks injuries and damage you create.\n\n## Inputs\n- `06_direction/SC<NN>_direction.md` (the director's analysis, beats, shot slots for the action).\n- Character bibles: build, height, skills, costume (what it allows), existing injuries.\n- Location file: floor plan, landmarks, hazards and usable objects.\n- Brief: rating/audience (violence level), medium, target video tools.\n\n## Outputs\n`06_direction/SC<NN>_action.md` ([templates/action-plan-template.md](templates/action-plan-template.md)):\n1. Story of the action: objectives, stakes, phases, who has momentum when, the turn.\n2. Geography: positions and travel on the floor plan per phase, axis and screen direction.\n3. Choreography: numbered phrases, each move written as action → reaction → consequence.\n4. Shot mapping: each phrase assigned to shots (with the director's IDs or proposed new IDs).\n5. Continuity output: injuries, damage, dirt, broken props, lost items — with the shot where each starts.\n6. AI-execution notes: risks per shot and how the choreography avoids them.\n\n## Workflow\n\n```\nAction progress:\n- [ ] 1 Purpose: what the action changes in the story\n- [ ] 2 Characters in action: style, skill, limits\n- [ ] 3 Phases and momentum\n- [ ] 4 Geography on the plan\n- [ ] 5 Choreography phrases\n- [ ] 6 Shot mapping\n- [ ] 7 AI-feasibility pass\n- [ ] 8 Continuity output; handoff\n```\n\n**1 Purpose.** An action scene is a scene: name the objective (escape, retrieve, protect, prove), the\nstakes, and the turn. Write the action's story in three sentences before any move.\n\n**2 Characters in action.** Each character fights or moves the way they are: trained and economical,\ndesperate and improvising, brutal, playful. Derive it from the character bible and story; note physical\nlimits (size, injury, costume). See [references/fight-choreography.md](references/fight-choreography.md).\n\n**3 Phases and momentum.** Split into 3-5 phases (opening, escalation, reversal, climax, resolution).\nMomentum must swing at least once; the protagonist should be losing before the turn. Each phase ends\nwith a changed situation.\n\n**4 Geography.** Place every phase on the floor plan with direction of travel and landmarks in view. Keep\none screen direction for each character's movement (or motivate the reversal). The audience must always\nknow where the exits, the threat and the goal are.\n\n**5 Choreography.** Write numbered phrases of 2-5 moves. Each move: who, body part and direction (\"Maya's\nright forearm blocks Rook's overhand swing at head height\"), contact or near-miss, the reaction, the\nconsequence for position or advantage, and tempo (fast/slow/hold). Use the environment (railings, laundry\nlines, doors) at least once per phase. Keep violence within the brief's rating; no gore unless the brief\nallows it. For chases and stunts use [references/chases-and-set-pieces.md](references/chases-and-set-pieces.md).\n\n**6 Shot mapping.** Map phrases to shots: wide for geography and full-body moves, medium for exchanges,\nclose/insert for impacts and decisions, reactions to show cost. Cut on action (the start of a move in one\nshot, the completion in the next). Each shot carries one move or one short phrase.\n\n**7 AI-feasibility pass.** Current video models struggle with tangled limbs, rapid multiple contacts,\nconsistent hands on weapons and fast spins. Prefer: one decisive move per clip (2-4 s), clear silhouettes,\nmoves along the camera's horizontal plane, impacts sold by reaction and cut rather than contact detail,\nand motion-reference video where the user's tool supports it (check the tool profile). Mark each shot's risk.\n\n**8 Continuity and handoff.** List every injury, tear, dirt mark, lost or broken object with the shot where\nit begins, for the script supervisor. Return proposed shot additions or removals to the film-director as\n`PROPOSAL:` with reasons.\n\n## Boundaries\n- Do not change the scene's outcome, who wins, or story events — those are the screenplay's.\n- Do not override the director's coverage plan; propose changes.\n- Do not exceed the violence level in the brief; no graphic injury detail without it.\n- Do not design moves that contradict a character's established abilities or limits without a story reason.\n- For live-action shoots, this plan is not a safety plan: real stunts need a qualified stunt coordinator.\n\n## Quality checks\n- Every move has cause and effect; no move happens \"because choreography\".\n- Momentum swings at least once; the turn matches the director's beat map.\n- Geography: every phase placed on the plan; screen direction consistent; landmarks named.\n- Every phrase maps to shots; every shot has ≤ 1 decisive move or one short phrase and an end state.\n- Every injury/damage has a continuity entry with its starting shot.\n- Durations of  or right, jump or hide) that reveals\n  character.\n- **Near misses** escalate; the final segment contains the biggest risk (the jump).\n- **Screen direction:** pursuer and pursued travel the same screen direction; cutting between them with\n  opposite directions reads as running toward each other.\n- **Ending:** capture, escape, or reversal (the pursued turns on the pursuer). It must change the story.\n\n## 2. Falls, jumps and stunts\n- Break into: preparation (look, decision), commitment (the run-up/launch), the air/peak (often the hero\n  shot), the landing, the aftermath (pain, cost). Each is its own shot for AI production.\n- State the distances and heights from the floor plan (a 1.5 m gap between roofs) so the move is plausible.\n- The landing reaction tells the audience how hard it was.\n\n## 3. Vehicles\n- Vehicle identity is a prop record (make it generic, distinctive color/shape, no real trademarks).\n- Specify direction of travel on screen and keep it consistent.\n- Interior shots (driver reactions) are cheaper and more reliable than complex exterior stunts.\n\n## 4. Destruction and effects\n- Every broken object becomes a new prop state; debris persists in later shots.\n- Fire, smoke, water, glass shattering: flag for vfx-supervisor (generate as separate elements or rely on\n  the model, depending on the tool).\n\n## 5. Shot patterns\n| Pattern | Use |\n|---|---|\n| Wide → medium → insert → reaction | standard readable exchange |\n| Point of view of the pursued looking back | gap and threat |\n| Low angle on the launch, high angle on the drop | height and danger |\n| Static camera, subject crosses frame | clean, AI-friendly speed |\n| Tracking alongside (truck) | sustained running; keep short for AI |\n", "references/fight-choreography.md": "# Fight Choreography\n\n## Contents\n1. The story inside a fight\n2. Fighting styles from character\n3. Phrase notation\n4. Impacts and reactions\n5. Weapons and props\n6. Readability on camera\n7. AI-execution notes\n\n## 1. The story inside a fight\nA fight is a conversation in which each move is a line. It has objectives, tactics that fail and change, a\nturn and a cost. Professional action designers plan it before the shoot through previs or \"stuntvis\" (video\nof the choreography shot and cut before production), so the director can approve the action as a cut\nsequence — this plan is the written equivalent.\n\n## 2. Fighting styles from character\n| Character type | Style | Tells |\n|---|---|---|\n| Trained professional | economical, few wasted moves, controls distance | calm breathing, finishes quickly |\n| Desperate amateur | wild swings, grabs, uses whatever is near | off-balance, eyes on the exit |\n| Brawler | power over precision, absorbs hits | advances, crowds the opponent |\n| Small and fast | evasion, uses environment, hits and runs | changes levels, keeps moving |\n| Reluctant | defends, tries to end it, hesitates at the finishing move | looks away after hitting |\nA style can change during the fight; that change is often the character's arc in miniature.\n\n## 3. Phrase notation\nWrite in numbered phrases; each phrase is a short exchange that ends with a changed situation.\n\n```\nP3 (escalation, momentum: Rook)  ~4 s\n 3.1 Rook steps in, right hook at Maya's head.\n     → Maya ducks under it (level change), stumbling back two steps toward the parapet.\n     ⇒ She is now cornered, parapet behind her.\n 3.2 Rook grabs the strap of her messenger bag with his left hand, yanks her toward him.\n     → Maya lets the bag strap slide off her shoulder; she spins free, out of frame left.\n     ⇒ Rook holds the empty bag; Maya has space but lost the bag.\n```\n`→` reaction, `⇒` consequence. Directions are the character's own left/right; add screen direction when it\nmatters (\"exits frame left\").\n\n## 4. Impacts and reactions\n- The reaction sells the hit: head snaps, body folds, a step back, a breath out, a stumble into scenery.\n- Escalate damage: early hits glance off; later ones cost. Exhaustion shows (slower guards, heavy breathing).\n- For lower ratings: cut on the impact, show the reaction or the aftermath (a fallen object, the winner's\n  hand shaking).\n\n## 5. Weapons and props\n- State the weapon's grip hand and where it is when not in use; weapon swaps are continuity events.\n- Environmental props: anything the location has can be used (laundry line, chair, door); check with the\n  production-designer's set dressing; breaking a prop creates a new prop state.\n\n## 6. Readability on camera\n- Geography first: open each phase with a shot that shows both fighters and the space.\n- Keep the camera on one side of the line of action; cross only with a visible move.\n- One idea per shot: an attack, a reaction, a decision.\n- Cut on action: the start of a move ends one shot, its completion opens the next.\n- Vary rhythm: a flurry, then a breath (hold), then a decisive move.\n- Show the eyes before key decisions (the moment a character chooses to fight or flee).\n\n## 7. AI-execution notes\nCurrent video models (as reported by practitioners; varies by tool) tend to fail on: limbs passing through\neach other, extra or missing fingers on grips, weapons changing hands or vanishing, fast spins scrambling\nidentity, more than one contact per second. Design around it:\n- 2-4 s clips with one decisive move; reactions in their own shots.\n- Moves across the frame (lateral) read better than moves toward or away from camera.\n- Silhouettes separated (fighters not overlapping in frame) except at the moment of contact.\n- Use speed changes (slow-motion on the decisive move) to give the model fewer frames of complex motion.\n- If the tool supports motion reference (a reference video of the move) or start/end frames, use them for\n  the hardest moves; describe the end pose precisely.\n", "templates/action-plan-template.md": "---\nartifact: action-plan\nid: SC<NN>_action\nversion: 1\nstatus: DRAFT\nowner: action-director\ndepends_on: [SC<NN>_direction@N, CH-<SLUG>@N, LOC-<SLUG>@N]\nupdated: YYYY-MM-DD\n---\n# SC<NN> Action Plan — <name of the sequence>\n\n## Story of the action\n- Objective(s):\n- Stakes:\n- Turn:\n- Rating / violence level:\n\n## Characters in action\n| Character | Style | Limits | How the style changes |\n|---|---|---|---|\n\n## Phases\n| Phase | Momentum | Situation at end | Est. s |\n|---|---|---|---|\n\n## Geography\nFloor plan reference: <LOC-...>. Positions and travel per phase; axis; screen direction; landmarks in view.\n\n## Choreography\nP1 (<phase>, momentum: <who>) ~<n> s\n 1.1 <who does what> → <reaction> ⇒ <consequence>\n\n## Shot mapping\n| Phrase/move | Shot ID | Size | Angle | Move | End state | Risk | Mitigation |\n|---|---|---|---|---|---|---|---|\n\n## Continuity output\n| Item | Description | Starts at shot |\n|---|---|---|\n\n## Proposals to the director\n- PROPOSAL: ...\n\n## Handoff\n- Produced:\n- Next: film-director (approve), cinematographer, script-supervisor\n"}}, "animation-director": {"description": "Directs animated films and AI animation the way an animation director and lead animator do — acting choices that show a character's thought process, key poses (extremes) and breakdowns with readable silhouettes and lines of action, timing charts in frames, holds, anticipation, follow-through, squash and stretch and the other principles of animation, lip-sync accents, style rules (frame-rate feel, on-model limits) and start/end pose frames for AI video generation. Works for 2D, 3D, stop-motion, anime and stylized AI animation. Use when the film or a scene is animated, or the user asks for animation acting, key poses, pose sheets, timing, exposure sheets, lip-sync planning or \"make it feel animated\".", "body": "# Animation Director\n\nYou direct performance and motion for animated work inside the film-director's plan. The film-director\nowns the scene's purpose, blocking and shot list; you own how the characters act and move in each shot:\nkey poses, timing, holds, motion principles, lip-sync emphasis and the style of motion. You keep every\npose on-model with the character-designer's sheets.\n\n## Inputs\n- `06_direction/SC<NN>_direction.md` (beats, blocking, shot list with durations).\n- Character bibles and model sheets (proportions, construction, expression system, allowed squash/stretch).\n- Style bible (medium, frame-rate feel, rendering).\n- Voice tracks or line timings if available (for lip-sync); otherwise screenplay lines with estimated timing.\n- Brief: frame rate (default 24 fps), target tools.\n\n## Outputs\n`06_direction/SC<NN>_animation.md` ([templates/animation-plan-template.md](templates/animation-plan-template.md)):\n1. Motion style rules for the scene (frame-rate feel, exaggeration level, squash/stretch limits).\n2. Per shot: acting beats (thought → decision → action), key poses with frame numbers, breakdowns where they\n   matter, holds, principle notes, timing chart, lip-sync accents, end pose.\n3. Start-pose and end-pose descriptions written as frame text for AI keyframes (start_frame/end_frame input).\n4. Off-model risks and how to avoid them.\n\n## Workflow\n\n```\nAnimation progress (per scene):\n- [ ] 1 Read the scene: beats, shot list, model sheets, voice timing\n- [ ] 2 Motion style rules\n- [ ] 3 Acting pass: thought process per beat\n- [ ] 4 Key poses per shot (silhouette, line of action)\n- [ ] 5 Timing charts (frames), holds, spacing\n- [ ] 6 Principles pass\n- [ ] 7 Lip-sync accents\n- [ ] 8 AI keyframe poses; on-model check; handoff\n```\n\n**1 Read.** Note each shot's duration in frames (seconds × fps) and what must happen. Read the model\nsheets: construction, proportions, expression shapes; these limit the poses.\n\n**2 Style rules.** State: frame-rate feel (full animation on ones, \"on twos\" 12 drawings/s, limited animation\non threes/holds for anime or cut-out), exaggeration level (realistic / cartoony / extreme), squash and stretch\nallowance (volume preserved; how far), and what never deforms (faces of realistic characters, logos, rigid props).\n\n**3 Acting.** For each beat: what the character thinks, the visible moment of decision, then the action.\nGood animation acting shows the change of mind: eyes move first, then head, then body. Choose one strong\naction per beat. See [references/animation-acting.md](references/animation-acting.md).\n\n**4 Key poses.** For each shot, define the extremes: the storytelling poses that read in silhouette, with a\nclear line of action. Number them with their frame (e.g. K1 @ f1, K2 @ f14). Describe each pose\nconcretely: weight distribution, spine curve, head tilt, arms and hands, eyes and eyebrows, mouth shape.\n\n**5 Timing.** Write a timing chart per shot: keys, breakdowns, holds (moving holds keep slight motion),\nease-in/ease-out (slow in, slow out), number of frames between keys. Fast actions have few frames; weight\nand hesitation have more. Shot duration must equal the sum.\n\n**6 Principles pass.** Check each shot against the twelve principles (Thomas and Johnston, *The Illusion of\nLife*, 1981) as listed in [references/principles-and-timing.md](references/principles-and-timing.md):\nanticipation before major moves, follow-through and overlapping action on hair, clothes and tails, arcs,\nsecondary action that supports (not distracts), exaggeration within the style rules, appeal.\n\n**7 Lip-sync.** Mark the accented syllables and mouth shapes at their frames; open vowels and closed\nconsonants (M, B, P) matter most. In stylized work, mouth shapes from the model sheet's mouth chart only.\nMouth movement can lead the sound by a frame or two to read as in sync — check with the editor's frame rate.\n\n**8 AI keyframes and handoff.** For each shot, write the start pose and end pose as standalone frame text\n(character lock reference + pose + expression + position in frame) for the production-manager to compile\ninto start_frame/end_frame. Flag poses at risk of going off-model (extreme stretch, foreshortened hands,\nprofile views not on the sheet). End with the handoff.\n\n## Boundaries\n- Do not change the director's shots, sizes, blocking or durations; propose changes.\n- Do not redesign characters; poses must stay within the model sheet (request new sheet views if needed).\n- Do not change the dialogue; if timing doesn't fit, raise it with the film-editor and voice-director.\n- Do not apply cartoony exaggeration to a style that is defined as realistic.\n\n## Quality checks\n- Every shot has key poses with frame numbers; timing sums to the shot's frame count.\n- Every key pose reads in silhouette and has a line of action.\n- Every major move has anticipation; every stop has follow-through/settle on loose parts.\n- Thought process visible at each decision (eyes lead).\n- Lip-sync accents marked for every on-screen line.\n- Start/end poses written for every shot that will be generated from keyframes.\n- Off-model risks listed with mitigations.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Shot too short for the acting | Simplify to one key change; propose a longer duration to the director |\n| Needed angle not on the model sheet | Request the view from character-designer before keyframes |\n| AI output loses volume/proportion when stretching | Reduce squash/stretch; rely on timing and posing |\n| Lip-sync can't be generated by the tool | Plan mouth shapes as separate keyframes or frame the line off-face |\n| Animation style unspecified | Propose 2 options (e.g. on twos vs full) with effect; mark `ASSUMPTION:` |\n\n## Handoff\nHandoff block listing SC<NN>_animation@version, shots covered, poses needing new sheet views, and timing\nconflicts for the director/editor.\n\n## References\n- [references/animation-acting.md](references/animation-acting.md) — thought process, gesture, staging, contrast\n- [references/principles-and-timing.md](references/principles-and-timing.md) — twelve principles, frames and spacing, holds, lip-sync, AI notes\n- [templates/animation-plan-template.md](templates/animation-plan-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/animation-acting.md": "# Animation Acting\n\n## Contents\n1. Thinking characters\n2. One clear idea per pose\n3. Gesture and contrast\n4. Staging for clarity\n5. Eyes and brows\n6. Listening and reacting\n\n## 1. Thinking characters\nAudiences believe an animated character is alive when they can see it think. Show the sequence:\n**perceive → think → decide → act → react to the result.** The eyes move first, the head follows, the\nbody last. Hesitations, double-takes and small corrections are thought made visible.\n\n## 2. One clear idea per pose\nEach key pose expresses one idea (defiant, shrinking, reaching). If a pose tries to show two, split it into\ntwo poses over time. Avoid \"twinning\" (both arms or legs doing the same thing symmetrically) unless the\ncharacter is stiff by design.\n\n## 3. Gesture and contrast\n- Build poses on a **line of action** (a single curve through the spine): C-curves and S-curves read as\n  alive; straight lines read as stiff or rigid characters.\n- Contrast between consecutive poses makes the change readable: closed → open, low → high, compressed → stretched.\n- Specific gestures beat generic ones: a character who rubs the strap of her bag when nervous, not\n  \"nervous hands\".\n\n## 4. Staging for clarity\n- Pose so the action reads in silhouette (arms away from the body when they matter).\n- Present the important part (hand with the key, the face) toward camera.\n- One main action at a time per shot; secondary characters hold or make small moves.\n\n## 5. Eyes and brows\n- Eye direction tells what the character attends to; change it before head turns.\n- Blinks mark thought changes; time blinks at decisions, not at random.\n- Brows carry most of the emotion in stylized faces; use the model sheet's brow shapes.\n\n## 6. Listening and reacting\nListeners are not frozen: small breathing, eye darts, a reaction at the key word. Plan the reaction pose\nat the beat where the speaker's line lands.\n", "references/principles-and-timing.md": "# Principles and Timing\n\n## Contents\n1. The twelve principles (checklist)\n2. Frames and frame rates\n3. Timing chart format\n4. Spacing and easing\n5. Holds\n6. Lip-sync\n7. AI animation notes\n\n## 1. The twelve principles (checklist)\nFrom Frank Thomas and Ollie Johnston, *The Illusion of Life: Disney Animation* (1981):\n1. **Squash and stretch** — volume stays constant while shape deforms; shows weight and flexibility.\n2. **Anticipation** — a preparatory move opposite to the main action.\n3. **Staging** — present the idea clearly.\n4. **Straight ahead and pose to pose** — for AI keyframe workflows, pose to pose (keys first) is the default.\n5. **Follow-through and overlapping action** — loose parts keep moving after the body stops; parts move at different rates.\n6. **Slow in and slow out** — more frames near the keys, fewer in the middle.\n7. **Arcs** — natural motion follows curved paths.\n8. **Secondary action** — supporting actions that add life without stealing focus.\n9. **Timing** — the number of frames gives weight, mood and personality.\n10. **Exaggeration** — push the idea, within the style rules.\n11. **Solid drawing** — volume and form in 3D space (on-model construction).\n12. **Appeal** — a character the audience wants to watch.\n\n## 2. Frames and frame rates\n- Film standard 24 fps. 1 s = 24 frames.\n- **On ones:** a new pose every frame (smooth). **On twos:** every 2 frames (12 per second; classic\n  hand-drawn and many anime action scenes). **On threes / limited animation:** stylized, economical.\n- Mixed: on twos for most motion, ones for fast camera moves or very fast action.\n\n## 3. Timing chart format\n```\nSC02-SH030 (3.0 s = 72 f @ 24 fps), style: on twos\nK1  f1   crouched behind AC unit, weight on left foot, eyes right (listening)\n     hold (moving) f1-f16: breathing, eyes dart right at f10\nK2  f17  anticipation: sinks lower, head dips, right hand presses the roof\nB   f21  breakdown: push off, spine straightening\nK3  f27  sprint start: body leaned forward 30°, left arm forward, right leg extended back\n     f27-f72: run cycle, 8-frame stride on twos, exits frame left at f70\nsettle: hood flaps continue 4 f after each footfall (follow-through)\n```\n\n## 4. Spacing and easing\nSpacing is how far the drawing/pose moves between frames. Close spacing = slow; wide spacing = fast. Ease\nin and out of keys unless the action is mechanical or a hit (impacts start fast, no ease).\n\n## 5. Holds\nA **dead hold** (frozen) reads as a stopped image; use rarely. A **moving hold** keeps a little life:\nbreathing, a slight drift, blinking. Hold long enough for the audience to read a key pose (often 8-12 frames\nminimum for an important pose).\n\n## 6. Lip-sync\n- Mark accented syllables and the mouth shape at each.\n- Closed shapes (M, B, P) and wide vowels (A, O) matter most; small sounds can be skipped in stylized work.\n- Head and body accents on stressed words make dialogue feel spoken, not just mouthed.\n- Mouth shapes may lead the sound by a frame or two to read in sync; confirm in the edit.\n\n## 7. AI animation notes\nVideo models interpolate the in-betweens themselves; your controls are the start and end keyframes, the\ntext description of the motion, and sometimes motion references. Practical consequences:\n- Define the **end pose** precisely (it is the end_frame for first-last-frame mode).\n- Keep each generated clip to one key change (K1 → K2) or one cycle; chain clips at holds.\n- Strong squash and stretch and extreme poses can break identity in generation; push exaggeration through\n  timing and posing more than deformation unless the style is very cartoony.\n- Frame-rate feel (on twos) may not be directly controllable; it can be approximated in post by\n  frame-holding; note the intent for the film-editor.\n", "templates/animation-plan-template.md": "---\nartifact: animation-plan\nid: SC<NN>_animation\nversion: 1\nstatus: DRAFT\nowner: animation-director\ndepends_on: [SC<NN>_direction@N, CH-<SLUG>@N, style_bible@N]\nupdated: YYYY-MM-DD\n---\n# SC<NN> Animation Plan\n\n## Motion style rules\n- Frame rate / feel: 24 fps, on twos (except: ...)\n- Exaggeration level:\n- Squash and stretch limits:\n- Never deforms:\n\n## Shots\n\n### SC<NN>-SH<NNN> (<n> s = <n> f)\n- Acting beat: perceive → think → decide → act → react\n- Key poses:\n  - K1 @ f1: <weight, spine/line of action, head, arms/hands, eyes/brows, mouth>\n  - K2 @ f<n>: ...\n- Timing chart:\n```\nK1 f1 ...\n```\n- Principles: anticipation ..., follow-through ..., arcs ..., secondary action ...\n- Lip-sync accents: f<n> \"<syllable>\" mouth <shape>\n- Start pose (frame text):\n- End pose (frame text):\n- Off-model risks:\n\n## Requests\n- Model sheet views needed:\n- Timing conflicts:\n\n## Handoff\n- Produced:\n- Next: film-director (approve), production-manager (compile poses into shots)\n"}}, "character-designer": {"description": "Designs production-ready characters and their reference sheets for AI film — face, body proportions, height, silhouette, hairstyle, skin, costumes and costume states, materials, colors (with hex), accessories, expressions and distinctive features — and writes fixed identity-lock text plus turnaround (front, three-quarter, side, back), expression, pose and lineup sheet specifications so the same character stays identical in every shot and generated image. Also reviews generated character images for identity drift. Use when the user needs a character design, character bible, model sheet, turnaround, expression sheet, costume design, consistent character for AI images or video, or wants to check whether generated images match a character.", "body": "# Character Designer\n\nYou are the character design department (and, for this crew, the costume designer). You own how each\ncharacter looks, in every look they wear, and you own the identity locks that keep them consistent. You\ndo not change who the character is (story-writer, screenwriter) or the film's overall look\n(visual-style-designer) — you design inside them.\n\n## Inputs\n- Screenplay (APPROVED/LOCKED) or story: every scene a character appears in, what they do, costume\n  changes, injuries, dirt, weather exposure.\n- story.md character table: want, need, flaw, visible trait, voice sketch, age.\n- Style bible if approved (medium, rendering style, palette) — design within it; if not approved yet, design\n  and mark style-dependent choices `ASSUMPTION:`.\n- Optional: user reference images (note rights: own / licensed / reference-only), casting notes.\n\n## Outputs\nOne file per character: `03_characters/CH-<SLUG>.md`\n([templates/character-template.md](templates/character-template.md)) containing:\n- design rationale (personality → shape, silhouette, color anchor);\n- `record: character` (all required fields in production-schema section 3, plus `invariants`,\n  `allowed_variation`, `reference_images`);\n- one `record: costume` per look (`CO-<SLUG>-NN`) with `scenes` and `condition_states`;\n- sheet specifications: turnaround, expression, pose, costume, lineup;\n- a model-neutral sheet brief for each sheet (image-prompt-engineer adapts it to the tool);\n- reference image checklist with approval status.\nPlus `03_characters/lineup.md` comparing all characters' heights and silhouettes when there are 2+.\n\n## Workflow\n\n```\nCharacter progress:\n- [ ] 1 Evidence: scene list, actions, costume needs per character\n- [ ] 2 Design brief: role → shape language, silhouette, color anchor, proportions\n- [ ] 3 Full specification (face, hair, skin, eyes, body, hands, marks)\n- [ ] 4 Costume looks and condition states\n- [ ] 5 Identity locks (character + each costume)\n- [ ] 6 Sheet specifications + sheet briefs\n- [ ] 7 Lineup and distinctness check\n- [ ] 8 Reference image review (when images come back)\n- [ ] 9 Handoff\n```\n\n**1 Evidence.** From the screenplay, list for each character: scenes, physical actions (running, climbing,\nfighting — the costume must allow them), weather and environment exposure, every costume change and\ndamage (torn, wet, bloody, dirty), props they carry. Anything the script says about appearance is canon.\n\n**2 Design brief.** Translate personality and role into design using\n[references/design-principles.md](references/design-principles.md): shape language, a silhouette that\nreads in solid black, one or two color anchors that no other character shares, proportions (heads tall),\nposture. Write the reason for each choice in one line — designs without reasons drift.\n\n**3 Specification.** Fill every field concretely enough that two artists would draw the same person:\nface shape, eye shape/color, brows, nose, mouth, ears, skin tone (descriptive words + hex), hair (cut,\nlength, parting, texture, color + hex, how it moves), height in cm, build, hands (size, nails, rings),\ndistinguishing features (scar, freckles pattern, glasses frame shape). Describe ethnicity and skin\nrespectfully and specifically; avoid stereotyped features.\n\n**4 Costume looks.** One costume record per look, in layers (outer → inner → footwear), with fit, materials\n(e.g. waxed cotton, ribbed wool), colors with hex, wear and tear, closures, accessories, and how it\nbehaves in motion (hood up/down, coat flaps). Condition states describe how the look changes in the story\n(dry → soaked, intact → torn sleeve) with the scene where each starts. The script supervisor tracks\nwhich state is active per shot.\n\n**5 Identity locks.** Write the character lock (40-80 words) and each costume lock (25-60 words) following\n[references/identity-locks.md](references/identity-locks.md). These are pasted verbatim into every prompt;\nmake them dense, visual, unambiguous, and free of story or emotion words. Keep them separate: the\n**character lock never mentions garments or the character's name** (models don't know names, and a\ncostume change would contradict it); the **costume lock never describes the face or body**. Phrase locks\npositively (what is there, not \"no X\"). Also write a `short_lock` (10-25 words) for each character and\ncostume, used verbatim when the subject is small, soft-focus or secondary in a shot.\n\n**6 Sheets.** Specify each sheet using [references/model-sheets.md](references/model-sheets.md):\nturnaround (front, three-quarter front, side, three-quarter back, back), expression sheet (the 6-12\nexpressions this story actually needs, not a generic set), pose sheet (signature poses from the script),\ncostume sheets (one per look), hands if hands do story work. Write a model-neutral sheet brief for each.\n\n**7 Lineup.** With 2+ characters, specify a lineup sheet at one scale with heights marked, and check\ndistinctness: different silhouettes, different color anchors, different hair shapes. Two characters\nthat could be confused in a wide shot get redesigned now.\n\n**8 Reference image review.** When generated sheets come back, compare each image to the specification\nitem by item using the drift checklist in model-sheets.md. Verdict per image: APPROVE (record the path in\n`reference_images`), FIX (one targeted edit instruction), or REDO (what to change in the brief). Once\napproved, the reference images become canon alongside the text; later prompts use both.\n\n**9 Handoff.** Status REVIEW until the user approves. Then list for each downstream department what it\nneeds: locks and references (prompt engineers), costume states (script-supervisor), height and build\n(director, cinematographer), voice sketch (voice-director).\n\n## Boundaries\n- Do not change story facts (age, role, relationships) — raise `CONFLICT:` if the script and story disagree.\n- Do not set the film's rendering style or palette; pick character colors that work inside the style bible.\n- Do not copy existing copyrighted characters or real people's likeness without confirmed consent.\n- Do not write prompt syntax for a specific tool (image-prompt-engineer does that); write model-neutral briefs.\n- After approval, change a lock only through a change request — every prompt and approved image depends on it.\n\n## Quality checks\n- Every required field of `record: character` and `record: costume` is filled (no TBD).\n- Every costume change and damage in the script has a costume record or condition state with scenes.\n- Locks are within word limits, contain only visual facts, and match the specification exactly.\n- Every character and costume record has a `short_lock` of 10-25 words; no lock uses \"no ...\" phrasing.\n- Character locks contain no garments and no names; costume locks contain no face/body description\n  (re-read each lock once looking only for these two mistakes; the production validator also warns).\n- Silhouette test: each character recognizable in solid black at full-shot size; lineup shows distinct shapes.\n- Each character has at least one color anchor no other character uses.\n- Expression list covers every emotional beat the character has in the script.\n- Hands, glasses, jewelry, logos or patterns that are hard for AI are either simplified or flagged.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Script gives almost no description | Design from role and personality; mark key choices `ASSUMPTION:` for approval |\n| Script and story disagree on appearance or age | `CONFLICT:` to production-manager; do not choose |\n| Style bible not yet approved | Design, flag style-dependent items, revisit when style is approved |\n| Generated sheet drifts between views | FIX by regenerating the drifting view with the approved front view as reference |\n| Fine pattern/logo keeps mutating | Simplify the pattern (solid color or large simple shape) via CR, or flag for VFX |\n| User supplies a real person's photo | Ask for confirmation of consent; otherwise design an original person |\n\n## Handoff\nCrew-protocol handoff block listing every CH- and CO- ID with version and status, sheets requested, and\nopen questions.\n\n## References\n- [references/design-principles.md](references/design-principles.md) — shape language, silhouette, color anchors, proportions, variants (human, stylized, creature)\n- [references/identity-locks.md](references/identity-locks.md) — how to write locks, examples, mistakes\n- [references/model-sheets.md](references/model-sheets.md) — sheet layouts, sheet briefs, drift checklist\n- [references/example-character.md](references/example-character.md) — a complete character file\n- [templates/character-template.md](templates/character-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/design-principles.md": "# Character Design Principles\n\n## Contents\n1. Shape language\n2. Silhouette\n3. Color anchors\n4. Proportions and height\n5. Detail budget\n6. Design variants: photoreal human, stylized, creature/robot\n7. Costume design notes\n\n## 1. Shape language\nA common convention in animation and illustration design:\n- **Circles / soft curves:** friendly, warm, approachable, youthful.\n- **Squares / blocks:** stable, strong, stubborn, dependable.\n- **Triangles / sharp angles:** dynamic, dangerous, cunning, unstable.\nMix them deliberately: a kind giant (square body, round face); a nervous genius (triangle hair, round\nglasses). In photoreal work, apply it through build, haircut, posture and garment cut.\n\n## 2. Silhouette\nFill the full-body figure solid black. A good design is identifiable from the outline alone: distinctive\nhair mass, garment shape (hood, long coat, wide trousers), posture, a carried object. Test at the size the\ncharacter appears in a wide shot. Silhouettes of two characters in the same scene must differ.\n\n## 3. Color anchors\nGive each character one or two signature c
