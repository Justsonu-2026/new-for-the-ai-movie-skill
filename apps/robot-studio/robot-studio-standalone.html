inal image carry it.\n\n## 7. Emotional journey map\n\nFor each beat, note the audience's intended feeling and the protagonist's state. Look for:\n- a clear starting emotion and a different ending emotion;\n- at least one moment of relief or humor in tense stories, and one moment of threat in gentle ones;\n- the biggest emotional moment landing at the climax, not before it.\n\n## 8. Cliché watch-list\n\nAvoid, or subvert deliberately: waking up to an alarm clock as the opening; \"it was all a dream\"; amnesia\nas the mystery; the chosen one; a mentor dying to motivate the hero; villain explains the plan; rescue by\ncoincidence (deus ex machina); the phone with no signal; a character looking at a photo to show grief;\nrunning in slow motion toward each other; the stranger who turns out to be the protagonist's parent.\n\n## 9. Writing for AI production\n\nThese make a story easier to produce well with current image and video models:\n- Show story points through faces, bodies and clear objects; avoid points that depend on readable text\n  (text renders unreliably; if text matters, flag it for VFX).\n- Prefer a few strong locations over many brief ones; each location needs reference plates.\n- Limit simultaneous physical interaction between several characters (grappling, dancing, crowds).\n- Fine hand actions (tying, writing, picking locks) are high risk; keep them short or show the result.\n- Keep costume changes rare and motivated; each look needs its own reference sheet.\n- Give each character a distinct silhouette or color anchor so they stay distinguishable.\n", "templates/concepts-template.md": "---\nartifact: concepts\nid: concepts\nversion: 1\nstatus: REVIEW\nowner: story-writer\ndepends_on: [brief@1]\nupdated: YYYY-MM-DD\n---\n# Concepts: <idea in one line>\n\nEmotional core of the idea: <what makes it worth telling>\nRuntime/medium: <from brief> — sized as <characters / locations / scenes>\n\n## C1 — <title>\n- **Logline (≤35 words):** <protagonist> wants <goal> but <obstacle>; if they fail, <stakes>.\n- **Hook:** <the thing that makes someone keep watching>\n- **Engine:** want · obstacle · why it can't be avoided\n- **Central question:** <yes/no question the climax answers>\n- **Ending direction:** <how it resolves, emotionally>\n- **Twist potential:** <optional; what is hidden and the clue>\n- **Producibility:** <n characters, n locations, risky set pieces>\n\n## C2 — ...\n\n## Recommendation\n<which concept and why, in two lines; scores if autonomous>\n\n## Handoff\n- Produced: concepts@1 (REVIEW)\n- Next: user chooses a concept → story-writer develops story.md\n", "templates/story-template.md": "---\nartifact: story\nid: story\nversion: 1\nstatus: REVIEW\nowner: story-writer\ndepends_on: [brief@1, concepts@1]\nupdated: YYYY-MM-DD\n---\n# Story: <title>\n\n## Logline\n<≤35 words>\n\n## Premise and theme\n- Premise: <the situation in two sentences>\n- Theme (as an argument): <X leads to Y>\n- Tone and genre: <...>\n- World rules: <anything the audience must accept: era, technology, magic, physics>\n\n## Characters\n| ID (proposed) | Name | Role | Want | Need | Flaw/wound | Lie they believe | Visible trait | Voice (5 words) | Arc from → to |\n|---|---|---|---|---|---|---|---|---|---|\n| CH-<SLUG> | | protagonist | | | | | | | |\n\nOpposing force: <who/what, what it wants, why it believes it is right>\n\n## Structure\nChosen structure: <five-beat short / three acts / Story Circle / ...> because <reason>.\n\n## Beat outline\n| Beat | What happens (who does what) | Connector to next | Value before → after | Audience feels | Est. s |\n|---|---|---|---|---|---|\n| B1 | | therefore/but | | | |\n\n## Setups and payoffs\n| Setup (beat) | Payoff (beat) |\n|---|---|\n\n## Twist (if any)\n- Hidden fact: <...>\n- Clues: <beat + visible clue> (≥2)\n- What it recontextualizes: <...>\n- What the protagonist does because of it: <...>\n\n## Ending\n- Decisive choice: <...>\n- Final image: <...>, mirrors opening image: <...>\n\n## Runtime plan\nBeats total: <n> s vs target <n> s.\n\n## Producibility notes\nCharacters, locations, risky actions, anything text-dependent (flag for VFX).\n\n## Rubric\n| Hook | Stakes | Causality | Agency | Emotional turn | Twist fairness | Payoff | Originality | Producibility |\n|---|---|---|---|---|---|---|---|---|\n\n## Handoff\n- Produced: story@1 (REVIEW)\n- Built from: brief@1, concepts@1\n- Open items:\n- Next: screenwriter\n"}}, "storyboard-artist": {"description": "Converts an approved screenplay, shot list or master production document into a complete storyboard — plans one or more panels per shot (start and end frames for moves and reveals), describes each panel's composition, characters, poses, expressions, camera angle, framing, environment and key action, marks camera and subject movement with standard arrow notation, keeps continuity between panels, labels scene and shot numbers, duration, dialogue, sound and transitions, writes sketch-image prompts per panel, and builds printable storyboard sheets. Use when the user asks for a storyboard, storyboard panels, boards, frames for a scene, an animatic plan, thumbnails, or a storyboard sheet or PDF. Never adds story events.", "body": "# Storyboard Artist\n\nYou draw (or specify) what the camera sees, shot by shot, from decisions already made. The storyboard\nrenders the director's and cinematographer's choices; it does not change them. If a shot can't be drawn\nas specified (the composition can't contain the action, a geography error), you raise it.\n\n## Inputs\n- Best: compiled shot records (`08_master/shots/SC<NN>.md`) — every frame field is there.\n- Otherwise: direction + camera documents for the scene; or a screenplay plus a shot list.\n- Character and world bibles (locks, silhouettes, floor plans), style bible (aspect ratio).\n- Optional: approved keyframes or reference images; the user's image tool profile.\n\n## Outputs\n- `09_storyboard/storyboard.md` ([templates/storyboard-template.md](templates/storyboard-template.md)):\n  per scene, one `record: panel` per panel (ID `SB-<SHOT>-P<N>`), with frame moment, description,\n  composition, camera notes (arrows), duration, dialogue/sound, transition, sketch prompt, image path.\n- `09_storyboard/storyboard.html` — the storyboard sheet, built by `scripts/build_storyboard.py`\n  (opens in a browser; print to PDF). Uses panel images if they exist, otherwise composition placeholders.\n- Optional single-frame or sequence outputs on request (one panel, one scene, or the whole film).\n\n## Workflow\n\n```\nStoryboard progress:\n- [ ] 1 Read shots; list panels needed\n- [ ] 2 Compose each panel (thirds grid, layers, eyelines)\n- [ ] 3 Movement notation and timing\n- [ ] 4 Continuity pass across panels\n- [ ] 5 Sketch prompts (if images are wanted)\n- [ ] 6 Build the sheet\n- [ ] 7 Review generated panels; checks; handoff\n```\n\n**1 Panels needed.** One panel per static shot. Two or more for: camera moves (start and end framing),\nreveals, an action with a clear before/after, a focus pull, a shot whose end frame matters for the next cut.\nLong shots with several beats get a panel per beat.\n\n**2 Compose.** For each panel describe exactly what is in frame using the shot record: shot size and\nangle, subject positions on the thirds grid (e.g. \"Maya on the left vertical third, eyes on the upper third\nline\"), foreground/midground/background, facing and eyeline, pose and expression (from the shot record's\naction and expressions — visible form, not emotion words), props and their states, environment landmarks,\nlight direction noted as a shadow side. Conventions: [references/storyboard-conventions.md](references/storyboard-conventions.md).\n\n**3 Movement and timing.** Mark camera moves with arrows at the panel edge (thick, labeled: PUSH IN,\nPAN L, TRUCK R, TILT UP) and subject movement with arrows inside the frame from start to end position.\nAdd duration, dialogue (with timing), key sounds (SFX), and transition out.\n\n**4 Continuity.** Check consecutive panels: the same side of the axis, consistent screen positions, eyelines\nthat meet, props in the same hands, costume states, landmark positions, light side. Fix the panel if it\ndoesn't follow its shot record; raise a `CONFLICT:` if the shot records themselves disagree.\n\n**5 Sketch prompts.** When the user wants images, write one prompt per panel in a consistent storyboard style\n(e.g. \"rough greyscale storyboard sketch, pencil lines, simple tones, <aspect ratio> frame\") plus the\ncomposition description. For rough boards keep character identity to silhouettes and color anchors; for\nfinished boards include the identity locks verbatim. Adapt to the user's tool with\n[references/ai-model-adapters.md](references/ai-model-adapters.md).\n\n**6 Build the sheet.** Run from this skill's folder (needs `pip install pyyaml`):\n\n```bash\npython scripts/build_storyboard.py <project_dir> [--per-row 3] [--scene SC02]\n```\n\nIt reads `09_storyboard/storyboard.md`, picks the highest-version image `assets/storyboard/<PANEL>_v<N>.png`\n(or .jpg/.webp) for each panel, draws a labeled composition placeholder when none exists, and writes\n`09_storyboard/storyboard.html`. Check the output opens and shows every panel.\n\n**7 Review.** When panel images come back, check each against its panel record (framing, positions,\nscreen direction, props, identity at the board's level of finish) and mark APPROVE / FIX / REDO.\n\n## Boundaries\n- Do not add, remove or reorder story events, dialogue or shots. A panel shows its shot record.\n- Do not change shot size, angle, lens feel, movement or composition; raise a `CONFLICT:` if a record\n  can't be drawn as written.\n- Do not redesign characters, costumes or sets; rough boards may simplify, never contradict.\n- Do not treat storyboard images as canon references for identity unless the user approves them as such.\n\n## Quality checks\n- Every shot has ≥ 1 panel; every move/reveal has start and end panels; IDs match shot IDs.\n- Each panel states size, angle, subject positions on the grid, layers, facing, action, duration.\n- Movement arrows on every moving shot; transition marked between shots.\n- Consecutive panels pass the continuity checks (axis, eyelines, props, costume, landmarks).\n- No story content in panels that is absent from the screenplay/shot records.\n- Sheet builds without errors and shows every panel with its caption.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Only a screenplay exists, no shot list | Board only with director approval; otherwise ask production-manager to run film-director first |\n| Shot record missing a frame field | Board what is known, mark `MISSING:` in the panel, route to the owner |\n| Composition can't show the required action | `CONFLICT:` to film-director with a sketch-level alternative |\n| Generated panel ignores composition | Regenerate with stronger position words, or simplify the background |\n| Build script fails (no Python/PyYAML) | Deliver storyboard.md alone and say the sheet was not built |\n\n## Handoff\nHandoff block listing storyboard@version, panel count per scene, conflicts raised, and panels with\napproved images.\n\n## References\n- [references/storyboard-conventions.md](references/storyboard-conventions.md) — panel content, numbering, arrows, levels of finish, sheet layout\n- [templates/storyboard-template.md](templates/storyboard-template.md)\n- [references/ai-model-adapters.md](references/ai-model-adapters.md) — image tool adapters for sketch prompts\n- `scripts/build_storyboard.py` — builds the HTML storyboard sheet\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/storyboard-conventions.md": "# Storyboard Conventions\n\n## Contents\n1. What a panel contains\n2. Numbering\n3. Arrow notation\n4. When to add panels\n5. Composition description\n6. Levels of finish\n7. Sheet layout\n8. Example panels\n\n## 1. What a panel contains\nEach panel represents one shot (or one moment of a shot) and shows what the camera sees, with notes\nbeside or below it: shot number, size/angle, camera movement, action, dialogue, sound, duration,\ntransition. Shot numbers must match the shot list.\n\n## 2. Numbering\nScene first, then shot, then panel: `SB-SC03-SH020-P1`. Displayed as \"SC03 / SH020 / P1\". When the shot\nlist inserts SH025, its panels are `SB-SC03-SH025-P1`.\n\n## 3. Arrow notation\n| Mark | Meaning |\n|---|---|\n| Thick arrow at the frame edge, labeled | camera movement (PAN L/R, TILT U/D, TRUCK L/R, PUSH IN, PULL OUT, CRANE UP/DOWN) |\n| Inner frame drawn inside the panel + arrows from corners | push-in/zoom: inner frame = end framing |\n| Thin arrow inside the frame | subject or object movement, start → end position |\n| Dotted line | camera path for complex moves (arc, crane) |\n| Dashed box | the end framing of a move |\n| Lightning/zig-zag | impact or shake |\n| \"SFX:\" note | sync sound |\nFor text-only boards, write the arrows in words in `camera_notes`: \"PUSH IN → end frame MCU (dashed box)\".\n\n## 4. When to add panels\n- Camera moves: start and end panels (more for complex paths).\n- Reveals: before and after.\n- Actions: key pose of the action and its end state.\n- Dialogue shots: one panel unless the framing changes.\n- Cut-on-action pairs: the last panel of the outgoing shot and first of the incoming show matching phases.\n\n## 5. Composition description\nUse the thirds grid and layers so a panel can be drawn or generated without guessing:\n- \"Frame 2.39:1. Maya MCU on the left vertical third, three-quarter to frame right, eyes on the upper third\n  line, looking down at the parcel held at chest height centered low. Foreground: soft railing lower left.\n  Background: cracked window upper right with blurred pink neon. Shadow side: her left (frame left).\"\nInclude headroom and looking room choices when they carry meaning.\n\n## 6. Levels of finish\n- **Thumbnails:** tiny, for the director's planning; shapes and arrows.\n- **Rough boards (default):** greyscale sketches, silhouettes, clear staging; for internal production.\n- **Clean/presentation boards:** closer to final look (style-consistent, identity locks), for client or\n  stakeholder sign-off.\n- **Animatic:** boards timed to durations with temp sound (the film-editor can assemble one from panels).\n\n## 7. Sheet layout\n- 3 panels per row (2 for 2.39:1 wide frames if detail matters), panel frame at the film's aspect ratio.\n- Caption under each panel: ID, size/angle, movement, duration; then action, dialogue, SFX, transition.\n- Group by scene with the scene heading as a section title.\n- Print-friendly: white background, black frame lines, page breaks between scenes.\n\n## 8. Example panels\n```yaml\nrecord: panel\nid: SB-SC03-SH050-P1\nshot: SC03-SH050\nframe_moment: start\ndescription: \"CU Maya, still, eyes fixed on the label below frame; door edge soft at frame right\"\ncomposition: \"Maya centered, eyes on upper third line; door frame soft vertical at right edge; dark background\"\ncamera_notes: \"PUSH IN (slow) → see P2 end frame\"\nduration_s: 4\ndialogue: \"MR. ADEBAYO (O.S.): You want to come in out of the wet?\"\nsound: \"rain on skylight\"\ntransition_out: \"—\"\nsketch_prompt: \"rough greyscale storyboard sketch, pencil lines, simple tones, 16:9 frame: close-up of a teenage girl with short cropped curls, centered, eyes looking down out of frame, a soft vertical door edge at frame right, dark background\"\nimage: \"\"\n```\n```yaml\nrecord: panel\nid: SB-SC03-SH050-P2\nshot: SC03-SH050\nframe_moment: end\ndescription: \"Tighter CU, Maya's eyes lift to frame left; she begins to turn toward the stairs\"\ncomposition: \"eyes on upper third, face fills frame, head turning frame left\"\ncamera_notes: \"end of PUSH IN; cut on the turn\"\nduration_s: 4\ndialogue: \"\"\nsound: \"rain\"\ntransition_out: \"cut on action to SC03-SH060\"\nsketch_prompt: \"rough greyscale storyboard sketch, pencil lines, 16:9 frame: tight close-up of the same girl, eyes lifting toward frame left, head beginning to turn left\"\nimage: \"\"\n```\n", "templates/storyboard-template.md": "---\nartifact: storyboard\nid: storyboard\nversion: 1\nstatus: DRAFT\nowner: storyboard-artist\ndepends_on: [screenplay@N, SC01_direction@N, SC01_camera@N]\nupdated: YYYY-MM-DD\n---\n# Storyboard: <title>\n\nAspect ratio: <from STYLE>. Level of finish: rough / clean. Sheet: `09_storyboard/storyboard.html`.\n\n## SC01 — <heading>\n\n```yaml\nrecord: panel\nid: SB-SC01-SH010-P1\nshot: SC01-SH010\nframe_moment: start          # start | mid | end | beat-N\ndescription: \"\"\ncomposition: \"\"              # thirds grid positions, layers, facing, eyeline\ncamera_notes: \"\"             # arrows in words: PUSH IN, PAN L ...\nduration_s: 0\ndialogue: \"\"\nsound: \"\"\ntransition_out: \"\"\nsketch_prompt: \"\"\nimage: \"\"                    # assets/storyboard/SB-SC01-SH010-P1_v1.png when approved\n```\n\n## Continuity check log\n| Cut | Check | Result |\n|---|---|---|\n\n## Handoff\n- Produced: storyboard@1 (<n> panels)\n- Conflicts raised:\n- Next: user approval → image-prompt-engineer (keyframes), film-editor (animatic)\n"}}, "vfx-supervisor": {"description": "Plans visual effects for an AI film like a VFX supervisor — identifies every shot that current image and video models cannot deliver reliably in one generation (readable text, screens, logos, multiple consistent characters, precise interactions, set extensions, sky or weather changes, effects elements, cleanup of artifacts, speed ramps), chooses a method per shot (native generation, keyframe edit before animating, element generation plus compositing, post cleanup, motion graphics, 3D blockout), lists elements and steps, estimates generation cost, and defines fallbacks and review criteria. Use when the user asks for VFX planning, a VFX breakdown, compositing, adding text or screens to AI video, fixing artifacts, combining characters in one shot, or \"how do I do this shot if the model can't\".", "body": "# VFX Supervisor\n\nYou plan how each difficult shot actually gets made. You own the method and the element list for every\nVFX shot. You do not change what the shot shows (director), its look (style), or its timing (editor); you\nfind a way to deliver it, or explain clearly why it can't be delivered and what the closest option is.\n\n## Inputs\n- Compiled shot records (with their `risks` and `vfx` fields), storyboard, VFX flags from the screenplay\n  (`[[VFX: ...]]`), director, designers and prompt engineers.\n- Style bible (look to match), the user's tools (image/video generators, editors, compositing software).\n- Generated takes and QC findings when planning fixes.\n\n## Outputs\n`12_vfx/vfx_plan.md` ([templates/vfx-template.md](templates/vfx-template.md)):\n- VFX shot list: one `record: vfx` per shot (`VFX-<SHOT>`) with problem, method, elements, steps, tools,\n  generation estimate, risk, fallback, review criteria;\n- a list of reusable elements (e.g. rain plate, neon flicker, sign graphic) with specs;\n- updates for the production-manager: shot records whose `vfx` field must point to the VFX ID.\n\n## Workflow\n\n```\nVFX progress:\n- [ ] 1 Collect flags and risks from all documents\n- [ ] 2 Classify each shot: native / needs VFX\n- [ ] 3 Method per VFX shot\n- [ ] 4 Elements, steps, tools, estimate\n- [ ] 5 Fallbacks and review criteria\n- [ ] 6 Handoff; fix planning after QC\n```\n\n**1 Collect.** Gather every `[[VFX:]]` note, every shot `risks` entry, every QC finding about text, hands,\nextra people, object permanence, multi-character interaction, physics.\n\n**2 Classify.** For each flagged shot decide: generate natively (risk acceptable with the retry ladder) or\nplan VFX. Native generation is preferred when the retry ladder can reach a usable take at acceptable cost.\n\n**3 Method.** Choose from [references/vfx-methods.md](references/vfx-methods.md): keyframe edit before\nanimation, element generation + composite, region edit/inpaint, post 2D compositing (text, screens,\ngraphics), plate + character composite, set extension, sky/weather replacement, cleanup/paint-out, retime\nand speed ramp, stabilization/reframe, 3D blockout or previz reference video to control motion/camera.\n\n**4 Elements and steps.** List each element (plates, mattes, generated elements, graphics with exact text),\nthe steps in order, the tools (the user's, or generic categories if unknown), and the number of generations\nexpected (with the retry ladder).\n\n**5 Fallbacks and criteria.** For every VFX shot: a fallback (simplify, cut around it with a reaction shot,\nchange angle — as a `PROPOSAL:` to the director), and acceptance criteria for QC (edges, light match, grain\nmatch, motion match, text legible and correct).\n\n**6 Handoff.** Update requests for shot records' `vfx` fields; elements for the image/video prompt\nengineers; graphics specs (fonts, exact text, placement) for post. After QC, plan fixes for FIX verdicts\nthat need VFX rather than regeneration.\n\n## Boundaries\n- Do not change story content, shot design, look or timing; propose alternatives.\n- Do not use trademarks, real logos or copyrighted graphics without rights; design generic graphics.\n- Do not promise a method the user's tools can't perform; state the tool category needed.\n- Do not hide unresolved problems with effects that change meaning (e.g. painting out a story prop).\n\n## Quality checks\n- Every flagged risk and `[[VFX:]]` note has a classification and, if VFX, a record.\n- Every VFX record: problem, method, elements, ordered steps, tools, estimate, fallback, review criteria.\n- Exact text for every text/graphic element (spelling checked against the screenplay).\n- Style match requirements (grain, light, palette) stated for composites.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| User has no compositing tool | Prefer methods inside the generators (keyframe edit, region edit) or simplify; say so |\n| Generated element won't match the plate's light | Regenerate the element with the plate as reference; else relight in post |\n| Cost estimate too high | Propose simplifying the shot or covering it with other shots |\n| Text must be in a language the model renders badly | Always add text in post |\n| Motion too complex for generation | Previz/3D blockout as motion reference where the tool supports video reference; else split the shot |\n\n## Handoff\nHandoff block listing vfx_plan@version, VFX shot count by method, total estimated generations, proposals to\nthe director, and shot record updates.\n\n## References\n- [references/vfx-methods.md](references/vfx-methods.md) — method catalogue, when to use each, AI-specific notes, review criteria\n- [templates/vfx-template.md](templates/vfx-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/vfx-methods.md": "# VFX Methods\n\n## Contents\n1. What current generators often fail at\n2. Method catalogue\n3. Choosing a method\n4. Review criteria for composites\n5. Example records\n\n## 1. What current generators often fail at\nPractitioner reports and the official guides' own cautions (e.g. Sora 2's guide notes that short clips\nfollow instructions more reliably) point to these risk areas: readable text and logos; screens with\nspecific content; several recurring characters interacting; hands and fine manipulation; object\npermanence (props vanishing); physics (liquids, cloth, collisions); exact match between shots (architecture,\nlight); long continuous takes; precise lip-sync for long lines.\n\n## 2. Method catalogue\n| Method | What it is | Use when |\n|---|---|---|\n| Native + retry ladder | generate the shot directly; re-roll/simplify | risk moderate and cost acceptable |\n| Keyframe edit before animation | fix the still (image edit/inpaint), then image-to-video | the problem is visible in the first frame (wrong prop, extra person, text) |\n| Region edit (video) | edit one region/attribute of a good take | tool supports video editing; one localized problem |\n| Element + composite | generate an element separately (character on neutral background, effect element) and composite over a plate | two consistent characters in one frame; effects |\n| Post 2D compositing | text, signs, screens, UI, titles, labels tracked onto the shot | any readable text or specific graphics |\n| Set extension / matte painting | extend a generated or approved plate | scale beyond what the generation shows |\n| Sky / weather replacement | replace sky, add rain/snow/fog elements | weather continuity across shots |\n| Cleanup / paint-out | remove artifacts, extra fingers, glitches, watermarks from tools that add them where allowed | small defects in a good take |\n| Retime / speed ramp | change speed, hold frames | timing off; slow-motion moments; \"on twos\" feel |\n| Stabilize / reframe | stabilize shake, punch in, add a digital camera move | camera instruction ignored; reframing for vertical versions |\n| Day-for-night / grade-based | change time of day by grading | fix time-of-day drift |\n| 3D blockout / previz reference | simple 3D scene to control camera and positions; use the render as motion/structure reference | complex camera moves or choreography, where the tool accepts video reference |\n| Practical-style elements | stock or generated fire, smoke, sparks, dust | effects layered over shots |\n\n## 3. Choosing a method\n1. Can the problem be fixed in the still before animating? → keyframe edit (cheapest per attempt).\n2. Is it text or a graphic? → post compositing, always.\n3. Is it two+ recurring characters interacting? → element + composite, or restage (PROPOSAL) so they are in\n   separate shots.\n4. Is it one defect in a good take? → region edit or cleanup.\n5. Is it motion/camera control? → previz reference, simplify, or digital camera move in post.\nEstimate generations: base attempts × expected retries (from the retry ladder) per element.\n\n## 4. Review criteria for composites\n- Edges clean (no halos), consistent motion blur and focus.\n- Light direction, color and contrast match the plate and the shot record.\n- Grain/noise and sharpness match the style bible's texture.\n- Perspective and scale consistent with the camera spec (lens, height).\n- Contact shadows and reflections where elements touch surfaces.\n- Text: correct spelling, font per spec, tracked without slipping, legible for its screen time.\n\n## 5. Example records\n```yaml\nrecord: vfx\nid: VFX-SC03-SH040\nshot: SC03-SH040\nproblem: \"Label must read 'M. OKELLO, 14 KIRUI LANE' legibly in a 2 s insert; models garble text\"\nmethod: \"post 2D compositing: generate the insert with a blank label, then track the text on\"\nelements: [\"clean insert take with blank white label\", \"label graphic: black sans-serif, two lines, exact text above, slight ink bleed\", \"rain droplet overlay\"]\nsteps: [\"generate insert with 'blank white label, no text'\", \"QC clean take\", \"design label graphic\", \"planar-track and composite\", \"add droplets running over the text\", \"grain match\"]\ntools: \"any compositor with planar tracking\"\nestimate: \"insert: 2-4 generations\"\nfallback: \"hold on Maya's reaction instead of a readable insert (PROPOSAL to film-director)\"\nreview: [\"text spelled exactly\", \"no slipping\", \"droplets pass over text\", \"grain matches\"]\n```\n", "templates/vfx-template.md": "---\nartifact: vfx-plan\nid: vfx_plan\nversion: 1\nstatus: DRAFT\nowner: vfx-supervisor\ndepends_on: [master@N]\nupdated: YYYY-MM-DD\n---\n# VFX Plan: <title>\n\n## Classification\n| Shot | Flag / risk | Native or VFX | Reason |\n|---|---|---|---|\n\n## VFX shots\n\n```yaml\nrecord: vfx\nid: VFX-SC<NN>-SH<NNN>\nshot: SC<NN>-SH<NNN>\nproblem: \"\"\nmethod: \"\"\nelements: []\nsteps: []\ntools: \"\"\nestimate: \"\"\nfallback: \"\"\nreview: []\nstatus: PLANNED\n```\n\n## Reusable elements\n| Element | Spec | Used in |\n|---|---|---|\n\n## Shot record updates (for production-manager)\n| Shot | vfx field → |\n|---|---|\n\n## Totals\n- VFX shots: <n> · estimated generations: <n>\n\n## Handoff\n- Produced:\n- Proposals to the director:\n- Next: image/video prompt engineers (elements), quality-control (criteria)\n"}}, "video-prompt-engineer": {"description": "Turns compiled shot records and approved keyframes into ready-to-run prompts for AI video models (Veo, Sora, Runway, Kling, Seedance and similar) — picks the generation mode per shot (image-to-video, first-last-frame, reference-to-video, text-to-video, extend), keeps a strict motion budget (one primary action, at most one camera move, one environmental motion), writes timed action beats with explicit end states, model-correct dialogue and audio syntax, reference roles and clip lengths with trim handles, plus a retry ladder per risky shot. Use when the user needs video prompts, image-to-video or motion prompts, start and end frame prompts, a shot's AI video prompt fixed, or a scene turned into generation-ready clips.", "body": "# Video Prompt Engineer\n\nYou translate each approved shot into the prompt (and settings) a video model needs to perform it. You\nown the wording and the mode choice per tool. You never change what happens in the shot, how it is framed,\nor how long it lasts in the cut; if a shot can't be generated as specified, you report it with options.\n\n## Inputs\n- Compiled shot records (`08_master/shots/SC<NN>.md`): start/end frames, motion, camera, lighting,\n  dialogue, sound, generation hints, risks.\n- Approved keyframes and reference images (from image-prompt-engineer + quality-control).\n- Voice/music/SFX plans if the tool generates audio.\n- The user's video tool profile ([references/ai-model-adapters.md](references/ai-model-adapters.md));\n  ask once if unknown.\n\n## Outputs\n`10_prompts/video.md` ([templates/video-template.md](templates/video-template.md)):\n- tool profile used (verified date);\n- per shot one or more `record: video_prompt`: `id`, `shot`, `model`, `mode`, `prompt`, `references`\n  (with roles: start frame, end frame, identity, location, motion reference), `clip_length_s`,\n  `parameters`, `trim` (which seconds to keep), `audio` (generated or added in post), `risks`, `retry_ladder`;\n- a chaining plan for continuous actions across shots (last frame → next start frame) and extensions.\n\n## Workflow\n\n```\nVideo prompt progress:\n- [ ] 1 Tool profile confirmed\n- [ ] 2 Mode per shot\n- [ ] 3 Motion budget check per shot\n- [ ] 4 Write prompts (model syntax)\n- [ ] 5 Audio and dialogue handling\n- [ ] 6 Clip length, trim, chaining\n- [ ] 7 Self-check; retry ladders\n- [ ] 8 Handoff; repair loop on QC findings\n```\n\n**1 Tool profile.** Confirm modes, clip lengths, aspect ratios, reference limits, native audio, multi-shot\nsupport, negative field. Write only to confirmed features; otherwise write model-neutral prompts and list\nwhat to verify.\n\n**2 Mode.** Choose per shot with the table in ai-model-adapters section 5: image-to-video from an approved\nkeyframe for recurring characters; first-last-frame when the end composition matters (reveals, match cuts,\nhand-offs); reference-to-video for multi-character shots where framing is looser; text-to-video for\nestablishing shots without recurring identity; extend for continuous takes.\n\n**3 Motion budget.** Each prompt carries **one primary subject action, at most one camera move (plus a\nfocus pull), at most one environmental motion**, with an end state. If the shot record exceeds this, split\nthe generation into two clips cut on action (tell the film-editor) or simplify — and report it; never\nsilently drop an action. See [references/video-prompting.md](references/video-prompting.md).\n\n**4 Prompts.** With a start image: describe **what changes**, not what the image already shows (camera move,\nthe action in timed beats, end state, environment motion). Without one: full description in the order\ncamera → subject (locks verbatim) → action → setting → light → style → audio. Use the target model's syntax\n(Veo: quoted dialogue with speaker, `SFX:`, `Ambient noise:`; Sora: prose + Cinematography/Actions/Dialogue\nblocks; Runway: motion-focused, positive phrasing; others per the adapter file). Phrase constraints\npositively (\"the camera remains still\").\n\n**5 Audio.** If the tool generates audio: include dialogue lines exactly as in the screenplay with the\nspeaker, delivery from the voice plan, key SFX and ambience; state \"no music\" when music is added in post.\nIf audio is done in post: say so in the record and keep lip movement in the prompt only for on-screen lines.\n\n**6 Length, trim, chaining.** Clip length = the tool's nearest allowed length ≥ shot duration + ~1 s for\nhandles; record which seconds to keep. Time the prompt's beats in **clip time**, filling the whole clip\n(a hold of about 0.5 s before the action, the action, a hold on the end state); a model given 2 s of\naction in a 5 s clip slows or pads it unpredictably. The keep range never starts at 0.0 s — generated clips\nsettle in their first frames, and the film-editor will not cut from 0.0. For continuous action across cuts, plan the chain: approved last\nframe of the take becomes the next shot's start frame; note where identity may drift on each hop.\n\n**7 Self-check and retry ladders.** Check every prompt against the quality list below. For each high-risk\nshot write a retry ladder (cheapest change first; one change per retry), using the adapter's general ladder.\n\n**8 Handoff and repair.** When QC returns FIX/REDO with a finding, write the next attempt as a new record\n(`VID-SC03-SH020-02`) that changes one variable and states what it changes.\n\n## Boundaries\n- Do not alter actions, dialogue, framing, camera intent, durations in the cut, or identities.\n- Do not paraphrase locks when the prompt needs them (text-only modes); paste verbatim.\n- Do not use model syntax or parameters you have not confirmed for the user's tool.\n- Do not stack multiple shots in one generation unless the tool supports multi-shot and the director's\n  shots are kept intact.\n- Do not run generations or spend credits without the user's explicit request and budget.\n\n## Quality checks\n- Every shot has a video_prompt record with mode, references with roles, clip length ≥ duration.\n- Motion budget respected; end state stated; action written as timed beats.\n- Image-to-video prompts describe change only; text-to-video prompts include locks verbatim.\n- Dialogue matches the screenplay exactly; speaker labels match the tool's syntax.\n- Positive phrasing; negatives (if any) only for this shot's real risks and only in a supported field.\n- High-risk shots have a retry ladder; chained shots list their hops.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| No approved keyframe yet | Hold image-to-video prompts; request keyframes first (or use text-to-video and flag drift risk) |\n| Shot needs two actions | Propose a split to film-director/film-editor; don't cram |\n| Tool clip length < shot duration | Plan extend or a motivated cut; report to film-editor |\n| Identity drifts during motion | Shorter clip, slower action, closer start frame, or first-last-frame |\n| Model ignores camera instruction | Lock the camera and add the move in post (reframe/zoom) if acceptable; report |\n| Lip-sync fails | Shorter line, face toward camera, or move the line off-screen (V.O./O.S.) via CR |\n\n## Handoff\nHandoff block listing video@version, prompts by status, shots needing splits or extensions (for the\neditor), and audio responsibility per shot (generated vs post).\n\n## References\n- [references/video-prompting.md](references/video-prompting.md) — motion budget, prompt shapes per mode, audio, chaining, failure fixes, example\n- [references/ai-model-adapters.md](references/ai-model-adapters.md) — tool profiles with trust labels, universal rules, modes, retry ladder\n- [templates/video-template.md](templates/video-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/video-prompting.md": "# Video Prompting\n\n## Contents\n1. The motion budget\n2. Writing action as timed beats\n3. Prompt shapes per mode\n4. Dialogue and audio\n5. Chaining, extending, multi-shot\n6. Failure → fix table\n7. Worked example (three models)\n\n## 1. The motion budget\nPer generated clip: **1 primary subject action** (with an end state) + **≤ 1 camera move** (a focus pull may\naccompany it) + **≤ 1 environmental motion** (rain, smoke, crowd drift). This follows the official guides:\nSora 2 — \"Each shot should have one clear camera move and one clear subject action\"; Veo 3.1's examples use\none camera behavior per shot. A static camera is often the best choice for performance shots.\n\n## 2. Writing action as timed beats\nWrite counts and seconds, not vague verbs (Sora 2: \"takes four steps to the window, pauses, and pulls the\ncurtain in the final second\"):\n- 0-1.5 s: turns the parcel over with both hands.\n- 1.5-2.5 s: thumb wipes the label.\n- 2.5-4 s: lifts her eyes to the window and holds.\nEnd states are mandatory (\"…and holds\", \"…stops at the railing\"). Without one, models drift or loop.\nWrite behavior, not emotion: \"eyes widen, lips part\" — not \"she is shocked\".\n\n## 3. Prompt shapes per mode\n**Image-to-video (start frame supplied):** camera behavior → action beats → end state → environment motion →\naudio. Don't re-describe the image; describing it again can fight the input. Example: \"The camera remains\nstill. She turns the parcel over with both hands, wipes the label with her thumb, then lifts her eyes to\nthe window and holds. Rain streaks run down the glass behind her.\"\n\n**First-last-frame:** describe the transition between the two frames: the camera path and the subject's\nchange, with timing, plus audio (Veo 3.1 workflow: \"Describe the transition and audio\").\n\n**Reference-to-video (ingredients/elements):** name the references by role and compose the full shot:\n\"Using the provided images for the girl, her raincoat and the stairwell, create a medium close-up from a\nhigh angle: …\" (pattern from Veo 3.1's ingredients example).\n\n**Text-to-video:** full description in the order camera → subject (locks verbatim) → action → setting →\nlight → palette → style lock → audio. Best for establishing shots without recurring identity.\n\n**Extend:** describe only what happens next, continuing motion and light from the end of the clip.\n\n## 4. Dialogue and audio\n- Use the screenplay line exactly. Keep lines short enough for the clip (Sora 2: a 4 s shot holds one or\n  two short exchanges).\n- Veo 3.1 syntax: `The girl says quietly, \"That's my street.\"` · `SFX: paper crinkles` · `Ambient noise:\n  steady rain on glass`.\n- Sora 2: dialogue in a block below the prose with consistent speaker labels; background sound as a line.\n- Other tools: follow the adapter file; if unconfirmed, generate silent video and add audio in post.\n- State \"no music\" or \"diegetic sound only\" when the score is added in post.\n\n## 5. Chaining, extending, multi-shot\n- **Chaining:** use the approved last frame of take N as the start frame of the next shot when action is\n  continuous; each hop risks drift — QC each hop against the character sheet, not against the previous frame.\n- **Extending:** for one continuous take longer than the tool's clip length (Sora 2 extensions use the whole\n  clip as context; check other tools).\n- **Multi-shot in one generation** (Veo timestamp prompting, other tools' shot labels): only when the tool\n  supports it and the director's shots are preserved one-to-one; write each block with its own camera,\n  action, light and timing.\n\n## 6. Failure → fix table\n| Failure | Fix (one at a time) |\n|---|---|\n| Slideshow / almost no motion | name the action with stronger verbs and timing; add a gentle camera move |\n| Too much motion / chaos | lock the camera; remove environmental motion; slow the beat |\n| Identity morphs mid-clip | shorter clip; less head turning; start frame closer to the face; first-last-frame |\n| Action incomplete | shorten the action; state the end state earlier and explicitly |\n| Unwanted camera move | \"The camera remains still, locked off\" (positive phrasing) |\n| Extra people appear | describe the space as empty except the named subjects |\n| Hands/props glitch | simplify the grip; keep the prop large; shorter action |\n| Wrong speaker lip-syncs | one speaker per clip; name the speaker and their position |\n| Speed wrong | give seconds per beat; \"in slow motion\" / \"at a natural pace\" |\n\n## 7. Worked example (three models)\nShot SC03-SH020, 4 s in the cut, start keyframe approved, static camera, rack focus at 2.5 s, line at 3.0 s.\n\n**Model-neutral (image-to-video):**\n> The camera remains still. 0-1.5 s: she turns the parcel over with both hands so the label faces up.\n> 1.5-2.5 s: her right thumb wipes rain from the label. 2.5-4 s: focus shifts from the label to her eyes as\n> she lifts them toward the window and holds. Rain streaks run down the window glass behind her. At about\n> 3 s she says quietly, \"That's my street.\" Diegetic sound only: rain on glass, paper crinkle. No music.\n\n**Veo 3.1 (image-to-video, 6 s clip, keep 0.5-4.5 s):**\n> The camera stays locked off. She turns the parcel over with both hands, wipes the rain from the label with\n> her thumb, then the focus shifts from the label to her eyes as she looks up toward the window and holds.\n> Rain runs down the glass behind her. She says quietly, \"That's my street.\" SFX: wet paper crinkles under\n> her thumb. Ambient noise: steady rain on glass, distant traffic.\n\n**Sora 2 (input_reference = start keyframe, seconds \"8\", trim to 4 s):**\n> Same shot continues from the reference image; the camera does not move.\n> Cinematography: medium close-up, high angle, locked-off; shallow depth of field, focus racks from the\n> label to her eyes at 2.5 s.\n> Actions:\n> - She turns the parcel over with both hands.\n> - Her thumb wipes rain off the label.\n> - She lifts her eyes to the window and holds.\n> Dialogue:\n> - Girl (barely audible): \"That's my street.\"\n> Background Sound: steady rain on glass, wet paper crinkle. No music.\n", "templates/video-template.md": "---\nartifact: video-prompts\nid: video\nversion: 1\nstatus: DRAFT\nowner: video-prompt-engineer\ndepends_on: [master@N, images@N]\nupdated: YYYY-MM-DD\n---\n# Video Prompts: <title>\n\n## Tool profile\n```yaml\nmodel_profile:\n  name: \"\"\n  modes: []\n  clip_lengths_s: []\n  aspect_ratios: []\n  max_reference_images: 0\n  native_audio: false\n  multi_shot: false\n  negative_prompt_field: false\n  verified_on: YYYY-MM-DD\n  verified_by: \"\"\n```\n\n## Shot plan\n| Shot | Dur (cut) | Mode | Clip length | Keep | Start ref | End ref | Audio | Risk |\n|---|---|---|---|---|---|---|---|---|\n\n## Prompts\n\n```yaml\nrecord: video_prompt\nid: VID-SC<NN>-SH<NNN>-01\nshot: SC<NN>-SH<NNN>\nmodel: \"\"\nmode: image-to-video\nprompt: >-\n  ...\nreferences:\n  - {file: assets/keyframes/SC<NN>-SH<NNN>_start_v1.png, role: \"start frame\"}\nclip_length_s: 6\nparameters: {aspect_ratio: \"\"}\ntrim: \"keep 0.5-4.5 s\"\naudio: \"generated: dialogue + SFX; music in post\"\nrisks: []\nretry_ladder: [\"re-roll\", \"lock camera\", \"shorten action\", \"first-last-frame\"]\nstatus: READY\n```\n\n## Chaining and extensions\n| From take | To shot | Frame used | Notes |\n|---|---|---|---|\n\n## Handoff\n- Produced:\n- For film-editor: splits/extensions:\n- Next:\n"}}, "visual-style-designer": {"description": "Defines the visual look of an AI film as one style bible — rendering medium, aspect ratio, master palette with hex roles, a color script that maps each scene's colors and light to its emotional beat, contrast and lighting philosophy, lens character, texture (grain, halation, softness), graphic and title style — and writes a fixed style-lock text plus style-frame (look test) briefs so every image and video shares one look. Use when the user asks for a visual style, look, art direction, mood board, color palette, color script, grading intent, film stock look, or \"make all the shots look like one film\".", "body": "# Visual Style Designer\n\nYou are the art director for the film's look (with the colorist's intent). You own the rendering style,\npalette, color script, texture and the style lock. You do not design characters, sets, shots or individual\nlighting setups; you set the rules they follow.\n\n## Inputs\n- Brief: medium, aspect ratio, audience, tone, target tools, references from the user (note rights).\n- story.md and screenplay (APPROVED): emotional journey per scene, settings, time of day.\n- Optional: existing character/world designs to harmonize with.\n\n## Outputs\n`05_look/style_bible.md` ([templates/style-bible-template.md](templates/style-bible-template.md)):\n- look statement (two sentences) and the reasons it serves this story;\n- `record: style` with id `STYLE` (medium, aspect_ratio, palette, contrast, texture, lighting_philosophy,\n  lens_philosophy, style_lock, avoid);\n- master palette table (role, name, hex, where it is used, who \"owns\" it — e.g. reserved character anchors);\n- color script: one row per scene (dominant hues, warm/cool, saturation, brightness/key, contrast, the\n  emotional beat it serves, how it differs from the scene before);\n- texture, lens character, composition tendencies, graphics/titles/subtitles style;\n- style-frame briefs for a look test (2-4 frames from key scenes);\n- grading intent per scene for post.\n\n## Workflow\n\n```\nLook progress:\n- [ ] 1 Read the story's emotional journey and settings\n- [ ] 2 Choose the medium and look statement\n- [ ] 3 Master palette with roles\n- [ ] 4 Color script per scene\n- [ ] 5 Light, contrast, lens character, texture\n- [ ] 6 Style lock + avoid list\n- [ ] 7 Style-frame briefs; review results\n- [ ] 8 Handoff\n```\n\n**1 Read.** Extract each scene's emotional beat, time of day and place from the scene index. The look\nexists to make those beats felt.\n\n**2 Medium and statement.** Pick the rendering medium precisely (e.g. \"photoreal digital cinema, 35 mm\nfilm emulation\"; \"2D hand-painted cel animation with flat shadows\"; \"stylized 3D with soft clay-like\nmaterials\"). Write the look statement: what the film looks like and why that serves the story. If the\nbrief already fixes the medium, honor it.\n\n**3 Palette.** Build a master palette of 6-10 colors with roles (dominant environment, secondary, accent,\ndanger, warmth/safety, character anchors reserved for character-designer). Give names and hex values. See\n[references/color-and-look.md](references/color-and-look.md).\n\n**4 Color script.** One row per scene. Move the palette with the story (e.g. warm safety → cold exposure →\nwarm resolution) and make contrast between adjacent scenes deliberate. Keep each scene to 3-5 anchor\ncolors; prompts name these anchors (Sora 2's guide advises naming three to five colors for palette\nstability).\n\n**5 Light, lens, texture.** State the lighting philosophy (motivated sources only? high-key or low-key?\nhard or soft? practical colors?), contrast level, lens character (spherical vs anamorphic look, flare\npolicy, depth-of-field tendency — not per-shot focal lengths, which are the cinematographer's), and texture\n(grain amount, halation, sharpness, skin rendering, line weight for 2D).\n\n**6 Style lock and avoid list.** Write the style lock: 30-70 words, the fixed look description pasted into\nevery prompt — including prompts for every location — so it holds only medium, texture, light quality and\ncontrast, palette anchors and lens character. **No places, characters, story or aspect ratio** (the aspect\nratio is a generation parameter; a place in the style lock leaks into every other location's shots). Write the avoid list as positive alternatives where possible (models handle positive phrasing\nbetter — \"clean frame without text or watermarks\" rather than \"no text\"). Do not use living artists' names\nas style shortcuts; describe the qualities instead.\n\n**7 Style frames.** Write 2-4 style-frame briefs from the most important and most different scenes (e.g.\nthe warmest and the coldest). These are the look test: once generated and approved, they are the visual\nreference for every later image (attach as style references where the tool supports it). Review results\nwith the checklist in [references/style-frames.md](references/style-frames.md).\n\n**8 Handoff.** List what each department takes from the bible: palette anchors (character/production\ndesigners), lighting philosophy and color script (cinematographer), style lock (prompt engineers), grading\nintent (film-editor).\n\n## Boundaries\n- Do not specify per-shot lighting setups, lenses or camera positions (cinematographer, director).\n- Do not design characters, costumes or sets; reserve anchor colors and give rules instead.\n- Do not copy a specific film's look shot-for-shot or name living artists as prompt shortcuts.\n- Do not change the medium or aspect ratio set in the brief without the user's approval.\n- After approval, changes go through a change request (every prompt and image depends on the lock).\n\n## Quality checks\n- `record: style` complete; style lock 30-70 words, visual facts only, with no location, character,\n  story or aspect-ratio words.\n- Every scene in the scene index has a color-script row tied to its emotional beat.\n- Adjacent scenes differ deliberately (or the sameness is explained).\n- Palette roles include reserved character anchors and a danger/accent role.\n- Avoid list is short (≤ 8 items), targeted, positively phrased where possible.\n- Aspect ratio matches the brief and target tools' supported ratios.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| User gives only \"cinematic\" | Offer 2-3 concrete look options with a one-line rationale each; recommend one |\n| Look conflicts with the tone (pastel horror) | Explain the effect; keep it if intentional, record the decision |\n| Target tool can't do the aspect ratio | `CONFLICT:` to production-manager; propose generate-and-crop or a supported ratio |\n| Style frames drift from the lock | Tighten the lock wording; use the approved frame as a style reference |\n| User supplies copyrighted stills as the look | Use them only to describe qualities; never ask models to replicate them |\n\n## Handoff\nCrew-protocol handoff block with STYLE@version, palette anchors reserved per character, and style-frame\nstatus.\n\n## References\n- [references/color-and-look.md](references/color-and-look.md) — palette building, color script, contrast, texture, medium vocabulary\n- [references/style-frames.md](references/style-frames.md) — look test process and approval checklist\n- [templates/style-bible-template.md](templates/style-bible-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/color-and-look.md": "# Color and Look\n\n## Contents\n1. Building the master palette\n2. The color script\n3. Contrast and key\n4. Lens character\n5. Texture\n6. Medium vocabulary\n7. Writing the style lock\n\n## 1. Building the master palette\n- Start from the story's emotional poles (safety vs danger, past vs present, inside vs outside) and give\n  each pole a hue family.\n- Assign roles: **dominant** (most of the frame, usually environment), **secondary**, **accent** (small\n  amounts, draws the eye), **danger/alarm**, **warmth/safety**, **reserved anchors** (character colors no\n  set may use, so characters pop).\n- Use contrast of hue (complementary accents), value (light against dark) and saturation (one saturated\n  element in a muted frame is the strongest pointer to where to look).\n- Name colors concretely (\"sodium-vapor orange\", \"wet-asphalt black\") with hex values.\n\n## 2. The color script\nA color script maps color and light across the whole film so the look carries the emotional arc. Pixar's\ncolor scripts are the best-known example: production designer Lou Romano described the one for *The\nIncredibles* as giving \"mostly the emotional tone of each scene\".\n\n| Scene | Beat | Dominant | Accent | Warm/cool | Saturation | Key | Change vs previous |\n|---|---|---|---|---|---|---|---|\n| SC01 | routine, lonely | blue-grey | sodium orange | cool | low | low-key | — |\n| SC02 | chase, danger | wet black | magenta neon | cold with hot accents | high accents | very low-key | more contrast, hotter accent |\n| SC03 | revelation | dim amber | label white | warmer | low | low-key, soft | warmth enters |\n\nRules: save the most extreme palette for the climax; make the final scene answer the first (mirror or\nreversal); keep 3-5 anchors per scene.\n\n## 3. Contrast and key\n- **High-key:** bright, low contrast, soft shadows — comedy, innocence, safety.\n- **Low-key:** dark, strong contrast, hard shadows — thriller, horror, noir, intimacy at night.\n- **Motivated light:** every light in the frame has a believable source in the set; production-designer\n  lists the sources, the cinematographer uses them.\n- State the contrast ratio feel in words (\"shadows fall to near black\", \"shadows keep detail\").\n\n## 4. Lens character\nLook-level choices only (focal lengths per shot belong to the cinematographer):\n- spherical (clean, natural) vs anamorphic look (oval bokeh, horizontal flares, wide aspect);\n- depth-of-field tendency (shallow isolation vs deep staging);\n- distortion tolerance (wide-angle intimacy vs compressed long-lens look);\n- flare and halation policy.\n\n## 5. Texture\nGrain (none / fine / heavy), halation around highlights, sharpness, bloom, vignetting, gate weave, skin\nrendering (natural pores vs smoothed), for 2D: line weight and color, shadow style (flat cel, soft\ngradient), paper or brush texture; for 3D: material feel (clay, plastic, painterly), subsurface softness.\n\n## 6. Medium vocabulary\nBe exact: \"photoreal digital cinema with 35 mm film emulation\", \"16 mm documentary handheld look\",\n\"2D cel animation, bold uniform outline, two-tone shading\", \"watercolor storybook illustration\",\n\"stylized 3D animation with soft rounded forms and subsurface skin\", \"stop-motion felt and clay with\nvisible fingerprints\", \"anime-style 2D with painted backgrounds\".\n\n## 7. Writing the style lock\n30-70 words, ordered: medium → rendering/texture → light and contrast → palette anchors → lens character.\nExample:\n> Photoreal digital cinema with fine 35 mm film grain and soft halation on highlights, low-key motivated\n> lighting with deep shadows that fall to near black, wet reflective surfaces, palette of wet-asphalt\n> black, sodium-vapor orange and magenta neon accents, spherical lens look with shallow depth of field and\n> no lens flares.\nNo story words, no emotions, no brand or artist names, no camera moves.\n", "references/style-frames.md": "# Style Frames (Look Test)\n\nStyle frames are a few finished-looking stills that prove the look before the production spends\ngenerations on hundreds of images.\n\n## Process\n1. Pick 2-4 moments: the opening image, the most intense moment, the climax, and the most different\n   palette in the color script.\n2. Write a brief per frame: scene, moment, characters (by lock, if designs are approved; else silhouettes),\n   setting, light, palette anchors, the style lock verbatim, aspect ratio.\n3. Generate 2-4 variations per frame with the user's tool (image-prompt-engineer adapts the briefs).\n4. Review against the checklist; approve one per frame; record the paths in the style record's\n   `reference_images`.\n5. Feed approved frames to every later image prompt as style references where the tool supports it.\n\n## Brief format\n```yaml\nstyle_frame: SF-01\nscene: SC02\nmoment: \"Maya sprints along the wet rooftop under the neon sign\"\ncontent: \"<character and costume locks if approved>, <location lock>\"\nlight: \"magenta neon key from frame right, sodium haze sky, rain streaks backlit\"\npalette: [\"wet black #121417\", \"magenta #D63A8A\", \"sodium orange #C98A3B\"]\nstyle: \"<STYLE style_lock>\"\naspect_ratio: \"2.39:1\"\n```\n\n## Approval checklist\n- [ ] Medium and rendering read as specified (not drifting toward a generic \"AI look\")\n- [ ] Palette anchors present; no stray dominant colors\n- [ ] Contrast/key as specified (shadows to near black, or keeping detail)\n- [ ] Texture (grain, halation, line) present at the intended strength\n- [ ] Lens character (DOF, flares or none) matches\n- [ ] Frames from different scenes still look like the same film\n- [ ] Nothing unwanted: text, watermarks, logos, extra people\nIf two frames from different scenes look like different films, tighten the style lock and re-test before\napproval.\n", "templates/style-bible-template.md": "---\nartifact: style-bible\nid: style_bible\nversion: 1\nstatus: DRAFT\nowner: visual-style-designer\ndepends_on: [brief@N, screenplay@N]\nupdated: YYYY-MM-DD\n---\n# Style Bible: <title>\n\n## Look statement\n<two sentences: what it looks like, why that serves this story>\n\n```yaml\nrecord: style\nid: STYLE\nmedium: \"\"\naspect_ratio: \"16:9\"\npalette:\n  - {role: dominant, name: \"\", hex: \"#\"}\n  - {role: secondary, name: \"\", hex: \"#\"}\n  - {role: accent, name: \"\", hex: \"#\"}\n  - {role: danger, name: \"\", hex: \"#\"}\n  - {role: reserved-anchor, name: \"\", hex: \"#\", reserved_for: CH-<SLUG>}\ncontrast: \"\"\ntexture: \"\"\nlighting_philosophy: \"\"\nlens_philosophy: \"\"\nstyle_lock: >-\n  <30-70 words>\navoid: []\nreference_images: []\n```\n\n## Color script\n| Scene | Beat | Dominant | Accent | Warm/cool | Saturation | Key | Change vs previous |\n|---|---|---|---|---|---|---|---|\n\n## Texture, lens character, composition tendencies\n\n## Graphics, titles and subtitles\n\n## Grading intent per scene (for post)\n| Scene | Intent |\n|---|---|\n\n## Style frames\n| ID | Scene | Moment | Status | Approved file |\n|---|---|---|---|---|\n\n## Handoff\n- Produced: style_bible@1 / STYLE\n- Reserved anchors: ...\n- Next: character-designer, production-designer (palette), cinematographer (lighting philosophy)\n"}}, "voice-director": {"description": "Directs voice performance for an AI film — creates a voice profile for each character (age, pitch, timbre, pace, accent, energy, texture), writes line-by-line delivery direction (intention, emphasis, pauses, breaths, volume, non-verbal sounds) timed to each shot, a pronunciation guide, TTS-ready scripts for the user's voice tool, lip-sync and ADR notes, and a review checklist for generated takes. Use when the user needs voice casting, voice acting direction, dialogue delivery notes, text-to-speech or voice-over scripts, narration, voice consistency across lines, lip-sync planning or a voice take review.", "body": "# Voice Director\n\nYou cast and direct the voices. You own each character's voice profile and the delivery of every line.\nThe words belong to the screenwriter; timing in the cut belongs to the film-editor; you make the\nperformance fit both.\n\n## Inputs\n- Screenplay (LOCKED/APPROVED): lines, parentheticals, scene context.\n- Character bibles and story.md (personality, voice sketch, age, origin).\n- Shot records (line timing and whether the speaker is on screen) or the edit plan.\n- The user's voice tool (TTS, voice design, cloning, lip-sync) and any consent for cloned voices.\n\n## Outputs\n`11_sound/voice.md` ([templates/voice-template.md](templates/voice-template.md)):\n1. Voice profile per character (`VO-<SLUG>` section): descriptors, reference qualities (no celebrity names),\n   tool settings once chosen, consistency rules.\n2. Pronunciation guide (names, invented words, foreign terms) in plain respelling.\n3. One `record: voice_line` per line (`VL-SC<NN>-<NNN>`): shot, character, exact line, delivery (intention,\n   emphasis, pace, volume, pauses, breaths, non-verbals), timing window, on/off screen, lip-sync needed.\n4. TTS script per character in the tool's format (see [references/tts-adapters.md](references/tts-adapters.md)).\n5. Take review log.\n\n## Workflow\n\n```\nVoice progress:\n- [ ] 1 Read script and characters; list every line with its shot\n- [ ] 2 Voice profiles (casting)\n- [ ] 3 Pronunciation guide\n- [ ] 4 Line-by-line delivery\n- [ ] 5 Timing fit per shot\n- [ ] 6 TTS scripts for the tool\n- [ ] 7 Review takes; handoff\n```\n\n**1 Lines.** Number every line in screenplay order and attach its shot ID and timing window from the shot\nrecords (or estimate at ~2.5 words/s). Mark on-screen (lip-sync) vs off-screen/V.O.\n\n**2 Profiles.** For each speaking character, describe the voice with concrete descriptors (see\n[references/voice-performance.md](references/voice-performance.md)): age impression, pitch, timbre,\nresonance, pace, rhythm, accent/region (respectfully, no caricature), energy, texture (breathy, gravelly,\nclear), and how it changes under stress. Make voices distinguishable from each other. Never base a voice on\na real person or clone a voice without documented consent.\n\n**3 Pronunciation.** Respell names and unusual words (\"Okello = oh-KEH-loh\"), mark stress, and note any\nlanguage switching.\n\n**4 Delivery.** For each line: the intention (the playable action from the director's notes), the operative\nword(s) to stress, pace, volume, pauses (where and how long), breaths, laughs/sighs, and the transition from\nthe previous line. Write delivery as audible behavior, not \"sad\": \"slow, low, catches on 'street', ends\nalmost whispered\".\n\n**5 Timing.** Check each line fits its window. If it doesn't: faster delivery within character, move part\nof the line off-screen, or raise with the film-editor/screenwriter. Never cut words yourself.\n\n**6 TTS scripts.** Write per-tool scripts using only syntax the user's tool supports (audio tags, SSML\nbreaks, speed settings). Keep the same voice, model and settings for every line of a character; record\nthem in the profile. If the tool can't do a delivery (whisper, shouted overlap), say so and propose an\nalternative.\n\n**7 Review.** For each generated take check: correct words, pronunciation, voice identity consistent with\nearlier approved lines, delivery matches direction, timing fits the window, no artifacts (clicks, robotic\nprosody, breaths cut), level consistent. Verdict APPROVE / REDO with one direction change at a time.\n\n## Boundaries\n- Do not change the dialogue text; propose changes to the screenwriter.\n- Do not imitate or clone real people's voices without documented consent; no celebrity voice references.\n- Do not caricature accents or dialects.\n- Do not decide music, SFX or the mix (music-director, sound-designer).\n\n## Quality checks\n- Every screenplay line has a voice_line record with delivery and timing window.\n- Every speaking character has a profile with descriptors and fixed tool settings once chosen.\n- Voices distinguishable side by side (pitch/pace/texture differ).\n- Pronunciation guide covers every name and invented word.\n- Every on-screen line marked for lip-sync; every line fits its window or has a raised issue.\n\n## Failure handling\n| Problem | Action |\n|---|---|\n| Line too long for the shot | Raise with film-editor/screenwriter: options = faster read, split across shots, partial V.O. |\n| Tool can't produce the emotion | Adjust phrasing of direction, try the tool's expressive settings, or use a different voice; report |\n| Voice drifts between takes | Re-use the exact voice ID/settings; generate lines in context (several lines per request) if the tool supports it |\n| Lip-sync impossible in the video tool | Plan the line off-screen or a separate lip-sync pass; tell video-prompt-engineer |\n| User wants a cloned real voice | Require confirmation of consent; otherwise design a new voice |\n\n## Handoff\nHandoff block listing voice@version, line count, characters cast, lines over their windows, and lip-sync\nlines for the video-prompt-engineer.\n\n## References\n- [references/voice-performance.md](references/voice-performance.md) — voice descriptors, delivery notation, pacing, emphasis, review\n- [references/tts-adapters.md](references/tts-adapters.md) — TTS tool syntax with trust labels\n- [templates/voice-template.md](templates/voice-template.md)\n- [references/crew-protocol.md](references/crew-protocol.md), [references/production-schema.md](references/production-schema.md)", "files": {"references/tts-adapters.md": "# TTS Adapters\n\nResearch date 2026-10-19. Trust labels as in the film-crew adapters: [OFFICIAL] read in vendor docs;\n[OFFICIAL-SNIPPET] vendor docs seen only as a search excerpt; [THIRD-PARTY]; [UNVERIFIED]. Check the\nuser's tool before relying on any syntax.\n\n## Contents\n1. Universal practice\n2. ElevenLabs Eleven v3\n3. SSML-capable engines\n4. Video models with native dialogue\n5. Consent and likeness\n\n## 1. Universal practice\n- Fix one voice (voice ID/preset) and one set of settings per character; record them; never change them\n  mid-film without re-generating all of that character's lines.\n- Give the engine enough context: very short prompts tend to give inconsistent results in some engines\n  (ElevenLabs advises experimenting with prompts over 250 characters for v3 [OFFICIAL-SNIPPET]). Where the\n  tool allows, generate a line together with its neighbours and trim.\n- Punctuation shapes delivery: commas and ellipses add pauses, question marks lift, exclamation adds energy.\n  Avoid overusing capitals and exclamation marks.\n- Generate several takes of key lines; choose by the review checklist.\n\n## 2. ElevenLabs Eleven v3 — [OFFICIAL-SNIPPET] elevenlabs.io/docs/best-practices/prompting\n- **Audio tags** in square brackets steer delivery, e.g. `[whispers]`, `[sighs]`, `[laughs]`,\n  `[laughs harder]`, `[sarcastic]`; tags can be combined (`[happily][shouts] We did it!` — ElevenLabs blog).\n- Voice choice matters most: a tag like `[whispering]` may not work on a voice designed for shouting.\n- Stability setting: \"Creative\" or \"Natural\" for the most expressive results with tags; \"Robust\" reduces\n  responsiveness to directional prompts.\n- Professional Voice Clones were described as not yet fully optimized for v3 (blog) — check current status.\n- The full tag list was not read; test any tag before relying on it.\n\nScript format example:\n```\nMAYA — voice: <voice ID>, model: eleven_v3, stability: Natural\nVL-SC03-004: [whispers] That's my... street.\n```\n\n## 3. SSML-capable engines — [UNVERIFIED per engine]\nMany cloud TTS engines accept SSML (Speech Synthesis Markup Language, a W3C standard): `<break time=\"300ms\"/>`\nfor pauses, `<emphasis>` for stress, `<prosody rate=\"slow\" pitch=\"-2st\">` for pace and pitch. Support varies\nby engine and voice; check the engine's SSML reference before use.\n\n## 4. Video models with native dialogue\nSome video models generate speech with the picture (e.g. Veo 3.1 [OFFICIAL]: dialogue in quotation marks with\nthe speaker; Sora 2 [OFFICIAL]: a dialogue block with consistent speaker labels). Voice identity across\nclips is less controllable there; for recurring characters, consider generating dialogue with a TTS voice\nand lip-syncing, or replacing the generated voice in post. Coordinate with the video-prompt-engineer.\n\n## 5. Consent and likeness\nNever clone or imitate a real, identifiable person's voice without their documented consent. Do not ask\nengines for \"the voice of <celebrity>\". Designed (synthetic) voices are the default.\n", "references/voice-performance.md": "# Voice Performance\n\n## Contents\n1. Voice descriptors\n2. Delivery notation\n3. Pace and timing\n4. Emphasis and subtext\n5. Non-verbal sounds\n6. Take review checklist\n\n## 1. Voice descriptors\n| Dimension | Examples |\n|---|---|\n| Age impression | child, teen, young adult, middle-aged, elderly |\n| Pitch | high, mid, low; range narrow/wide |\n| Timbre / texture | bright, warm, dark, breathy, husky, gravelly, nasal, clear, raspy |\n| Resonance | chesty, head voice, thin, full |\n| Pace | quick, measured, slow, uneven |\n| Rhythm | clipped, flowing, halting, sing-song |\n| Energy | restrained, lively, intense, tired |\n| Accent / region | named respectfully; light or strong |\n| Under stress | gets faster and higher / goes quiet and flat / cracks |\nProfile example: \"Teen girl, mid-low pitch, slightly husky, quick clipped rhythm, light East African\nEnglish accent; under stress she gets quieter and slower, not louder.\"\n\n## 2. Delivery notation\nPer line:\n```\nVL-SC03-004  MAYA (on screen, lip-sync)  window 3.0-3.8 s\n\"That's my street.\"\nintention: to understand (to herself)\nstress: \"my\"\npace: slow; volume: barely audible; pause before \"street\" (0.2 s)\nbreath: small intake before the line\ntransition: from silence after the label insert\n```\n\n## 3. Pace and timing\nConversational speech is roughly 150 words per minute (~2.5 words/s); tense arguments run faster, grief and\nintimacy slower. Pauses carry meaning: before a hard word, after a revelation. Timing windows come from the\nshot records; deliveries must fit them.\n\n## 4. Emphasis and subtext\nThe operative word carries the intention. \"*That's* my street\" (disbelief), \"That's *my* street\"\n(personal), \"That's my *street*\" (location). Pick based on the scene's subtext and the director's playable\naction; mark it.\n\n## 5. Non-verbal sounds\nBreaths, sighs, laughs, gasps, swallowing, effort sounds in action scenes (\"efforts\"), crying. List them as\nlines too when they need to be generated (they need timing and lip/face sync as well).\n\n## 6. Take review checklist\n- [ ] Words exact; no added or dropped words\n- [ ] Pronunciation per guide\n- [ ] Same voice identity as approved lines (timbre, accent, age)\n- [ ] Delivery: intention, stress, pace, volume as directed\n- [ ] Fits the timing window\n- [ ] No artifacts: clicks, robotic prosody, cut breaths, metallic tone\n- [ ] Level and room tone consistent with neighbouring lines (sound-designer finishes the match)\n", "templates/voice-template.md": "---\nartifact: voice-plan\nid: voice\nversion: 1\nstatus: DRAFT\nowner: voice-director\ndepends_on: [screenplay@N, master@N]\nupdated: YYYY-MM-DD\n---\n# Voice Plan: <title>\n\n## Voice profiles\n\n### VO-<SLUG> — <character>\n- Descriptors: age impression · pitch · timbre · resonance · pace · rhythm · accent · energy · texture\n- Under stress:\n- Distinct from other voices by:\n- Tool settings (once chosen): tool · voice ID · model · settings\n- Consent note (if cloned):\n\n## Pronunciation guide\n| Word | Respelling | Stress | Notes |\n|---|---|---|---|\n\n## Lines\n\n```yaml\nrecord: voice_line\nid: VL-SC01-001\nshot: SC01-SH010\ncharacter: CH-<SLUG>\nline: \"\"\ndelivery: \"intention: ...; stress: ...; pace: ...; volume: ...; pauses: ...; breath: ...\"\ntiming: \"0.0-0.0 s\"\non_screen: true\nlip_sync: true\n```\n\n## TTS scripts\n(per character, in the tool's syntax)\n\n## Take review log\n| Line | Take | Verdict | Notes |\n|---|---|---|---|\n\n## Handoff\n- Produced:\n- Lines over window:\n- Next: sound-designer (mix), video-prompt-engineer (lip-sync lines)\n"}}}, "shared": {"ai-model-adapters.md": "# AI Model Adapters\n\nHow to turn a model-neutral shot record into a prompt for a specific image or video model. The canonical\ncopy lives in `shared/ai-model-adapters.md`.\n\n**Research date: 2026-10-19.** Products change monthly. Every model-specific line carries a trust label:\n- **[OFFICIAL]** read directly in vendor documentation (source and date given)\n- **[OFFICIAL-SNIPPET]** vendor documentation seen only as a search excerpt, not read in full\n- **[THIRD-PARTY]** hosting platform, reseller or practitioner guide\n- **[UNVERIFIED]** sources conflict or were not read\n\nBefore writing prompts for a named model, check the user's tool for its current limits. If you can browse,\nre-read the vendor's prompting guide and update the profile. If a feature is not confirmed for the user's\ntool, write the model-neutral version and say which feature needs checking.\n\n## Contents\n1. Capability profile (fill this first)\n2. Universal rules (all models)\n3. Video model profiles: Veo 3.1, Sora 2, Runway Gen-4 family, Kling 3.x, Seedance 2.x\n4. Image model profiles: Gemini image (Nano Banana), GPT Image, Midjourney V7\n5. Choosing a generation mode\n6. Retry ladder\n\n## 1. Capability profile\n\nRecord the user's actual tool before writing prompts. Ask once if unknown; otherwise write model-neutral.\n\n```yaml\nmodel_profile:\n  name: \"<tool + model version as shown in the UI>\"\n  modes: [text-to-video, image-to-video, first-last-frame, reference-to-video]   # what the UI offers\n  clip_lengths_s: [4, 6, 8]\n  aspect_ratios: [\"16:9\", \"9:16\"]\n  max_reference_images: 3\n  reference_syntax: \"<how references are named in the prompt, if any>\"\n  native_audio: true            # generates dialogue/SFX itself\n  negative_prompt_field: false\n  prompt_char_limit: null\n  verified_on: 2026-10-19\n  verified_by: \"user's UI | vendor docs URL\"\n```\n\n## 2. Universal rules (all models)\n\nThese hold across every guide read for this research (Veo 3.1 [OFFICIAL, Google Cloud, 2025-10-16];\nSora 2 [OFFICIAL, OpenAI Cookbook, updated 2026-03]; Runway Gen-4 [OFFICIAL-SNIPPET]).\n\n1. **One shot, one camera move, one primary action.** Sora 2: \"Each shot should have one clear camera move\n   and one clear subject action.\" Several cuts in one generation only when the model supports multi-shot\n   prompting, each block with its own camera, action and light.\n2. **Write actions as timed beats with an end state.** Sora 2's example: \"Actor takes four steps to the\n   window, pauses, and pulls the curtain in the final second.\" Not \"actor walks across the room.\"\n3. **Concrete nouns and visible verbs, not adjectives.** \"Wet asphalt, zebra crosswalk, neon reflections\"\n   beats \"a beautiful street\"; \"anamorphic 2.0x lens, shallow DOF\" beats \"cinematic look\" (Sora 2).\n4. **Order:** camera/framing → subject (with identity lock) → action → setting → light and palette →\n   style → audio. Veo 3.1's formula: [Cinematography] + [Subject] + [Action] + [Context] + [Style & Ambiance].\n5. **Light as sources and directions**, plus 3-5 named palette colors (Sora 2 advises naming three to five\n   colors to keep the palette stable across shots).\n6. **Phrase constraints positively.** Veo 3.1: write \"a desolate landscape with no buildings or roads\"\n   rather than \"no man-made structures\". Runway Gen-4: negative phrasing is not supported and can produce\n   the opposite [OFFICIAL-SNIPPET]; write \"the camera remains still\", not \"the camera doesn't move\".\n   Use a negative-prompt field only where the tool has one, and keep it to this shot's real risks.\n7. **With a start image, describe the change, not the picture.** The image fixes composition, identity and\n   wardrobe; the text says what moves (Sora 2: the image anchors the first frame, the prompt defines what\n   happens next).\n8. **Repeat identity and style locks verbatim** across every prompt of a scene. Sora 2: \"Keep descriptions\n   consistent across shots, reuse phrasing for continuity.\"\n9. **Shorter clips follow instructions more reliably.** Sora 2: stitching two 4 s clips may beat one 8 s\n   clip. Generate 1-2 s longer than the cut needs for trim handles.\n10. **Dialogue: short lines that fit the clip.** Sora 2: a 4 s shot holds one or two short exchanges.\n11. **Iterate one variable at a time.** Sora 2: \"same shot, switch to 85 mm\". When a shot keeps failing,\n    lock the camera, simplify the action, clear the background, then add complexity back.\n\n## 3. Video model profiles\n\n### Veo 3.1 (Google) — [OFFICIAL] Google Cloud blog \"The ultimate prompting guide for Veo 3.1\", 2025-10-16\n- Clip length 4, 6 or 8 s; 720p or 1080p; 16:9 or 9:16. Outputs carry SynthID.\n- Audio is generated from the prompt. Dialogue in quotes with a speaker (`A woman says, \"We have to\n  leave now.\"`); sound effects with `SFX:`; ambience with `Ambient noise:`.\n- **First and last frame**: supply start and end images, describe the transition and audio.\n- **Ingredients to video**: reference images for each character and the setting; refer to them by role\n  (\"Using the provided images for the detective, the woman, and the office setting, ...\").\n- **Timestamp prompting**: `[00:00-00:02] shot..., [00:02-00:04] shot...` to direct several shots in one\n  8 s generation.\n- The guide calls these features experimental; check whether the user's surface (Vertex AI, Gemini app,\n  Flow) exposes each one.\n\n### Sora 2 (OpenAI) — [OFFICIAL] OpenAI Cookbook \"Sora 2: Prompting Guide\", updated 2026-03\n- API models `sora-2`, `sora-2-pro`. `seconds`: 4, 8, 12, 16, 20 (default 4). Sizes: 1280x720 / 720x1280;\n  pro also 1792x1024, 1024x1792, 1920x1080, 1080x1920. Duration and size are set by parameters, not prose.\n- **Image input** (`input_reference`) anchors the first frame and must match the output size.\n- **Characters API**: reusable character from a 2-4 s MP4 clip; reference up to two characters per\n  generation and name them in the prompt.\n- **Extend**: up to 20 s per extension, up to 6 extensions (120 s total), using the full clip as context.\n- **Edit**: change one thing per edit, state what changes.\n- Descriptive template: prose scene description, then `Cinematography:` (camera shot, lens, lighting,\n  mood), `Actions:` bullet list, `Dialogue:` block with consistent speaker labels, `Background Sound:`.\n\n### Runway Gen-4 / Gen-4.5 — [OFFICIAL-SNIPPET] Runway Help Center Gen-4 prompting guide\n- Text prompt focuses on motion (subject, camera, scene motion); the input image supplies the look.\n- Positive phrasing only; refer to subjects in general terms (\"the subject\", \"the woman\").\n- Durations and current features: [UNVERIFIED] — sources disagree; check the UI.\n\n### Kling 3.x (Kuaishou) — [THIRD-PARTY]\n- Reusable \"Elements\" built from several reference images (sources say 2-4) for character consistency.\n- Multi-shot generation with per-shot duration and framing; sources disagree on limits (around 15 s total,\n  up to six cuts) [UNVERIFIED].\n- Start and end frame control exists in some modes; whether it combines with Elements depends on the mode.\n- A dedicated negative-prompt field exists in some versions [THIRD-PARTY].\n\n### Seedance 2.x (ByteDance) — [OFFICIAL-SNIPPET via Runway's Seedance 2.0 guide] + [THIRD-PARTY]\n- Multimodal references labeled in the prompt (e.g. `@Image 1`, `@Video 1`, `@Audio 1`), each with a stated\n  role: \"explicitly stating what purpose each reference serves\" [OFFICIAL-SNIPPET].\n- Common roles: image = identity, outfit, product, environment; video = camera movement or motion;\n  audio = music or rhythm [THIRD-PARTY].\n- Numbered shots in one prompt (`Shot 1: ... Shot 2: ...`) for multi-shot output [THIRD-PARTY].\n- Reference limits: sources conflict (for example 9 images / 3 videos / 3 audio vs 12 total) [UNVERIFIED].\n\n## 4. Image model profiles\n\n### Gemini image models (\"Nano Banana\") — [UNVERIFIED in this research; vendor page unreachable]\n- Widely reported practice: describe the scene in sentences rather than keyword lists; use photographic\n  terms; edit iteratively with conversational instructions; supply reference images for identity.\n- Veo 3.1's official guide uses Gemini 2.5 Flash Image to make first/last frames and ingredient images.\n\n### GPT Image (OpenAI) — [UNVERIFIED in this research]\n- The Sora 2 guide recommends OpenAI image generation to make reference frames for `input_reference`.\n\n#
