<title>Robo Film Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">🎬</span>
      <div class="brand-text">
        <span class="brand-name">Robo Film Studio</span>
        <button class="project-title" id="projectTitle" title="Rename film">No film yet</button>
      </div>
    </div>
    <nav class="nav" aria-label="Studio pages">
      <button class="nav-btn" data-page="lobby">🏠 <span>Lobby</span></button>
      <button class="nav-btn" data-page="cabin">🪑 <span>Cabin</span><b class="badge" id="cabinBadge" hidden>0</b></button>
      <button class="nav-btn" data-page="studio">🏢 <span>Studio</span></button>
      <button class="nav-btn" data-page="screening">🍿 <span>Screening</span></button>
      <button class="nav-btn" data-page="board">🧭 <span>Board</span></button>
      <button class="nav-btn" data-page="keys">🔑 <span>Keys</span></button>
    </nav>
    <div class="top-actions">
      <button class="btn ghost" id="btnIssues" hidden title="Open questions and flags">❓ <span id="issueCount">0</span></button>
      <button class="btn ghost" id="btnExport" title="Export" disabled>📦</button>
      <button class="btn ghost" id="btnSettings" title="Production settings" disabled>⚙️</button>
      <button class="btn primary" id="btnNew">＋ <span class="hide-sm">New film</span></button>
    </div>
  </header>

  <section class="command" id="dropZone">
    <div class="attach-row" id="attachRow"></div>
    <div class="command-row">
      <label class="btn icon attach-btn" title="Upload images, video, scripts, notes">📎<input type="file" id="fileInput" multiple hidden></label>
      <textarea id="cmdInput" rows="1" placeholder="Talk to Captain Clipboard: pitch an idea, give notes, ask anything… (drop files anywhere)"></textarea>
      <button class="btn primary send" id="btnSend" title="Send (Enter)">Send ➤</button>
      <div class="progress-pill" id="progressPill" hidden>
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" class="ring-bg"/><circle cx="18" cy="18" r="15" class="ring-fg" id="ringFg"/></svg>
      <div class="progress-text"><span id="progressStage">Ready</span><small id="progressCount">0 / 0</small></div>
      <span class="onair" id="onAir">ON AIR</span>
    </div>
    </div>
  </section>

  <main class="pages">
    <section class="page" id="page-lobby"></section>

    <section class="page" id="page-cabin" hidden>
      <div class="cabin">
        <div class="slot" id="slotCabin">
          <div class="hud hud-tl"><div class="hud-stage">You're in Captain Clipboard's cabin</div></div>
          <div class="hud hud-bl"><span class="hint">📺 When the Captain is out, watch the crew on the big TV behind the desk.</span></div>
        </div>
        <aside class="panel chat-panel">
          <div class="chat-tools"><b>💬 Talk with Captain Clipboard</b><label class="toggle"><input type="checkbox" id="chkChatter" checked> Team chatter</label></div>
          <div class="chat" id="chatLog" aria-live="polite"></div>
          <div class="review-card" id="reviewCard" hidden></div>
        </aside>
      </div>
    </section>

    <section class="page" id="page-studio" hidden>
      <div class="slot big" id="slotStudio">
        <div class="hud hud-tl"><div class="hud-stage">Studio</div></div>
        <div class="hud hud-tr cam-bar">
          <button class="cam-btn" data-cam="director" title="Automatic cuts between rooms">🎬 Director cam</button>
          <button class="cam-btn" data-cam="top" title="See the whole studio from above">🗺 Top view</button>
          <button class="cam-btn" data-cam="seat" title="Back to your seat in the cabin">🪑 My seat</button>
          <select id="roomSelect" aria-label="Visit a room"></select>
          <button class="chip-btn" id="btnZoomIn" title="Zoom in (top view)">＋</button>
          <button class="chip-btn" id="btnZoomOut" title="Zoom out (top view)">－</button>
        </div>
        <div class="live-box" id="liveBox" hidden></div>
        <div class="room-card" id="roomCard" hidden></div>
      </div>
    </section>

    <section class="page" id="page-screening" hidden></section>

    <section class="page" id="page-board" hidden>
      <div class="board-page">
        <h2>🧭 Production board</h2>
        <div class="run-controls" id="runControls"></div>
        <ol class="pipeline" id="pipelineList"></ol>
      </div>
    </section>

    <section class="page" id="page-keys" hidden></section>
  </main>

  <footer class="tracker" id="tracker" aria-label="Production stages"></footer>
</div>

<div class="stage3d" id="stage3d"><svg id="studio" class="studio2d" xmlns="http://www.w3.org/2000/svg" hidden></svg></div>
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="application/json" id="skillData">__SKILL_DATA__</script>
<script type="application/octet-stream" id="homeCopy">__HOME_COPY__</script>
<script>
/*__JS__*/
</script>
